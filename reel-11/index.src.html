    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/
        // safe zone dell'11/10: le inquadrature finiscono a y 1300 (la linea della faccia è a 1332), il titolo resta sopra 330
        BAND.y1 = 1300;

        // ═══ base ═══════════════════════════════════════════════════════════════════════════════════════════════
        bokeh($("bokeh"), [
          [120, 1200, 380, 0.05, true], [700, 980, 300, 0.035], [-300, 1500, 420, 0.04, true], [900, 1500, 360, 0.04],
          [1400, 600, 420, 0.05], [2000, 200, 420, 0.06, true], [2500, -400, 460, 0.07, true], [2900, -900, 420, 0.06],
          [1700, 1300, 380, 0.04, true], [3300, 300, 400, 0.05], [600, 300, 360, 0.04, true], [2300, 900, 380, 0.04],
        ]);
        const L = layer(10);
        const S = svgLayer(L, 6, -60000, -60000, 200000, 200000);
        const wt = (i) => WORDS[i][1]; // istante della parola i (indici: python -X utf8 _tools/parole.py …/d11.ts)
        const head = (lines, times, out, o) => { const T = titleW(Object.assign({ lines, size: 82 }, o || {})); T.inAt(times); if (out) T.outAt(out); return T; };
        const via = (els, t, dur) => tl.to(els, { opacity: 0, duration: dur || 0.3, ease: "power1.out" }, t);
        const grp = (z) => el(L, { position: "absolute", left: 0, top: 0, width: 1, height: 1, zIndex: z });

        // ── luoghi del mondo: in basso a sinistra la stanza, poi la scala che sale in diagonale verso la luce ──
        const ST = [180, 1560, 1240, 1240];     // stanza (rettangolo davanti)
        const TILE = [770, 1895, 420, 747];     // il tuo reel nella stanza (in piedi sul pavimento, davanti al fondo)
        const FACE = [980, 2119];               // il tuo viso nel reel (dove cade la luce)
        const GROUND = 2800, X0 = 1500;         // pavimento e bordo sinistro del gradino 1

        // ═══ 1 · HOOK — "Non è la fotocamera a farti sembrare professionale," (0 – 2,45) ═══════════════════════════
        // A02 la fotocamera vera è già in scena al fotogramma 0 (spia REC), rack focus; "fotocamera" lo scatto col lampo;
        // "a farti sembrare professionale" la camera si allarga: accanto c'è il tuo reel vero che lei riprende, buio e piatto
        const ROOM = stanzaR11(L, ST[0], ST[1], ST[2], ST[3], { ix: 170, iy: 150, z: 8 });
        const ME = reelLuceR11(L, TILE[0], TILE[1], TILE[2], TILE[3], "a", { stato: "buio", z: 24, play: [0.4, 13.8] });
        gsap.set(ME.f, { opacity: 0 });
        const CAMG = grp(26);
        const FC = fotocamera(CAMG, 470, 2000, 560, { z: 3 });
        const TRP = treppiedeR11(CAMG, 470, 2190, 2745, { spread: 210, col: 20, z: 1 });
        const LENS = FC.lens();
        const pH0 = fitPose(190, 1770, 750, 2230);
        camInit(pH0.fx, pH0.fy, pH0.s);
        rackFocus(0, 0.45);
        float(0, 0.93, 0, -6, 0.035);
        FC.rec(0.1, 2.4);
        FC.shutter(wt(3) + 0.02);
        FC.glint(0.2, 0.8);
        // "a farti sembrare professionale": la camera si allarga e scopre il tuo reel, buio
        frameRect(wt(4), 0.85, [170, 1770, 1215, 2745]);
        tl.fromTo(ME.f, { opacity: 0, x: 140, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: KW.arrive, immediateRender: false }, wt(4) + 0.06);
        tl.set(ME.f, { filter: "none" }, wt(4) + 0.58);
        ME.grana(0.4, 11.2, 0.08);
        // l'obiettivo guarda te: linea tratteggiata che si allunga (C01) e scorre
        const SEE = connector(S, [[LENS.x + LENS.r + 12, LENS.y], [600, LENS.y - 24], [TILE[0] - 16, FACE[1]]], { color: "rgba(255,255,255,.62)", w: 5, dash: [14, 11], curve: "h" });
        SEE.draw(wt(5), 0.3);
        SEE.march(wt(5), 1.4, 120);
        float(1.78, 0.7, 0, -6, 0.02);
        head([[{ t: "Non è la " }, { t: "fotocamera", box: true }]], [wt(0), wt(1), wt(2), wt(3)], 2.05);

        // ═══ 2 · "è dove metti la luce." (2,5 – 4,1) ════════════════════════════════════════════════════════════
        // F11 la fotocamera si spegne in grigio ed esce; "dove" arriva il faro vero, "metti" viene messo giù al suo posto,
        // "luce" sfarfalla e si accende: il fascio cade sul tuo reel, che si illumina (colori veri, bordo lime, alone)
        // la fotocamera resta, ma spenta e in disparte: non è lei che conta
        tl.to(CAMG, { filter: "grayscale(1) brightness(.42)", duration: 0.25, ease: "power2.out" }, wt(8));
        tl.to(CAMG, { x: -70, y: -150, scale: 0.8, transformOrigin: "470px 2000px", duration: 0.45, ease: "power3.inOut" }, wt(8) + 0.06);
        tl.to(TRP, { opacity: 0, duration: 0.25 }, wt(8) + 0.06);
        SEE.hide(wt(8), 0.2);
        const FAROG = grp(22);
        const FR = faro(FAROG, 420, 2470, 380, { len: 900, z: 2 });
        gsap.set(FAROG, { opacity: 0 });
        tl.fromTo(FAROG, { opacity: 0, x: -180, y: 280 }, { opacity: 1, x: 0, y: -46, duration: 0.24, ease: "power3.out", immediateRender: false }, wt(9));
        tl.to(FAROG, { y: 0, duration: 0.14, ease: "power2.in" }, wt(10) - 0.02);
        tl.fromTo(FAROG, { scaleY: 0.9 }, { scaleY: 1, duration: 0.3, ease: "back.out(3)", transformOrigin: "420px 2650px", immediateRender: false }, wt(10) + 0.12);
        ripple(L, 420, 2648, wt(10) + 0.12, { wd: 380, ht: 60, radius: "50%", s0: 0.6, s1: 1.4, w: 3, dur: 0.45, color: "#ffffff", glow: false, z: 21 });
        FR.on(wt(11) + 0.02);
        ME.stato(wt(12) + 0.14, "faro", 0.3);
        ME.rim(wt(12) + 0.16);
        pulse(L, FACE[0], FACE[1], wt(12) + 0.16, { r: 300, z: 23 });
        FR.live(3.9, 4.2);
        frameRect(wt(8), 0.9, [200, 1880, 1215, 2700], { fill: 0.96 });
        head([[{ t: "È dove metti" }], [{ t: "la luce", box: true }]], [wt(8), wt(9), wt(10), wt(11), wt(12)], 3.98);

        // ═══ 3 · "E finché giri in una stanza illuminata male," (4,2 – 6,5) ════════════════════════════════════════
        // il faro si spegne ed esce; la camera si allarga e attorno al tuo reel si disegna la stanza; "illuminata" una
        // lampadina nuda sfarfalla (F05) e si accende: luce gialla dall'alto, ombre dure, grana; "male" sfarfalla ancora
        FR.off(wt(13));
        tl.to(FAROG, { y: 320, opacity: 0, duration: 0.35, ease: "power2.in" }, wt(13) + 0.08);
        tl.to(CAMG, { x: -560, opacity: 0, duration: 0.35, ease: "power2.in" }, wt(13) + 0.04);
        ME.stato(wt(13), "buio", 0.3);
        ME.rimOff(wt(13));
        frameRect(4.42, 0.95, [ST[0], ST[1], ST[0] + ST[2], ST[1] + ST[3]], { fill: 1.0 });
        ROOM.show(4.55, 0.5);
        const BULB = lampadinaR11(L, FACE[0], 1640, 110, { w: 64, cono: [760, 860], pozza: [FACE[0], 2705, 860, 150], z: 30 });
        gsap.set(BULB.g, { opacity: 0 });
        tl.fromTo(BULB.g, { opacity: 0, y: -120 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, wt(17));
        BULB.on(wt(19));
        ME.stato(wt(19) + 0.24, "lampadina", 0.25);
        ME.sfarfalla(wt(19), [[0, 0.7], [0.05, 0.15], [0.11, 0.6], [0.17, 0.3], [0.24, 0]]);
        BULB.sfarfalla(wt(20));
        ME.sfarfalla(wt(20));
        BULB.dondola(5.0, 6.2);
        float(5.4, 1.15, 0, -8, 0.02);
        head([[{ t: "Una stanza" }], [{ t: "illuminata male", box: true }]], [wt(17), wt(18), wt(19), wt(20)], 6.3);

        // ═══ 4 · "anche l'attrezzatura da 5.000 euro" (6,6 – 8,2) ════════════════════════════════════════════════
        // la fotocamera torna nella stanza sul treppiede (K02) col cartellino del prezzo che oscilla; "5.000 euro" il prezzo
        // conta da 0 a 5.000 € (D01)
        tl.set(CAMG, { filter: "none", x: -560, y: 0, scale: 1 }, wt(21) - 0.01);
        tl.set(TRP, { opacity: 1 }, wt(21) - 0.01);
        tl.to(CAMG, { x: 0, opacity: 1, duration: 0.4, ease: KW.arrive }, wt(21));
        const TAG = cartellinoR11(L, 158, 1984, "0 €", { w: 236, h: 118, fs: 50, filo: 100, z: 40 }); // appeso alla cinghia, a sinistra del corpo
        TAG.show(wt(23) - 0.02);
        TAG.count(wt(25), 0, 5000, 0.5);
        tl.fromTo(TAG.g, { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", immediateRender: false }, wt(27));
        tl.to(TAG.g, { scale: 1, duration: 0.3, ease: "back.out(3)" }, wt(27) + 0.1);
        glowFlash(TAG.num, wt(27), { base: "none", peak: "0 0 14px rgba(255,255,255,.9)" });
        frameRect(6.55, 0.8, [90, 1760, 1215, 2760], { fill: 0.97 });
        head([[{ t: "L'attrezzatura" }], [{ t: "da " }, { t: "5.000 euro", box: true }]], [wt(22), wt(24), wt(25), wt(27)], 8.5);

        // ═══ 5 · "ti fa sembrare uno che improvvisa." (8,2 – 11,0) ═════════════════════════════════════════════════
        // K07 si entra nell'obiettivo e si è nel mirino (U14) della fotocamera da 5.000 €: il tuo reel è quello che vede,
        // buio e con la grana; l'ISO sale a 12.800 (rosso), l'autofocus cerca e non aggancia
        move(7.98, 0.3, LENS.x, LENS.y, 2.4);
        const pV = fitPose(TILE[0], TILE[1], TILE[0] + TILE[2], TILE[1] + TILE[3], { fill: 1 });
        zoomThrough(wt(28) + 0.05, pV.fx, pV.fy, pV.s, { pre: 0.12, blur: 14, settle: 0.45 });
        const VF = mirinoR11(L, [TILE[0], TILE[1], TILE[0] + TILE[2], TILE[1] + TILE[3]], { nero: true, z: 62 });
        VF.show(wt(28) + 0.06);
        ME.maniglia(wt(28) - 0.1, 0);
        via(TAG.g, wt(28) - 0.1, 0.2); // dentro il mirino il cartellino resterebbe sotto il nero
        VF.rec(wt(28) + 0.1, 2.8);
        VF.iso(wt(30) + 0.05, 400, 12800, 0.5);
        VF.cerca(wt(31), 1.9);
        ME.sfarfalla(wt(33), [[0, 0.5], [0.06, 0.1], [0.12, 0.42], [0.19, 0]]);
        BULB.sfarfalla(wt(33));
        shake(wt(33), 5, 4);
        float(8.75, 2.3, 0, -10, 0.04);
        head([[{ t: "Uno che" }], [{ t: "improvvisa", box: true }]], [wt(31), wt(32), wt(33)], 10.75);

        // ═══ 6 · LA SCALA — "C'è una scala e ha 4 gradini." (11,1 – 14,0) ═════════════════════════════════════════
        // dal mirino la camera esce all'indietro (zoom out lungo): la stanza buia è ai piedi di una scala di 4 gradini che sale
        // in diagonale verso la luce. "scala" i gradini si alzano uno dopo l'altro (in piedi in mezzo secondo, reel 90);
        // "4" i numeri sulle alzate; "gradini" gli spigoli si accendono; sulle alzate le folle di 100 persone, spente (O23)
        const SCALA = scalaR11(L, X0, GROUND, { w: 800, r: 800, dx: 84, dy: 54, z: 10 });
        const TR = [0, 1, 2, 3].map((i) => SCALA.tread(i));
        // la luce in cima (F07): raggi e alone caldo sopra l'ultimo gradino
        const TOPX = TR[3].x0 + 400, TOPY = TR[3].y - 620;
        const ALONE = el(L, { position: "absolute", left: TOPX - 1300, top: TOPY - 1000, width: 2600, height: 2000, borderRadius: "50%", background: "radial-gradient(closest-side, rgba(255,252,236,.2), rgba(255,252,236,.07) 55%, rgba(255,252,236,0) 100%)", opacity: 0, zIndex: 4, pointerEvents: "none" });
        const RAGGI = rays(L, TOPX, TOPY, 1250, { n: 18, a: 0.16, color: "255,252,236", z: 5 });
        // il fascio della luce in cima che scende lungo la scala (bianco caldo, mai lime trasparente)
