// D13 · termometro verticale (reel 72, 111): tubo di vetro col bulbo in basso, il lime pieno sale fino al livello; si mette accanto
// alla scala (O07). (x, yTop, yBot) = asse e estremi del tubo · o: { w (46), etichette: [basso, alto], fs (26), z }
// → { show(t), to(t, f, dur) }
const thermo = (parent, x, yTop, yBot, o) => {
  o = o || {};
  const w = o.w || 46, z = o.z || 12, H = yBot - yTop, bd = w * 1.9;
  const tube = el(parent, { position: "absolute", left: x - w / 2, top: yTop, width: w, height: H, borderRadius: w / 2, background: "linear-gradient(90deg, rgba(255,255,255,.14), rgba(255,255,255,.05) 40%, rgba(255,255,255,.1))", border: "2px solid rgba(255,255,255,.55)", boxShadow: "0 0 18px rgba(255,255,255,.15)", overflow: "hidden", zIndex: z });
  const fill = el(tube, { position: "absolute", left: 5, right: 5, bottom: 4, height: H - 8, borderRadius: w / 2, background: "linear-gradient(90deg,#a6d332,#e8ff9c 40%,#CFFB50 60%,#9fca2c)", boxShadow: GLOW_A(0.6), transformOrigin: "50% 100%" });
  const bulb = el(parent, { position: "absolute", left: x - bd / 2, top: yBot - bd * 0.35, width: bd, height: bd, borderRadius: "50%", background: "radial-gradient(circle at 38% 32%, #f6ffd8, #CFFB50 55%, #8fb829)", border: "2px solid rgba(255,255,255,.6)", boxShadow: GLOW_A(0.8), zIndex: z + 1 });
  const lab = (o.etichette || []).map((tx, i) => el(parent, { position: "absolute", left: x - 140, top: i ? yTop - 54 : yBot + bd * 0.7, width: 280, textAlign: "center", fontFamily: FS, fontWeight: 800, fontSize: o.fs || 26, color: i ? K.lime : "rgba(255,255,255,.7)", textShadow: i ? GLOW_LT : "none", whiteSpace: "nowrap", zIndex: z }, tx));
  gsap.set(fill, { scaleY: 0 });
  gsap.set([tube, bulb, ...lab], { opacity: 0 });
  return {
    show: (t) => { tl.to([tube, bulb], { opacity: 1, duration: 0.3 }, t); lab.forEach((l, i) => blurIn(l, t + 0.1 + i * 0.1, { y: 8, blur: 8, dur: 0.3 })); },
    to: (t, f, dur) => tl.to(fill, { scaleY: f, duration: dur || 0.6, ease: "power2.inOut" }, t),
  };
};

// O27 · amo che aggancia (reel 100 di Kallaway, "Hook-Lean-Snap"; anche reel 76): una cornice con dentro la canna (due puntini
// lime, come i suoi gialli), la lenza che si arcua dalla punta e l'amo d'acciaio che scende sull'arco nell'acqua scura a bande con
// le onde che scorrono. Chi scorre (volto vero) nuota con la scia verso l'amo, abbocca e viene strappato fuori dall'acqua con gli
// schizzi; la canna si piega e torna. Altri volti nuotano dietro e non abboccano.
// (cx, cy) = centro della cornice · o: { w (900), h (980), d (volto, 120), volto, altri (0), z }
// → { rect, show(t), cast(t, dur), swim(t, dur), snap(t) }
const hookCatch = (parent, cx, cy, o) => {
  o = o || {};
  const W = o.w || 900, H = o.h || 980, d = o.d || 120, z = o.z || 14;
  const X0 = cx - W / 2, Y0 = cy - H / 2;
  const card = el(parent, { position: "absolute", left: X0, top: Y0, width: W, height: H, borderRadius: 40, overflow: "hidden", background: "linear-gradient(180deg, #121212 0%, #0d0d0d 100%)", border: "2px solid rgba(255,255,255,.28)", boxShadow: "0 40px 90px rgba(0,0,0,.6), 0 0 40px rgba(255,255,255,.06)", zIndex: z });
  card.setAttribute("data-layout-allow-overlap", "");
  // acqua: tre bande che scorrono (onde sinusoidali in SVG, traslate in orizzontale), cresta chiara in cima
  const WY = H * 0.6; // pelo dell'acqua nella cornice
  const SW = svgIn(card, W, H);
  const wave = (y0, amp, len, col, k) => {
    let dd = `M${-len} ${H}`;
    for (let x = -len; x <= W + len; x += 10) dd += ` L${x} ${(y0 + Math.sin((x / len) * Math.PI * 2 + k) * amp).toFixed(1)}`;
    dd += ` L${W + len} ${H} Z`;
    return pathEl(SW, dd, { fill: col });
  };
  const W1 = wave(WY, 14, 260, "#18343a", 0), W2 = wave(WY + 46, 18, 300, "#1d4a52", 1.7), W3 = wave(WY + 120, 12, 240, "#173c43", 3.1);
  let cd = "";
  for (let x = -260; x <= W + 260; x += 10) cd += `${cd ? "L" : "M"}${x} ${(WY + Math.sin((x / 260) * Math.PI * 2) * 14).toFixed(1)} `;
  const crest = pathEl(SW, cd, { fill: "none", stroke: "rgba(255,255,255,.55)", "stroke-width": 3 });
  crest.style.filter = "drop-shadow(0 0 6px rgba(255,255,255,.5))";
  // canna (dritta, bianca) con il manico e la punta lime; lenza lime che si arcua dalla punta all'amo
  const HX = W * 0.1, HY = H * 0.48, TX = W * 0.3, TY = H * 0.18;
  const rod = pathEl(SW, `M${HX} ${HY} L${TX} ${TY}`, { stroke: "#ffffff", "stroke-width": 7, "stroke-linecap": "round" });
  rod.style.filter = "drop-shadow(0 0 8px rgba(255,255,255,.6))";
  const dots = [[HX, HY], [TX, TY]].map(([x, y]) => {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 13); c.setAttribute("fill", K.lime);
    c.style.filter = "drop-shadow(0 0 10px rgba(207,251,80,.9))";
    SW.appendChild(c);
    return c;
  });
  const AX = W * 0.62; // dove scende l'amo
  const line = pathEl(SW, "M0 0", { fill: "none", stroke: K.lime, "stroke-width": 5, "stroke-linecap": "round" });
  line.style.filter = "drop-shadow(0 0 8px rgba(207,251,80,.85))";
  // amo d'acciaio disegnato: occhiello, gambo, curva a J con l'ardiglione; gradiente argento
  const hook = layered(el(card, { position: "absolute", left: 0, top: 0, width: 1, height: 1, zIndex: 6 }));
  const HS = svgIn(hook, 1, 1);
  const hg = "hk" + ++SVGN;
  HS._defs.insertAdjacentHTML("beforeend", `<linearGradient id="${hg}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d9196"/><stop offset=".45" stop-color="#ffffff"/><stop offset=".7" stop-color="#c9cdd2"/><stop offset="1" stop-color="#6c7075"/></linearGradient>`);
  const hk = pathEl(HS, "M0 -10 L0 58 C0 96 -48 96 -48 62 L-48 50 L-38 64", { fill: "none", stroke: `url(#${hg})`, "stroke-width": 11, "stroke-linecap": "round", "stroke-linejoin": "round" });
  hk.style.filter = "drop-shadow(0 0 8px rgba(255,255,255,.55))";
  const eye = document.createElementNS(NS, "circle");
  eye.setAttribute("cx", 0); eye.setAttribute("cy", -20); eye.setAttribute("r", 10); eye.setAttribute("fill", "none"); eye.setAttribute("stroke", `url(#${hg})`); eye.setAttribute("stroke-width", 6);
  HS.appendChild(eye);
  // posizione dell'amo (aggiorna lenza, canna e punta): bend = quanto si piega la canna nello strappo
  const P = { x: TX + 40, y: TY + 30, bend: 0 };
  const setLine = () => {
    gsap.set(hook, { x: P.x, y: P.y });
    const tx = TX + P.bend * 40, ty = TY + P.bend * 60;
    const mx = (tx + P.x) / 2 + 60 * (1 - P.bend), my = Math.min(ty, P.y) - 40 * (1 - P.bend);
    line.setAttribute("d", `M${tx.toFixed(1)} ${ty.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${P.x.toFixed(1)} ${(P.y - 30).toFixed(1)}`);
    rod.setAttribute("d", `M${HX} ${HY} L${tx.toFixed(1)} ${ty.toFixed(1)}`);
    dots[1].setAttribute("cx", tx.toFixed(1)); dots[1].setAttribute("cy", ty.toFixed(1));
  };
  setLine();
  // chi scorre: volto vero con la scia; gli altri nuotano più in fondo e più piccoli
  const mkFace = (dd, i) => {
    const f = layered(el(card, { position: "absolute", left: 0, top: 0, width: 1, height: 1, zIndex: 5 }));
    faceDot(f, -dd / 2, -dd / 2, dd, i, "atlas-muro", { bw: 3 });
    gsap.set(f, { opacity: 0 });
    return f;
  };
  const others = Array.from({ length: o.altri || 0 }, (_, i) => {
    const od = d * (0.55 + 0.2 * Math.abs(hash(i, 61))), oy = WY + 150 + (i % 3) * 90 + hash(i, 63) * 20, ox = W * (0.12 + ((i * 0.37) % 1) * 0.76);
    const f = mkFace(od, 40 + i * 17);
    gsap.set(f, { x: ox, y: oy });
    return { f, ox, oy, dir: i % 2 ? -1 : 1 };
  });
  const fish = mkFace(d, o.volto == null ? 21 : o.volto);
  const FY = WY + 110, FX0 = W * 0.08;
  gsap.set(fish, { x: FX0, y: FY });
  const wake = pathEl(SW, `M${FX0 - 140} ${FY + 26} Q${FX0 - 60} ${FY + 40} ${FX0} ${FY + 26}`, { fill: "none", stroke: "rgba(255,255,255,.75)", "stroke-width": 3, "stroke-linecap": "round", opacity: 0 });
  gsap.set(card, { opacity: 0 });
  const waves = [W1, W2, W3, crest];
  return {
    rect: [X0 - 20, Y0 - 20, X0 + W + 20, Y0 + H + 20],
    show: (t) => {
      tl.fromTo(card, { opacity: 0, scale: 0.94, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, t);
      // onde che scorrono per tutta la scena (sensi alterni, deterministiche)
      waves.forEach((p, i) => tl.fromTo(p, { x: 0 }, { x: (i % 2 ? -1 : 1) * 260, duration: 6, ease: "none", immediateRender: false }, t));
      others.forEach((q, i) => { tl.to(q.f, { opacity: 0.55, duration: 0.3 }, t + 0.2 + i * 0.05); tl.to(q.f, { x: q.ox + q.dir * 140, duration: 5.5, ease: "sine.inOut" }, t + 0.2); });
    },
    // lancio: l'amo scende sull'arco dalla punta della canna fin sott'acqua (0,6 s), la lenza lo segue
    cast: (t, dur) => {
      dur = dur || 0.6;
      tl.fromTo(P, { x: TX + 40, y: TY + 30 }, { x: AX, y: WY + 100, duration: dur, ease: "power2.inOut", onUpdate: setLine, immediateRender: false }, t);
      ripple(card, AX, WY, t + dur * 0.7, { wd: 160, ht: 36, s0: 0.3, s1: 1.4, w: 3, color: "rgba(255,255,255,.8)", glow: false, z: 7, dur: 0.6 });
    },
    // nuota verso l'amo con la scia (onda deterministica)
    swim: (t, dur) => {
      tl.to(fish, { opacity: 1, duration: 0.25 }, t);
      tl.to(wake, { attr: { opacity: 1 }, duration: 0.2 }, t);
      const n = 8, tx = AX - d * 0.55;
      for (let k = 1; k <= n; k++) {
        const f = k / n, x = FX0 + (tx - FX0) * f, y = FY + Math.sin(f * Math.PI * 2.5) * 18;
        tl.to(fish, { x, y, rotation: Math.cos(f * Math.PI * 2.5) * 7, duration: dur / n, ease: "sine.inOut" }, t + (k - 1) * (dur / n));
        tl.to(wake, { attr: { d: `M${(x - 150).toFixed(1)} ${(y + 26).toFixed(1)} Q${(x - 70).toFixed(1)} ${(y + 44).toFixed(1)} ${(x - d * 0.4).toFixed(1)} ${(y + 24).toFixed(1)}` }, duration: dur / n, ease: "sine.inOut" }, t + (k - 1) * (dur / n));
      }
      tl.to(P, { x: AX + 6, duration: dur * 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, onUpdate: setLine }, t);
    },
    // abbocca (piccolo strattone), poi lo strappo: la canna si piega, amo e volto escono dall'acqua con gli schizzi
    snap: (t) => {
      tl.to(fish, { x: AX - d * 0.18, y: WY + 140, rotation: 0, duration: 0.12, ease: "power2.out" }, t);
      tl.to(wake, { attr: { opacity: 0 }, duration: 0.15 }, t);
      tl.to(P, { y: WY + 118, duration: 0.08, ease: "power2.out", onUpdate: setLine }, t + 0.12);
      tl.to(P, { x: AX - 120, y: WY - 300, bend: 1, duration: 0.36, ease: "power3.in", onUpdate: setLine }, t + 0.22);
      tl.to(fish, { x: AX - 120 - d * 0.18, y: WY - 260, rotation: -16, duration: 0.36, ease: "power3.in" }, t + 0.22);
      tl.to(P, { bend: 0.35, duration: 0.5, ease: "back.out(2)", onUpdate: setLine }, t + 0.6);
      for (let i = 0; i < 12; i++) {
        const a = -Math.PI / 2 + hash(i, 13) * 1.3, sp = 110 + Math.abs(hash(i, 4)) * 180;
        const dd = el(card, { position: "absolute", left: AX - 9, top: WY - 9, width: 18, height: 18, borderRadius: "50%", background: "radial-gradient(circle at 35% 30%, #fff, #d6eef2 60%, rgba(255,255,255,.4))", opacity: 0, zIndex: 8 });
        tl.set(dd, { opacity: 1 }, t + 0.42);
        tl.to(dd, { x: Math.cos(a) * sp * 0.9, duration: 0.6, ease: "power1.out" }, t + 0.42);
        tl.to(dd, { y: Math.sin(a) * sp, duration: 0.3, ease: "power2.out" }, t + 0.42);
        tl.to(dd, { y: 40, opacity: 0, duration: 0.3, ease: "power2.in" }, t + 0.72);
      }
      ripple(card, AX - 40, WY, t + 0.42, { wd: 420, ht: 70, s0: 0.3, s1: 1.4, w: 3, color: "rgba(255,255,255,.85)", glow: false, z: 7, dur: 0.7 });
      shake(t + 0.42, 8, 4);
    },
  };
};

// O26 · figura umana 3D con il telefono (reel 18, 52, 62 di Kallaway). In Kallaway non è una persona riconoscibile: è un
// manichino bianco opaco, liscio come gesso, di profilo, chino sul telefono, con l'alone morbido e il busto che sfuma in basso.
// obj-manichino = Adobe Stock 140421534 ("Incorrect posture concept", scontorno di Photoshop) passato da _tools/manichino.py.
// Guarda a sinistra (con {flip: true} a destra): il telefono grande con lo schermo vero va dal lato in cui guarda (reel 18).
// Gesti misurati sui reel:
//   .show(t)    entra di lato in corsa e va a fuoco (reel 62, 0,45 s)
//   .screen(t)  lo schermo si accende e illumina il viso (luce lime morbida sul volto e sulle mani)
//   .dot(t)     un punto lime compare sulla testa (reel 52 a 23,8 s: "confuso")
//   .focus(t)   una lente sulla testa: disco scuro trasparente col bordo lime, arriva in 0,15 s, resta, svanisce allargandosi (reel 52)
//   .pulse(t)   disco grafite col bordo lime dietro tutta la figura, nasce e svanisce allargandosi (reel 62 a 3,05 s)
//   .away(t)    se ne va: si spegne in grigio e scivola via (il "bounce" del reel 52)
// cx = centro dell'immagine · base = fondo (il busto sfuma) · h = altezza dell'immagine · o: { flip, z }
// → { g, rect, headXY(), headR, phoneXY(), show, screen, dot, focus, pulse, away }
const FIG_GEO = { ar: 2089 / 2200, head: [0.305, 0.245, 0.165], phone: [0.168, 0.673], box: [0.084, 0.082, 0.916, 0.814] };
const figure3d = (parent, cx, base, h, o) => {
  o = o || {};
  const z = o.z || 12, w = h * FIG_GEO.ar, X0 = cx - w / 2, Y0 = base - h;
  const fx = (u) => X0 + (o.flip ? 1 - u : u) * w, fy = (v) => Y0 + v * h;
  const g = layered(el(parent, { position: "absolute", left: X0, top: Y0, width: w, height: h, zIndex: z }));
  const im = imgIn(g, "obj-manichino", { objectFit: "contain" });
  if (o.flip) im.style.transform = "scaleX(-1)";
  const [hu, hv, hr] = FIG_GEO.head, HX = fx(hu), HY = fy(hv), HR = hr * h;
  const PX = fx(FIG_GEO.phone[0]), PY = fy(FIG_GEO.phone[1]);
  // luce dello schermo: alone lime morbido sul volto e sulle mani (dentro il gruppo, sopra al manichino, in modalità screen)
  const spill = el(g, { position: "absolute", left: PX - X0 - w * 0.2, top: PY - Y0 - h * 0.34, width: w * 0.46, height: h * 0.46, borderRadius: "50%", background: "radial-gradient(closest-side, rgba(207,251,80,.5), rgba(207,251,80,.16) 55%, rgba(207,251,80,0))", mixBlendMode: "screen", opacity: 0 });
  const scr = el(g, { position: "absolute", left: PX - X0 - w * 0.085, top: PY - Y0 - h * 0.022, width: w * 0.17, height: h * 0.044, borderRadius: 10, background: "radial-gradient(closest-side, rgba(240,255,200,.95), rgba(207,251,80,.55) 60%, rgba(207,251,80,0))", mixBlendMode: "screen", opacity: 0 });
  // punto sulla testa (tempia) e lente sulla testa
  const dotD = Math.max(18, HR * 0.16);
  const dot = el(parent, { position: "absolute", left: HX + (o.flip ? -1 : 1) * HR * 0.12 - dotD / 2, top: HY - HR * 0.18 - dotD / 2, width: dotD, height: dotD, borderRadius: "50%", background: K.lime, boxShadow: GLOW_A(1), opacity: 0, zIndex: z + 3 });
  const lens = el(parent, { position: "absolute", left: HX - HR * 1.12, top: HY - HR * 1.12, width: HR * 2.24, height: HR * 2.24, borderRadius: "50%", background: "radial-gradient(circle at 50% 45%, rgba(20,20,20,.14), rgba(20,20,20,.34) 70%, rgba(20,20,20,.5))", border: `${Math.max(5, Math.round(HR * 0.03))}px solid ${K.lime}`, boxShadow: `${GLOW_A(0.9)}, inset 0 0 40px rgba(207,251,80,.25)`, opacity: 0, zIndex: z + 2, pointerEvents: "none" });
  [dot, lens].forEach((n) => n.setAttribute("data-layout-allow-overlap", ""));
  const bx = FIG_GEO.box, R0 = [fx(o.flip ? bx[2] : bx[0]), fy(bx[1]), fx(o.flip ? bx[0] : bx[2]), fy(bx[3])];
  gsap.set(g, { opacity: 0 });
  return {
    g, headR: HR,
    rect: [R0[0] - 20, R0[1] - 30, R0[2] + 20, base - h * 0.08],
    headXY: () => [HX, HY],
    phoneXY: () => [PX, PY],
    show: (t, oo) => {
      oo = oo || {};
      const dx = oo.dx == null ? (o.flip ? -1 : 1) * w * 0.35 : oo.dx;
      tl.fromTo(g, { opacity: 0, x: dx, filter: "blur(14px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: false }, t);
      tl.set(g, { filter: "none" }, t + 0.46);
    },
    screen: (t) => { tl.to(scr, { opacity: 1, duration: 0.12 }, t); tl.to(spill, { opacity: 1, duration: 0.35, ease: "power2.out" }, t + 0.04); },
    dot: (t) => tl.fromTo(dot, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(3)", immediateRender: false }, t),
    focus: (t, hold) => {
      hold = hold == null ? 0.35 : hold;
      tl.fromTo(lens, { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.15, ease: "expo.out", immediateRender: false }, t);
      tl.to(lens, { opacity: 0, scale: 1.18, duration: 0.3, ease: "power1.in" }, t + 0.15 + hold);
    },
    pulse: (t, oo) => {
      oo = oo || {};
      const r = oo.r || h * 0.42, PCX = fx(0.52), PCY = fy(0.44);
      const d = el(parent, { position: "absolute", left: PCX - r, top: PCY - r, width: 2 * r, height: 2 * r, borderRadius: "50%", background: "radial-gradient(circle at 50% 45%, rgba(58,58,58,.55), rgba(26,26,26,.6) 72%)", border: `${Math.max(5, Math.round(r * 0.018))}px solid ${K.lime}`, boxShadow: GLOW_A(0.9), opacity: 0, zIndex: z - 1, pointerEvents: "none" });
      d.setAttribute("data-layout-allow-overlap", "");
      gsap.set(d, { scale: 0.5 });
      tl.set(d, { opacity: 1 }, t);
      tl.to(d, { scale: 1, duration: 0.14, ease: "expo.out" }, t);
      tl.to(d, { scale: 1.14, opacity: 0, duration: 0.4, ease: "power1.in" }, t + 0.26);
      return d;
    },
    away: (t) => {
      tl.to([scr, spill, dot], { opacity: 0, duration: 0.25 }, t);
      tl.to(g, { x: (o.flip ? -1 : 1) * w * 0.3, opacity: 0.35, filter: "grayscale(1) brightness(.55)", duration: 0.6, ease: "power2.in" }, t);
    },
  };
};

// F10 · muro di mattoni (reel 40 di Kallaway: "il muro" da mostrare o buttare giù): mattoni in grafite lucida a file sfalsate che
// si montano dal basso (.build), si accendono di luce (.light) o esplodono in pezzi che volano via ruotando (.blast) lasciando
// vedere cosa c'era dietro. x0, y0 = angolo in alto a sinistra · cols × rows · o: { bw (150), bh (66), gap (8), z }
// → { g, bricks, rect, build(t, dur), blast(t, {cx, cy, power}), grey(t) }
const brickWall = (parent, x0, y0, cols, rows, o) => {
  o = o || {};
  const bw = o.bw || 150, bh = o.bh || 66, gap = o.gap || 8, z = o.z || 14;
  const W = cols * (bw + gap) - gap, H = rows * (bh + gap) - gap;
  const g = el(parent, { position: "absolute", left: x0, top: y0, width: W, height: H, zIndex: z });
  const bricks = [];
  for (let r = 0; r < rows; r++) {
    const off = r % 2 ? -bw / 2 : 0;
    for (let c = 0; c < cols + (r % 2 ? 1 : 0); c++) {
      let x = off + c * (bw + gap), w = bw;
      if (x < 0) { w += x; x = 0; }
      if (x + w > W) w = W - x;
      if (w < 20) continue;
      const y = H - (r + 1) * (bh + gap) + gap;
      const b = el(g, { position: "absolute", left: x, top: y, width: w, height: bh, borderRadius: 8, background: "linear-gradient(180deg,#5a5a5a 0%,#3a3a3a 18%,#2a2a2a 62%,#1d1d1d 100%)", border: "1.5px solid rgba(255,255,255,.16)", boxShadow: "inset 0 2px 0 rgba(255,255,255,.22), 0 10px 22px rgba(0,0,0,.45)" });
      gsap.set(b, { opacity: 0 });
      bricks.push({ b, r, c, x: x0 + x + w / 2, y: y0 + y + bh / 2, k: bricks.length });
    }
  }
  return {
    g, bricks, rect: [x0, y0, x0 + W, y0 + H],
    // i mattoni cadono al loro posto, fila per fila dal basso
    build: (t, dur) => {
      dur = dur || 0.8;
      const n = bricks.length;
      bricks.forEach((q, i) => {
        const tt = t + (q.r / rows) * dur * 0.85 + ((hash(i, 5) + 1) / 2) * dur * 0.12;
        tl.fromTo(q.b, { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, tt);
      });
    },
    // esplosione dal punto (cx, cy): ogni mattone vola via in fuori ruotando e svanisce (power2.out), con la scossa
    blast: (t, oo) => {
      oo = oo || {};
      const cx = oo.cx == null ? x0 + W / 2 : oo.cx, cy = oo.cy == null ? y0 + H / 2 : oo.cy, pw = oo.power || 900;
      bricks.forEach((q, i) => {
        const dx = q.x - cx, dy = q.y - cy, d = Math.max(60, Math.hypot(dx, dy)), k = (pw * (0.7 + 0.5 * Math.abs(hash(i, 9)))) / Math.sqrt(d);
        const tt = t + (d / 2400) + Math.abs(hash(i, 3)) * 0.04;
        tl.to(q.b, { x: (dx / d) * k * 22, y: (dy / d) * k * 22 + 260, rotation: hash(i, 7) * 220, opacity: 0, duration: 0.85, ease: "power2.out" }, tt);
      });
      shake(t, 16, 7);
    },
    grey: (t) => tl.to(bricks.map((q) => q.b), { filter: "grayscale(1) brightness(.6)", duration: 0.3 }, t),
    // riavvolgi: i mattoni tornano al loro posto (dopo .blast), in fretta e con la scia
    rewind: (t, dur) => {
      dur = dur || 0.55;
      bricks.forEach((q, i) => tl.to(q.b, { x: 0, y: 0, rotation: 0, opacity: 1, duration: dur, ease: "power3.inOut" }, t + Math.abs(hash(i, 21)) * 0.08));
      mblurV(t, dur + 0.08, "power3.inOut", 10, "xy");
    },
  };
};

// D · indicatore a lancetta (gauge): semicerchio d'acciaio con le tacche e la scala dal grafite al lime (colori pieni), lancetta
// bianca con la punta lime e il perno; .to(t, f, dur) porta la lancetta alla frazione f (0 = sinistra, 1 = destra), .shake(t)

// F10 · cupola di vetro che si frantuma (il "carcere" di una convinzione): una cupola di vetro (bordo chiaro, riflesso) fatta di
// schegge a ventaglio; .close(t) le schegge arrivano e la chiudono, .shatter(t) esplodono in fuori ruotando con le scintille.
// cx, cy = centro · r = raggio · o: { n (14 schegge), z } → { g, rect, close(t), shatter(t) }
const glassCage = (parent, cx, cy, r, o) => {

  const n = o.n || 14, z = o.z || 18, D = 2 * r;
  const g = layered(el(parent, { position: "absolute", left: cx - r, top: cy - r, width: D, height: D, zIndex: z, pointerEvents: "none" }));

    const poly = "polygon(" + pts.map(([x, y]) => `${((x / D) * 100).toFixed(2)}% ${((y / D) * 100).toFixed(2)}%`).join(", ") + ")";
    const s = el(g, { position: "absolute", left: 0, top: 0, width: D, height: D, clipPath: poly, background: "radial-gradient(circle at 36% 28%, rgba(255,255,255,.34) 0%, rgba(255,255,255,.1) 38%, rgba(200,220,230,.06) 70%, rgba(255,255,255,.2) 100%)", borderRadius: "50%" });

  const glint = el(g, { position: "absolute", left: r * 0.28, top: r * 0.18, width: r * 0.5, height: r * 0.22, borderRadius: "50%", background: "radial-gradient(closest-side, rgba(255,255,255,.6), rgba(255,255,255,0))", transform: "rotate(-28deg)" });

  const SV = svgIn(g, D, D);

    g, rect: [cx - r - 20, cy - r - 20, cx + r + 20, cy + r + 20],

      tl.set(g, { opacity: 1 }, t);
      shards.forEach((q) => tl.fromTo(q.s, { x: Math.cos(q.a) * r * 0.9, y: Math.sin(q.a) * r * 0.9, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t + Math.abs(hash(q.k, 7)) * 0.1));

      shards.forEach((q) => tl.to(q.s, { x: Math.cos(q.a) * r * (1.6 + Math.abs(hash(q.k, 11))), y: Math.sin(q.a) * r * (1.6 + Math.abs(hash(q.k, 13))) + 120, rotation: hash(q.k, 17) * 160, opacity: 0, duration: 0.8, ease: "power2.out" }, t + 0.18));

};

// L09 · albero / flowchart che cresce (reel 3 di Kallaway, "The Formula Behind Winning Content"; anche 23 e 68): nodi a pill su
// righe, collegati con linee morbide che scendono dal genitore; ogni riga si disegna (linea 0,35 s, nodo 0,25 s, sfalsati) e la
// camera scende con la crescita. livelli: [{ nodi: [{t, p (indice del genitore nella riga sopra), lime}], cols (a capo dopo cols
// nodi), w (larghezza della riga) }] — il livello 0 è la radice. o: { dy (passo tra le righe, 200), w (960), fs (28), h (66), z }
// → { L (righe), grow(l, t, {step, dur}), light(l, i, t), nodeXY(l, i), rowRect(l0, l1), rect }
const flowTree = (parent, S, cx, y0, livelli, o) => {
  o = o || {};
  const fs = o.fs || 28, nh = o.h || 66, dy = o.dy || 200, z = o.z || 13, W0 = o.w || 960;
  let y = y0;
  const L = livelli.map((lv, l) => {
    const n = lv.nodi.length, cols = lv.cols || n, rows = Math.ceil(n / cols), w = lv.w || W0, cw = w / cols;
    const nodes = lv.nodi.map((nd, i) => {
      const r = Math.floor(i / cols), c = i % cols, inRow = Math.min(cols, n - r * cols);
      const x = cx - (inRow * cw) / 2 + (c + 0.5) * cw, yy = y + r * (nh + 34);
      const lime = nd.lime || l === 0;
      const b = el(parent, { position: "absolute", left: x - (cw - 16) / 2, top: yy, width: cw - 16, height: nh, borderRadius: nh / 2, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 10px", background: lime ? limeFill(1) : "linear-gradient(180deg, rgba(62,62,62,.97), rgba(32,32,32,.98))", border: lime ? "none" : "1.5px solid rgba(255,255,255,.22)", boxShadow: lime ? `${GLOW_A(0.7)}, 0 14px 30px rgba(0,0,0,.5)` : "0 14px 30px rgba(0,0,0,.5), inset 0 1.5px 0 rgba(255,255,255,.1)", fontFamily: FS, fontWeight: 800, fontSize: l === 0 ? Math.round(fs * 1.2) : fs, color: lime ? K.ink : K.white, whiteSpace: "nowrap", overflow: "hidden", zIndex: z }, nd.t);
      gsap.set(b, { opacity: 0, scale: 0.7 });
      return { b, x, y: yy, p: nd.p, cn: null };
    });
    const out = { nodes, y0: y, y1: y + rows * (nh + 34) - 34, w };
    y = out.y1 + dy;
    return out;
  });
  // collegamenti: dal fondo del genitore alla cima del figlio
  L.forEach((lv, l) => { if (!l) return; lv.nodes.forEach((nd) => { const pa = L[l - 1].nodes[nd.p || 0]; nd.cn = connector(S, [[pa.x, pa.y + nh], [nd.x, nd.y]], { curve: "v", color: "rgba(255,255,255,.7)", w: 3 }); }); });
  const minX = Math.min(...L.map((lv) => cx - lv.w / 2)), maxX = Math.max(...L.map((lv) => cx + lv.w / 2));
  return {
    L,
    rect: [minX - 20, y0 - 30, maxX + 20, L[L.length - 1].y1 + 30],
    rowRect: (a, b) => [minX - 20, L[a].y0 - 30, maxX + 20, L[b == null ? a : b].y1 + 30],
    nodeXY: (l, i) => [L[l].nodes[i].x, L[l].nodes[i].y + nh / 2],
    grow: (l, t, oo) => {
      oo = oo || {};

      L[l].nodes.forEach((nd, i) => {
        const tt = t + i * step;

        tl.fromTo(nd.b, { opacity: 0, scale: 0.7, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "back.out(2.2)", immediateRender: false }, tt + (nd.cn ? dur * 0.7 : 0));
        tl.set(nd.b, { filter: "none" }, tt + (nd.cn ? dur * 0.7 : 0) + 0.26);
      });
    },
    // accende un nodo (e la sua linea) di lime: il ramo che si segue
    light: (l, i, t) => {
      const nd = L[l].nodes[i];
      tl.to(nd.b, { background: limeFill(1), color: K.ink, borderColor: "rgba(0,0,0,0)", boxShadow: `${GLOW_A(0.8)}, 0 14px 30px rgba(0,0,0,.5)`, duration: 0.2 }, t);
      tl.fromTo(nd.b, { scale: 1.08 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, t);
      if (nd.cn) tl.to(nd.cn.p, { attr: { stroke: K.lime }, duration: 0.2 }, t);

// ── easing: cubic-bezier misurate → funzioni per GSAP (risolutore deterministico, come i browser) ──
const bez = (p1x, p1y, p2x, p2y) => {
  const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
  const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
  const sx = (u) => ((ax * u + bx) * u + cx) * u;
  const sy = (u) => ((ay * u + by) * u + cy) * u;
  const dx = (u) => (3 * ax * u + 2 * bx) * u + cx;
  const solve = (x) => {
    let u = x;
    for (let i = 0; i < 8; i++) {
      const e = sx(u) - x;
      if (Math.abs(e) < 1e-6) return u;
      const d = dx(u);
      if (Math.abs(d) < 1e-6) break;
      u -= e / d;
    }
    let lo = 0, hi = 1;
    u = x;
    for (let i = 0; i < 32; i++) {
      const v = sx(u);
      if (Math.abs(v - x) < 1e-6) break;
      if (x > v) lo = u; else hi = u;
      u = (lo + hi) / 2;
    }
    return u;
  };
  return (x) => (x <= 0 ? 0 : x >= 1 ? 1 : sy(solve(x)));
};
const KW = {
  move: bez(0.3, 0.2, 0.35, 0.9),     // K03 · spostamento tra due oggetti (206 misure, mediana 1,31 s)
  arrive: bez(0.2, 0.8, 0.7, 0.95),   // K02 · scena che entra già in corsa dopo un taglio (243 misure)
  drift: bez(0.3, 0.35, 0.55, 0.8),   // K04 · drift lento (1.565 misure)
};
// F01 · glow misurato: testo bianco = alone medio (σ≈7 px) + largo (σ≈45 px); oggetti d'accento molto più forti
const GLOW_T = "0 0 14px rgba(255,255,255,.34), 0 0 90px rgba(255,255,255,.17)";
const GLOW_A = (a) => { a = a == null ? 1 : a; return `0 0 18px rgba(207,251,80,${(0.62 * a).toFixed(3)}), 0 0 110px rgba(207,251,80,${(0.3 * a).toFixed(3)})`; };

// Gestore di camera: ogni movimento kit2 passa da camK(). Due tween sulla stessa proprietà che si sovrappongono
// "litigano" quando il renderer salta tra i fotogrammi (vince quello renderizzato per ultimo): camK tronca il
// segmento precedente nell'istante in cui parte il nuovo, conservandone esattamente la traiettoria fino al taglio.
// Nei reel nuovi usare SOLO move / float / arrive / cutTo / whip2 / zoomThrough (non cam/drift/whip di kit.js).
const CAMQ = { seg: null };

const camTw = (targets, from, to, t, dur, ease) => {
  const tw = gsap.fromTo(targets, from, Object.assign({ duration: dur, ease, immediateRender: false }, to));
  tl.add(tw, t);
  return tw;

const camTweens = (t, dur, a, b, ease) => {
  const tw = [
    camTw([pan, gpan], { x: -a.fx, y: -a.fy }, { x: -b.fx, y: -b.fy }, t, dur, ease),
    camTw([zoom, gzoom], { scale: a.s }, { scale: b.s }, t, dur, ease),

    tw.push(camTw(gpan2, { x: -a.fx * PF, y: -a.fy * PF }, { x: -b.fx * PF, y: -b.fy * PF }, t, dur, ease));
    tw.push(camTw(gzoom2, { scale: 1 + (a.s - 1) * PF }, { scale: 1 + (b.s - 1) * PF }, t, dur, ease));

// tronca il segmento attivo all'istante t; restituisce la posa della camera in quell'istante
const camCut = (t) => {
  const g = CAMQ.seg;
  if (!g) return { fx: CAM.fx, fy: CAM.fy, s: CAM.s };
  if (t >= g.t0 + g.dur - 1e-4) { CAMQ.seg = null; return { fx: g.to.fx, fy: g.to.fy, s: g.to.s }; }

// ═══ testo ═════════════════════════════════════════════════════════════════════════════════
// T01 · T02 · T07 · T08 — titolo parola per parola: ogni parola compare quando viene detta (grigia e sfocata →
// bianca e nitida in 0,2 s); il box d'accento nasce come cursore sottile e cresce insieme alle parole.
// spec: { lines: [[{t:"L'errore "},{t:"numero uno", box:true}], [{t:"dei principianti", hand:true, ul:true}]],
//         size, top, parent (default hud), x, y (centro/alto in coordinate del parent), align }

const titleW = (spec) => {
  const size = spec.size || 84;
  const parent = spec.parent || hud;
  const root = el(parent, { position: "absolute", left: spec.x == null ? 40 : spec.x - 500, top: spec.y == null ? spec.top || TITLE_TOP : spec.y, width: 1000, display: "flex", flexDirection: "column", alignItems: spec.align || "center", gap: spec.gap == null ? Math.round(size * 0.05) : spec.gap, zIndex: spec.z || 50 });

    const rowEl = el(root, { display: "flex", alignItems: "baseline", justifyContent: "center", whiteSpace: "nowrap" });
    line.forEach((seg) => {
      const hand = !!seg.hand, box = !!seg.box, ul = !!seg.ul;
      const fs = Math.round(size * (hand ? 1.1 : 1) * (seg.scale || 1));
      const toks = [];
      seg.t.split(/(\s+)/).filter(Boolean).forEach((p) => (/^\s+$/.test(p) && toks.length ? (toks[toks.length - 1] += p) : toks.push(p)));
      const grp = el(rowEl, { position: "relative", display: "inline-flex", alignItems: "baseline", margin: box ? `0 ${Math.round(size * 0.05)}px` : 0 }, null, "span");

        const w = el(grp, { position: "relative", display: "inline-block", whiteSpace: "pre", paddingLeft: box && first ? Math.round(size * 0.17) : 0, paddingRight: box && last ? Math.round(size * 0.17) : 0, zIndex: 1 }, null, "span");
        let bg = null, und = null;
        if (box) {
          const rr = Math.round(size * 0.08);
          bg = el(w, { position: "absolute", left: 0, top: Math.round(size * 0.02), width: "100%", height: Math.round(size * 1.04), background: "linear-gradient(180deg,#dcff74 0%,#CFFB50 55%,#bde83f 100%)", borderRadius: `${first ? rr : 0}px ${last ? rr : 0}px ${last ? rr : 0}px ${first ? rr : 0}px`, transformOrigin: "0 50%", zIndex: 0 });

// ═══ segnali ed effetti ════════════════════════════════════════════════════════════════════
// C03 · segnale col segno che viaggia sul connettore (reel 40 di Kallaway): un disco con "+" (lime pieno: segnale buono) o "−"
// (grafite col bordo bianco: segnale cattivo) percorre la linea in ~0,4 s (power1.inOut) e all'arrivo il punto d'arrivo pulsa.
// parent = layer del mondo che contiene lo svgLayer del connettore · conn = connector(...) · o: { sign: "+" | "-", d (46), z,
//   ring (true: anello all'arrivo), back (true: dall'ultimo punto al primo) } · restituisce l'istante d'arrivo

  const g = el(parent, { position: "absolute", left: -d / 2, top: -d / 2, width: d, height: d, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", zIndex: o.z || 30, pointerEvents: "none",
    background: plus ? "radial-gradient(circle at 38% 30%, #f6ffd8 0%, #dcff74 38%, #CFFB50 64%, #a9d436 100%)" : "radial-gradient(circle at 38% 30%, #5a5a5a 0%, #333 55%, #1c1c1c 100%)",

// F10 · disintegrazione (reel 40 di Kallaway): il riquadro si sbriciola dai bordi verso il centro in una polvere fitta che vola via
// allargandosi e si spegne (~0,7 s). Le particelle sono pezzi veri dell'immagine (stessi colori) disegnati su un canvas, con la
// scia nella direzione del volo (migliaia di particelle, deterministiche, seek-safe); qualche scintilla bianca dà la luce.
// node = elemento da sostituire (si spegne all'istante t); x, y, w, h = il suo riquadro nel parent; id = immagine del pool
// ("th-…", "av-…", "obj-…") che ne ricopre il contenuto (object-fit: cover). o: { cols (52), dur (0.7), spread (480), up (60),
//   sparks (40), z } → { cv, end } · misurato sul reel 40: il centro si sbriciola entro 0,13 s, la nuvola resta fitta fino al taglio
const disintegrate = (parent, node, x, y, w, h, id, t, o) => {

    const k = r * cols + c, dx = (c + 0.5) * pw - w / 2, dy = (r + 0.5) * ph - h / 2;

  }

      if (p <= 0) { ctx.globalAlpha = 1; ctx.drawImage(img, sx, sy, pw * kx, ph * kx, bx, by, pw + 0.6, ph + 0.6); continue; }
      // la polvere continua ad allargarsi (reel 40: si espande fino all'ultimo fotogramma): metà lineare, metà power2.out
      const e = 0.55 * p + 0.45 * (1 - (1 - p) * (1 - p)), v = 0.55 + 0.9 * (1 - p), sz = pw * (1 + (q.s1 - 1) * Math.min(1, p / 0.55));

// T09 · una parola del titolo viene sostituita (reel 4 e 46 di Kallaway): la parola si cancella lettera per lettera e la nuova si
// riscrive a macchina (~0,3 s in tutto), il resto del titolo resta. T = titleW(...) · i = indice della parola (in T.words)
const swapWord = (T, i, testo, t, o) => {

  const old = (tx.textContent || "").replace(/ /g, " ").replace(/\s+$/, ""), sp = /\s$/.test((tx.textContent || "").replace(/ /g, " ")) ? " " : "";

// T10 · il titolo si compatta (reel 26 di Kallaway, misurato): taglio secco — il titolo grande sparisce e in alto il titolo compatto
// si scrive parola per parola (~0,1 s l'una) dentro il box d'accento che nasce sottile e si allunga con le parole (come T02), così

// A06 · tipografia gigante che diventa l'oggetto (reel 139 e 150 di Kallaway): le parole del hook riempiono lo schermo una alla volta

const limeFill = (k) => `linear-gradient(180deg, ${shade(1.12 * k)} 0%, ${shade(1 * k)} 45%, ${shade(0.8 * k)} 100%)`;
// alone che resta fuori da una forma ritagliata (clip-path taglia box-shadow e filtri dell'elemento stesso)
const clipGlow = (parent, x, y, w, h, poly, z, a) => {
  const g = el(parent, { position: "absolute", left: x, top: y, width: w, height: h, filter: "blur(18px)", opacity: a == null ? 0.55 : a, zIndex: z, pointerEvents: "none" });
  el(g, { position: "absolute", inset: 0, clipPath: poly, background: "#CFFB50" });
  return g;
};
const drawable = (p) => { const L = p.getTotalLength(); p.setAttribute("stroke-dasharray", `${L} ${L}`); p.setAttribute("stroke-dashoffset", L); return L; };
const drawOn = (p, t, dur, ease) => tl.to(p, { attr: { "stroke-dashoffset": 0 }, duration: dur || 0.5, ease: ease || "power2.inOut" }, t);

// ═══ O24 · calendario che si riempie ═══════════════════════════════════════════════════════
// o: { mese:"Novembre", start (0=lun), giorni:30, cell, cellH (celle verticali per i video), gap, z }
// .fill(t, giorni, {step, conta})   → giorni che si accendono di lime (reel 82, 67, 94)
// .fillVideos(t, idVideo, {step})   → ogni giorno riceve un reel vero che si muove, in ordine (reel 68 e 59)
// .put(t, giorno, html)             → un'icona/contenuto in un giorno
const calendar = (parent, cx, cy, o) => {
  o = o || {};
  const cell = o.cell || 108, cellH = o.cellH || cell, gap = o.gap || 10, cols = 7;
  const start = o.start == null ? 2 : o.start, days = o.giorni || 30;
  const rows = Math.ceil((start + days) / 7);
  const gw = cols * cell + (cols - 1) * gap, gh = rows * cellH + (rows - 1) * gap;
  const pad = 34, head = 150;
  const W = gw + pad * 2, H = gh + head + pad;
  const c = glass(parent, cx - W / 2, cy - H / 2, W, H, { zIndex: o.z || 12 });
  el(c, { position: "absolute", left: pad, top: 26, fontFamily: FD, fontWeight: 700, fontSize: 58, color: K.white, textShadow: GLOW_T, whiteSpace: "nowrap" }, o.mese || "Novembre");
  const counter = el(c, { position: "absolute", right: pad, top: 34, fontFamily: FS, fontWeight: 800, fontSize: 30, color: K.lime, textShadow: GLOW_LT, opacity: 0, whiteSpace: "nowrap" }, "");
  "LMMGVSD".split("").forEach((d, i) => el(c, { position: "absolute", left: pad + i * (cell + gap), top: 104, width: cell, textAlign: "center", fontFamily: FS, fontWeight: 700, fontSize: 22, color: "rgba(255,255,255,.4)", letterSpacing: "0.1em" }, d));
  const cells = [];
  for (let d = 1; d <= days; d++) {
    const i = start + d - 1, x = pad + (i % 7) * (cell + gap), y = head + Math.floor(i / 7) * (cellH + gap);
    const b = el(c, { position: "absolute", left: x, top: y, width: cell, height: cellH, borderRadius: 16, background: "rgba(255,255,255,.045)", border: "1.5px solid rgba(255,255,255,.07)", overflow: "hidden" });
    const fillE = el(b, { position: "absolute", inset: 0, background: limeFill(1), opacity: 0 });
    const n = el(b, { position: "absolute", left: 10, top: 7, fontFamily: FS, fontWeight: 800, fontSize: 22, color: "rgba(255,255,255,.55)", zIndex: 6 }, String(d));
    cells.push({ b, fillE, n });
  }
  const conta = (t, n, dur, f) => {
    f = f || ((v) => `${Math.round(v)} contenuti`);
    tl.set(counter, { opacity: 1 }, t);
    const P = { v: 0 };
    tl.to(P, { v: n, duration: dur, ease: "none", onUpdate: () => (counter.textContent = f(P.v)) }, t);
    glowFlash(counter, t + dur, { base: GLOW_LT });
  };
  const fill = (t, list, o2) => {
    o2 = o2 || {};
    const step = o2.step == null ? 0.035 : o2.step;
    const L = list || cells.map((_, i) => i + 1);
    L.forEach((d, k) => {
      const cl = cells[d - 1];
      const tt = t + k * step;
      tl.to(cl.fillE, { opacity: 1, duration: 0.12 }, tt);
      tl.to(cl.n, { color: K.ink, duration: 0.12 }, tt);
      tl.fromTo(cl.b, { scale: 0.86 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, tt);
    });
    if (o2.conta) conta(t, L.length, L.length * step + 0.1, o2.label);
  };
  // i reel arrivano nei giorni in ordine, ~0,055 s l'uno (il mese si riempie in ~1,6 s come nel reel 68)
  const fillVideos = (t, ids, o2) => {
    o2 = o2 || {};
    const step = o2.step == null ? 0.055 : o2.step;
    const tiles = [];
    ids.forEach((id, k) => {
      const cl = cells[k];
      if (!cl) return;
      const tile = videoTile(cl.b, 0, 0, cell, cellH, id, 4);
      tile.style.borderRadius = "15px";
      gsap.set(tile, { opacity: 0, scale: 0.5 });
      const tt = t + k * step;
      tl.to(tile, { opacity: 1, duration: 0.05 }, tt);
      tl.to(tile, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, tt);
      tl.to(cl.n, { color: "#ffffff", textShadow: "0 1px 6px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.9)", duration: 0.08 }, tt);
      tl.to(cl.b, { borderColor: "rgba(255,255,255,.35)", duration: 0.1 }, tt);
      tiles.push(tile);
    });
    if (o2.conta !== false) conta(t, ids.length, ids.length * step + 0.1, o2.label);
    return tiles;
  };
  const put = (t, d, html) => {
    const cl = cells[d - 1];
    const m = el(cl.b, { position: "absolute", left: 0, top: 22, width: cell, height: cellH - 22, display: "flex", alignItems: "center", justifyContent: "center", zIndex: 3 }, html);
    gsap.set(m, { opacity: 0, scale: 0.6 });
    tl.to(m, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, t);
    return m;
  };
  // A06 · i giorni arrivano sparsi (fuori posto, ruotati) e si montano nella griglia in ~0,6 s (reel 139 di Kallaway)
  const assemble = (t, o2) => {
    o2 = o2 || {};
    const spr = o2.spread || 420, dd = o2.dur || 0.45;
    gsap.set(cells.map((cl) => cl.b), { opacity: 0 });
    cells.forEach((cl, k) => {
      const tt = t + ((hash(k + 7, 9) + 1) / 2) * dd;
      tl.fromTo(cl.b, { x: hash(k + 1, 3) * spr, y: hash(k + 41, 5) * spr * 1.2, rotation: hash(k + 81, 7) * 50, opacity: 0 }, { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, tt);
    });
    return t + dd + 0.5;
  };
  return { c, cells, fill, fillVideos, put, assemble, W, H, cell, cellH, pad, head };
};

// ═══ O23 · griglia di 100 puntini ══════════════════════════════════════════════════════════
// o: { cols, rows, gap, r, z } · light(t, n, dur): n puntini a caso diventano bianchi luminosi
// split(t, gruppi): colora i puntini a blocchi, es. [[70, K.lime], [20, "#fff"], [10, "rgba(255,255,255,.18)"]]
const dotGrid = (parent, cx, cy, o) => {
  o = o || {};
  const cols = o.cols || 10, rows = o.rows || 10, gap = o.gap || 62, r = o.r || 16;
  const W = (cols - 1) * gap + 2 * r + 80, H = (rows - 1) * gap + 2 * r + 80;
  const c = glass(parent, cx - W / 2, cy - H / 2, W, H, { zIndex: o.z || 12, borderRadius: 30 });
  const dots = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const d = el(c, { position: "absolute", left: 40 + i * gap, top: 40 + j * gap, width: r * 2, height: r * 2, borderRadius: "50%", background: "rgba(255,255,255,.22)" });
    dots.push(d);
  }
  gsap.set(dots, { opacity: 0 });
  const order = dots.map((_, i) => i).sort((a, b) => hash(a + 3, 17) - hash(b + 3, 17));
  const waveIn = (t, dur) => { for (let j = 0; j < rows; j++) tl.to(dots.slice(j * cols, j * cols + cols), { opacity: 1, duration: 0.12 }, t + j * ((dur || 0.5) / rows)); };
  const light = (t, n, dur, color) => {
    const pick = order.slice(0, n);
    pick.forEach((i, k) => {
      const tt = t + ((hash(k + 11, 4) + 1) / 2) * (dur || 1.6);
      tl.to(dots[i], { background: color || "#ffffff", boxShadow: color ? GLOW_A(0.8) : "0 0 14px rgba(255,255,255,.9)", duration: 0.08 }, tt);
    });
    return pick;
  };
  const recolor = (t, idx, color) => tl.to(idx.map((i) => dots[i]), { background: color, boxShadow: color === K.lime ? GLOW_A(0.8) : "none", duration: 0.05 }, t);
  const split = (t, gruppi, step) => {
    let k = 0;
    gruppi.forEach(([n, color]) => {
      for (let q = 0; q < n && k < dots.length; q++, k++) tl.to(dots[k], { background: color, boxShadow: color === K.lime ? GLOW_A(0.7) : "none", duration: 0.08 }, t + k * (step == null ? 0.012 : step));
    });
  };
  return { c, dots, waveIn, light, recolor, split, W, H };
};

// ═══ D07 · formula che si compone ══════════════════════════════════════════════════════════
// terms: [{v:"5", l:"sotto-nicchie"}, {op:"×"}, {v:"10", l:"formati"}, {op:"×"}, {v:"7", l:"angoli"}, {op:"="}, {v:"350", res:true, l:"contenuti"}]
const equation = (parent, cx, cy, terms, o) => {
  o = o || {};
  if (o.vertical) return equationV(parent, cx, cy, terms, o);
  const fs = o.fs || 150;
  const row = el(parent, { position: "absolute", left: cx - 1000, top: cy - fs * 0.6, width: 2000, display: "flex", justifyContent: "center", alignItems: "flex-start", gap: Math.round(fs * 0.16), zIndex: o.z || 14 });
  const items = terms.map((tm) => {
    const col = el(row, { display: "flex", flexDirection: "column", alignItems: "center" });
    const big = el(col, { fontFamily: tm.op ? FS : FD, fontWeight: tm.op ? 300 : 700, fontSize: tm.op ? fs * 0.62 : fs * (tm.res ? 1.12 : 1), lineHeight: 1, color: tm.res ? K.lime : tm.op ? "rgba(255,255,255,.6)" : K.white, textShadow: tm.res ? GLOW_LT : GLOW_T, marginTop: tm.op ? fs * 0.22 : 0, whiteSpace: "nowrap" }, tm.res ? "0" : tm.v || tm.op);
    let lab = null;
    if (tm.l) lab = el(col, { marginTop: 10, fontFamily: FH, fontSize: Math.round(fs * 0.26), color: tm.res ? K.lime : "rgba(255,255,255,.75)", whiteSpace: "nowrap" }, tm.l);
    gsap.set(col, { opacity: 0, filter: "blur(10px)", y: 24, scale: 0.9 });
    return { col, big, lab, tm };
  });
  // show(i, t): fa entrare il termine i (il risultato conta e brilla)
  const show = (i, t, dur) => {
    const it = items[i];
    tl.to(it.col, { opacity: 1, filter: "blur(0px)", y: 0, scale: 1, duration: 0.32, ease: "back.out(1.8)" }, t);
    tl.set(it.col, { filter: "none" }, t + 0.33);
    if (it.tm.res) {
      const to = Number(String(it.tm.v).replace(/\D/g, "")) || 0;
      const P = { v: 0 };
      tl.to(P, { v: to, duration: dur || 0.7, ease: "power1.out", onUpdate: () => (it.big.textContent = itNum(P.v) + (it.tm.suffix || "")) }, t);
      glowFlash(it.big, t + (dur || 0.7), { base: GLOW_LT, peak: "0 0 18px rgba(207,251,80,1), 0 0 70px rgba(207,251,80,.8), 0 0 140px rgba(207,251,80,.45)" });
    }
  };
  return { row, items, show };
};

// D07 verticale (reel 117 di Kallaway): i termini impilati in un riquadro tratteggiato, operatore a sinistra, etichetta a
// destra, una riga sopra il risultato in lime che conta e brilla. Molto più "pieno" della formula in riga.
const equationV = (parent, cx, cy, terms, o) => {
  const fs = o.fs || 130, rowH = Math.round(fs * 1.22), w = o.w || 860;
  const rows = terms.filter((tm) => !tm.op);
  const H = rows.length * rowH + 120;
  const box = el(parent, { position: "absolute", left: cx - w / 2, top: cy - H / 2, width: w, height: H, borderRadius: 30, background: "linear-gradient(180deg, rgba(48,48,48,.55), rgba(24,24,24,.75))", border: "3px dashed rgba(255,255,255,.28)", boxShadow: "0 30px 80px rgba(0,0,0,.5)", zIndex: o.z || 13 });
  gsap.set(box, { opacity: 0, scale: 0.94 });
  const items = [];
  let r = 0, pendingOp = null;
  terms.forEach((tm) => {
    if (tm.op) { pendingOp = tm.op; return; }
    const y = 60 + r * rowH;
    const rowEl = el(box, { position: "absolute", left: 0, top: y, width: w, height: rowH, display: "flex", alignItems: "center", gap: Math.round(fs * 0.22), padding: `0 ${Math.round(fs * 0.4)}px` });
    const opTxt = pendingOp || "";
    const op = el(rowEl, { width: Math.round(fs * 0.5), textAlign: "center", fontFamily: FS, fontWeight: 300, fontSize: Math.round(fs * 0.6), color: "rgba(255,255,255,.55)" }, opTxt);
    // il risultato sta su una pill lime piena (come il "10.6M" in rosso del reel 117): è il punto della scena
    const big = el(rowEl, Object.assign({ fontFamily: FD, fontWeight: 700, fontSize: tm.res ? Math.round(fs * 1.02) : fs, lineHeight: 1, color: tm.res ? K.ink : K.white, textShadow: tm.res ? "none" : GLOW_T, whiteSpace: "nowrap" },
      tm.res ? { background: "linear-gradient(180deg,#e6ff94 0%,#CFFB50 55%,#bde83f 100%)", borderRadius: Math.round(fs * 0.16), padding: `${Math.round(fs * 0.1)}px ${Math.round(fs * 0.22)}px ${Math.round(fs * 0.04)}px`, boxShadow: `${GLOW_A(0.9)}, inset 0 2px 0 rgba(255,255,255,.6)` } : {}), tm.res ? "0" : tm.v);
    const lab = el(rowEl, { fontFamily: FH, fontSize: Math.round(fs * (tm.res && tm.tag ? 0.3 : 0.38)), color: tm.res ? K.lime : "rgba(255,255,255,.85)", textShadow: tm.res ? GLOW_LT : "none", whiteSpace: "nowrap", marginTop: Math.round(fs * 0.12) }, tm.l || "");
    // o.units: la quantità disegnata come mini-reel 9:16 a destra (5 → cinque reel): riempie la riga e rende concreto il numero
    if (o.units && !tm.res) {
      const nU = Math.min(12, Number(tm.v) || 0), uw0 = Math.round(fs * (o.unit || 0.2)), uh0 = Math.round(uw0 * 1.62), ug = Math.round(uw0 * 0.3);
      const per = nU > 6 ? Math.ceil(nU / 2) : nU;
      const uw = el(rowEl, { marginLeft: "auto", display: "flex", flexWrap: "wrap", gap: ug, width: per * uw0 + (per - 1) * ug, justifyContent: "flex-end" });
      for (let q = 0; q < nU; q++) el(uw, { width: uw0, height: nU > 6 ? Math.round(uh0 * 0.8) : uh0, borderRadius: Math.round(uw0 * 0.22), background: "linear-gradient(180deg,#e6ff94,#CFFB50 55%,#b6e23c)", boxShadow: `${GLOW_A(0.45)}, inset 0 1.5px 0 rgba(255,255,255,.6)` }, `<div style="width:0;height:0;margin:${Math.round(uh0 * 0.3)}px auto 0;border-top:${Math.round(uw0 * 0.2)}px solid transparent;border-bottom:${Math.round(uw0 * 0.2)}px solid transparent;border-left:${Math.round(uw0 * 0.3)}px solid rgba(30,30,30,.55)"></div>`);
    }
    // tm.tag: etichetta sulla riga del risultato (es. "≈ 1 anno"), lega il numero al titolo
    if (tm.res && tm.tag) el(rowEl, { marginLeft: "auto", display: "flex", alignItems: "center", gap: Math.round(fs * 0.07), padding: `${Math.round(fs * 0.06)}px ${Math.round(fs * 0.13)}px`, borderRadius: Math.round(fs * 0.12), border: `3px solid ${K.lime}`, boxShadow: GLOW_A(0.4), fontFamily: FS, fontWeight: 800, fontSize: Math.round(fs * 0.21), color: K.lime, textShadow: GLOW_LT, whiteSpace: "nowrap", flexShrink: 0 }, svg(tm.icon || "calendar", Math.round(fs * 0.21), K.lime, 2.4) + tm.tag);
    if (opTxt === "=" || tm.res) el(box, { position: "absolute", left: Math.round(fs * 0.4), top: y - 6, width: w - Math.round(fs * 0.8), height: 3, borderRadius: 2, background: "rgba(255,255,255,.55)" });
    gsap.set(rowEl, { opacity: 0, filter: "blur(10px)", x: 30 });
    items.push({ col: rowEl, big, lab, tm });
    pendingOp = null;
    r++;
  });
  let shown = false;
  const show = (i, t, dur) => {
    if (!shown) { tl.to(box, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, t - 0.1); shown = true; }
    const it = items[i];
    tl.to(it.col, { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.32, ease: "power3.out" }, t);
    tl.set(it.col, { filter: "none" }, t + 0.33);
    if (it.tm.res) {
      const to = Number(String(it.tm.v).replace(/\D/g, "")) || 0;
      const P = { v: 0 };
      tl.to(P, { v: to, duration: dur || 0.7, ease: "power1.out", onUpdate: () => (it.big.textContent = itNum(P.v) + (it.tm.suffix || "")) }, t);
      const te = t + (dur || 0.7);
      tl.to(it.big, { boxShadow: "0 0 30px rgba(207,251,80,1), 0 0 120px rgba(207,251,80,.75), inset 0 2px 0 rgba(255,255,255,.6)", scale: 1.06, duration: 0.08, ease: "power2.out" }, te);
      tl.to(it.big, { boxShadow: `${GLOW_A(0.9)}, inset 0 2px 0 rgba(255,255,255,.6)`, scale: 1, duration: 0.4, ease: "power2.out" }, te + 0.09);
    }
  };
  return { box, items, show, W: w, H };
};

// ═══ U03 · cursore che si muove e clicca ══════════════════════════════════════════════════
const cursor = (parent, x, y, o) => {
  o = o || {};
  const s = o.size || 64;
  const c = el(parent, { position: "absolute", left: 0, top: 0, width: s, height: s, zIndex: o.z || 70, pointerEvents: "none" },
    `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M4 2.5 L4 19.5 L8.6 15.4 L11.6 22 L14.6 20.7 L11.7 14.2 L18 14.2 Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>`);
  c.style.filter = "drop-shadow(0 6px 10px rgba(0,0,0,.55))";
  gsap.set(c, { x: x - s * 0.17, y: y - s * 0.1, opacity: 0 });
  let cx0 = x, cy0 = y;
  return {
    c,
    show: (t) => tl.to(c, { opacity: 1, duration: 0.15 }, t),
    hide: (t) => tl.to(c, { opacity: 0, duration: 0.2 }, t),
    moveTo: (t, x2, y2, dur) => { tl.to(c, { x: x2 - s * 0.17, y: y2 - s * 0.1, duration: dur || 0.45, ease: "power3.inOut" }, t); cx0 = x2; cy0 = y2; },
    click: (t) => {
      tl.to(c, { scale: 0.82, duration: 0.07, ease: "power2.out", transformOrigin: "17% 10%" }, t);
      tl.to(c, { scale: 1, duration: 0.18, ease: "back.out(3)" }, t + 0.08);
      ripple(parent, cx0, cy0, t + 0.04, { r: 46, s0: 0.3, s1: 1.3, w: 3, dur: 0.4, color: "#ffffff", glow: false, z: (o.z || 70) - 1 });
    },
  };
};

// ═══ O13 · cervello luminoso ══════════════════════════════════════════════════════════════
// Oggetto vero, non un'icona (regola dell'utente per tutti gli oggetti-metafora): cervello a raggi X di Adobe Stock 318556173
// scontornato con Photoshop → _tools/oggetto_da_stock.py → assets/obj/cervello.png (bianco) + cervello_lime.png (acceso).
// Il vecchio cervello procedurale è in assets/obj_archivio/. .on() lo accende di lime con neuroni e alone.
const brain = (parent, cx, cy, size, o) => {
  o = o || {};
  const g = el(parent, { position: "absolute", left: cx - size / 2, top: cy - size / 2, width: size, height: size, zIndex: o.z || 12 });
  const halo = el(g, { position: "absolute", left: -size * 0.2, top: -size * 0.2, width: size * 1.4, height: size * 1.4, borderRadius: "50%", background: "radial-gradient(circle, rgba(207,251,80,.34) 0%, rgba(207,251,80,.10) 40%, rgba(207,251,80,0) 68%)", opacity: 0 });
  const base = el(g, { position: "absolute", left: 0, top: 0, width: size, height: size });
  imgIn(base, o.img || "obj-cervello");
  const lit = el(g, { position: "absolute", left: 0, top: 0, width: size, height: size, opacity: 0 });
  imgIn(lit, o.imgOn || "obj-cervello_lime");
  const N = [[0.30, 0.30], [0.46, 0.22], [0.62, 0.27], [0.38, 0.44], [0.56, 0.42], [0.72, 0.40], [0.28, 0.52], [0.48, 0.56]].map(([u, v]) =>
    el(g, { position: "absolute", left: size * u - 6, top: size * v - 6, width: 12, height: 12, borderRadius: "50%", background: "#fff", boxShadow: "0 0 12px #fff, 0 0 26px rgba(207,251,80,.8)", opacity: 0 }));
  // lampo dello strobo: copia accesa, più luminosa, sopra al cervello (si vede solo per 2 fotogrammi)
  const fla = el(g, { position: "absolute", left: 0, top: 0, width: size, height: size, opacity: 0, filter: "brightness(1.75) drop-shadow(0 0 24px rgba(207,251,80,.9))" });
  imgIn(fla, o.imgOn || "obj-cervello_lime");
  const F1 = 1 / 30;
  return {
    g, halo,
    on: (t) => { tl.to([lit, halo], { opacity: 1, duration: 0.3 }, t); tl.to(base, { opacity: 0, duration: 0.3 }, t); N.forEach((d, i) => { tl.to(d, { opacity: 1, duration: 0.08 }, t + 0.05 + i * 0.04); tl.to(d, { opacity: 0.35, duration: 0.4 }, t + 0.3 + i * 0.04); }); },
    off: (t) => { tl.to([lit, halo], { opacity: 0, duration: 0.3 }, t); tl.to(base, { opacity: 1, duration: 0.3 }, t); tl.to(N, { opacity: 0, duration: 0.2 }, t); },
    spark: (t) => N.forEach((d, i) => { tl.to(d, { opacity: 1, duration: 0.06 }, t + ((hash(i, 3) + 1) / 2) * 0.5); tl.to(d, { opacity: 0, duration: 0.3 }, t + 0.1 + ((hash(i, 3) + 1) / 2) * 0.5); }),

    accendi: (t, o2) => {

    },
    // .strobo (reel 62, 2,97–3,60 s): lampi di 2 fotogrammi ogni 0,30 s (o.n = 3), un'onda lime si allarga dopo il primo

      tl.to(N, { opacity: 0, duration: 0.2 }, t);
      if (o2.dim !== false) tl.to(g, { filter: `brightness(${o2.dim || 0.62}) saturate(.4)`, duration: 0.4 }, t);

  };
};

// ═══ O14 · slot machine (reel 79 e 118 di Kallaway) ═════════════════════════════════════════
// Oggetto vero: Adobe Stock 730774093 scontornato con Photoshop e portato in grafite da _tools/oggetti_adobe.py (testi
// inventati dall'IA ripuliti, finestre dei rulli vuote, leva tolta). Rulli, luci e leva sono del kit: .spin() fa girare
// i rulli (sfocati) e li ferma sui simboli, .pull() tira la leva (pomo lime), .win() accende la riga vincente e le luci.
// Simboli: nomi di icone Lucide, testo breve o id del pool ("av-…", "th-…"); o.reels = 3 liste (default: ricompense IG).
// SLOT_GEO = frazioni dell'immagine stampate da oggetti_adobe.py: se si rifà l'asset, vanno aggiornate.
const SLOT_GEO = {
  ratio: 0.7008, reels: [[0.2596, 0.2138, 0.3718, 0.4801], [0.4218, 0.2138, 0.536, 0.4801], [0.5842, 0.2138, 0.6982, 0.4801]],
  pomo: [0.936, 0.4294, 0.0538], perno: [0.9276, 0.7616], asta: [0.9276, 0.466], luci: [[0.1897, 0.6447, 0.3706, 0.6845], [0.4245, 0.6447, 0.5866, 0.6845]],

const slotCell = (parent, y, w, h, s) => {
  const c = el(parent, { position: "absolute", left: 0, top: y, width: w, height: h, display: "flex", alignItems: "center", justifyContent: "center", borderBottom: "2px solid rgba(0,0,0,.14)", background: "linear-gradient(90deg, #c9ccc4 0%, #f3f4ef 28%, #f7f8f3 50%, #f3f4ef 72%, #c9ccc4 100%)" });
  const m = Math.min(w, h);
  if (/^(av|th|obj)-/.test(s)) { const d = el(c, { position: "relative", width: m * 0.74, height: m * 0.74, borderRadius: "50%", overflow: "hidden", border: `3px solid ${K.ink}` }); imgIn(d, s, { objectFit: "cover" }); }
  else if (ICON[s]) c.innerHTML = svg(s, Math.round(m * 0.62), K.ink, 2.5);
  else el(c, { fontFamily: FD, fontWeight: 700, fontSize: Math.round(Math.min(h * 0.42, (w * 1.75) / Math.max(1, s.length))), color: K.ink, whiteSpace: "nowrap", lineHeight: 1 }, s);
  return c;
};
const slotMachine = (parent, cx, cy, h, o) => {
  o = o || {};
  const G = SLOT_GEO, W = Math.round(h * G.ratio), x0 = cx - W / 2, y0 = cy - h / 2;
  const g = layered(el(parent, { position: "absolute", left: x0, top: y0, width: W, height: h, zIndex: o.z || 12 }));
  // controluce: stacca la lacca nera dallo sfondo scuro
  el(g, { position: "absolute", left: -W * 0.3, top: -h * 0.12, width: W * 1.6, height: h * 1.24, background: "radial-gradient(ellipse 50% 50% at 50% 42%, rgba(255,255,255,.09), rgba(255,255,255,0) 70%)" });
  const halo = el(g, { position: "absolute", left: -W * 0.35, top: -h * 0.15, width: W * 1.7, height: h * 1.3, background: `radial-gradient(ellipse 50% 50% at 50% 40%, ${rgba(K.lime, 0.3)}, ${rgba(K.lime, 0.08)} 45%, rgba(207,251,80,0) 70%)`, opacity: 0 });
  const body = el(g, { position: "absolute", left: 0, top: 0, width: W, height: h, filter: "drop-shadow(0 30px 60px rgba(0,0,0,.6))" });
  imgIn(body, o.img || "obj-slot");
  const SYM = o.reels || [["heart", "message-circle", "user-plus", "send", "bookmark", "eye"], ["eye", "heart", "bookmark", "message-circle", "send", "user-plus"], ["user-plus", "send", "heart", "eye", "message-circle", "bookmark"]];
  const R = 7; // ripetizioni della striscia: bastano per un giro lungo, poi .spin() la riporta in cima
  const reels = G.reels.map(([u0, v0, u1, v1], i) => {
    const rw = (u1 - u0) * W, rh = (v1 - v0) * h, ch = rh / 3, list = SYM[i % SYM.length], N = list.length;
    const win = el(g, { position: "absolute", left: u0 * W, top: v0 * h, width: rw, height: rh, overflow: "hidden", background: "#e9ebe4" });
    const strip = el(win, { position: "absolute", left: 0, top: 0, width: rw, height: ch * N * R });
    for (let r = 0; r < R; r++) list.forEach((s, k) => slotCell(strip, (r * N + k) * ch, rw, ch, s));
    // cilindro: ombra sopra e sotto, riflesso obliquo del vetro
    el(win, { position: "absolute", left: 0, top: 0, width: rw, height: rh, background: "linear-gradient(180deg, rgba(0,0,0,.74) 0%, rgba(0,0,0,.2) 22%, rgba(0,0,0,0) 38%, rgba(0,0,0,0) 62%, rgba(0,0,0,.2) 78%, rgba(0,0,0,.74) 100%)" });
    el(win, { position: "absolute", left: 0, top: 0, width: rw, height: rh, background: "linear-gradient(104deg, rgba(255,255,255,0) 28%, rgba(255,255,255,.18) 40%, rgba(255,255,255,0) 52%)" });
    const frame = el(win, { position: "absolute", left: 0, top: ch, width: rw, height: ch, boxSizing: "border-box", border: `4px solid ${K.lime}`, boxShadow: `inset 0 0 16px ${rgba(K.lime, 0.55)}`, opacity: 0 });
    const k0 = o.start ? o.start[i] : i;
    const st = { win, strip, ch, N, frame, idx: (R - 2) * N + k0 }; // cella al centro della finestra

  });
  const luci = G.luci.map(([u0, v0, u1, v1]) => el(g, { position: "absolute", left: u0 * W, top: v0 * h, width: (u1 - u0) * W, height: (v1 - v0) * h, borderRadius: 4, background: `linear-gradient(180deg, #f4ffd6 0%, ${K.lime} 38%, ${K.lime} 100%)`, boxShadow: GLOW_L(0.8), opacity: 0 }));
  // leva del kit: asta cromata + pomo lime (la foto non ce l'ha più)
  const [pu, pv] = G.perno, [, av] = G.asta, [ku, kv, kr] = G.pomo;
  const rodW = W * 0.03, rodH = (pv - av) * h, KR = kr * W;
  const rod = el(g, { position: "absolute", left: pu * W - rodW / 2, top: av * h, width: rodW, height: rodH, borderRadius: rodW / 2, background: "linear-gradient(90deg, #2c2c2c 0%, #cfcfcf 34%, #ffffff 47%, #8c8c8c 70%, #262626 100%)", transformOrigin: "50% 100%" });
  const knob = el(g, { position: "absolute", left: ku * W - KR, top: kv * h - KR, width: 2 * KR, height: 2 * KR, borderRadius: "50%", background: `radial-gradient(circle at 34% 30%, #ffffff 0%, #f4ffd6 12%, ${K.lime} 44%, #a6cc35 100%)`, boxShadow: `0 10px 24px rgba(0,0,0,.55), ${GLOW_L(0.45)}` });

    for (let k = 0; k * step < dur; k++) luci.forEach((l, j) => tl.set(l, { opacity: (k + j) % 2 ? 0.25 : 1 }, t + k * step));

  };
  return {
    g, W, H: h, reels, rect: [x0 - W * 0.02, y0, x0 + W * 1.02, y0 + h],
    knobXY: () => [x0 + ku * W, y0 + kv * h],
    // tira la leva: l'asta ruota verso chi guarda (si accorcia), il pomo scende e si avvicina
    pull: (t) => {
      tl.to(rod, { scaleY: 0.1, duration: 0.26, ease: "power2.in" }, t);
      tl.to(knob, { y: rodH * 0.9, scale: 1.2, duration: 0.26, ease: "power2.in" }, t);
      tl.to(rod, { scaleY: 1, duration: 0.6, ease: "back.out(1.8)" }, t + 0.34);
      tl.to(knob, { y: 0, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, t + 0.34);
    },
    // stops = indice del simbolo su cui si ferma ogni rullo, oppure il nome di un simbolo (tris: vince); giri interi
    // prima di fermarsi; le luci lampeggiano finché gira. Restituisce l'istante dell'ultimo stop (→ .win()).
    spin: (t, stops, oo) => {
      oo = oo || {};
      const dur = oo.dur || 1.1, stag = oo.stagger == null ? 0.28 : oo.stagger, giri = Math.min(4, oo.giri || 3);
      if (typeof stops === "string") { const nome = stops; stops = reels.map((r, i) => Math.max(0, SYM[i % SYM.length].indexOf(nome))); }
      reels.forEach((r, i) => {
        const k = stops[i] % r.N, cur = r.idx % r.N, d = giri * r.N + ((cur - k + r.N) % r.N);
        const end = r.idx - d, ti = dur + i * stag;
        tl.to(r.strip, { y: -(r.idx - 1) * r.ch - r.ch * 0.22, duration: 0.12, ease: "power2.out" }, t);   // carica
        tl.to(r.strip, { y: -(end - 1) * r.ch, duration: ti, ease: "back.out(1.25)" }, t + 0.12);
        tl.to(r.strip, { filter: "blur(5px)", duration: 0.1, ease: "power1.in" }, t + 0.12);
        tl.to(r.strip, { filter: "blur(0px)", duration: 0.22, ease: "power1.out" }, t + 0.12 + ti * 0.55);

        r.idx = (R - 2) * r.N + k;
        tl.set(r.strip, { y: -(r.idx - 1) * r.ch }, t + 0.14 + ti);
      });
      const stop = t + 0.12 + dur + (reels.length - 1) * stag;   // istante dell'ultimo stop
      if (oo.luci !== false) blink(t, stop - t, 0.12);

    },
    win: (t) => {
      reels.forEach((r, i) => { tl.to(r.frame, { opacity: 1, duration: 0.12 }, t + i * 0.06); });
      tl.to(luci, { opacity: 1, duration: 0.1 }, t);
      tl.to(halo, { opacity: 1, duration: 0.3 }, t);
      tl.to(knob, { boxShadow: `0 10px 24px rgba(0,0,0,.55), ${GLOW_L(1)}`, duration: 0.3 }, t);
    },
    unwin: (t) => {
      tl.to(reels.map((r) => r.frame), { opacity: 0, duration: 0.25 }, t);
      tl.to([...luci, halo], { opacity: 0, duration: 0.3 }, t);
    },
    lights: (t, dur) => blink(t, dur || 1, 0.14),
  };
};

// ═══ fotocamera vera (script 24/09 "davanti alla telecamera" e 11/10 "non è la fotocamera") ═══════════
// Adobe Stock 285265822 (mirrorless argento, obiettivo verso chi guarda), colori veri appena desaturati.
// .rec() accende la spia rossa (lampeggia per dur s), .shutter() scatta (il vetro si chiude + lampo), .glint() riflesso
// che passa sul vetro, .lens() = centro e raggio del vetro nel mondo (entrare nell'obiettivo: match cut sul nero).
const CAM_GEO = { ratio: 1.3707, vetro: [0.2707, 0.6476, 0.1039], rec: [0.7601, 0.2946] };
const fotocamera = (parent, cx, cy, w, o) => {
  o = o || {};
  const G = CAM_GEO, h = Math.round(w / G.ratio), x0 = cx - w / 2, y0 = cy - h / 2;
  const g = layered(el(parent, { position: "absolute", left: x0, top: y0, width: w, height: h, zIndex: o.z || 12 }));
  el(g, { position: "absolute", left: -w * 0.15, top: -h * 0.2, width: w * 1.3, height: h * 1.4, background: "radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,255,255,.07), rgba(255,255,255,0) 70%)" });
  const body = el(g, { position: "absolute", left: 0, top: 0, width: w, height: h, filter: "drop-shadow(0 34px 50px rgba(0,0,0,.6))" });
  imgIn(body, o.img || "obj-fotocamera");
  const [vu, vv, vr] = G.vetro, R = vr * w, LX = vu * w, LY = vv * h;
  const glass = el(g, { position: "absolute", left: LX - R, top: LY - R, width: 2 * R, height: 2 * R, borderRadius: "50%", overflow: "hidden" });
  const sweep = el(glass, { position: "absolute", left: -2 * R, top: -R, width: R * 0.9, height: R * 4, background: "linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0))", transform: "rotate(28deg)", opacity: 0.9 });
  const iris = el(glass, { position: "absolute", left: 0, top: 0, width: 2 * R, height: 2 * R, borderRadius: "50%", background: "radial-gradient(circle, #040404 0%, #0a0a0a 72%, #1b1b1b 100%)" });
  tl.set(iris, { scale: 0 }, 0);
  const flash = el(g, { position: "absolute", left: LX - R * 2.6, top: LY - R * 2.6, width: R * 5.2, height: R * 5.2, borderRadius: "50%", background: "radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 28%, rgba(255,255,255,0) 64%)", opacity: 0 });
  const [ru, rv] = G.rec, rr = Math.max(6, w * 0.012);
  const rec = el(g, { position: "absolute", left: ru * w - rr, top: rv * h - rr, width: 2 * rr, height: 2 * rr, borderRadius: "50%", background: "#ff3b30", boxShadow: "0 0 10px #ff3b30, 0 0 28px rgba(255,59,48,.75)", opacity: 0 });

    g, W: w, H: h, rect: [x0, y0, x0 + w, y0 + h],
    lens: () => ({ x: x0 + LX, y: y0 + LY, r: R }),
    rec: (t, dur) => {
      tl.to(rec, { opacity: 1, duration: 0.06 }, t);
      for (let k = 0.6; k < (dur || 0); k += 1) { tl.to(rec, { opacity: 0.2, duration: 0.2 }, t + k); tl.to(rec, { opacity: 1, duration: 0.2 }, t + k + 0.45); }
    },
    recOff: (t) => tl.to(rec, { opacity: 0, duration: 0.15 }, t),
    glint: (t, dur) => tl.fromTo(sweep, { x: 0 }, { x: R * 4.4, duration: dur || 0.9, ease: "power2.inOut", immediateRender: false }, t),
    shutter: (t) => {
      tl.to(iris, { scale: 1, duration: 0.07, ease: "power2.in" }, t);
      tl.to(iris, { scale: 0, duration: 0.18, ease: "power2.out" }, t + 0.11);
      tl.to(flash, { opacity: 1, duration: 0.04 }, t + 0.08);
      tl.to(flash, { opacity: 0, duration: 0.45, ease: "power2.out" }, t + 0.14);
    },
  };

// ═══ faro da studio con fascio di luce (script 11/10 "è dove metti la luce") ═════════════════════════
// Adobe Stock 329591900 (flash con alette), metallo neutro; faro_on.png = parabola incandescente. Il fascio è del kit,
// bianco caldo in screen (mai lime trasparente: diventa oliva). La parabola guarda in alto a destra (asse -27°): il soggetto
// da illuminare va lì, oppure o.flip = specchiato (fascio in alto a sinistra). o.len = lunghezza del fascio, o.spread = apertura.
const FARO_GEO = { ratio: 1.0368, parabola: [0.597, 0.4031], semiasse: 0.1268, ang: -27.2 };
const faro = (parent, cx, cy, w, o) => {
  o = o || {};
  const G = FARO_GEO, h = Math.round(w / G.ratio), x0 = cx - w / 2, y0 = cy - h / 2;
  const g = layered(el(parent, { position: "absolute", left: x0, top: y0, width: w, height: h, zIndex: o.z || 12, transform: o.flip ? "scaleX(-1)" : "none" }));
  const body = el(g, { position: "absolute", left: 0, top: 0, width: w, height: h, filter: "drop-shadow(0 30px 50px rgba(0,0,0,.6))" });
  imgIn(body, o.img || "obj-faro");
  const lit = el(g, { position: "absolute", left: 0, top: 0, width: w, height: h, opacity: 0 });
  imgIn(lit, o.imgOn || "obj-faro_on");
  const BX = G.parabola[0] * w, BY = G.parabola[1] * h, dir = o.dir == null ? G.ang : o.dir, len = o.len || w * 2.3;
  const s0 = 2 * G.semiasse * w * 0.9, s1 = s0 + 2 * len * Math.tan(((o.spread || 12) * Math.PI) / 180);
  // fascio: involucro sfocato (bordi morbidi) > trapezio con gradiente; il nucleo è più stretto e più chiaro
  const beam = el(g, { position: "absolute", left: BX, top: BY - s1 / 2, width: len, height: s1, transformOrigin: `0px ${s1 / 2}px`, opacity: 0, mixBlendMode: "screen", pointerEvents: "none" });
  const cone = (k, a0, blur) => {
    const wrap = el(beam, { position: "absolute", left: 0, top: 0, width: len, height: s1, filter: `blur(${blur}px)` });
    const e0 = (s0 * k) / 2, e1 = (s1 * k) / 2, m = s1 / 2;
    el(wrap, { position: "absolute", left: 0, top: 0, width: len, height: s1, clipPath: `polygon(0px ${m - e0}px, ${len}px ${m - e1}px, ${len}px ${m + e1}px, 0px ${m + e0}px)`, background: `linear-gradient(90deg, rgba(255,252,236,${a0}) 0%, rgba(255,252,236,${(a0 * 0.4).toFixed(3)}) 50%, rgba(255,252,236,0) 100%)` });
  };
  cone(1, 0.42, 16);
  cone(0.55, 0.5, 8);
  tl.set(beam, { rotation: dir }, 0);
  const halo = el(g, { position: "absolute", left: BX - s0 * 1.1, top: BY - s0 * 1.1, width: s0 * 2.2, height: s0 * 2.2, borderRadius: "50%", background: `radial-gradient(circle, rgba(255,255,255,.75) 0%, rgba(244,255,214,.35) 30%, ${rgba(K.lime, 0.1)} 52%, rgba(207,251,80,0) 70%)`, opacity: 0, mixBlendMode: "screen" });
  const fl = (t, els, a) => { tl.to(els, { opacity: a, duration: 0.05 }, t); tl.to(els, { opacity: a * 0.3, duration: 0.05 }, t + 0.07); tl.to(els, { opacity: a, duration: 0.06 }, t + 0.14); };
  return {
    g, W: w, H: h, rect: [x0, y0, x0 + w, y0 + h],
    // punto del mondo a frazione f del fascio (dove mettere ciò che viene illuminato)
    target: (f) => {
      const d = len * (f == null ? 0.8 : f), a = (dir * Math.PI) / 180, lx = BX + Math.cos(a) * d, ly = BY + Math.sin(a) * d;
      return [x0 + (o.flip ? w - lx : lx), y0 + ly];
    },
    // sogg = elementi illuminati dal fascio: restano in penombra finché il faro non si accende
    on: (t, sogg) => {
      fl(t, lit, 1); fl(t + 0.02, [halo, beam], 1);
      if (sogg) { tl.set(sogg, { filter: "brightness(0.32) saturate(0.6)" }, 0); tl.to(sogg, { filter: "brightness(1.06) saturate(1)", duration: 0.3, ease: "power2.out" }, t + 0.16); }
    },
    off: (t) => tl.to([lit, halo, beam], { opacity: 0, duration: 0.25 }, t),
    // il fascio respira appena (luce viva) tra t0 e t1
    live: (t0, t1) => { for (let k = 0, t = t0; t < t1; k++, t += 0.6) tl.to(beam, { opacity: 0.86 + 0.14 * ((hash(k, 7) + 1) / 2), duration: 0.6, ease: "sine.inOut" }, t); },
  };
