    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        // ═══ base ═══════════════════════════════════════════════════════════════════════════════════════════════
        bokeh($("bokeh"), [
          [120, 320, 360, 0.06], [620, -60, 260, 0.035, true], [860, 720, 420, 0.05], [180, 1150, 300, 0.04, true],
          [1650, 450, 380, 0.05], [2300, 1000, 420, 0.05, true], [3000, 600, 400, 0.06], [2600, -1400, 380, 0.045],
          [-400, 1900, 420, 0.05], [2200, 2600, 380, 0.045, true], [3300, -2000, 420, 0.05], [4200, -900, 380, 0.05, true],
        ]);
        const L = layer(10);
        const S = svgLayer(L, 6, -60000, -60000, 200000, 200000);
        const wt = (i) => WORDS[i][1]; // istante della parola i (indici: python -X utf8 _tools/parole.py …/d10.ts)
        const head = (lines, times, out, o) => { const T = titleW(Object.assign({ lines, size: 82 }, o || {})); T.inAt(times); if (out) T.outAt(out); return T; };
        const via = (els, t, dur) => tl.to(els, { opacity: 0, duration: dur || 0.3, ease: "power1.out" }, t);

        // ── luoghi del mondo (colonna verticale: in basso il pozzo, in alto la cima) ──
        const PA = [260, 250];          // il tuo telefono (home → editor), centro (540, 820)
        const RC = [540, 820];          // gli anelli dei follower, attorno alla tua storia
        const PC = [2120, 250];         // il telefono del primo follower (home → storia aperta), centro (2400, 820)

        // ═══ 1 · HOOK — "Ecco come funziona davvero l'algoritmo delle storie su Instagram." (0 – 4,1) ════════════════
        // A02 la home di Instagram (vecchio stile) già in scena al fotogramma 0, la fila delle storie con le foto vere e la tua
        // per prima; "davvero" il tuo cerchio pulsa; "l'algoritmo" (T05) la pill di Kallaway 40 si decodifica e scende sui cerchi
        // (O03 + C01); "storie" i cerchi si accendono a cascata
        // si parte stretti sulla fila delle storie (cerchi grandi, foto vere): la camera si allarga su "l'algoritmo"
        const pH0 = fitPose(PA[0] - 4, 330, PA[0] + PH.w + 4, 790, { fill: 0.99 });
        camInit(pH0.fx, pH0.fy, pH0.s);
        rackFocus(0, 0.45);
        const HOME = igHome(L, PA[0], PA[1], {
          storie: [{ src: "tu", nome: "La tua storia", ring: "none", plus: true }, { src: "hormozi", nome: "hormozi" }, { src: "garyvee", nome: "garyvee" }, { src: "leilahormozi", nome: "leilahormozi" }],
          post: { user: "tu", nome: "samuelerinaldo.media", media: "feedA" }, user: "tu", z: 12,
        });
        float(0, 1.4, 0, -6, 0.03);
        const [c0x, c0y] = HOME.circleXY(0);
        // "davvero": il tuo cerchio pulsa (F02 dentro lo schermo, dietro al cerchio)
        pulse(HOME.screen, 24 + 59, 140 + 59, wt(3), { r: 118, z: 3 });
        ripple(L, c0x, c0y, wt(3) + 0.05, { r: 80, s0: 0.8, s1: 1.9, w: 5, dur: 0.5, color: "#ffffff", glow: false, z: 40 });
        tl.fromTo(HOME.tray[0].g, { scale: 1 }, { scale: 1.14, duration: 0.12, ease: "power2.out", immediateRender: false }, wt(3));
        tl.to(HOME.tray[0].g, { scale: 1, duration: 0.35, ease: "back.out(3)" }, wt(3) + 0.12);
        // la camera si allarga prima di "l'algoritmo": quando la pill compare è già ferma sotto il titolo
        frameRect(1.4, 0.55, [PA[0] - 10, 96, PA[0] + PH.w + 10, 800], { fill: 0.99 });
        const AP1 = algoPill(L, 540, 186, { fs: 40, z: 30 });
        AP1.show(wt(4), { pr: 46 });
        const LINES1 = HOME.tray.map((_, i) => {
          const [x, y] = HOME.circleXY(i);
          const cn = connector(S, [[540, 230], [540 + (x - 540) * 0.25, 318], [x, y - 66]], { color: "rgba(255,255,255,.7)", w: 3, curve: "v" });
          cn.draw(wt(5) - 0.1 + i * 0.08, 0.35);
          return cn;
        });
        HOME.tray.forEach((c, i) => {
          const t = wt(7) + i * 0.08;
          tl.to(LINES1[i].p, { attr: { stroke: K.lime }, duration: 0.1 }, t);
          tl.fromTo(c.g, { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
          tl.to(c.g, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t + 0.1);
          if (i) glowFlash(c.lab, t);
        });
        glowFlash(HOME.header[0], wt(9));
        via([AP1.g, ...LINES1.map((c) => c.p)], 3.5, 0.2); // prima del punch-in: la pill finirebbe sotto il titolo
        float(1.95, 1.65, 0, -8, 0.025);
        head([[{ t: "Come funziona" }], [{ t: "l'algoritmo delle " }, { t: "storie", box: true }]], [wt(1), wt(2), wt(4), wt(6), wt(7)], 3.4);

        // ═══ 2 · "Quando pubblici una storia, Instagram non la mostra a tutti," (4,2 – 7,3) ═══════════════════════════
        // K13 / K07: la camera entra nel tuo cerchio ed è l'editor della storia con il tuo video vero; il dito preme "La tua
        // storia"; poi il telefono si rimpicciolisce e diventa il cerchio al centro di tre anelli di follower (volti veri, O21):
        // "non la mostra a tutti" → gli anelli si spengono
        move(3.62, 0.5, c0x, c0y, 2.4);
        const ED = igStoryEdit(L, PA[0], PA[1], { media: "st1", user: "tu", z: 13 });
        gsap.set(ED.frame, { opacity: 0 });
        // l'editor grande: il telefono parte subito sotto il titolo, i bottoni in basso restano sopra la zona dei sottotitoli
        const pEd = fitPose(PA[0] - 10, PA[1] - 10, PA[0] + PH.w + 10, PA[1] + 1100, { top: 340, fill: 1.0 });
        zoomThrough(wt(10), pEd.fx, pEd.fy, pEd.s, { pre: 0.12, blur: 12, settle: 0.45 });
        tl.set(ED.frame, { opacity: 1 }, wt(10));
        tl.set(HOME.frame, { opacity: 0 }, wt(10));
        const F = tapFinger(L, { size: 92, z: 80 });
        const [yx, yy] = ED.yourXY();
        F.show(4.32, yx + 60, yy + 200);
        F.to(4.42, yx, yy, 0.28);
        F.tap(wt(11));
        ED.press(wt(11));
        F.hide(wt(11) + 0.3);
        // il telefono si rimpicciolisce nel cerchio della storia, al centro degli anelli
        const SC0 = storyCircle(L, RC[0], RC[1], 300, { media: "stc" }, { ring: "ig", z: 20 });
        gsap.set(SC0.g, { opacity: 0 });
        tl.to(ED.frame, { scale: 0.27, borderRadius: 300, duration: 0.42, ease: "power3.in" }, wt(13));
        tl.to(ED.frame, { opacity: 0, duration: 0.12 }, wt(13) + 0.34);
        tl.fromTo(SC0.g, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)", immediateRender: false }, wt(13) + 0.32);
        // tre anelli di volti veri (scelti sul foglio numerato: occhi aperti, niente scritte, il primo anello tutti diversi)
        const RINGS = [[248, 124, [2, 8, 10, 25, 17, 33, 29, 38], 0], [408, 102, [5, 12, 9, 18, 27, 13, 41, 1, 44, 26, 55, 47, 6, 59], 0.2], [568, 88, [43, 15, 3, 20, 49, 57, 50, 40, 30, 48, 52, 35, 23, 46, 42, 24, 53, 32, 45, 56, 19, 37], 0.1]];
        const ringLines = [], ring = RINGS.map(([r, d, ids, a0], k) => {
          const ol = el(L, { position: "absolute", left: RC[0] - r, top: RC[1] - r, width: 2 * r, height: 2 * r, borderRadius: "50%", border: "2.5px solid rgba(255,255,255,.3)", zIndex: 14 });
          ringLines.push(ol);
          gsap.set(ol, { opacity: 0 });
          return ids.map((fi, i) => {
            const a = a0 + (i / ids.length) * Math.PI * 2, x = RC[0] + Math.cos(a) * r, y = RC[1] + Math.sin(a) * r;
            const h = el(L, { position: "absolute", left: x - d / 2, top: y - d / 2, width: d, height: d, zIndex: 16 });
            const f = faceDot(h, 0, 0, d, fi, null, { bw: 4 });
            gsap.set(h, { opacity: 0 });
            return { h, f, x, y, a, d };
          });
        });
        const ALLF = ring.flat();
        // stretti come Kallaway: l'anello esterno arriva ai bordi
        frameRect(wt(13) + 0.05, 0.85, [RC[0] - 615, RC[1] - 615, RC[0] + 615, RC[1] + 615], { top: 362, fill: 1.1 });
        ringLines.forEach((ol, k) => tl.fromTo(ol, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 5.45 + k * 0.07));
        ALLF.forEach((p, i) => {
          const dist = 220 + Math.abs(hash(i, 3)) * 220, tt = 5.5 + ((hash(i, 7) + 1) / 2) * 0.4;
          tl.fromTo(p.h, { x: Math.cos(p.a) * dist, y: Math.sin(p.a) * dist, opacity: 0, scale: 0.6 }, { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, tt);
        });
        // "non la mostra a tutti": tutti gli anelli si spengono
        tl.to(ALLF.map((p) => p.h), { filter: "grayscale(1) brightness(.42)", duration: 0.3 }, wt(15));
        tl.to(ring[1].concat(ring[2]).map((p) => p.h), { opacity: 0.7, duration: 0.3 }, wt(19));
        ripple(L, RC[0], RC[1], wt(19), { r: 600, s0: 0.3, s1: 1.0, w: 4, dur: 0.55, color: "#ffffff", glow: false, z: 15 });
        float(6.1, 1.35, 0, -8, 0.02);
        head([[{ t: "Quando pubblici" }], [{ t: "una " }, { t: "storia", box: true }]], [wt(10), wt(11), wt(12), wt(13)], 5.62);
        head([[{ t: "Non la mostra" }], [{ t: "a " }, { t: "tutti", box: true }]], [wt(15), wt(16), wt(17), wt(18), wt(19)], 7.45);

        // ═══ 3 · "la fa vedere prima ai follower che interagiscono di più con te" (7,3 – 10,3) ═══════════════════════
        // O21 + F08: la storia parte verso il primo anello (raggi + la tua storia in piccolo che viaggia), quei volti si
        // riaccendono col bordo lime; su "interagiscono" accanto a loro spuntano ♥ 💬 ➤; "con te" la tua foto sul cerchio
        ring[0].forEach((p, i) => {
          const a = p.a, x0 = RC[0] + Math.cos(a) * 160, y0 = RC[1] + Math.sin(a) * 160, x1 = p.x - Math.cos(a) * (p.d / 2 + 6), y1 = p.y - Math.sin(a) * (p.d / 2 + 6);
          const cn = connector(S, [[x0, y0], [x1, y1]], { color: K.lime, w: 5, glow: true });
          cn.draw(wt(22) + i * 0.035, 0.3);
          p.ray = cn.p;
          const mini = storyCircle(L, x0, y0, 44, "tu", { ring: "ig", z: 19 });
          gsap.set(mini.g, { opacity: 0 });
          tl.set(mini.g, { opacity: 1 }, wt(23) + i * 0.035);
          tl.fromTo(mini.g, { x: 0, y: 0 }, { x: x1 - x0, y: y1 - y0, duration: 0.4, ease: "power2.in", immediateRender: false }, wt(23) + i * 0.035);
          tl.to(mini.g, { opacity: 0, scale: 0.4, duration: 0.1 }, wt(23) + i * 0.035 + 0.4);
          const t1 = wt(23) + i * 0.035 + 0.4;
          tl.to(p.h, { filter: "grayscale(0) brightness(1)", opacity: 1, duration: 0.2 }, t1);
          tl.to(p.f, { borderColor: K.lime, borderWidth: 5, boxShadow: GLOW_A(0.85), duration: 0.15 }, t1);
          tl.fromTo(p.h, { scale: 1 }, { scale: 1.18, duration: 0.1, ease: "power2.out", immediateRender: false }, t1);
          tl.to(p.h, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t1 + 0.1);
          tl.set(p.h, { filter: "none" }, t1 + 0.21);
        });
        // ♥ 💬 ➤ accanto ai primi
        const REAZ = ["heart", "message-circle", "send"];
        const badges = ring[0].map((p, i) => {
          const a = p.a - 0.3, bx = RC[0] + Math.cos(a) * (248 + 66), by = RC[1] + Math.sin(a) * (248 + 66);
          const b = el(L, { position: "absolute", left: bx - 31, top: by - 31, width: 62, height: 62, borderRadius: "50%", background: limeFill(1), display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `${GLOW_A(0.7)}, 0 6px 14px rgba(0,0,0,.5)`, zIndex: 18 }, svg(REAZ[i % 3], 34, K.ink, 2.6, i % 3 === 0 ? K.ink : "none"));
          gsap.set(b, { opacity: 0, scale: 0.3 });
          tl.to(b, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, wt(27) + i * 0.06);
          return b;
        });
        // "con te": la tua foto vera sul cerchio della storia
        const meB = avatar(L, RC[0] + 112, RC[1] + 112, 104, "tu", { bw: 4, z: 22 });
        gsap.set(meB, { opacity: 0, scale: 0.4 });
        tl.to(meB, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.6)" }, wt(31) - 0.05);

        const FX = 3600, FY = -740, CWd = 300, CHt = 533;
        const FAN = ["f1", "f2", "f3", "f4", "f5"].map((id, k) => {
          const c = el(L, { position: "absolute", left: FX - CWd / 2, top: FY - CHt / 2, width: CWd, height: CHt, borderRadius: 22, overflow: "hidden", background: "#111", border: "2px solid rgba(255,255,255,.3)", boxShadow: "0 30px 70px rgba(0,0,0,.6)", zIndex: 30 + (k === 2 ? 5 : 2 - Math.abs(k - 2)), transformOrigin: "50% 120%" });
          videoTile(c, 0, 0, CWd, CHt, id, 1);
          el(c, { position: "absolute", left: 0, top: 0, width: CWd, height: 90, background: "linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0))", zIndex: 2 });
          const segs = el(c, { position: "absolute", left: 10, top: 12, width: CWd - 20, height: 4, display: "flex", gap: 3, zIndex: 3 });
          for (let q = 0; q < 12; q++) el(segs, { flex: 1, height: 5, borderRadius: 3, background: q <= k * 2 + 1 ? "#fff" : "rgba(255,255,255,.38)" });
          const hd = el(c, { position: "absolute", left: 10, top: 24, display: "flex", alignItems: "center", gap: 8, zIndex: 3, whiteSpace: "nowrap" });
          const av = el(hd, { width: 36, height: 36, borderRadius: "50%", overflow: "hidden", border: "1.5px solid #fff", position: "relative", flex: "none" });
          imgIn(av, "av-tu", { objectFit: "cover" });
          el(hd, { fontFamily: FS, fontWeight: 700, fontSize: 18, color: "#fff" }, ["9:12", "11:40", "14:05", "18:30", "22:47"][k], "span");
          [c, ...c.querySelectorAll("*")].forEach((e) => e.setAttribute("data-layout-allow-overlap", "")); // impilate prima di aprirsi a ventaglio
          gsap.set(c, { opacity: 0 });
          return c;
        });
        // la barra del giorno, grande, sopra il ventaglio: tante storie = tanti segmenti
        const DAYB = el(L, { position: "absolute", left: FX - 360, top: FY - 470, width: 720, height: 16, display: "flex", gap: 7, zIndex: 40 });
        const DAYS = Array.from({ length: 12 }, () => { const s = el(DAYB, { flex: 1, height: 16, borderRadius: 8, background: "rgba(255,255,255,.3)", position: "relative", overflow: "hidden" }); const f = el(s, { position: "absolute", left: 0, top: 0, width: "100%", height: 16, background: "#fff", transformOrigin: "0 50%" }); gsap.set(f, { scaleX: 0 }); return f; });
        gsap.set(DAYB, { opacity: 0 });
        const pFan = fitPose(FX - 540, FY - 490, FX + 540, FY + CHt / 2 + 70, { fill: 0.98 });
        // le card sono già lì quando arriva la camera (si impilano mentre il muro esce a sinistra)
        // la pila arriva grande (le storie del giorno una sopra l'altra) e su "quante" si apre a ventaglio
        FAN.forEach((c, k) => tl.fromTo(c, { opacity: 0, x: 300 + k * 16, y: -k * 14, rotation: 8, scale: 1.32 }, { opacity: 1, x: k * 16, y: -k * 14, rotation: (k - 2) * 2.5, scale: 1.32, duration: 0.4, ease: "power3.out", immediateRender: false }, 27.3 + k * 0.04));
        move(27.4, 0.6, pFan.fx, pFan.fy, pFan.s);
        mblurV(27.4, 0.6, KW.move, 10, "x");
        FAN.forEach((c, k) => tl.to(c, { rotation: (k - 2) * 12, x: (k - 2) * 178, y: Math.abs(k - 2) * 30, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, wt(87) + k * 0.03));
        float(28.0, 1.88, 0, -8, 0.025);
        tl.to(DAYB, { opacity: 1, duration: 0.25 }, 27.55);
        DAYS.forEach((f, q) => tl.to(f, { scaleX: 1, duration: 0.05, ease: "none" }, wt(89) + q * 0.045));
        // "non conta": tutto si spegne in grigio, una riga lo barra
        const STR = el(L, { position: "absolute", left: FX - 500, top: FY - 40, width: 1000, height: 14, borderRadius: 7, background: "#ffffff", boxShadow: "0 0 18px rgba(255,255,255,.7)", transformOrigin: "0 50%", zIndex: 60 });
        gsap.set(STR, { scaleX: 0, rotation: -12 });
        tl.to([...FAN, DAYB], { filter: "grayscale(1) brightness(.45)", duration: 0.3 }, 29.72);
        tl.to(STR, { scaleX: 1, duration: 0.2, ease: "power2.out" }, 29.72);
        // l'orologio
        const CLY = FY + 820;
        const CLK = orologio(L, FX, CLY, 420, { ora: 9, min: 10, z: 40 });
        // attorno: gli orari veri delle tue storie (gli stessi delle card), le lancette ci passano sopra
        const ORE = [["9:12", -330, 0], ["14:05", 250, -235], ["18:30", 335, 40], ["22:47", -240, 250]].map(([tx, dx, dy], k) => {
          const pl = el(L, { position: "absolute", left: FX + dx - 95, top: CLY + dy - 33, width: 190, height: 66, borderRadius: 33, background: "linear-gradient(180deg, rgba(58,58,58,.97), rgba(28,28,28,.98))", border: "2px solid rgba(255,255,255,.3)", boxShadow: "0 14px 30px rgba(0,0,0,.55)", display: "flex", alignItems: "center", gap: 12, paddingLeft: 10, fontFamily: FS, fontWeight: 800, fontSize: 30, color: K.white, whiteSpace: "nowrap", zIndex: 45 });
          const a = el(pl, { width: 46, height: 46, borderRadius: "50%", overflow: "hidden", border: "2px solid #fff", position: "relative", flex: "none" });
          imgIn(a, "av-tu", { objectFit: "cover" });
          el(pl, {}, tx, "span");
          gsap.set(pl, { opacity: 0, scale: 0.6 });
          return pl;
        });
        const pClk = fitPose(FX - 440, CLY - 300, FX + 440, CLY + 300, { fill: 0.96 });
        move(wt(90) - 0.05, 0.5, pClk.fx, pClk.fy, pClk.s);
        tl.to([...FAN, DAYB, STR], { opacity: 0, duration: 0.25 }, wt(90) + 0.1);
        CLK.show(wt(90) - 0.02);
        ORE.forEach((pl, k) => tl.to(pl, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, wt(90) + 0.05 + k * 0.05));
        CLK.spin(wt(91), 0.75, 7, "power2.inOut");
        ORE.forEach((pl, k) => {
          const t = wt(91) + 0.12 + k * 0.15;
          tl.to(pl, { borderColor: K.lime, boxShadow: `${GLOW_A(0.8)}, 0 14px 30px rgba(0,0,0,.55)`, duration: 0.08 }, t);
          tl.to(pl, { borderColor: "rgba(255,255,255,.3)", boxShadow: "0 14px 30px rgba(0,0,0,.55)", duration: 0.25 }, t + 0.12);
        });
        tl.to(ORE, { filter: "grayscale(1) brightness(.5)", duration: 0.3 }, 30.85);
        const STR2 = el(L, { position: "absolute", left: FX - 420, top: CLY - 6, width: 840, height: 14, borderRadius: 7, background: "#ffffff", boxShadow: "0 0 18px rgba(255,255,255,.7)", transformOrigin: "0 50%", zIndex: 60 });
        gsap.set(STR2, { scaleX: 0, rotation: -12 });
        CLK.off(30.85);
        tl.to(STR2, { scaleX: 1, duration: 0.18, ease: "power2.out" }, 30.85);
        head([[{ t: "Non conta" }], [{ t: "quante storie", box: true }]], [wt(85), wt(86), wt(87), wt(88)], 29.5);
        head([[{ t: "Non conta" }], [{ t: "l'ora", box: true }]], [wt(90), wt(91), wt(92)], 30.9);

        // ═══ 10 · "conta solo cosa fanno i primi che le vedono." (31,2 – 34,1) ══════════════════════════════════
        // ritorno sugli anelli (K02): resta acceso solo il primo anello con ♥ 💬 ➤ (F04); su "i primi" gli angoli (H04) si chiudono
        // attorno ai primi; "che le vedono" l'impulso dal centro
        const BACK = 31.12;
        const SCb = storyCircle(L, RC[0], RC[1], 300, { media: "stc2" }, { ring: "ig", z: 20 });
        gsap.set(SCb.g, { opacity: 0 });
        tl.set([SCb.g, meB, ...badges, ...ringLines, ...ring[0].map((p) => p.h), ...ring[0].map((p) => p.ray)], { opacity: 1 }, BACK);
        tl.set(ring[1].concat(ring[2]).map((p) => p.h), { opacity: 0.55 }, BACK);
        arriveRect(BACK, [RC[0] - 615, RC[1] - 615, RC[0] + 615, RC[1] + 615], { top: 362, fill: 1.1, dx: 0, dy: 340, dur: 0.9 });
        tl.to(ring[1].concat(ring[2]).map((p) => p.h), { opacity: 0.22, duration: 0.35 }, wt(95));
        tl.to(ringLines.slice(1), { opacity: 0.35, duration: 0.35 }, wt(95));
        badges.forEach((b, i) => {
          const t = wt(96) + i * 0.05;
          tl.fromTo(b, { scale: 1 }, { scale: 1.3, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
          tl.to(b, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t + 0.1);
        });
        const SCR = selectCorners(L, [RC[0] - 322, RC[1] - 322, RC[0] + 322, RC[1] + 322], { len: 64, w: 8, pad: 10, z: 60 });
        SCR.show(wt(99));
        ring[0].forEach((p, i) => {
          const t = wt(99) + 0.1 + i * 0.03;
          tl.to(p.f, { boxShadow: "0 0 26px rgba(207,251,80,1), 0 0 80px rgba(207,251,80,.6)", duration: 0.08 }, t);
          tl.to(p.f, { boxShadow: GLOW_A(0.85), duration: 0.4 }, t + 0.1);
        });
        pulse(L, RC[0], RC[1], wt(102), { r: 200, z: 19 });
        ripple(L, RC[0], RC[1], wt(102) + 0.04, { r: 330, s0: 0.5, s1: 1.15, w: 5, dur: 0.6, z: 21 });
        float(32.05, 2.0, 0, -8, 0.035);
        head([[{ t: "Conta solo" }], [{ t: "cosa fanno " }, { t: "i primi", box: true }]], [31.37, 31.45, wt(96), wt(97), wt(98), wt(99)]);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
