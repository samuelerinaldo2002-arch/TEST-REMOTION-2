const pan = document.getElementById("pan");

const tl = gsap.timeline({ paused: true });

const CAM = { fx: ANCHOR.x, fy: ANCHOR.y, s: 1 };
const camInit = (fx, fy, s) => {

const drift = (t, dur, dx, dy, ds) => {

const whip = (t, dur, fx, fy, s, axis, peak) => {

  const write = () => mbn.setAttribute("stdDeviation", axis === "y" ? `0 ${P.v}` : `${P.v} 0`);

  tl.to(P, { v: peak, duration: dur / 2, ease: "power3.in", onUpdate: write }, t);
  tl.to(P, { v: 0, duration: dur / 2, ease: "power3.out", onUpdate: write }, t + dur / 2);

const toScreen = (wx, wy, c) => { c = c || CAM; return [ANCHOR.x + (wx - c.fx) * c.s, ANCHOR.y + (wy - c.fy) * c.s]; };
// screen point → world point for a camera pose {fx, fy, s} (place things where they will be seen)
const toWorld = (sx, sy, c) => { c = c || CAM; return [c.fx + (sx - ANCHOR.x) / c.s, c.fy + (sy - ANCHOR.y) / c.s]; };

const shake = (t, amp, n) => {
  for (let k = 0; k < n; k++) {

    tl.to(shakeEl, { x: (k % 2 ? -1 : 1) * amp * f, y: (((k * 5) % 3) - 1) * amp * 0.6 * f, duration: 0.04, ease: "none" }, t + k * 0.04);

  tl.to(shakeEl, { x: 0, y: 0, duration: 0.06, ease: "power1.out" }, t + n * 0.04);

// ═══ reveals ══════════════════════════════════════════════════════════════════
// the signature arrival: blur → sharp, a small lift and scale settle
const blurIn = (target, t, o) => {

  const b = o.blur == null ? 18 : o.blur;

  tl.set(target, { filter: "none" }, t + d + (o.stagger || 0) * (n - 1) + 0.01);
};
const blurOut = (target, t, o) => {
  o = o || {};
  tl.to(target, { opacity: 0, filter: `blur(${o.blur || 14}px)`, y: o.y || 0, x: o.x || 0, scale: o.scale == null ? 0.97 : o.scale, duration: o.dur || 0.35, ease: "power2.in", stagger: o.stagger || 0 }, t);

// "not spoken yet": sharp-but-blurred placeholder that resolves on its cue
const unblur = (target, t, from, dur) => {
  gsap.set(target, { filter: `blur(${from || 9}px)`, opacity: 0.45 });
  tl.to(target, { filter: "blur(0px)", opacity: 1, duration: dur || 0.4, ease: "power2.out" }, t);

const pop = (target, t, from, ease, dur) => {

  tl.to(target, { scale: 1, duration: dur || 0.45, ease: ease || "back.out(2.2)" }, t);

const fadeOut = (target, t, dur) => tl.to(target, { opacity: 0, duration: dur || 0.3 }, t);
const counter = (node, from, to, t, dur, ease, fmt) => {

const itNum = (v) => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const typeText = (node, text, t, dur) => {
  const o = { n: 0 };
  tl.to(o, { n: text.length, duration: dur, ease: "none", onUpdate: () => (node.textContent = text.slice(0, Math.round(o.n))) }, t);

const sheen = (card, t, dur) => {

const arcFly = (node, from, to, t, dur, o) => {
  o = o || {};

  const blade = el(L, { position: "absolute", left: -900, top: -400, width: 900, height: 2800, background: "linear-gradient(90deg, rgba(255,120,40,0) 0%, rgba(255,150,60,.85) 45%, rgba(255,220,150,.95) 55%, rgba(255,120,40,0) 100%)", transform: "rotate(18deg)", opacity: 0, mixBlendMode: "screen" });
  const white = el(L, { position: "absolute", inset: 0, background: o.color || "#fff8ec", opacity: 0 });
  tl.set(blade, { opacity: 1 }, t);
  tl.fromTo(blade, { x: 0 }, { x: 2600, duration: 0.2, ease: "power1.in", immediateRender: false }, t);
  tl.set(blade, { opacity: 0 }, t + 0.2);
  tl.set(white, { opacity: 0.95 }, t + 0.167);
  tl.to(white, { opacity: 0, duration: 0.1, ease: "power2.out" }, t + 0.2);
};

// ═══ testo ═════════════════════════════════════════════════════════════════════════════════
// T01 · T02 · T07 · T08 — titolo parola per parola: ogni parola compare quando viene detta (grigia e sfocata →
// bianca e nitida in 0,2 s); il box d'accento nasce come cursore sottile e cresce insieme alle parole.
// spec: { lines: [[{t:"L'errore "},{t:"numero uno", box:true}], [{t:"dei principianti", hand:true, ul:true}]],
//         size, top, parent (default hud), x, y (centro/alto in coordinate del parent), align }
// inAt(tempi) — tempi: un numero (inizio, ~0,12 s per parola) oppure un array con l'istante di ogni parola.
const titleW = (spec) => {
  const size = spec.size || 84;
  const parent = spec.parent || hud;
  const root = el(parent, { position: "absolute", left: spec.x == null ? 40 : spec.x - 500, top: spec.y == null ? spec.top || TITLE_TOP : spec.y, width: 1000, display: "flex", flexDirection: "column", alignItems: spec.align || "center", gap: Math.round(size * 0.05), zIndex: spec.z || 50 });
  const W = [];
  const halos = [];
  spec.lines.forEach((line) => {
    const rowEl = el(root, { display: "flex", alignItems: "baseline", justifyContent: "center", whiteSpace: "nowrap" });
    line.forEach((seg) => {
      const hand = !!seg.hand, box = !!seg.box, ul = !!seg.ul;
      const fs = Math.round(size * (hand ? 1.1 : 1) * (seg.scale || 1));
      const toks = [];
      seg.t.split(/(\s+)/).filter(Boolean).forEach((p) => (/^\s+$/.test(p) && toks.length ? (toks[toks.length - 1] += p) : toks.push(p)));
      const grp = el(rowEl, { position: "relative", display: "inline-flex", alignItems: "baseline", margin: box ? `0 ${Math.round(size * 0.05)}px` : 0 }, null, "span");
      const halo = box ? el(grp, { position: "absolute", left: 0, right: 0, top: Math.round(size * 0.02), height: Math.round(size * 1.04), borderRadius: 8, boxShadow: GLOW_A(0.75), opacity: 0, zIndex: 0 }) : null;
      if (halo) halos.push(halo);
      toks.forEach((tk, i) => {
        const first = i === 0, last = i === toks.length - 1;
        const tkTrim = box && last ? tk.replace(/\s+$/, "") : tk;
        const w = el(grp, { position: "relative", display: "inline-block", whiteSpace: "pre", paddingLeft: box && first ? Math.round(size * 0.17) : 0, paddingRight: box && last ? Math.round(size * 0.17) : 0, zIndex: 1 }, null, "span");
        let bg = null, und = null;
        if (box) {
          const rr = Math.round(size * 0.08);
          bg = el(w, { position: "absolute", left: 0, top: Math.round(size * 0.02), width: "100%", height: Math.round(size * 1.04), background: "linear-gradient(180deg,#dcff74 0%,#CFFB50 55%,#bde83f 100%)", borderRadius: `${first ? rr : 0}px ${last ? rr : 0}px ${last ? rr : 0}px ${first ? rr : 0}px`, transformOrigin: "0 50%", zIndex: 0 });
          gsap.set(bg, { scaleX: 0 });
        }
        if (ul) {
          und = el(w, { position: "absolute", left: 0, bottom: -Math.round(size * 0.06), width: "100%", height: Math.max(3, Math.round(size * 0.045)), borderRadius: 3, background: K.lime, boxShadow: GLOW_A(0.6), transformOrigin: "0 50%", zIndex: 0 });
          gsap.set(und, { scaleX: 0 });
        }
        const c1 = box ? K.ink : hand ? K.lime : K.white;
        const c0 = hand ? "rgba(207,251,80,.42)" : GREY;
        const tx = el(w, { position: "relative", zIndex: 1, fontFamily: hand ? FH : FD, fontWeight: hand ? 400 : 700, fontSize: fs, lineHeight: 1.04, letterSpacing: hand ? "0" : "-0.01em", color: c0, textShadow: box ? "none" : hand ? GLOW_LT : GLOW_T }, tkTrim.replace(/ /g, "&nbsp;"), "span");
        gsap.set(tx, { opacity: 0, filter: `blur(${hand || fs > size ? 11 : 9}px)`, y: Math.round(size * 0.06) });
        W.push({ w, tx, bg, und, c1, box, first, last });
      });
    });
  });
  const auto = (t0) => W.map((_, i) => t0 + i * 0.12);
  let tEnd = 0;
  const inAt = (times) => {
    const T = Array.isArray(times) ? times : auto(times);
    W.forEach((wd, i) => {
      const t = T[Math.min(i, T.length - 1)];
      tl.to(wd.tx, { opacity: 1, duration: 0.07, ease: "none" }, t);
      tl.to(wd.tx, { filter: "blur(0px)", y: 0, duration: 0.2, ease: "power2.out" }, t);
      tl.to(wd.tx, { color: wd.c1, duration: wd.box ? 0.18 : 0.2, ease: "power2.out" }, t + (wd.box ? 0.05 : 0));
      tl.set(wd.tx, { filter: "none" }, t + 0.21);
      if (wd.bg) {
        if (wd.first) {
          tl.set(wd.bg, { scaleX: 0.035 }, t - 0.07); // il cursore sottile che anticipa il box
        }
        tl.to(wd.bg, { scaleX: 1, duration: 0.22, ease: "power2.out" }, t);
        if (wd.last) halos.forEach((h) => tl.to(h, { opacity: 1, duration: 0.35, ease: "power1.out" }, t + 0.12));
      }
      if (wd.und) tl.to(wd.und, { scaleX: 1, duration: 0.24, ease: "power2.out" }, t);
      tEnd = Math.max(tEnd, t + 0.21);
    });
    return tEnd;
  };
  // T08 · uscita: il titolo si spegne (grigio) e poi se ne va
  const outAt = (t) => {
    W.forEach((wd) => tl.to(wd.tx, { color: wd.box ? "rgba(30,30,30,.55)" : GREY, duration: 0.15, ease: "power1.out" }, t));
    W.forEach((wd) => wd.bg && tl.to(wd.bg, { opacity: 0.45, duration: 0.15 }, t));
    halos.forEach((h) => tl.to(h, { opacity: 0, duration: 0.15 }, t));
    tl.to(W.map((wd) => wd.w), { opacity: 0, filter: "blur(8px)", y: -10, duration: 0.24, ease: "power2.in", stagger: 0.012 }, t + 0.15);
    tl.set(root, { opacity: 0 }, t + 0.42 + W.length * 0.012);
  };
  return { root, words: W, inAt, outAt, n: W.length };
};
// tempi delle parole dal voice-over (WORDS = [[parola, inizio, fine], …] iniettato da build.cjs)
// wordsFrom(i0, n): gli inizi delle n parole a partire dall'indice i0 · findWord("tutto.", dopo) → indice
const wordsFrom = (i0, n) => WORDS.slice(i0, i0 + n).map((w) => w[1]);
const findWord = (txt, after) => {
  const k = WORDS.findIndex((w, i) => i >= (after || 0) && w[0].toLowerCase().replace(/[^\p{L}\p{N}']/gu, "") === txt.toLowerCase().replace(/[^\p{L}\p{N}']/gu, ""));
  if (k < 0) throw new Error("parola non trovata nel voice-over: " + txt);
  return k;
};
const at = (txt, after) => WORDS[findWord(txt, after)][1];

// T03 · T06 — testo a macchina da scrivere (lettere che compaiono in ordine, con cursore opzionale)
const typeIn = (node, text, t, cps, o) => {
  o = o || {};
  node.innerHTML = "";
  const box = el(node, { display: "inline-block", whiteSpace: "pre" }, null, "span");
  const step = 1 / (cps || 30);
  const cw = Math.max(3, Math.round((o.size || 40) * 0.07));
  const chars = [...text];
  // each glyph carries its own caret (absolute, right after it): no layout measuring, seek-safe
  const cs = chars.map((ch) => {
    const c = el(box, { position: "relative", display: "inline-block", whiteSpace: "pre" }, ch === " " ? "&nbsp;" : ch, "span");
    let k = null;
    if (o.caret) k = el(c, { position: "absolute", right: -cw - 3, top: "0.08em", width: cw, height: "0.92em", background: o.caretColor || K.lime }, null, "span");
    return { c, k };
  });
  gsap.set(cs.map((x) => x.c), { opacity: 0 });
  if (o.caret) gsap.set(cs.map((x) => x.k), { opacity: 0 });
  cs.forEach((x, i) => {
    tl.set(x.c, { opacity: 1 }, t + i * step);
    if (x.k) { tl.set(x.k, { opacity: 1 }, t + i * step); if (i < cs.length - 1) tl.set(x.k, { opacity: 0 }, t + (i + 1) * step); }
  });
  const end = t + cs.length * step;
  if (o.caret && cs.length) {
    const k = cs[cs.length - 1].k;
    for (let i = 0; i < (o.blinks || 3); i++) { tl.set(k, { opacity: 0 }, end + i * 0.5 + 0.25); tl.set(k, { opacity: 1 }, end + i * 0.5 + 0.5); }
    tl.set(k, { opacity: 0 }, end + (o.blinks || 3) * 0.5 + 0.25);
  }
  return end;
};
// T04 — lettere che compaiono in ordine casuale (etichette, corsivi)
const scrambleIn = (node, text, t, dur, seed) => {
  node.innerHTML = "";
  const wrapS = el(node, { display: "inline-block", whiteSpace: "pre" }, null, "span");
  const cs = [...text].map((ch) => el(wrapS, { display: "inline-block", whiteSpace: "pre" }, ch === " " ? "&nbsp;" : ch, "span"));
  gsap.set(cs, { opacity: 0 });
  dur = dur || 0.28;
  cs.forEach((c, i) => {
    const u = (hash(i + 1, seed || 5) + 1) / 2;
    tl.to(c, { opacity: 1, duration: 0.05, ease: "none" }, t + u * dur);
  });
  return t + dur + 0.05;
};
// T05 — testo che si decodifica (glitch): glifi a caso che si fermano sulla parola giusta
const decode = (node, text, t, dur, o) => {
  o = o || {};
  const GL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<>/#%&";
  dur = dur || 0.3;
  node.innerHTML = "";
  const STEP = 1 / 30;
  const wrapD = el(node, { display: "inline-block", whiteSpace: "pre" }, null, "span");
  [...text].forEach((ch, i) => {
    const slot = el(wrapD, { position: "relative", display: "inline-block", whiteSpace: "pre" }, null, "span");
    const fin = el(slot, { display: "inline-block", whiteSpace: "pre" }, ch === " " ? "&nbsp;" : ch, "span");
    gsap.set(fin, { opacity: 0 });
    if (ch === " ") { tl.set(fin, { opacity: 1 }, t); return; }
    const tr = t + (0.35 + 0.65 * (hash(i + 2, o.seed || 9) + 1) / 2) * dur; // quando si ferma
    const n = Math.max(1, Math.round((tr - t) / STEP));
    for (let k = 0; k < n; k++) {
      const g = el(slot, { position: "absolute", left: 0, top: 0, whiteSpace: "pre", color: o.glitchColor || "inherit" }, GL[Math.floor(((hash(i * 31 + k, o.seed || 9) + 1) / 2) * GL.length) % GL.length], "span");
      gsap.set(g, { opacity: 0 });
      tl.set(g, { opacity: 1 }, t + k * STEP);
      tl.set(g, { opacity: 0 }, t + (k + 1) * STEP);
    }
    tl.set(fin, { opacity: 1 }, tr);
  });
  return t + dur;
};
// T11 — parola/numero gigante sullo sfondo (grigio, trasparente), opzionale conteggio
const bigBack = (parent, cx, cy, text, o) => {
  o = o || {};
  const b = el(parent, { position: "absolute", left: cx - 1200, top: cy - (o.size || 520) * 0.62, width: 2400, textAlign: "center", fontFamily: FD, fontWeight: 700, fontSize: o.size || 520, lineHeight: 1, letterSpacing: "-0.03em", color: "rgba(255,255,255,.075)", zIndex: o.z || 1, whiteSpace: "nowrap" }, text);
  gsap.set(b, { opacity: 0, scale: 0.92 });
  return { b, inAt: (t) => tl.to(b, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, t), outAt: (t) => tl.to(b, { opacity: 0, duration: 0.3 }, t) };
};

// ═══ liste ═════════════════════════════════════════════════════════════════════════════════
// L01 · L02 · L03 · K14 — la lista di Kallaway: barre scure, accento a sinistra, numero, testo sfocato finché
// non viene detto; la pila si ri-centra quando arriva una voce; la voce si "risolve" con uno sheen da destra.
// items: ["Testo 1", …] · o: { h, gap, fs, z, numbers:true }
const listK = (parent, cx, cy, w, items, o) => {
  o = o || {};
  const h = o.h || 96, gap = o.gap || 20, fs = o.fs || 36;
  const box = el(parent, { position: "absolute", left: cx - w / 2, top: cy, width: w, height: 1, zIndex: o.z || 12 });
  const rows = items.map((txt, i) => {
    const y = i * (h + gap);
    const r = el(box, { position: "absolute", left: 0, top: y, width: w, height: h, borderRadius: 16, background: "linear-gradient(90deg,#272727 0%,#1f1f1f 100%)", border: "1.5px solid rgba(255,255,255,.09)", boxShadow: "0 16px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06)", overflow: "hidden" });
    const lit = el(r, { position: "absolute", inset: 0, background: "linear-gradient(90deg,rgba(255,255,255,.075),rgba(255,255,255,.03))", opacity: 0 });
    const acc = el(r, { position: "absolute", left: 0, top: 0, width: 7, height: h, background: K.lime, boxShadow: GLOW_A(0.5) });
    const nx = 34;
    const num = el(r, { position: "absolute", left: nx, top: 0, height: h, display: "flex", alignItems: "center", fontFamily: FS, fontWeight: 800, fontSize: Math.round(fs * 0.95), color: K.white, letterSpacing: "0.02em" }, o.numbers === false ? "" : String(i + 1).padStart(2, "0"));
    const lx = o.numbers === false ? nx : nx + Math.round(fs * 2.1);
    const mk = (extra) => el(r, Object.assign({ position: "absolute", left: lx, top: 0, right: 24, height: h, display: "flex", alignItems: "center", fontFamily: FS, fontWeight: 700, fontSize: fs, color: K.white, whiteSpace: "nowrap", overflow: "hidden" }, extra), txt);
    const soft = mk({ filter: "blur(7px)", opacity: 0.6 });
    const sharp = mk({ clipPath: "inset(0% 0% 0% 100%)", textShadow: GLOW_T });
    const band = el(r, { position: "absolute", top: -h * 0.4, left: 0, width: 46, height: h * 1.8, background: "linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 45%, rgba(255,255,255,.85) 50%, rgba(255,255,255,.55) 55%, rgba(255,255,255,0) 100%)", transform: "rotate(20deg)", filter: "blur(1.5px)", opacity: 0, zIndex: 5 });
    return { r, lit, acc, num, soft, sharp, band, y };
  });
  gsap.set(rows.map((x) => x.r), { opacity: 0 });
  const H = (k) => k * h + (k - 1) * gap;
  let shown = 0, curY = -H(1) / 2;
  gsap.set(box, { y: curY });
  // fa comparire le voci fino alla k-esima (1-based); la pila si ri-centra su cy
  const show = (k, t, o2) => {
    for (let i = shown; i < k; i++) blurIn(rows[i].r, t + (i - shown) * 0.06, { y: 26, blur: 12, dur: 0.45 });
    if (!(o2 && o2.noRecentre)) { curY = -H(k) / 2; tl.to(box, { y: curY, duration: 0.4, ease: "power3.out" }, t); }
    shown = Math.max(shown, k);
  };
  // L02 · sheen da destra a sinistra, il testo va a fuoco dietro la banda, poi la barra diventa "attiva"
  const resolve = (i, t, dur) => {
    dur = dur || 0.78;
    const rw = rows[i];
    tl.set(rw.band, { opacity: 1 }, t);
    tl.fromTo(rw.band, { x: w + 40 }, { x: -80, duration: dur, ease: "power1.inOut", immediateRender: false }, t);
    tl.set(rw.band, { opacity: 0 }, t + dur);
    tl.to(rw.sharp, { clipPath: "inset(0% 0% 0% 0%)", duration: dur, ease: "power1.inOut" }, t);
    tl.to(rw.soft, { opacity: 0, duration: dur * 0.9, ease: "power1.in" }, t);
    activate(i, t + 0.08);
  };
  const activate = (i, t) => {
    const rw = rows[i];
    tl.to(rw.lit, { opacity: 1, duration: 0.3 }, t);
    tl.to(rw.r, { borderColor: "rgba(255,255,255,.55)", scale: 1.03, boxShadow: "0 18px 46px rgba(0,0,0,.55), 0 0 26px rgba(255,255,255,.10)", duration: 0.3, ease: "power2.out" }, t);
  };
  const deactivate = (i, t) => {
    const rw = rows[i];
    tl.to(rw.lit, { opacity: 0, duration: 0.25 }, t);
    tl.to(rw.r, { borderColor: "rgba(255,255,255,.09)", scale: 1, boxShadow: "0 16px 40px rgba(0,0,0,.45)", duration: 0.25 }, t);
  };
  // L03 · accensione a cascata (bordo bianco che scende di barra in barra)
  const cascade = (t, stepT) => rows.forEach((rw, i) => {
    tl.to(rw.r, { borderColor: "rgba(255,255,255,.7)", duration: 0.08 }, t + i * (stepT || 0.08));
    tl.to(rw.r, { borderColor: "rgba(255,255,255,.09)", duration: 0.25 }, t + i * (stepT || 0.08) + 0.1);
  });
  // le altre voci si attenuano (focus) / tornano
  const dimOthers = (i, t, a) => rows.forEach((rw, j) => j !== i && tl.to(rw.r, { opacity: a == null ? 0.35 : a, duration: 0.3 }, t));
  // K14 · la voce i sale e diventa l'intestazione (coordinate nel parent), il resto se ne va
  const promote = (i, t, x, y, s) => {
    const rw = rows[i];
    rows.forEach((o3, j) => j !== i && blurOut(o3.r, t, { dur: 0.3 }));
    const bx = cx - w / 2, by = cy + curY;
    tl.to(rw.r, { x: x - (bx + w / 2), y: y - (by + rw.y + h / 2), scale: s || 0.8, duration: 0.45, ease: "power3.inOut" }, t);
  };
  return { box, rows, show, resolve, activate, deactivate, cascade, dimOthers, promote, h, gap };
};

// ═══ luce ed enfasi ════════════════════════════════════════════════════════════════════════
// F02 · pulse: disco pieno dell'accento (versione profonda) con contorno chiaro: nasce da un punto, si espande
// in 0,22 s e svanisce allargandosi. o: { r, a, z, front }
const pulse = (parent, x, y, t, o) => {
  o = o || {};
  const R = o.r || 230;
  // lime pieno (non scurito: il lime scuro diventa verde oliva), contorno chiaro e bagliore
  const d = el(parent, { position: "absolute", left: x - R, top: y - R, width: R * 2, height: R * 2, borderRadius: "50%", background: "radial-gradient(circle at 50% 42%, #eaffa6 0%, #d6fd62 38%, #CFFB50 62%, #bce63f 100%)", border: "3px solid rgba(255,255,255,.92)", boxShadow: "0 0 60px rgba(207,251,80,.55), inset 0 0 50px rgba(255,255,255,.22)", opacity: 0, zIndex: o.z || 2, pointerEvents: "none" });
  gsap.set(d, { scale: 0.035 });
  tl.set(d, { opacity: o.a == null ? (o.front ? 0.5 : 0.9) : o.a }, t);
  tl.to(d, { scale: 1, duration: 0.22, ease: "expo.out" }, t);
  tl.to(d, { scale: 1.13, opacity: 0, duration: 0.5, ease: "power1.in" }, t + 0.22);
  return d;
};
// F09/D01 · flash di glow su un numero/testo appena arrivato al valore finale
const glowFlash = (node, t, o) => {
  o = o || {};
  const base = o.base || GLOW_T;
  tl.to(node, { textShadow: o.peak || "0 0 18px rgba(255,255,255,.95), 0 0 60px rgba(255,255,255,.6), 0 0 120px rgba(207,251,80,.35)", duration: 0.07, ease: "power2.out" }, t);
  tl.to(node, { textShadow: base, duration: 0.35, ease: "power2.out" }, t + 0.08);
};
// F04 · riflettore: gli scelti si accendono, il resto si scurisce
const spotlight = (keep, dim, t, o) => {
  o = o || {};
  if (dim && dim.length) tl.to(dim, { opacity: o.a == null ? 0.32 : o.a, duration: 0.4, ease: "power2.out" }, t);
  if (keep && keep.length) tl.to(keep, { scale: o.s || 1.05, boxShadow: `${GLOW_A(0.9)}, 0 0 0 3px ${K.lime}`, duration: 0.4, ease: "power2.out" }, t);
};
// F11 · tinta: "si" = verde-lime (giusto), "no" = spento e desaturato (sbagliato)
const tint = (target, t, kind, o) => {
  o = o || {};
  const ts = Array.isArray(target) ? target : [target];
  ts.forEach((tg, i) => {
    const tt = t + i * (o.stagger || 0);
    if (kind === "si") {
      const ov = el(tg, { position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(207,251,80,.34), rgba(207,251,80,.16))", mixBlendMode: "screen", opacity: 0, zIndex: 20, pointerEvents: "none", borderRadius: "inherit" });
      tl.to(ov, { opacity: 1, duration: 0.25 }, tt);
      tl.to(tg, { boxShadow: `${GLOW_A(0.8)}, 0 0 0 3px ${K.lime}`, duration: 0.25 }, tt);
    } else {
      tl.to(tg, { filter: "grayscale(1) brightness(.42)", duration: 0.3, ease: "power2.out" }, tt);
    }
  });
};
// F05 · lampeggio di attivazione: alterna due stati ogni 2 fotogrammi e si ferma sul nuovo
const flicker = (node, t, a, b, dur) => {
  dur = dur || 0.3;
  const n = Math.round(dur / (2 / 30));
  for (let k = 0; k <= n; k++) tl.set(node, k % 2 ? a : b, t + k * (2 / 30));
  tl.set(node, b, t + (n + 1) * (2 / 30));
};

// ═══ dati ══════════════════════════════════════════════════════════════════════════════════
// D02 · badge views (pill con occhio) — poppano in sequenza
const viewBadge = (parent, cx, cy, text, o) => {

  const g = el(parent, { position: "absolute", left: cx - size / 2, top: cy - size / 2, width: size, height: size, zIndex: o.z || 12 });
  const halo = el(g, { position: "absolute", left: -size * 0.25, top: -size * 0.25, width: size * 1.5, height: size * 1.5, borderRadius: "50%", background: "radial-gradient(circle, rgba(207,251,80,.45) 0%, rgba(207,251,80,.12) 38%, rgba(207,251,80,0) 68%)", opacity: 0 });
  const base = el(g, { position: "absolute", inset: 0, filter: "drop-shadow(0 0 10px rgba(255,255,255,.55)) drop-shadow(0 0 30px rgba(255,255,255,.25))" }, svg("brain", size, "rgba(255,255,255,.92)", 1.1));
  const lit = el(g, { position: "absolute", inset: 0, opacity: 0, filter: "drop-shadow(0 0 12px rgba(207,251,80,.95)) drop-shadow(0 0 40px rgba(207,251,80,.6))" }, svg("brain", size, K.lime, 1.4));
  // neuroni: puntini che si accendono sul cervello
  const N = [[0.3, 0.32], [0.46, 0.22], [0.62, 0.3], [0.38, 0.5], [0.58, 0.52], [0.7, 0.66], [0.3, 0.68], [0.5, 0.72]].map(([u, v]) => {
    const d = el(g, { position: "absolute", left: size * u - 6, top: size * v - 6, width: 12, height: 12, borderRadius: "50%", background: "#fff", boxShadow: "0 0 12px #fff, 0 0 26px rgba(207,251,80,.8)", opacity: 0 });
    return d;
  });
  return {
    g,
    on: (t) => { tl.to([lit, halo], { opacity: 1, duration: 0.25 }, t); tl.to(base, { opacity: 0.25, duration: 0.25 }, t); N.forEach((d, i) => { tl.to(d, { opacity: 1, duration: 0.08 }, t + 0.05 + i * 0.04); tl.to(d, { opacity: 0.35, duration: 0.4 }, t + 0.3 + i * 0.04); }); },
    off: (t) => { tl.to([lit, halo], { opacity: 0, duration: 0.3 }, t); tl.to(base, { opacity: 1, duration: 0.3 }, t); tl.to(N, { opacity: 0, duration: 0.2 }, t); },
    spark: (t) => N.forEach((d, i) => { tl.to(d, { opacity: 1, duration: 0.06 }, t + ((hash(i, 3) + 1) / 2) * 0.5); tl.to(d, { opacity: 0, duration: 0.3 }, t + 0.1 + ((hash(i, 3) + 1) / 2) * 0.5); }),
  };
};

// ═══ O18 · tubo al neon che si disegna + riflesso che corre ═══════════════════════════════
// d = path SVG (coordinate del parent); o: { w (spessore), color, z, x0,y0,W,H (area svg) }
const neonPath = (parent, d, o) => {
  o = o || {};
  const w = o.w || 34, col = o.color || K.lime;
  const S = svgLayer(parent, o.z || 8, o.x0 == null ? -60000 : o.x0, o.y0 == null ? -60000 : o.y0, o.W || 200000, o.H || 200000);
  const glowP = pathEl(S, d, { fill: "none", stroke: col, "stroke-width": w + 26, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.22 });
  glowP.style.filter = "blur(16px)";
  const body = pathEl(S, d, { fill: "none", stroke: col, "stroke-width": w, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.9 });
  body.style.filter = `drop-shadow(0 0 10px ${rgba(col.startsWith("#") ? col : "#CFFB50", 0.8)})`;
  const core = pathEl(S, d, { fill: "none", stroke: "#ffffff", "stroke-width": Math.max(3, w * 0.22), "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.7 });
  const L = drawable(glowP); drawable(body); drawable(core);
  const glint = pathEl(S, d, { fill: "none", stroke: "#ffffff", "stroke-width": w * 0.7, "stroke-linecap": "round", opacity: 0 });
  glint.style.filter = "blur(2px) drop-shadow(0 0 12px #fff)";
  const gl = Math.max(40, L * 0.06);
  glint.setAttribute("stroke-dasharray", `${gl} ${L}`);
  return {
    S, L,
    draw: (t, dur) => { [glowP, body, core].forEach((p) => drawOn(p, t, dur || 1.8, "none")); },
    // il riflesso fa n giri (giro = durata) a partire da t
    glint: (t, giro, n) => {
      tl.set(glint, { attr: { opacity: 1 } }, t);
      tl.fromTo(glint, { attr: { "stroke-dashoffset": gl } }, { attr: { "stroke-dashoffset": -L * (n || 1) }, duration: (giro || 1.6) * (n || 1), ease: "none", immediateRender: false }, t);
      tl.set(glint, { attr: { opacity: 0 } }, t + (giro || 1.6) * (n || 1));
    },
  };
};

// ═══ L04 · checklist con spunte ════════════════════════════════════════════════════════════
const checklist = (parent, cx, cy, w, items, o) => {
  o = o || {};
  const h = o.h || 100, gap = o.gap || 18, fs = o.fs || 32;
  const top = cy - (items.length * h + (items.length - 1) * gap) / 2;
  const rows = items.map((txt, i) => {
    const r = el(parent, { position: "absolute", left: cx - w / 2, top: top + i * (h + gap), width: w, height: h, borderRadius: 16, background: "linear-gradient(90deg,#272727,#1f1f1f)", border: "1.5px solid rgba(255,255,255,.09)", boxShadow: "0 16px 40px rgba(0,0,0,.45)", overflow: "hidden", zIndex: o.z || 12 });
    el(r, { position: "absolute", left: 0, top: 0, width: 7, height: h, background: K.lime, boxShadow: GLOW_A(0.5) });
    const bx = el(r, { position: "absolute", left: 34, top: h / 2 - 22, width: 44, height: 44, borderRadius: 10, border: "3px solid rgba(255,255,255,.8)" });
    const chk = el(bx, { position: "absolute", left: 2, top: 2, width: 34, height: 34 }, `<svg width="34" height="34" viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="${K.lime}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
    const p = chk.querySelector("path"); drawable(p);
    chk.style.filter = "drop-shadow(0 0 6px rgba(207,251,80,.9))";
    const tx = el(r, { position: "absolute", left: 104, top: 0, right: 24, height: h, display: "flex", alignItems: "center", fontFamily: FS, fontWeight: 700, fontSize: fs, color: K.white, lineHeight: 1.15 }, txt);
    gsap.set(r, { opacity: 0 });
    return { r, bx, p, tx };
  });
  return {
    rows,
    show: (t, step) => rows.forEach((rw, i) => blurIn(rw.r, t + i * (step == null ? 0.08 : step), { y: 24, blur: 10, dur: 0.4 })),
    tick: (i, t) => { drawOn(rows[i].p, t, 0.22, "power2.out"); tl.to(rows[i].bx, { borderColor: K.lime, boxShadow: GLOW_A(0.5), duration: 0.15 }, t); },
  };
};

// ═══ L11 · percorso a tappe ════════════════════════════════════════════════════════════════
// pts: [[x,y], …] (coordinate del parent) · labels: testo di ogni tappa · o: { S (svgLayer), r }
const pathSteps = (parent, S, pts, labels, o) => {
  o = o || {};
  const R = o.r || 34;
  const segs = [];
  for (let i = 1; i < pts.length; i++) segs.push(connector(S, [pts[i - 1], pts[i]], { color: "rgba(255,255,255,.35)", w: 4, curve: o.curve || null }));
  const lit = [];
  for (let i = 1; i < pts.length; i++) lit.push(connector(S, [pts[i - 1], pts[i]], { color: K.lime, w: 5, curve: o.curve || null, glow: true }));
  const nodes = pts.map(([x, y], i) => {
    const n = el(parent, { position: "absolute", left: x - R, top: y - R, width: R * 2, height: R * 2, borderRadius: "50%", background: "#262626", border: "3px solid rgba(255,255,255,.35)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FS, fontWeight: 800, fontSize: R * 0.8, color: "rgba(255,255,255,.6)", zIndex: 14 }, String(i + 1));
    const lb = el(parent, { position: "absolute", left: x - 180, top: y + R + 14, width: 360, textAlign: "center", fontFamily: FS, fontWeight: 700, fontSize: o.fs || 28, color: "rgba(255,255,255,.5)", filter: "blur(5px)", zIndex: 14, lineHeight: 1.15 }, labels[i] || "");
    gsap.set([n, lb], { opacity: 0 });
    return { n, lb };
  });
  const runner = el(parent, { position: "absolute", left: pts[0][0] - 11, top: pts[0][1] - 11, width: 22, height: 22, borderRadius: "50%", background: "#fff", boxShadow: "0 0 16px #fff, 0 0 34px rgba(207,251,80,.8)", opacity: 0, zIndex: 15 });
  return {
    nodes,
    show: (t) => { segs.forEach((s, i) => s.draw(t + i * 0.12, 0.35)); nodes.forEach((nd, i) => tl.to([nd.n, nd.lb], { opacity: 1, duration: 0.25 }, t + i * 0.12)); },
    // go(i, t): il tratto fino alla tappa i si accende, la tappa si attiva, l'etichetta va a fuoco
    go: (i, t, dur) => {
      if (i > 0) { lit[i - 1].draw(t, dur || 0.45, "power2.inOut"); tl.set(runner, { opacity: 1 }, t); tl.to(runner, { x: pts[i][0] - pts[0][0], y: pts[i][1] - pts[0][1], duration: dur || 0.45, ease: "power2.inOut" }, t); }
      const nd = nodes[i], tt = t + (i > 0 ? (dur || 0.45) : 0);
      tl.to(nd.n, { background: K.lime, borderColor: K.lime, color: K.ink, boxShadow: GLOW_A(0.9), duration: 0.18 }, tt);
      tl.fromTo(nd.n, { scale: 1.25 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)", immediateRender: false }, tt);
      tl.to(nd.lb, { filter: "blur(0px)", color: K.white, duration: 0.25 }, tt);
    },
  };
};

// ═══ O07 · scala al neon ═══════════════════════════════════════════════════════════════════
// pioli dal basso (0) all'alto; labels per piolo · o: { w, gap, n }
const ladder = (parent, cx, bottom, labels, o) => {
  o = o || {};
  const n = labels.length, gap = o.gap || 170, w = o.w || 520, tube = o.tube || 22;
  const H = gap * (n - 1) + 160, top = bottom - H;
  const S = svgLayer(parent, o.z || 8, cx - w, top - 100, w * 2, H + 200);
  const rail = (x) => `M${x} ${bottom + 40} L${x} ${top}`;
  const parts = [];
  const tubeP = (d, a) => {
    const g = pathEl(S, d, { fill: "none", stroke: K.lime, "stroke-width": tube + 22, "stroke-linecap": "round", opacity: 0.18 * (a || 1) });
    g.style.filter = "blur(12px)";
    const b = pathEl(S, d, { fill: "none", stroke: K.lime, "stroke-width": tube, "stroke-linecap": "round", opacity: 0.55 * (a || 1) });
    b.style.filter = "drop-shadow(0 0 8px rgba(207,251,80,.8))";
    const c = pathEl(S, d, { fill: "none", stroke: "#fff", "stroke-width": tube * 0.22, "stroke-linecap": "round", opacity: 0.5 * (a || 1) });
    [g, b, c].forEach(drawable);
    parts.push([g, b, c]);
    return [g, b, c];
  };
  tubeP(rail(cx - w / 2)); tubeP(rail(cx + w / 2));
  const rungs = labels.map((_, i) => tubeP(`M${cx - w / 2} ${bottom - i * gap} L${cx + w / 2} ${bottom - i * gap}`, 0.8));
  const tags = labels.map((tx, i) => {
    const y = bottom - i * gap;
    const fsN = o.fs || 34;
    const nm = el(parent, { position: "absolute", left: cx - w / 2 + 30, top: y - gap / 2 - fsN * 0.75, width: w - 60, textAlign: "center", fontFamily: FS, fontWeight: 800, fontSize: fsN, lineHeight: 1.1, letterSpacing: "0.04em", color: K.white, textShadow: GLOW_T, zIndex: 12, whiteSpace: "nowrap" });
    const lvl = el(parent, { position: "absolute", left: cx - 200, top: y - gap / 2 + fsN * 0.55, width: 400, textAlign: "center", fontFamily: FS, fontWeight: 700, fontSize: 18, letterSpacing: "0.22em", color: "rgba(255,255,255,.55)", zIndex: 12 }, `LIVELLO ${i + 1}`);
    gsap.set(lvl, { opacity: 0 });
    return { lvl, nm, tx };
  });
  return {
    S, rungs, tags,
    build: (t, dur) => parts.forEach((pp, i) => pp.forEach((p) => drawOn(p, t + (i < 2 ? 0 : 0.15 + (i - 2) * 0.06), dur || 0.6, "power2.out"))),
    // il piolo i si accende e il nome si scrive a macchina
    on: (i, t) => {
      const [g, b, c] = rungs[i];
      tl.to([g], { attr: { opacity: 0.4 }, duration: 0.2 }, t);
      tl.to([b], { attr: { opacity: 1 }, duration: 0.2 }, t);
      tl.to([c], { attr: { opacity: 0.9 }, duration: 0.2 }, t);
      tl.to(tags[i].lvl, { opacity: 1, duration: 0.2 }, t);
      typeIn(tags[i].nm, tags[i].tx.toUpperCase(), t + 0.1, 14);
    },
  };
};

// ═══ O06 · imbuto a strati ═════════════════════════════════════════════════════════════════
const funnel = (parent, cx, top, labels, o) => {
  o = o || {};
  const n = labels.length, w0 = o.w || 820, w1 = o.wEnd || 260, h = o.h || 104, gap = o.gap || 14, z = o.z || 12;
  const layers = labels.map((tx, i) => {
    const a = w0 - ((w0 - w1) * i) / n, b = w0 - ((w0 - w1) * (i + 1)) / n;
    const y = top + i * (h + gap);
    const poly = `polygon(0 0, 100% 0, ${50 + (b / a) * 50}% 100%, ${50 - (b / a) * 50}% 100%)`;
    const glow = clipGlow(parent, cx - a / 2, y, a, h, poly, z - 1, 0.45);
    const L = el(parent, { position: "absolute", left: cx - a / 2, top: y, width: a, height: h, clipPath: poly, background: limeFill(1 - i * 0.06), zIndex: z });
    el(L, { position: "absolute", left: 0, top: 0, width: "100%", height: 5, background: "rgba(255,255,255,.75)" });
    const lb = el(parent, { position: "absolute", left: cx - a / 2, top: y, width: a, height: h, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FS, fontWeight: 800, fontSize: o.fs || 30, color: K.ink, zIndex: z + 2, whiteSpace: "nowrap" }, tx);
    gsap.set([glow, L, lb], { opacity: 0 });
    return { L, glow, lb, y };
  });
  const by = top + n * (h + gap) + 30;
  const orb = el(parent, { position: "absolute", left: cx - 60, top: by, width: 120, height: 120, borderRadius: "50%", background: "radial-gradient(circle at 35% 30%, #f4ffd0 0%, #CFFB50 40%, #a9d634 100%)", boxShadow: `${GLOW_A(1)}, 0 0 80px rgba(207,251,80,.5)`, zIndex: z + 1 });
  gsap.set(orb, { opacity: 0, scale: 0.3 });
  return {
    layers, orb,
    build: (t, step) => {
      layers.forEach((ly, i) => {
        const tt = t + i * (step || 0.15);
        tl.fromTo([ly.L, ly.lb], { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, tt);
        tl.fromTo(ly.glow, { opacity: 0 }, { opacity: 0.45, duration: 0.4, immediateRender: false }, tt);
      });
      tl.to(orb, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, t + layers.length * (step || 0.15));
    },
    light: (i, t) => { tl.to(layers[i].glow, { opacity: 1, duration: 0.15 }, t); tl.fromTo([layers[i].L, layers[i].lb], { scale: 1.06 }, { scale: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, t); tl.to(layers[i].glow, { opacity: 0.45, duration: 0.6 }, t + 0.5); },
    dim: (i, t) => tl.to([layers[i].L, layers[i].lb], { opacity: 0.25, duration: 0.3 }, t),
  };
};

// ═══ O22 · folla in un riquadro con contatore ═══════════════════════════════════════════════
const crowd = (parent, cx, cy, cols, rows, o) => {
  o = o || {};
  const s = o.s || 44, gap = o.gap || 12;
  const W = cols * s + (cols - 1) * gap + 70, H = rows * s + (rows - 1) * gap + 130;
  const c = glass(parent, cx - W / 2, cy - H / 2, W, H, { zIndex: o.z || 12 });
  const people = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) people.push(person(c, 35 + s / 2 + i * (s + gap), 35 + s / 2 + j * (s + gap), s, "rgba(255,255,255,.85)", 3));
  const num = el(c, { position: "absolute", left: 0, bottom: 22, width: W, textAlign: "center", fontFamily: FS, fontWeight: 800, fontSize: 40, color: K.lime, textShadow: GLOW_LT }, o.label || "");
  gsap.set(people, { opacity: 0 });
  const recolorP = (t, idx, color, step) => idx.forEach((i, k) => tl.to(people[i].children, { background: color, duration: 0.1 }, t + k * (step || 0)));
  return {
    c, people, num,
    fillIn: (t, dur) => people.forEach((p, i) => tl.to(p, { opacity: 1, duration: 0.1 }, t + ((hash(i, 21) + 1) / 2) * (dur || 0.6))),
    recolor: recolorP,
    dim: (t, idx, a) => tl.to(idx.map((i) => people[i]), { opacity: a == null ? 0.18 : a, duration: 0.3 }, t),
    count: (t, from, to, dur, fmt) => { const P = { v: from }; tl.to(P, { v: to, duration: dur, ease: "none", onUpdate: () => (num.textContent = (fmt || ((v) => itNum(v) + " persone"))(P.v)) }, t); },
  };
};

// ═══ D04 · retention che crolla ══════════════════════════════════════════════════════════
const retention = (parent, x, y, o) => {
  o = o || {};
  const w = o.w || 620, h = o.h || 380;
  const c = glass(parent, x, y, w, h, { zIndex: o.z || 12 });
  el(c, { position: "absolute", left: 30, top: 24, fontFamily: FS, fontWeight: 700, fontSize: 24, color: "rgba(255,255,255,.8)" }, o.label || "Visualizzazione");
  const S = svgIn(c, w, h);
  const x0 = 40, x1 = w - 40, y0 = 90, y1 = h - 40;
  const P = o.points || [[0, 0], [0.08, 0.12], [0.14, 0.55], [0.22, 0.7], [0.4, 0.78], [0.7, 0.84], [1, 0.88]];
  const d = "M" + P.map(([u, v]) => `${(x0 + (x1 - x0) * u).toFixed(1)} ${(y0 + (y1 - y0) * v).toFixed(1)}`).join(" L");
  pathEl(S, `M${x0} ${y1} L${x1} ${y1}`, { stroke: "rgba(255,255,255,.2)", "stroke-width": 2 });
  const line = pathEl(S, d, { fill: "none", stroke: "#fff", "stroke-width": 5, "stroke-linecap": "round", "stroke-linejoin": "round" });
  line.style.filter = "drop-shadow(0 0 8px rgba(255,255,255,.7))";
  drawable(line);
  const dropX = x0 + (x1 - x0) * P[2][0], dropY = y0 + (y1 - y0) * P[2][1];
  const pct = el(c, { position: "absolute", right: 30, top: 16, fontFamily: FD, fontWeight: 700, fontSize: 50, color: K.white, textShadow: GLOW_T }, "100%");
  return {
    c, dropX, dropY,
    draw: (t, dur) => {
      drawOn(line, t, dur || 0.9, "power1.inOut");
      const Q = { v: 100 };
      tl.to(Q, { v: o.end || 12, duration: dur || 0.9, ease: "power2.in", onUpdate: () => (pct.textContent = Math.round(Q.v) + "%") }, t);
    },
  };
};

// ═══ D05 · barre che crescono ══════════════════════════════════════════════════════════════
// bars: [{v:0..1, l:"etichetta", win:true}] · o: { w, h, bw }
const barChart = (parent, cx, base, bars, o) => {
  o = o || {};
  const bw = o.bw || 120, gap = o.gap || 60, H = o.h || 520;
  const W = bars.length * bw + (bars.length - 1) * gap;
  el(parent, { position: "absolute", left: cx - W / 2 - 30, top: base, width: W + 60, height: 3, background: "rgba(255,255,255,.3)", zIndex: 12 });
  const items = bars.map((b, i) => {
    const x = cx - W / 2 + i * (bw + gap);
    const bar = el(parent, { position: "absolute", left: x, top: base - H * b.v, width: bw, height: H * b.v, borderRadius: "14px 14px 4px 4px", background: b.win ? "linear-gradient(180deg,#e2ff8a,#b9e63b)" : "linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.22))", boxShadow: b.win ? GLOW_A(0.8) : "0 0 24px rgba(255,255,255,.12)", transformOrigin: "50% 100%", zIndex: 12 });
    const lb = el(parent, { position: "absolute", left: x - 40, top: base + 16, width: bw + 80, textAlign: "center", fontFamily: FS, fontWeight: 700, fontSize: o.fs || 26, color: b.win ? K.lime : "rgba(255,255,255,.75)", zIndex: 12, lineHeight: 1.1 }, b.l || "");
    gsap.set(bar, { scaleY: 0 });
    gsap.set(lb, { opacity: 0 });
    return { bar, lb, b };
  });
  return {
    items,
    grow: (t, step) => items.forEach((it, i) => { tl.to(it.bar, { scaleY: 1, duration: 0.55, ease: "power3.out" }, t + i * (step == null ? 0.12 : step)); tl.to(it.lb, { opacity: 1, duration: 0.3 }, t + i * (step == null ? 0.12 : step) + 0.1); }),
  };
};

// ═══ D06 · barra di avanzamento ════════════════════════════════════════════════════════════
const progressBar = (parent, x, y, w, o) => {
  o = o || {};
  const h = o.h || 26;
  const tr = el(parent, { position: "absolute", left: x, top: y, width: w, height: h, borderRadius: h / 2, background: "rgba(255,255,255,.1)", border: "1.5px solid rgba(255,255,255,.14)", overflow: "hidden", zIndex: o.z || 12 });
  const f = el(tr, { position: "absolute", left: 0, top: 0, width: w, height: h, borderRadius: h / 2, background: "linear-gradient(90deg,#b9e63b,#e2ff8a)", boxShadow: GLOW_A(0.7), transformOrigin: "0 50%" });
  gsap.set(f, { scaleX: 0 });
  const lab = o.label ? el(parent, { position: "absolute", left: x, top: y - 44, width: w, display: "flex", justifyContent: "space-between", fontFamily: FS, fontWeight: 700, fontSize: 24, color: "rgba(255,255,255,.75)", zIndex: o.z || 12 }, `<span>${o.label}</span><span class="pv">0%</span>`) : null;
  return {
    tr, f,
    fill: (t, to, dur, ease) => {

    },
  };
};

// ═══ X01 · "Commenta X" + anteprima della risorsa ══════════════════════════════════════════
// parola = la parola da commentare; o: { docs (quanti documenti), titolo, sotto }
const ctaCard = (parent, cx, cy, parola, o) => {
  o = o || {};
  const T = titleW({ parent, x: cx, y: cy - 520, size: 88, lines: [[{ t: "Commenta " }, { t: `"${parola}"`, box: true }], [{ t: o.sotto || "e te lo mando", hand: true }]] });
  const n = o.docs || 6, cols = 3, dw = 230, dh = 300, g = 26;
  const gx = cx - (cols * dw + (cols - 1) * g) / 2, gy = cy - 180;
  const docs = [];
  for (let i = 0; i < n; i++) {
    const x = gx + (i % cols) * (dw + g), y = gy + Math.floor(i / cols) * (dh + g);
    const d = el(parent, { position: "absolute", left: x, top: y, width: dw, height: dh, borderRadius: 16, background: "linear-gradient(180deg,#f7f7f2,#e6e6df)", boxShadow: "0 24px 60px rgba(0,0,0,.5)", overflow: "hidden", zIndex: o.z || 14 });
    el(d, { position: "absolute", left: 18, top: 18, width: dw - 36, height: 16, borderRadius: 4, background: "#1e1e1e" });
    el(d, { position: "absolute", left: 18, top: 44, width: (dw - 36) * 0.6, height: 10, borderRadius: 3, background: "#CFFB50" });
    for (let k = 0; k < 9; k++) el(d, { position: "absolute", left: 18, top: 72 + k * 22, width: (dw - 36) * (0.55 + 0.45 * ((hash(i * 9 + k, 4) + 1) / 2)), height: 9, borderRadius: 3, background: "rgba(30,30,30,.22)" });
    gsap.set(d, { opacity: 0, y: 40, scale: 0.9 });
    docs.push(d);
  }
  return {
    T, docs,
    // i documenti arrivano a ondate (1 → 3 → 6)
    show: (t, times) => {
      T.inAt(times || t);
      const waves = o.waves || [1, 3, n];
      let k = 0;
      waves.forEach((upto, wi) => { for (; k < upto && k < n; k++) tl.to(docs[k], { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t + 0.5 + wi * 0.35 + (k % cols) * 0.05); });
    },
  };
};

// ═══ L14 · griglia di esempi (reel veri) con etichetta e badge ═══════════════════════════════
// vids: [{v:"id", l:"etichetta", b:"1,2M"}] · o: { cols, w, h, gap }
const reelGrid = (parent, cx, cy, vids, o) => {
  o = o || {};
  const cols = o.cols || 3, w = o.w || 270, h = o.h || 480, gap = o.gap || 28;
  const rows = Math.ceil(vids.length / cols);
  const W = cols * w + (cols - 1) * gap, H = rows * h + (rows - 1) * (gap + 70);
  const cards = vids.map((vd, i) => {
    const x = cx - W / 2 + (i % cols) * (w + gap) + w / 2, y = cy - H / 2 + Math.floor(i / cols) * (h + gap + 70) + h / 2;
    const vc = videoCard(parent, x, y, w, h, vd.v, { z: 10 });
    const lab = vd.l ? el(parent, { position: "absolute", left: x - w / 2, top: y - h / 2 - 48, width: w, textAlign: "center", fontFamily: FS, fontWeight: 800, fontSize: 24, color: K.white, textShadow: GLOW_T, zIndex: 12, whiteSpace: "nowrap" }, vd.l) : null;
    const bd = vd.b ? viewBadge(parent, x, y + h / 2 + 34, vd.b, { fs: 26 }) : null;
    gsap.set(vc.body, { opacity: 0 });
    if (lab) gsap.set(lab, { opacity: 0 });
    return { vc, lab, bd };
  });
  return {

      popSeq(cards.filter((c) => c.bd).map((c) => c.bd), t + 0.45, 0.08);
    },
  };
};

// ═══ L12 · documento "Video Script" che si costruisce ═══════════════════════════════════════
// sections: [{label:"Hook", rows:2, color}] · o: { w, h, title }
const scriptDoc = (parent, cx, cy, sections, o) => {
  o = o || {};
  const w = o.w || 620, rowsTot = sections.reduce((a, s) => a + s.rows, 0), rh = o.rh || 30;
  const h = o.h || 140 + rowsTot * rh + sections.length * 18;
  const c = el(parent, { position: "absolute", left: cx - w / 2, top: cy - h / 2, width: w, height: h, borderRadius: 22, background: "linear-gradient(180deg,#232323,#171717)", border: "2px solid rgba(255,255,255,.85)", boxShadow: "0 0 26px rgba(255,255,255,.35), 0 0 90px rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.6)", overflow: "hidden", zIndex: o.z || 12 });
  el(c, { position: "absolute", left: 0, top: 26, width: w, textAlign: "center", fontFamily: FH, fontSize: 40, color: K.white }, o.title || "Copione");
  const PAL = ["#CFFB50", "#ffffff", "#9fd4ff", "#ffd27a", "#b9a3ff"];
  let y = 100;
  const secs = sections.map((s, si) => {
    const col = s.color || PAL[si % PAL.length];
    const mark = el(c, { position: "absolute", left: 30, top: y + 2, width: 18, height: 18, borderRadius: 4, background: col, boxShadow: `0 0 10px ${col}`, opacity: 0 });
    const lab = el(c, { position: "absolute", left: 58, top: y - 4, fontFamily: FS, fontWeight: 800, fontSize: 22, color: col, opacity: 0 }, s.label);
    y += 30;
    const rows = [];
    for (let k = 0; k < s.rows; k++) {
      const ww = (w - 90) * (k === s.rows - 1 ? 0.62 : 0.9 + 0.1 * ((hash(si * 10 + k, 6) + 1) / 2) - 0.1);
      const base = el(c, { position: "absolute", left: 58, top: y + k * rh, width: ww, height: 12, borderRadius: 4, background: "rgba(255,255,255,.18)" });
      const fillR = el(c, { position: "absolute", left: 58, top: y + k * rh, width: ww, height: 12, borderRadius: 4, background: col, boxShadow: `0 0 10px ${col}`, transformOrigin: "0 50%" });
      gsap.set(fillR, { scaleX: 0 });
      rows.push({ base, fillR });
    }
    y += s.rows * rh + 18;
    return { mark, lab, rows, col };
  });
  const allBase = secs.flatMap((s) => s.rows.map((r) => r.base));
  gsap.set(allBase, { scaleX: 0, transformOrigin: "0 50%" });
  return {
    c, secs,
    // le righe grigie si stendono a cascata
    lay: (t) => allBase.forEach((b, i) => tl.to(b, { scaleX: 1, duration: 0.25, ease: "power2.out" }, t + i * 0.02)),
    // la sezione i si colora riga per riga (evidenziatore) con quadratino + etichetta
    section: (i, t, step) => {
      const s = secs[i];
      tl.to([s.mark, s.lab], { opacity: 1, duration: 0.2 }, t);
      s.rows.forEach((r, k) => tl.to(r.fillR, { scaleX: 1, duration: 0.3, ease: "power1.inOut" }, t + 0.1 + k * (step || 0.12)));
    },
    focus: (i, t) => secs.forEach((s, j) => tl.to([s.mark, s.lab, ...s.rows.map((r) => r.fillR), ...s.rows.map((r) => r.base)], { opacity: j === i ? 1 : 0.25, duration: 0.3 }, t)),
  };
};

// ═══ O05 · piramide a livelli con bandiere ════════════════════════════════════════════════
// livelli dal basso; labels per livello (bandiere alternate sx/dx con linea guida)
const pyramid = (parent, S, cx, base, labels, o) => {
  o = o || {};
  const n = labels.length, W = o.w || 700, H = o.h || 640, gap = o.gap || 12;
  const lh = (H - gap * (n - 1)) / n;
  const lv = labels.map((tx, i) => {
    const yb = base - i * (lh + gap), yt = yb - lh;
    const wb = W * (1 - (i * (lh + gap)) / H), wt = W * (1 - (i * (lh + gap) + lh) / H);
    const poly = `polygon(${50 - (wt / wb) * 50}% 0, ${50 + (wt / wb) * 50}% 0, 100% 100%, 0 100%)`;
    const glow = clipGlow(parent, cx - wb / 2, yt, wb, lh, poly, 11, 0.4);
    const L = el(parent, { position: "absolute", left: cx - wb / 2, top: yt, width: wb, height: lh, clipPath: poly, background: limeFill(0.82 + i * (0.18 / Math.max(1, n - 1))), zIndex: 12 });
    el(L, { position: "absolute", left: 0, top: 0, width: "100%", height: 4, background: "rgba(255,255,255,.7)" });
    const num = el(parent, { position: "absolute", left: cx - 60, top: yt, width: 120, height: lh, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: Math.min(64, lh * 0.5), color: K.ink, zIndex: 13 }, String(i + 1));
    const side = i % 2 ? -1 : 1, ym = yt + lh / 2;
    const x0 = cx + side * ((wb + wt) / 4 + 10), x1 = cx + side * (W / 2 + 120);
    const ld = leader(parent, S, x0, ym, x1, ym, tx, { fs: o.fs || 30 });
    gsap.set([L, num, glow], { opacity: 0 });
    return { L, num, ld, glow };
  });
  return {
    lv,
    build: (t, step) => lv.forEach((l, i) => { tl.fromTo([l.L, l.num], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, t + i * (step || 0.15)); tl.to(l.glow, { opacity: 0.4, duration: 0.4 }, t + i * (step || 0.15)); }),
    flag: (i, t) => { lv[i].ld.draw(t, 0.35); lv[i].ld.write(t + 0.15); },
  };
};

// ═══ O20 · radar ══════════════════════════════════════════════════════════════════════════
const radar = (parent, cx, cy, r, o) => {

  };

// ═══ O04 · elementi in orbita su un cerchio tratteggiato ═══════════════════════════════════
const orbit = (parent, cx, cy, r, nodes, o) => {
  o = o || {};
  const ring = el(parent, { position: "absolute", left: cx - r, top: cy - r, width: r * 2, height: r * 2, borderRadius: "50%", border: "2px dashed rgba(255,255,255,.22)", zIndex: 9 });
  const arm = el(parent, { position: "absolute", left: cx, top: cy, width: 1, height: 1, zIndex: 12 });
  nodes.forEach((nd, i) => {
    const a = (i / nodes.length) * Math.PI * 2;
    const holder = el(arm, { position: "absolute", left: Math.cos(a) * r, top: Math.sin(a) * r, width: 1, height: 1 });
    holder.appendChild(nd);
    nd._holder = holder;
  });
  return {
    ring, arm,
