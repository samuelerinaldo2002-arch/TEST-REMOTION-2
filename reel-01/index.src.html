    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        // far bokeh (parallax space, PF of camera speed)
        bokeh($("bokeh"), [
          [120, 320, 360, 0.06], [620, -60, 260, 0.035, true], [860, 720, 420, 0.05], [180, 1150, 300, 0.04, true],
          [1250, 250, 380, 0.05], [1500, 900, 340, 0.045, true], [1150, 1550, 420, 0.06], [1900, 600, 380, 0.05],
          [2200, 1100, 360, 0.045, true], [2600, 700, 420, 0.06], [2050, 1700, 380, 0.05], [2900, 1450, 360, 0.04, true],
          [3200, 1000, 400, 0.05], [2500, 2100, 380, 0.045],
        ]);

        // ═══ 1 · HOOK — "L'errore numero uno che fanno i principianti?" (0 – 2.95s) ═══
        // Kallaway's ring of reels (reels 06 / 11 / 12): posts open from a pile into a slowly turning circle,
        // a dot at the centre blooms into a disc and becomes the label — here the answer, numbered and blurred
        camInit(540, 900, 1);
        drift(0, 2.9, 0, 0, 0.05);
        const T1 = title({ lines: [[{ t: "L'errore " }, { t: "n°1", box: true }], [{ t: "dei principianti", hand: true }]], size: 86 });
        T1.inAt(0.02);
        const L1 = layer(10);
        const RC = [540, 905], RN = 7, RCW = 172, RCH = 306;
        const S1r = svgLayer(L1, 2, 0, 300, 1080, 1250, "white");
        const ringLine = document.createElementNS(NS, "ellipse"); // slightly wider than tall: clears the bar and the title
        ringLine.setAttribute("cx", RC[0]); ringLine.setAttribute("cy", RC[1]); ringLine.setAttribute("rx", 40); ringLine.setAttribute("ry", 36);
        ringLine.setAttribute("fill", "none"); ringLine.setAttribute("stroke", "rgba(255,255,255,.38)"); ringLine.setAttribute("stroke-width", 2); ringLine.setAttribute("stroke-dasharray", "5 9");
        S1r.appendChild(ringLine);
        const ring = ["c1", "c2", "c3", "c4", "c5", "c6", "c7"].map((id, i) => {
          const c = videoCard(L1, RC[0], RC[1], RCW, RCH, id, { z: 6, rot: hash(i, 41) * 6 });
          gsap.set(c.body, { opacity: 1, filter: "blur(5px)" }); // frame 0 already shows the pile
          return c;
        });
        // one proxy drives the whole ring: radius (opens from the pile) and angle (slow clockwise turn); cards stay upright
        const RP = { a: -48, r: 30 };
        const putRing = () => {
          ring.forEach((c, i) => {
            const a = ((RP.a + (i * 360) / RN - 90) * Math.PI) / 180;
            gsap.set(c.wrap, { x: RC[0] + Math.cos(a) * RP.r * 1.076, y: RC[1] + Math.sin(a) * RP.r * 0.95 });
          });
          ringLine.setAttribute("rx", Math.max(1, RP.r * 1.076).toFixed(1)); ringLine.setAttribute("ry", Math.max(1, RP.r * 0.95).toFixed(1));
        };
        putRing();
        tl.to(ring.map((c) => c.body), { filter: "blur(0px)", duration: 0.35, ease: "power2.out", stagger: 0.02 }, 0.0);
        tl.to(RP, { r: 395, duration: 0.85, ease: "expo.out", onUpdate: putRing }, 0.02);
        tl.to(RP, { a: 52, duration: 3.75, ease: "none", onUpdate: putRing }, 0.02);
        tl.fromTo(ringLine, { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -140 }, duration: 3.75, ease: "none", immediateRender: false }, 0.02);
        // the centre: a lime dot on "numero uno" blooms into a disc, then becomes the answer (blurred)
        const dot = el(L1, { position: "absolute", left: RC[0] - 14, top: RC[1] - 14, width: 28, height: 28, borderRadius: "50%", background: K.lime, boxShadow: GLOW_L(0.9), zIndex: 15 });
        gsap.set(dot, { scale: 0 });
        tl.to(dot, { scale: 1, duration: 0.25, ease: "back.out(3)" }, 0.5);
        tl.to(dot, { scale: 9.5, opacity: 0.85, duration: 0.35, ease: "expo.out" }, 0.74);
        tl.to(dot, { scale: 0.3, opacity: 0, duration: 0.25, ease: "power3.in" }, 1.08);
        const BW = 600, BH = 112;
        const BAR = sectionBar(L1, RC[0] - BW / 2, RC[1] - BH / 2, BW, BH, "01", "<span>Pubblicare&nbsp;</span><span style=\"position:relative;display:inline-block\">di tutto</span>", null, { z: 20, fs: 49 });
        const [w1, w2] = BAR.tx.children;
        gsap.set([w1, w2], { filter: "blur(14px)", opacity: 0.5 });
        blurIn(BAR.r, 1.08, { scale: 0.5, blur: 20, y: 0, dur: 0.5, ease: "back.out(1.6)" });
        sheen(BAR.r, 1.45, 0.8);
        const q = handNote(L1, RC[0] + BW / 2 - 6, RC[1] - 140, "?", { size: 130, rot: 10 });
        q.write(1.82, 0.1);
        // "principianti?": the reels go out of focus, the blurred answer is what matters
        tl.to(ring.map((c) => c.body), { filter: "blur(7px)", opacity: 0.38, duration: 0.5, ease: "power2.out", stagger: 0.012 }, 1.5);
        tl.to(BAR.r, { boxShadow: `${GLOW_L(0.35)}, 0 18px 44px rgba(0,0,0,.5)`, duration: 0.4 }, 1.5);

        // ═══ 2 · "Pubblicare di tutto." (2.95 – 4.5s) ═══
        T1.outAt(2.8);
        q.hide(2.85);
        tl.to(w1, { filter: "blur(0px)", opacity: 1, duration: 0.35, ease: "power2.out" }, 3.0);
        tl.to(w2, { filter: "blur(0px)", opacity: 1, duration: 0.3, ease: "power2.out" }, 3.5);
        tl.set([w1, w2], { filter: "none" }, 3.85);
        // hand underline living inside the word, so it follows its real width
        const underline = (span) => {
          const s = document.createElementNS(NS, "svg");
          s.setAttribute("viewBox", "0 0 100 12");
          s.setAttribute("preserveAspectRatio", "none");
          Object.assign(s.style, { position: "absolute", left: "-4%", bottom: "-16px", width: "108%", height: "18px", overflow: "visible", filter: "drop-shadow(0 0 6px rgba(207,251,80,.6))" });
          span.appendChild(s);
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", "M1 7 Q 25 3 50 7 T 99 5");
          p.setAttribute("fill", "none"); p.setAttribute("stroke", K.lime); p.setAttribute("stroke-width", "4"); p.setAttribute("stroke-linecap", "round");
          s.appendChild(p);
          const Ln = p.getTotalLength();
          p.setAttribute("stroke-dasharray", `${Ln} ${Ln}`); p.setAttribute("stroke-dashoffset", Ln);
          return p;
        };
        const u1 = underline(w2);
        tl.to(u1, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.inOut" }, 3.8);
        // "di tutto": the ring spins up and flings the reels out in every direction
        tl.to(ring.map((c) => c.body), { filter: "blur(0px)", opacity: 1, duration: 0.2 }, 3.5);
        tl.to(RP, { a: 150, duration: 0.6, ease: "power2.in", onUpdate: putRing }, 3.77);
        tl.to(RP, { r: 1350, duration: 0.6, ease: "power3.in", onUpdate: putRing }, 3.77);
        tl.to(ring.map((c) => c.body), { opacity: 0, duration: 0.3, stagger: 0.015 }, 4.05);
        tl.to(ringLine, { attr: { opacity: 0 }, duration: 0.3 }, 3.8);
        // the list item becomes the section header (shared element), then hands over to a HUD copy
        const HY = 236, HS = 0.8, CS = CAM.s;
        tl.to(BAR.r, { y: (HY - 880) / CS - (RC[1] - 900), scale: HS / CS, duration: 0.45, ease: "power3.inOut" }, 4.05);
        const HB = sectionBar(hud, 540 - BW / 2, HY - BH / 2, BW, BH, "01", "<span>Pubblicare&nbsp;</span><span style=\"position:relative;display:inline-block\">di tutto</span>", null, { z: 55, fs: 49 });
        underline(HB.tx.children[1]).setAttribute("stroke-dashoffset", 0);
        gsap.set(HB.r, { scale: HS, opacity: 0 });
        tl.set(HB.r, { opacity: 1 }, 4.5);
        tl.set(BAR.r, { opacity: 0 }, 4.5);

        // ═══ 3 · THE WEEK — "Lunedì fitness, martedì viaggi, venerdì motivazione" (4.5 – 7.6s) ═══
        // Kallaway's horizontal timeline: the camera travels along it, each day drops a real post
        const L2 = layer(12);
        const TLY = 1150, CW = 340, CH = 604, CY = 741, DX = [1700, 2260, 2820, 3380, 3940], DAYS = ["LUN", "MAR", "MER", "GIO", "VEN"];
        const S2 = svgLayer(L2, 2, 1300, 300, 3200, 1100, "white");
        const tline = connector(S2, [[1380, TLY], [4300, TLY]], { color: "rgba(255,255,255,.8)", w: 3 });
        tline.draw(4.45, 0.6, "power2.out");
        const ticks = [];
        for (let x = 1450; x < 4280; x += 112) if (!DX.some((d) => Math.abs(d - x) < 40)) ticks.push(el(L2, { position: "absolute", left: x - 1, top: TLY - 12, width: 2, height: 24, background: "rgba(255,255,255,.28)" }));
        gsap.set(ticks, { opacity: 0 });
        tl.to(ticks, { opacity: 1, duration: 0.3, stagger: 0.008 }, 4.5);
        // every day is already on the line, dim; it lights up when he names it
        const nodes = DX.map((x, k) => {
          const n = el(L2, { position: "absolute", left: x - 18, top: TLY - 18, width: 36, height: 36, borderRadius: "50%", background: "#3a3a3a", border: "4px solid rgba(255,255,255,.55)", zIndex: 5 });
          const lb = el(L2, { position: "absolute", left: x + 22, top: TLY - 92, fontFamily: FD, fontWeight: 700, fontSize: 56, color: K.white, textShadow: GLOW_W, zIndex: 5, lineHeight: 1 }, DAYS[k]);
          gsap.set([n, lb], { opacity: 0 });
          tl.to([n, lb], { opacity: 0.35, duration: 0.3 }, 4.55 + k * 0.03);
          return { n, lb };
        });
        const dayIn = (k, t) => {
          tl.to(nodes[k].n, { opacity: 1, backgroundColor: K.lime, borderColor: "#ffffff", boxShadow: GLOW_L(0.8), duration: 0.2 }, t);
          tl.fromTo(nodes[k].n, { scale: 1.6 }, { scale: 1, duration: 0.4, ease: "back.out(3)", immediateRender: false }, t);
          tl.to(nodes[k].lb, { opacity: 1, duration: 0.25 }, t + 0.04);
        };
        const CARDS = [["l1", "Fitness", "dumbbell"], ["l2", "Viaggi", "plane"], ["l3", "Cucina", "pizza"], ["l4", "Animali", "paw-print"], ["l5", "Motivazione", "flame"]];
        const cards = CARDS.map(([id, lab, ic], k) => {
          const c = videoCard(L2, DX[k], CY, CW, CH, id, { label: lab, icon: ic, z: 8 });
          gsap.set(c.body, { opacity: 0 });
          const st = connector(S2, [[DX[k], CY + CH / 2 + 2], [DX[k], TLY - 20]], { dash: [8, 8], color: "rgba(255,255,255,.55)", w: 3 });
          return Object.assign(c, { st });
        });
        const cardIn = (k, t) => { blurIn(cards[k].body, t, { y: 50, blur: 22, scale: 0.9, dur: 0.55 }); cards[k].st.draw(t + 0.1, 0.3); };
        // tight on the day, camera travelling along the line (Kallaway timeline)
        whip(4.5, 0.5, 1817, 808, 1.2, null, 18);
        dayIn(0, 4.73);
        cardIn(0, 5.4);
        whip(5.8, 0.38, 2377, 808, 1.2, null, 12);
        dayIn(1, 5.86);
        cardIn(1, 6.17);
        whip(6.48, 0.42, 3820, 808, 1.2, null, 20);
        dayIn(2, 6.58);
        dayIn(3, 6.64);
        dayIn(4, 6.7);
        cardIn(4, 6.97);
        // pull back: the whole week, all over the place
        cam(7.0, 0.55, 2820, 800, 0.39, "power3.inOut");
        cardIn(2, 7.03);
        cardIn(3, 7.09);

        // ═══ 4 · THE ALGORITHM — "…l'algoritmo non capisce di cosa parla il tuo profilo" (7.6 – 10.75s) ═══
        // Kallaway hub: every post converges into the platform logo, which outputs a gauge that can't settle
        blurOut(HB.r, 7.55, { y: -20, dur: 0.3 });
        const T4 = title({ icon: "cpu", lines: [[{ t: "L'algoritmo " }, { t: "non capisce", box: true }]], size: 84 });
        T4.inAt(7.74);
        cam(7.6, 0.85, 2820, 900, 1, "power3.inOut");
        tline.hide(7.6, 0.3);
        tl.to([...nodes.map((n) => n.n), ...nodes.map((n) => n.lb), ...ticks], { opacity: 0, duration: 0.3 }, 7.6);
        cards.forEach((c) => c.st.hide(7.6, 0.2));
        const HX = 2820, OFFY = 20; // world = screen + (2280, 20) at this pose
        const ROWX = [150, 345, 540, 735, 930].map((x) => x + 2280), ROWY = 525 + OFFY, RS = 0.44;
        cards.forEach((c, k) => tl.to(c.wrap, { x: ROWX[k], y: ROWY, scale: RS, rotation: 0, duration: 0.85, ease: "power3.inOut" }, 7.6 + k * 0.03));
        const L3 = layer(14);
        const IGY = 800 + OFFY;
        const IG = appIcon(L3, HX, IGY, 130, "instagram", 22);
        blurIn(IG, 8.25, { y: -20, blur: 16, scale: 0.7, dur: 0.5, ease: "back.out(2)" });
        const NODE = nodePill(L3, HX, IGY + 112, '<span style="opacity:.55">&lt;</span>algoritmo<span style="opacity:.55">/&gt;</span>', { w: 300, h: 70, fs: 30 });
        blurIn(NODE, 8.35, { y: 16, blur: 14, dur: 0.45 });
        ripple(L3, HX, IGY, 8.67, { wd: 130, ht: 130, radius: "34px", s0: 1, s1: 1.9, dur: 0.6, w: 3 });
        ripple(L3, HX, IGY, 8.92, { wd: 130, ht: 130, radius: "34px", s0: 1, s1: 1.9, dur: 0.6, w: 3, a: 0.6 });
        const S3 = svgLayer(L3, 6, 2300, 400, 1100, 1100, true);
        ROWX.forEach((x, k) => {
          const cn = connector(S3, [[x, ROWY + (CH * RS) / 2 + 4], [HX, IGY - 72]], { curve: "v", dash: [12, 10], color: K.lime, w: 3.5 });
          cn.draw(8.45 + k * 0.04, 0.45);
          traveller(S3, cn, 8.72 + k * 0.08, 0.45, K.lime, 8);
          cn.hide(10.6, 0.3);
        });
        // the algorithm's read of your profile: three rows it cannot fill.
        // (the same three come back as the triad's choices: nicchia / pubblico / problema)
        const GW = 760, GH = 380, GX = HX - GW / 2, GY = 975 + OFFY;
