    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        // bokeh lontano (parallasse a PF della camera)
        bokeh($("bokeh"), [
          [120, 320, 360, 0.06], [620, -60, 260, 0.035, true], [860, 720, 420, 0.05], [180, 1150, 300, 0.04, true],
          [1250, 250, 380, 0.05], [1500, 900, 340, 0.045, true], [1150, 1550, 420, 0.06], [1900, 600, 380, 0.05],
          [2200, 1100, 360, 0.045, true], [2600, 700, 420, 0.06], [2050, 1700, 380, 0.05], [2900, 1450, 360, 0.04, true],
          [3200, 1000, 400, 0.05], [2500, 2100, 380, 0.045],
        ]);
        // titoli parola per parola sui tempi del voice-over (d01.ts)
        const W = (txt, from) => at(txt, from == null ? 0 : findWord(from));

        // ═══ 1 · HOOK — "L'errore numero uno che fanno i principianti?" (0 – 2.95) ═══
        // O01 anello di reel veri che si apre e gira (reel 13–14 di Kallaway) · al centro un punto diventa la risposta, sfocata
        const L1 = layer(10);
        const RC = [540, 905];
        { const p0 = fitPose(RC[0] - 470, RC[1] - 500, RC[0] + 470, RC[1] + 500, { top: 330, fill: 0.98 }); camInit(p0.fx, p0.fy, p0.s * 0.97); }
        rackFocus(0, 0.45);
        float(0, 2.9, 0, 0, 0.05);
        const T1 = titleW({ lines: [[{ t: "L'errore " }, { t: "numero uno", box: true }], [{ t: "dei principianti", hand: true }]], size: 86 });
        T1.inAt([W("'errore"), W("numero"), W("uno"), W("i"), W("principianti?")]);
        const ring = reelRing(L1, RC[0], RC[1], ["c1", "c2", "c3", "c4", "c5", "c6", "c7"], { r: 380, w: 170, r0: 40, a0: -2.2 });
        gsap.set(ring.cards.map((c) => c.wrap), { opacity: 1 }); // il fotogramma 0 mostra già la pila di reel (sfocata dal rack focus)
        ring.open(0.02, 0.42);
        ring.spin(0.02, 3.75, 26);
        // il punto lime su "numero uno" che sboccia in un disco e poi diventa la risposta (K13)
        const dot = el(L1, { position: "absolute", left: RC[0] - 14, top: RC[1] - 14, width: 28, height: 28, borderRadius: "50%", background: K.lime, boxShadow: GLOW_L(0.9), zIndex: 15 });
        gsap.set(dot, { scale: 0 });
        tl.to(dot, { scale: 1, duration: 0.25, ease: "back.out(3)" }, W("numero"));
        tl.to(dot, { scale: 9.5, opacity: 0.85, duration: 0.35, ease: "expo.out" }, W("uno"));
        tl.to(dot, { scale: 0.3, opacity: 0, duration: 0.25, ease: "power3.in" }, 1.08);
        const BW = 600, BH = 112;
        const BAR = sectionBar(L1, RC[0] - BW / 2, RC[1] - BH / 2, BW, BH, "01", "<span>Pubblicare&nbsp;</span><span style=\"position:relative;display:inline-block\">di tutto</span>", null, { z: 20, fs: 49 });
        const [w1, w2] = BAR.tx.children;
        gsap.set([w1, w2], { filter: "blur(14px)", opacity: 0.5 });
        blurIn(BAR.r, 1.08, { scale: 0.5, blur: 20, y: 0, dur: 0.5, ease: "back.out(1.6)" });
        sheen(BAR.r, 1.45, 0.8);
        const q = handNote(L1, RC[0] + BW / 2 - 6, RC[1] - 140, "?", { size: 130, rot: 10 });
        q.write(1.82, 0.1);
        // "principianti?": i reel vanno fuori fuoco, conta la risposta sfocata
        ring.defocus(W("principianti?"), 0.38);
        tl.to(BAR.r, { boxShadow: `${GLOW_L(0.35)}, 0 18px 44px rgba(0,0,0,.5)`, duration: 0.4 }, 1.5);

        // ═══ 2 · "Pubblicare di tutto." (2.95 – 4.5) — la risposta va a fuoco, l'anello scaglia via i reel ═══
        T1.outAt(2.55);
        q.hide(2.85);
        tl.to(w1, { filter: "blur(0px)", opacity: 1, duration: 0.35, ease: "power2.out" }, W("Pubblicare"));
        tl.to(w2, { filter: "blur(0px)", opacity: 1, duration: 0.3, ease: "power2.out" }, W("di", "Pubblicare"));
        tl.set([w1, w2], { filter: "none" }, 3.85);
        // sottolineatura a mano dentro la parola, così segue la sua larghezza vera
        const underline = (span) => {
          const s = document.createElementNS(NS, "svg");
          s.setAttribute("viewBox", "0 0 100 12");
          s.setAttribute("preserveAspectRatio", "none");
          Object.assign(s.style, { position: "absolute", left: "-4%", bottom: "-16px", width: "108%", height: "18px", overflow: "visible", filter: "drop-shadow(0 0 6px rgba(207,251,80,.6))" });
          span.appendChild(s);
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", "M1 7 Q 25 3 50 7 T 99 5");
          p.setAttribute("fill", "none"); p.setAttribute("stroke", K.lime); p.setAttribute("stroke-width", "4"); p.setAttribute("stroke-linecap", "round");
          s.appendChild(p);
          const Ln = p.getTotalLength();
          p.setAttribute("stroke-dasharray", `${Ln} ${Ln}`); p.setAttribute("stroke-dashoffset", Ln);
          return p;
        };
        const u1 = underline(w2);
        tl.to(u1, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.inOut" }, W("tutto.") + 0.03);
        ring.refocus(W("di", "Pubblicare"));
        ring.fling(W("tutto."), 0.6);
        // la voce diventa l'intestazione della sezione (K14), poi passa a una copia nell'HUD
        const HY = 236, HS = 0.8;
        tl.to(BAR.r, { y: (HY - ANCHOR.y) / CAM.s - (RC[1] - CAM.fy) + 0, scale: HS / CAM.s, duration: 0.45, ease: "power3.inOut" }, 4.05);
        const HB = sectionBar(hud, 540 - BW / 2, HY - BH / 2, BW, BH, "01", "<span>Pubblicare&nbsp;</span><span style=\"position:relative;display:inline-block\">di tutto</span>", null, { z: 55, fs: 49 });
        underline(HB.tx.children[1]).setAttribute("stroke-dashoffset", 0);
        gsap.set(HB.r, { scale: HS, opacity: 0 });
        tl.set(HB.r, { opacity: 1 }, 4.5);
        tl.set(BAR.r, { opacity: 0 }, 4.5);

        // ═══ 3 · LA SETTIMANA — "Lunedì fitness, martedì viaggi, venerdì motivazione" (4.5 – 7.6) ═══
        // O24 in riga: il planner della settimana, un reel vero di un tema diverso cade in ogni giorno detto
        const L2 = layer(12);
        const PX = 2800, PY = 900;
        const plan = weekPlan(L2, PX, PY, ["LUN", "MAR", "MER", "GIO", "VEN"], { cw: 172, gap: 18 });
        gsap.set(plan.box, { opacity: 0 });
        tl.set(plan.box, { opacity: 1 }, 4.5);
        plan.ghost(4.5, ["l1", "l2", "l3", "l4", "l5"]); // i giorni non ancora detti sono già pieni, sfocati
        const x0p = plan.rect[0], y0p = plan.rect[1], y1p = plan.rect[3], cwp = 172 + 18;
        // stretto su LUN–MAR (la camera corre lungo la settimana come la timeline di Kallaway), poi GIO–VEN, poi tutta
        const r01 = [x0p + 6, y0p, x0p + 30 + 2 * cwp + 24, y1p];
        { const p = fitPose(r01[0], r01[1], r01[2], r01[3], { top: 330, fill: 0.96 }); whip2(4.5, 0.5, p.fx, p.fy, p.s, { peak: 18 }); }
        float(5.0, 1.5, 12, 0, 0.02);
        plan.dayOn(0, W("Lunedì"));
        plan.resolve(0, W("fitness,"), "Fitness", "dumbbell", "#ff8a5c");
        plan.dayOn(1, W("martedì"));
        plan.resolve(1, W("viaggi,"), "Viaggi", "plane", "#5cc8ff");
        plan.dayOn(2, 6.38); plan.resolve(2, 6.38, "Cucina", "pizza", "#ffd25c");
        plan.dayOn(3, 6.48); plan.resolve(3, 6.48, "Animali", "paw-print", "#c79bff");
        const r34 = [plan.rect[2] - 30 - 2 * cwp - 24, y0p, plan.rect[2] - 6, y1p];
        { const p = fitPose(r34[0], r34[1], r34[2], r34[3], { top: 330, fill: 0.96 }); move(W("venerdì"), 0.5, p.fx, p.fy, p.s); }
        plan.dayOn(4, W("venerdì"));
        plan.resolve(4, W("motivazione."), "Motivazione", "flame", "#ff5c9d");
        // "motivazione": pull-back su tutta la settimana — cinque temi, nessun filo
        frameRect(7.03, 0.55, plan.rect, { top: 330 });

        // ═══ 4 · L'ALGORITMO — "…l'algoritmo non capisce di cosa parla il tuo profilo" (7.6 – 10.75) ═══
        // hub di Kallaway: la settimana sale e diventa la riga di ingresso, tutto converge nell'icona della piattaforma
        blurOut(HB.r, 7.55, { y: -20, dur: 0.3 });
        const T4 = titleW({ lines: [[{ t: "L'algoritmo " }, { t: "non capisce", box: true }]], size: 84 });
        T4.inAt([W("'algoritmo"), W("non", "'algoritmo"), W("capisce")]);
        const PS = 0.9, PDY = -380;
        tl.to(plan.box, { y: PDY, scale: PS, duration: 0.8, ease: "power3.inOut" }, 7.6);
        const after = (x, y) => [PX + (x - PX) * PS, PY + PDY + (y - PY) * PS];
        const HX = PX, IGY = 880;
        frameRect(7.6, 0.85, [PX - 480, PY + PDY - plan.H * PS / 2 - 24, PX + 480, 1490], { top: 330 });
        const L3 = layer(14);
        const IG = appIcon(L3, HX, IGY, 136, "instagram", 22);
        blurIn(IG, 8.25, { y: -20, blur: 16, scale: 0.7, dur: 0.5, ease: "back.out(2)" });
        const NODE = nodePill(L3, HX, IGY + 116, '<span style="opacity:.55">&lt;</span>algoritmo<span style="opacity:.55">/&gt;</span>', { w: 310, h: 72, fs: 31 });
        blurIn(NODE, 8.35, { y: 16, blur: 14, dur: 0.45 });
        ripple(L3, HX, IGY, W("'algoritmo"), { wd: 136, ht: 136, radius: "36px", s0: 1, s1: 1.9, dur: 0.6, w: 3 });
        ripple(L3, HX, IGY, W("'algoritmo") + 0.25, { wd: 136, ht: 136, radius: "36px", s0: 1, s1: 1.9, dur: 0.6, w: 3, a: 0.6 });
        const S3 = svgLayer(L3, 6, 2200, 300, 1300, 1500, true);
        const chipBottom = PY - plan.H / 2 + 30 + 92 + 306 + 18 + 64;
        [0, 1, 2, 3, 4].forEach((k) => {
          const [cx0] = plan.cellXY(k);
          const [ax, ay] = after(cx0, chipBottom);
          const cn = connector(S3, [[ax, ay + 8], [HX, IGY - 76]], { curve: "v", dash: [12, 10], color: K.lime, w: 3.5 });
          cn.draw(8.45 + k * 0.04, 0.45);
          traveller(S3, cn, 8.72 + k * 0.08, 0.45, K.lime, 8);
          cn.hide(10.6, 0.3);
        });
        // la lettura del profilo da parte dell'algoritmo: tre righe che non riesce a riempire
        // (tornano come le tre scelte della triade: nicchia / pubblico / problema)
        const GW = 840, GH = 390, GX = HX - GW / 2, GY = 1085;
        const GC = card(L3, GX, GY, GW, GH, { zIndex: 12 });
        el(GC, { position: "absolute", left: 32, top: 28, fontFamily: FS, fontWeight: 600, fontSize: 22, letterSpacing: "0.14em", color: K.mute }, "ANALISI DEL PROFILO");
        const rd1 = layered(el(GC, { position: "absolute", right: 32, top: 16, fontFamily: FD, fontWeight: 700, fontSize: 44, color: K.white, textShadow: GLOW_W }, "…"));
        const rd2 = layered(el(GC, { position: "absolute", right: 32, top: 16, fontFamily: FD, fontWeight: 700, fontSize: 44, color: K.lime, textShadow: GLOW_LT, opacity: 0 }, "Non chiaro"));
        const RY = [86, 184, 282], SX = 246, SW = GW - SX - 30, SH = 74;
        ["Argomento", "Pubblico", "Problema"].forEach((lb, r) => {
          el(GC, { position: "absolute", left: 32, top: RY[r], height: SH, display: "flex", alignItems: "center", fontFamily: FD, fontWeight: 700, fontSize: 42, color: K.white, textShadow: GLOW_W }, lb);
          el(GC, { position: "absolute", left: SX, top: RY[r], width: SW, height: SH, borderRadius: 14, border: "2px dashed rgba(255,255,255,.18)", background: "rgba(0,0,0,.18)" });
        });
        const ph = [1, 2].map((r) => el(GC, { position: "absolute", left: SX + 18, top: RY[r] + 22, width: SW * (r === 1 ? 0.62 : 0.74), height: 30, borderRadius: 15, background: "linear-gradient(90deg, rgba(255,255,255,.34), rgba(255,255,255,.14))", filter: "blur(6px)", opacity: 0 }));
        // Argomento: ogni post reclama la casella — i temi si accatastano uno sull'altro
        const CH5 = [["Fitness", "dumbbell"], ["Viaggi", "plane"], ["Cucina", "pizza"], ["Animali", "paw-print"], ["Motivazione", "flame"]];
        const chips = CH5.map(([lb, ic], k) => {
          const c = layered(el(GC, { position: "absolute", left: SX + 14 + k * 64, top: RY[0] + 10, height: 54, display: "flex", alignItems: "center", gap: 10, padding: "0 18px 0 14px", borderRadius: 27, background: "linear-gradient(180deg,#3d3d3d,#2a2a2a)", border: "1.5px solid rgba(255,255,255,.22)", boxShadow: "0 8px 20px rgba(0,0,0,.5)", fontFamily: FS, fontWeight: 700, fontSize: 24, color: K.white, whiteSpace: "nowrap", zIndex: 2 + k }, svg(ic, 26, K.white, 2.2) + lb));
          c.setAttribute("data-layout-allow-occlusion", "");
          gsap.set(c, { opacity: 0, rotation: (k % 2 ? -1 : 1) * (2 + k) });
          return c;
        });
        blurIn(GC, 8.9, { y: 30, blur: 18, dur: 0.55 });
        tl.to(ph, { opacity: 0.55, duration: 0.4, stagger: 0.08 }, 9.05);
        [9.23, 9.45, 9.67, 9.9, 10.12].forEach((t, k) => {
          blurIn(chips[k], t, { x: 120, y: 0, blur: 12, scale: 0.9, dur: 0.28, ease: "power3.out" });
          // il reel che la reclama si accende nella riga
          tl.to(plan.cells[k].tile, { borderColor: rgba(K.lime, 0.95), boxShadow: GLOW_L(0.7), duration: 0.08 }, t);
