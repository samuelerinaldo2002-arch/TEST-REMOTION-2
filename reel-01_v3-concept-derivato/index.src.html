    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        // far bokeh (parallax space, PF of camera speed)
        bokeh($("bokeh"), [
          [120, 300, 360, 0.06], [620, -80, 260, 0.035, true], [820, 700, 420, 0.05], [180, 1150, 300, 0.04, true],
          [1150, 250, 380, 0.05], [1450, 900, 340, 0.045, true], [980, 1450, 420, 0.06], [1500, 1700, 360, 0.04],
          [700, 1950, 300, 0.035, true], [1250, 2150, 420, 0.05],
        ]);

        // ═══ 1 · HOOK — "L'errore numero uno che fanno i principianti?" (0 – 2.9s) ═══
        // posts about everything rain into a profile; the camera pulls back to reveal it
        camInit(540, 1040, 1.45);
        const T1 = title({ lines: [[{ t: "L'errore " }, { t: "n°1", box: true }], [{ t: "dei principianti", hand: true }]], size: 86 });
        T1.inAt(0.02);
        const L1 = layer(10);
        const MESSY = ["fitness", "viaggi", "motivazione", "cucina", "gatti", "auto", "musica", "moda", "gaming"];
        const P1 = igPhone(L1, 260, 310, { grid: MESSY.map((topic) => ({ topic })), posts: "12", fol: "214", seg: "380", name: "Il tuo profilo", bio: "Fitness · viaggi · ricette · gatti · auto…" });
        const overlay = (bg, border, z) => P1.cells.map((c, i) => { const [x, y] = cellXY(i); return el(P1.screen, { position: "absolute", left: x, top: y, width: PL.cw, height: PL.ch, background: bg || "none", border: border || "none", boxShadow: border ? `inset 0 0 34px ${rgba(K.lime, 0.4)}` : "none", zIndex: z, opacity: 0 }); });
        const flashCell = overlay("rgba(255,255,255,.55)", null, 19);
        const hiCell = overlay(null, `5px solid ${K.lime}`, 20);
        const RAIN = [0, 1, 2, 3, 5, 6, 7];
        gsap.set(RAIN.map((i) => P1.cells[i]), { opacity: 0 });
        RAIN.forEach((i, k) => {
          const [cx, cy] = phCell(P1, i);
          const a = Math.atan2(cy - 1030, cx - 540) + hash(i, 4) * 0.4, R = 600 + hash(i, 6) * 90;
          const fly = layered(el(L1, { position: "absolute", left: -PL.cw / 2, top: -PL.ch / 2, width: PL.cw, height: PL.ch, zIndex: 25, borderRadius: 4, boxShadow: "0 30px 60px rgba(0,0,0,.6)", overflow: "hidden" }));
          topicTile(fly, 0, 0, PL.cw, PL.ch, MESSY[i]);
          const t = k * 0.085;
          arcFly(fly, [cx + Math.cos(a) * R, cy + Math.sin(a) * R], [cx, cy], t, 0.5, { straight: true, s0: 1.3, s1: 1, rot0: hash(i, 8) * 38, blur: 12, ease: "power3.out" });
          tl.set(P1.cells[i], { opacity: 1 }, t + 0.5);
          tl.fromTo(P1.cells[i], { scale: 1.1 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t + 0.5);
          tl.set(flashCell[i], { opacity: 1 }, t + 0.5);
          tl.to(flashCell[i], { opacity: 0, duration: 0.25 }, t + 0.52);
        });
        cam(0.9, 1.0, 540, 860, 0.9, "power3.inOut");
        drift(1.92, 0.88, 0, 8, 0.02);
        // the profile header builds itself once the camera has pulled back (the title always sits on clean black)
        gsap.set(P1.head, { opacity: 0 });
        blurIn(P1.head, 1.55, { y: 14, blur: 10, scale: 0.98, dur: 0.4, stagger: 0.03 });
        // the number that doesn't move
        const SC = card(L1, 700, 560, 360, 190, { zIndex: 12 });
        el(SC, { position: "absolute", left: 24, top: 22, fontFamily: FS, fontWeight: 600, fontSize: 18, letterSpacing: "0.12em", color: K.mute }, "FOLLOWER · ULTIMI 30 GIORNI");
        el(SC, { position: "absolute", left: 24, top: 56, fontFamily: FD, fontWeight: 700, fontSize: 84, color: K.white, lineHeight: 1, textShadow: GLOW_W }, "+0");
        el(SC, { position: "absolute", left: 150, top: 78, width: 190, height: 80 }, `<svg width="190" height="80" viewBox="0 0 190 80"><polyline points="0,52 24,50 48,53 72,49 96,52 120,50 144,52 168,51 182,51" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="182" cy="51" r="7" fill="#9a9a9a"/></svg>`);
        blurIn(SC, 1.3, { x: 40, y: 0, blur: 16, dur: 0.55 });
        sheen(SC, 1.6, 0.8);
        // the marker comes out: what is this profile about?
        const S1 = svgLayer(L1, 30, -100, 100, 1300, 1600, true);
        const circ = handCircle(S1, 540, 1010, 312, 250, 7, { w: 8 });
        circ.draw(1.5, 0.55);
        const q1 = handNote(L1, 70, 860, "?", { size: 210, rot: -10 });
        const q2 = handNote(L1, 905, 1010, "?", { size: 130, rot: 12 });
        q1.write(1.9, 0.12);
        q2.write(2.05, 0.12);

        // ═══ 2 · PUBBLICARE DI TUTTO — Lun fitness / Mar viaggi / Ven motivazione (2.9 – 7.6s) ═══
        T1.outAt(2.8);
        const T2 = title({ icon: "calendar-days", lines: [[{ t: "Pubblicare " }, { t: "di tutto", box: true }]], size: 86 });
        T2.inAt(2.98);
        circ.hide(2.82);
        q1.hide(2.82);
        q2.hide(2.82);
        blurOut(SC, 2.82, { y: -20 });
        cam(2.85, 0.85, 860, 880, 0.86);
        drift(3.72, 3.86, 0, 0, 0.025);
        const CAL = card(L1, 880, 440, 560, 880, { zIndex: 9 });
        el(CAL, { position: "absolute", left: 32, top: 32, fontFamily: FS, fontWeight: 600, fontSize: 21, letterSpacing: "0.14em", color: K.mute }, "LA TUA SETTIMANA");
        el(CAL, { position: "absolute", left: 30, top: 62, fontFamily: FD, fontWeight: 700, fontSize: 52, color: K.white, lineHeight: 1, textShadow: GLOW_W }, "Piano editoriale");
        const DAYS = ["LUN", "MAR", "MER", "GIO", "VEN"], DTOP = ["fitness", "viaggi", "gatti", "cucina", "motivazione"];
        const dayRows = DAYS.map((d, k) => {
          const y = 150 + k * 140;
          const day = el(CAL, { position: "absolute", left: 26, top: y, width: 96, height: 116, display: "flex", alignItems: "center", fontFamily: FD, fontWeight: 700, fontSize: 42, color: K.white }, d);
          const slot = el(CAL, { position: "absolute", left: 124, top: y, width: 406, height: 116, borderRadius: 14, border: "2px dashed rgba(255,255,255,.16)" });
          const [ic, lb] = TOPIC[DTOP[k]];
          const chip = el(CAL, { position: "absolute", left: 132, top: y + 9, width: 390, height: 98, borderRadius: 12, background: "linear-gradient(90deg,#3c3c3c,#2e2e2e)", border: "1.5px solid rgba(255,255,255,.14)", boxShadow: "inset 0 1.5px 0 rgba(255,255,255,.1)", display: "flex", alignItems: "center", gap: 20, padding: "0 26px", fontFamily: FS, fontWeight: 700, fontSize: 36, color: K.white, overflow: "hidden" }, svg(ic, 46, K.white, 2) + lb);
          const bar = el(chip, { position: "absolute", left: 0, top: 0, width: 9, height: 98, background: K.lime, boxShadow: GLOW_L(0.6) });
          gsap.set(chip, { opacity: 0 });
          return { day, slot, chip, bar, cy: 440 + y + 58 };
        });
        blurIn(CAL, 3.0, { x: 70, y: 0, blur: 22, dur: 0.7 });
        dayRows.forEach((r, k) => blurIn([r.day, r.slot], 3.28 + k * 0.06, { x: 24, y: 0, blur: 10, dur: 0.4 }));
        const S2 = svgLayer(L1, 24, 200, 300, 1300, 1100, true);
        const flyer = (topic, lime) => {
          const f = layered(el(L1, { position: "absolute", left: -PL.cw / 2, top: -PL.ch / 2, width: PL.cw, height: PL.ch, zIndex: 26, borderRadius: 4, overflow: "hidden", boxShadow: `0 24px 50px rgba(0,0,0,.6)${lime ? `, 0 0 34px ${rgba(K.lime, 0.4)}` : ""}` }));
          topicTile(f, 0, 0, PL.cw, PL.ch, topic);
          if (lime) el(f, { position: "absolute", left: 0, top: 0, width: PL.cw, height: PL.ch, border: `4px solid ${K.lime}`, borderRadius: 4, zIndex: 9 });
          return f;
        };
        const SPOKEN = [[0, 4.73, 5.4, 0], [1, 5.83, 6.17, 1], [4, 6.53, 6.97, 2]]; // [row, day cue, topic cue, phone cell]
        const trails = SPOKEN.map(([r, td, tt, cell]) => {
          tl.to(dayRows[r].day, { color: K.lime, textShadow: GLOW_LT, duration: 0.2 }, td);
          blurIn(dayRows[r].chip, tt, { x: -24, y: 0, blur: 14, scale: 0.97, dur: 0.38 });
          const to = phCell(P1, cell);
          const arc = arcFly(flyer(DTOP[r], true), [1207, dayRows[r].cy], to, tt + 0.06, 0.5, { lift: 150, s0: 0.42, s1: 1, rot0: -12, rotMid: 6, blur: 6 });
          const tr = connector(S2, null, { d: arc.d, dash: [12, 10], color: K.lime, w: 3.5 });
          tr.draw(tt + 0.06, 0.5, "power2.inOut");
          const land = tt + 0.56;
          tl.set(hiCell[cell], { opacity: 1 }, land);
          tl.to(hiCell[cell], { opacity: 0.6, duration: 0.4 }, land + 0.2);
          tl.fromTo(P1.cells[cell], { scale: 1.12 }, { scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, land);
          ripple(L1, to[0], to[1], land, { wd: PL.cw, ht: PL.ch, radius: "6px", s0: 1, s1: 1.35, dur: 0.5, z: 27 });
          return tr;
        });
        // the unspoken days fill too — "di tutto"
        [[2, 7.0, 4], [3, 7.1, 3]].forEach(([r, t, cell]) => {
          tl.to(dayRows[r].day, { color: K.lime, duration: 0.2 }, t);
          blurIn(dayRows[r].chip, t, { x: -24, y: 0, blur: 14, dur: 0.32 });
          arcFly(flyer(DTOP[r], false), [1207, dayRows[r].cy], phCell(P1, cell), t + 0.05, 0.38, { lift: 110, s0: 0.42, s1: 1, rot0: -10, blur: 6 });
          tl.set(flashCell[cell], { opacity: 1 }, t + 0.43);
          tl.to(flashCell[cell], { opacity: 0, duration: 0.25 }, t + 0.45);
        });

        // ═══ 3 · L'ALGORITMO NON CAPISCE — "…e nemmeno chi ti guarda" (7.6 – 12.8s) ═══
        T2.outAt(7.58);
        const T3 = title({ icon: "cpu", lines: [[{ t: "L'algoritmo " }, { t: "non capisce", box: true }]], size: 84 });
        T3.inAt(7.76);
        trails.forEach((cn) => cn.hide(7.6, 0.2));
        tl.to(hiCell, { opacity: 0, duration: 0.2 }, 7.6);
        blurOut(CAL, 7.62, { x: 140, dur: 0.4 });
        cam(7.7, 0.8, 540, 880, 1);
        tl.to(P1.frame, { x: -305, y: -110, scale: 0.58, duration: 0.8, ease: "power3.inOut" }, 7.7);
        drift(8.55, 4.2, 0, 0, 0.03);

        const L3 = layer(14);
        const S3 = svgLayer(L3, 6, 0, 300, 1080, 1200, true);
        const S3w = svgLayer(L3, 6, 0, 300, 1080, 1200, "white");
        // the algorithm = Instagram itself: glossy app icon + code-tag label
        const NODE = nodePill(L3, 790, 470, '<span style="opacity:.55">&lt;</span>algoritmo<span style="opacity:.55">/&gt;</span>', { w: 330, h: 86, fs: 34 });
        const IG = appIcon(L3, 590, 470, 96, "instagram", 22);
        blurIn(IG, 8.2, { y: -24, blur: 16, scale: 0.7, dur: 0.5, ease: "back.out(2)" });
        blurIn(NODE, 8.3, { x: -30, y: 0, blur: 16, dur: 0.5 });
        tl.fromTo(NODE, { boxShadow: `0 0 50px ${rgba(K.lime, 0.32)}, inset 0 0 22px ${rgba(K.lime, 0.12)}` }, { boxShadow: `0 0 90px ${rgba(K.lime, 0.7)}, inset 0 0 30px ${rgba(K.lime, 0.3)}`, duration: 0.25, yoyo: true, repeat: 1, immediateRender: false }, 8.67);
        ripple(L3, 590, 470, 8.67, { wd: 96, ht: 96, radius: "26px", s0: 1, s1: 1.9, dur: 0.6, w: 3 });
        ripple(L3, 590, 470, 8.92, { wd: 96, ht: 96, radius: "26px", s0: 1, s1: 1.9, dur: 0.6, w: 3, a: 0.6 });
        const cA = connector(S3, [[405, 640], [538, 470]], { curve: "h", dash: [14, 11], color: K.lime, w: 4 });
        cA.draw(8.45, 0.45);
        [8.75, 8.95, 9.15].forEach((t) => traveller(S3, cA, t, 0.42, K.lime, 9));
        // the scan beam reads every post
        const beam = el(P1.screen, { position: "absolute", left: 0, top: PL.gridTop - 130, width: PH.sw, height: 130, background: "linear-gradient(180deg, rgba(207,251,80,0) 0%, rgba(207,251,80,.3) 100%)", borderBottom: `5px solid ${K.lime}`, boxShadow: `0 8px 30px ${rgba(K.lime, 0.6)}`, zIndex: 26, opacity: 0 });
        tl.set(beam, { opacity: 1 }, 8.7);
        tl.fromTo(beam, { y: 0 }, { y: 720, duration: 0.55, ease: "power1.inOut", immediateRender: false }, 8.7);
        tl.set(beam, { opacity: 0 }, 9.26);
        const CC = card(L3, 455, 560, 570, 330, { zIndex: 12 });
        el(CC, { position: "absolute", left: 32, top: 26, fontFamily: FS, fontWeight: 600, fontSize: 21, letterSpacing: "0.14em", color: K.mute }, "DI COSA PARLA IL PROFILO?");
        const slot = el(CC, { position: "absolute", left: 32, top: 70, width: 506, height: 150, borderRadius: 14, background: "#161616", border: "1.5px solid rgba(255,255,255,.08)", boxShadow: "inset 0 6px 20px rgba(0,0,0,.5)", overflow: "hidden" });
        const CYCLE = ["Fitness", "Viaggi", "Motivazione", "Cucina", "Gatti", "Auto", "Musica", "Moda", "Gaming", "Fitness"];
        const ghost = layered(el(slot, { position: "absolute", left: 0, top: 0, width: 506, height: 150, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: 110, color: K.lime, opacity: 0 }, "???"));
        const cyc = CYCLE.concat(["???"]).map((w, k) => layered(el(slot, { position: "absolute", left: 0, top: 0, width: 506, height: 150, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: k === CYCLE.length ? 110 : 80, color: K.white, textShadow: GLOW_W, opacity: 0 }, w)));
        el(CC, { position: "absolute", left: 32, top: 252, fontFamily: FS, fontWeight: 600, fontSize: 21, letterSpacing: "0.14em", color: K.mute }, "CERTEZZA");
        el(CC, { position: "absolute", left: 180, top: 258, width: 268, height: 12, borderRadius: 6, background: "rgba(255,255,255,.1)" });
        const fill = el(CC, { position: "absolute", left: 180, top: 258, width: 268, height: 12, borderRadius: 6, background: K.lime, boxShadow: GLOW_L(0.5), transformOrigin: "0 50%" });
        const pctA = layered(el(CC, { position: "absolute", left: 462, top: 248, width: 80, textAlign: "right", fontFamily: FS, fontWeight: 800, fontSize: 26, color: K.white }, "…"));
