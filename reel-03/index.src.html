    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        bokeh($("bokeh"), [
          [120, 320, 360, 0.06], [620, -60, 260, 0.035, true], [860, 720, 420, 0.05], [1250, 250, 380, 0.05], [1500, 900, 340, 0.045, true],
          [2200, 1100, 360, 0.045, true], [2600, 700, 420, 0.06], [3200, 1000, 400, 0.05], [2700, 1800, 380, 0.045],
          [3600, 600, 380, 0.05], [4200, 900, 420, 0.05, true], [4600, 1700, 360, 0.045], [3900, 2400, 400, 0.05],
        ]);
        const W = (txt, from) => at(txt, from == null ? 0 : findWord(from));
        const Wi = (i) => WORDS[i][1]; // per le parole che tornano più volte nella voce (indice in d03.ts)
        const L = layer(10);
        const S = svgLayer(L, 6, -60000, -60000, 200000, 200000);
        const COVER = "th-mio_04"; // la tua copertina vera: il reel che salvi, duplichi e pubblichi due volte
        // card di un reel con la copertina vera (centrata su cx, cy: si può muovere col transform)
        const coverCard = (cx, cy, w, h, z) => {
          const wrap = layered(el(L, { position: "absolute", left: -w / 2, top: -h / 2, width: w, height: h, zIndex: z || 12 }));
          gsap.set(wrap, { x: cx, y: cy });
          const body = el(wrap, { position: "absolute", left: 0, top: 0, width: w, height: h, borderRadius: Math.round(w * 0.08), border: "2.5px solid rgba(255,255,255,.3)", boxShadow: `0 ${Math.round(w * 0.12)}px ${Math.round(w * 0.3)}px rgba(0,0,0,.6)`, overflow: "hidden", background: "#111" });
          mediaTile(body, 0, 0, w, h, COVER, 1);
          return { wrap, body };
        };

        // ═══ 1 · HOOK — "Instagram ti ha appena dato il più grande trucco di sempre." (0 – 3.6) ═══
        // A02 il logo è già in scena con i raggi vivi (F07); su "trucco" ne esce il tuo reel, su "sempre" si sdoppia (×2)
        const HX = 540, HY = 905;
        { const p0 = fitPose(HX - 470, HY - 470, HX + 470, HY + 470, { top: 380, fill: 0.98 }); camInit(p0.fx, p0.fy, p0.s); }
        float(0, 2.3, 0, -8, 0.05);
        const ry = rays(L, HX, HY, 520, { n: 16, z: 4 });
        gsap.set(ry.g, { opacity: 0.55, scale: 0.8 }); // A02: al fotogramma 0 il logo e i raggi sono già in scena
        ry.show(0); ry.live(0, 3.6);
        const IGb = appIcon(L, HX, HY, 230, "instagram", 14);
        gsap.set(IGb, { scale: 0.86 });
        tl.to(IGb, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.02);
        pulse(L, HX, HY, 0.05, { r: 260, z: 3 });
        const T1 = titleW({ lines: [[{ t: "Il più grande " }, { t: "trucco", box: true }], [{ t: "di sempre", hand: true }]], size: 88 });
        T1.inAt([W("il"), W("più"), W("grande"), W("trucco"), W("di", "trucco"), W("sempre.")]);
        // su "trucco": il logo si fa piccolo e il tuo reel sale fuori da lui
        const RA = coverCard(HX, HY, 330, 587, 16);
        gsap.set(RA.wrap, { opacity: 0, scale: 0.3, y: HY + 60 });
        tl.to(IGb, { scale: 0.42, y: -300, duration: 0.45, ease: "power3.inOut" }, W("trucco"));
        tl.set(RA.wrap, { opacity: 1 }, W("trucco") + 0.04);
        tl.to(RA.wrap, { scale: 1, y: HY, duration: 0.55, ease: "back.out(1.5)" }, W("trucco") + 0.04);
        camK(W("trucco"), 0.5, CAM.fx, CAM.fy, CAM.s * 0.98, "power2.out");
        // su "sempre": si sdoppia — due reel identici, lampo sulla cucitura, il badge ×2
        const RB = coverCard(HX, HY, 330, 587, 15);
        gsap.set(RB.wrap, { opacity: 0 });
        tl.set(RB.wrap, { opacity: 1 }, W("sempre."));
        tl.to(RA.wrap, { x: HX - 200, rotation: -4, duration: 0.45, ease: "power3.out" }, W("sempre."));
        tl.to(RB.wrap, { x: HX + 200, rotation: 4, duration: 0.45, ease: "power3.out" }, W("sempre."));
        const seam = el(L, { position: "absolute", left: HX - 40, top: HY - 300, width: 80, height: 600, borderRadius: 40, background: "radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0))", opacity: 0, zIndex: 17 });
        tl.set(seam, { opacity: 1, scaleX: 0.6 }, W("sempre.") + 0.02);
        tl.to(seam, { opacity: 0, scaleX: 3, duration: 0.4, ease: "power2.out" }, W("sempre.") + 0.02);
        const X2 = el(L, { position: "absolute", left: HX - 100, top: HY - 100, width: 200, height: 200, borderRadius: "50%", background: "radial-gradient(circle at 36% 30%, #ffffff 0%, #f0ffc2 10%, #d8fd66 36%, #b4de3a 70%, #86ad26 100%)", boxShadow: `${GLOW_A(1)}, 0 20px 50px rgba(0,0,0,.5)`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: 96, color: K.ink, zIndex: 18 }, "×2");
        gsap.set(X2, { scale: 2.3, opacity: 0, rotation: -14 });
        tl.to(X2, { opacity: 1, duration: 0.06 }, 3.14);
        tl.to(X2, { scale: 0.94, rotation: -6, duration: 0.15, ease: "power3.in" }, 3.14);
        tl.to(X2, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 3.29);
        shake(3.29, 12, 6);
        float(2.9, 0.8, 0, 0, 0.02);
        T1.outAt(3.2);

        // ═══ 2 · "E non te ne sei nemmeno accorto." (3.7 – 5.6) — il trucco è lì, in bella vista: la lente trova "Duplica" ═══
        const PX = 2720, PY = 340; // i due telefoni (Bozze e Nuovo reel) stanno nello stesso punto: si scambiano lo schermo
        const DR = igDrafts(L, PX, PY, [COVER]);
        const SH = igShare(L, PX, PY, COVER);
        gsap.set(SH.frame, { opacity: 0 });
        // cambio di schermata: si vede un solo telefono alla volta
        const screenTo = (t, which) => { tl.set(SH.frame, { opacity: which === "share" ? 1 : 0 }, t); tl.set(DR.frame, { opacity: which === "share" ? 0 : 1 }, t); };
        // inquadratura bassa (foglio, riga di prova, bottoni): la parte alta dello schermo si spegne, così sotto al titolo
        // non resta interfaccia (regola 17); torna accesa quando si inquadra di nuovo il telefono intero
        const topOf = (scr, ymax) => [...scr.children].filter((c) => (parseFloat(c.style.top) || 0) + (parseFloat(c.style.height) || 40) <= ymax && c.style.zIndex !== "60" && c.style.zIndex !== "59");
        const SH_UP = topOf(SH.screen, 600), DR_UP = DR.tiles.map((x) => x.t0).concat(topOf(DR.screen, 130));
        const dimTop = (t, els, on) => tl.to(els, { opacity: on ? 0 : 1, duration: 0.3, ease: "power2.out" }, t);
        const sAt = (x, y) => [PX + PH.bz + x, PY + PH.bz + y];
        const RECT_LOW = [PX - 10, sAt(0, 600)[1], PX + PH.w + 10, PY + PH.h + 10];   // metà bassa: foglio, riga di prova, bottoni
        const RECT_TOP = [PX - 10, PY - 10, PX + PH.w + 10, sAt(0, 660)[1]];           // metà alta: bozze e ⋯
        { const p = fitPose(...RECT_LOW, { top: 400 }); whip2(3.7, 0.45, p.fx, p.fy, p.s, { peak: 22 }); }
        dimTop(3.6, DR_UP, true);
        float(4.15, 1.4, 0, -10, 0.025);
        tl.to([RA.wrap, RB.wrap, X2, IGb], { opacity: 0, duration: 0.2 }, 3.72);
        ry.hide(3.7);
        const T2 = titleW({ lines: [[{ t: "E non te ne sei" }], [{ t: "nemmeno accorto", box: true }]], size: 80 });
        T2.inAt([W("E"), W("non"), W("te"), W("ne"), W("sei"), W("nemmeno"), W("accorto.")]);
        DR.menu(3.72);
        const rl = DR.rowLabel(1);
        const LZ = lens(L, rl.x, rl.y, DR.rowEl(1), { fx: rl.fx, fy: rl.fy, r: 140, k: 1.5 });
        LZ.show(W("nemmeno") - 0.1);
        tl.to(DR.rows[1].r, { borderColor: "rgba(207,251,80,.9)", boxShadow: GLOW_A(0.4), duration: 0.2 }, W("accorto."));
        tl.to(LZ.copy, { borderColor: "rgba(207,251,80,.9)", duration: 0.2 }, W("accorto."));
        LZ.hide(5.3);
        tl.to(DR.rows[1].r, { borderColor: "rgba(207,251,80,0)", boxShadow: "0 0 0px rgba(207,251,80,0)", duration: 0.2 }, 5.3);
        DR.closeMenu(5.35);
        T2.outAt(5.4);
        dimTop(5.5, DR_UP, false);

        // ═══ 3 · "Quando carichi il tuo prossimo video, prima di pubblicarlo, salvalo come bozza." (5.7 – 10.3) ═══
        screenTo(5.62, "share");
        frameRect(5.62, 0.6, [PX - 10, PY - 10, PX + PH.w + 10, sAt(0, 640)[1]], { top: 380 });
        float(6.25, 1.3, 0, -10, 0.02);
        // il video si carica (barra sotto la copertina)
        const upT = el(SH.screen, { position: "absolute", left: 24, top: 470, width: 184, height: 9, borderRadius: 5, background: "rgba(255,255,255,.14)", zIndex: 5 });
        const upF = el(upT, { position: "absolute", left: 0, top: 0, width: 184, height: 9, borderRadius: 5, background: limeFill(1), boxShadow: GLOW_A(0.6), transformOrigin: "0 50%" });
        gsap.set(upF, { scaleX: 0 });
        SH_UP.push(upT);
        tl.to(upF, { scaleX: 1, duration: 1.3, ease: "power1.inOut" }, W("carichi"));
        const T3a = titleW({ lines: [[{ t: "Il tuo " }, { t: "prossimo video", box: true }]], size: 82 });
        T3a.inAt([W("il", "carichi"), W("tuo"), W("prossimo"), W("video,")]);
        T3a.outAt(8.3);
        // "prima di pubblicarlo": il dito va verso Condividi… e si ferma
        { const p = fitPose(...RECT_LOW, { top: 380 }); move(7.55, 0.8, p.fx, p.fy, p.s); }
        dimTop(7.55, SH_UP, true);
        const F = tapFinger(L, { size: 92 });
        const [shx, shy] = SH.share(), [svx, svy] = SH.save();
        F.show(W("prima"), shx + 60, shy + 240);
        F.to(W("prima") + 0.08, shx + 10, shy + 20, 0.32);
        [[-14, -6], [10, 4], [-6, -2], [0, 0]].forEach(([dx, dy], k) => F.to(W("pubblicarlo,") + 0.1 + k * 0.1, shx + 10 + dx, shy + 20 + dy, 0.09));
        const noTag = handNote(L, shx - 40, shy - 150, "aspetta!", { size: 66, rot: -5, z: 90 });
        noTag.write(W("pubblicarlo,") + 0.15, 0.3);
        noTag.hide(8.75);
        float(8.35, 1.0, 0, -8, 0.02);
        // "salvalo come bozza": tocca Salva bozza → "Bozza salvata"
        F.to(W("salvalo"), svx, svy, 0.38);
        F.tap(W("bozza."));
        SH.press("save", W("bozza."));
        const T3b = titleW({ lines: [[{ t: "Salvalo " }, { t: "come bozza", box: true }]], size: 86 });
        T3b.inAt([W("salvalo"), W("come", "salvalo"), W("bozza.")]);
        T3b.outAt(10.05);
        igToast(SH.screen, PH.sw / 2, 690, "Bozza salvata", { w: 360 }).show(W("bozza.") + 0.15, 0.95);
        F.hide(9.8);
        float(9.35, 1.1, 0, -6, 0.015);
        tl.to(SH.screen.querySelectorAll("div"), { borderColor: "rgba(255,255,255,0)", boxShadow: "0 0 0px rgba(207,251,80,0)", duration: 0.01 }, 10.52);

        // ═══ 4 · "Apri le bozze, tocca i tre puntini accanto al video e duplicalo." (10.6 – 14.6) ═══
        screenTo(10.55, "drafts");
        dimTop(10.5, SH_UP, false);
        { const p = fitPose(...RECT_TOP, { top: 400 }); whip2(10.5, 0.42, p.fx, p.fy, p.s, { peak: 16 }); }
        float(10.95, 1.2, 0, -8, 0.02);
        const T4 = titleW({ lines: [[{ t: "Apri le bozze," }], [{ t: "tocca " }, { t: "i 3 puntini", box: true }]], size: 80 });
        T4.inAt([W("Apri"), W("le"), W("bozze,"), W("tocca"), W("i", "tocca"), W("tre"), W("puntini")]);
        const [ddx, ddy] = DR.dots(0);
        F.show(11.45, ddx + 70, ddy + 260);
        F.to(11.55, ddx, ddy, 0.34);
        F.tap(W("puntini"));
        tl.to(DR.tiles[0].dt, { scale: 1.2, duration: 0.1, yoyo: true, repeat: 1 }, W("puntini") - 0.02);
        DR.menu(W("puntini") + 0.12);
        { const p = fitPose(...RECT_LOW, { top: 400 }); move(W("puntini") + 0.12, 0.6, p.fx, p.fy, p.s); }
        dimTop(W("puntini") + 0.12, DR_UP, true);
        const rl2 = DR.rowLabel(1);
        const LZ2 = lens(L, rl2.x, rl2.y, DR.rowEl(1), { fx: rl2.fx, fy: rl2.fy, r: 140, k: 1.5 });
        LZ2.show(12.55); LZ2.hide(13.25);
        const [dpx, dpy] = DR.row(1);
        F.to(13.05, dpx - 120, dpy, 0.35);
        F.tap(W("duplicalo."));
        DR.pick(1, W("duplicalo."));
        DR.closeMenu(13.82);
        F.hide(13.85);
        { const p = fitPose(...RECT_TOP, { top: 400 }); move(13.82, 0.55, p.fx, p.fy, p.s); }
        dimTop(13.8, DR_UP, false);
        DR.duplicate(13.95, COVER);
        float(14.4, 0.5, 0, -6, 0.015);
        T4.outAt(14.45);

        // ═══ 5 · "Ora prendi la prima bozza e pubblicala come reel di prova." (14.9 – 18.6) ═══
        const T5 = titleW({ lines: [[{ t: "La prima: " }, { t: "reel di prova", box: true }]], size: 84 });
        T5.inAt([W("la", "prendi"), W("prima", "prendi"), W("reel", "come"), W("di", "reel"), W("prova.")]);
        const [t0x, t0y] = DR.tileXY(0);
        F.show(15.35, t0x + 60, t0y + 260);
        F.to(15.45, t0x, t0y, 0.36);
        F.tap(W("bozza", "prendi"));
        tl.to(DR.tiles[0].t0, { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1 }, W("bozza", "prendi"));
