    <script>
      (() => {

        camInit(540, 900, 1);
        const S = {};
        // i tagli: 0,1 s prima della prima parola della frase
        const C = [0, wt(18) - 0.1, wt(28) - 0.1, wt(39) - 0.1, wt(48) - 0.1, wt(60) - 0.1, wt(80) - 0.1, wt(90) - 0.1, wt(105) - 0.1, 42.7];

        // ═══ 1 · F02 · «Ormai lo pensano tutti. Se non diventi virale, non stai andando da nessuna parte. E se si sbagliassero?»
        // La griglia dei tuoi reel veri dal fotogramma 0; su «virale» il disco e il numero: «1M views» ═══

          parole: { parola: wt(7), dubbio: wt(17), titolo: [wt(4), wt(5), wt(6), wt(7), wt(14), wt(15), wt(16), wt(17)] } }, {
          titolo: [[{ t: "Se non diventi " }, { t: "virale", box: true }], [{ t: "e se si sbagliassero?", hand: true }]],
          media: ["g1", "g2", "g3", "g4", "g5", "g6"], etichetta: { testo: "1M views", icona: "eye" }, dubbio: true });

        // ═══ 2 · T05 · «L'algoritmo ci mostra soprattutto i contenuti con tantissima interazione.» Reel veri di Hormozi ═══
        S.T05 = TPL.T05({ t0: C[1], t1: C[2], X: 4000, Y: 900,
          parole: { mostra: wt(21), interazione: wt(26), titolo: [wt(18), wt(20), wt(21), wt(26), wt(27)] } }, {
          titolo: [[{ t: "L'algoritmo " }, { t: "ci mostra", box: true }], [{ t: "tantissima interazione", hand: true }]],
          media: ["e1", "e2", "e3"], numeri: [{ da: 120, a: 1200 }, { da: 86, a: 860 }, { da: 240, a: 2400 }] });

        // ═══ 3 · O13 · «E il cervello si convince che quello sia il livello normale.» Gli stessi contenuti, col badge «1M views» ═══
        S.O13 = TPL.O13({ t0: C[2], t1: C[3], X: 7500, Y: 900,
          parole: { accende: wt(32), etichetta: wt(37), titolo: [wt(29), wt(30), wt(31), wt(32)] } }, {
          titolo: [[{ t: "Il cervello " }, { t: "si convince", box: true }]],
          media: ["h1", "h2", "h3"], ratio: 4 / 3, badge: "1M views", etichetta: "= il livello normale" });

        // ═══ 4 · K11 · «Non lo è. È l'eccezione mostrata in continuazione.» Il feed: l'eccezione «1M» accesa, poi altre ═══
        S.K11 = TPL.K11({ t0: C[3], t1: C[4], X: 11000, Y: 900,
          parole: { eccezione: wt(44), scorre: wt(45), titolo: [wt(42), wt(43), wt(46), wt(47)] } }, {
          titolo: [[{ t: "È " }, { t: "l'eccezione", box: true }], [{ t: "in continuazione", hand: true }]], badge: "1M" });

        // ═══ 5 · F04 · «Ma da quel momento ogni video sotto quella soglia sembra un fallimento.» I tuoi reel sotto «1M views».
        // R8 MORBIDA: la camera entra nell'eccezione accesa del muro e dall'altra parte c'è la soglia ═══

          const r = { t0, t1: C[5], X: 14500, Y: 900, parole: { soglia: wt(56), riflettore: wt(59),
            titolo: [wt(54), wt(55), wt(56), wt(57), wt(58), wt(59)] } };
          S.F04 = TPL.F04(r, { titolo: [[{ t: "Sotto la " }, { t: "soglia", box: true }], [{ t: "sembra un fallimento", hand: true }]],
            colonne: [{ media: "m7", v: 0.3 }, { media: "m8", v: 0.44 }, { media: "h4", v: 1, scelto: true }, { media: "m9", v: 0.22 }, { media: "m10", v: 0.36 }],
            soglia: { v: 0.8, testo: "1M views" }, ingresso: "nessuno", fermoDa: t0 + 0.45 });
          tplTenuta(tplZoomThrough(t0, S.K11.ancore.eccezione(2), S.F04.pose), r.t1);
        }

        // ═══ 6 · vergogna (kit2-reel14.js) · «E nasce quella cosa che blocca davvero le persone. Cioè la vergogna di aver
        // pubblicato qualcosa che non ha funzionato.» Il lucchetto sul Condividi del prossimo reel; la linea all'ultimo, 312 views ═══

          parole: { blocca: wt(65), vergogna: wt(71), fallito: wt(79), titolo: [wt(64), wt(65), wt(70), wt(71)] } }, {
          titolo: [[{ t: "Che " }, { t: "blocca", box: true }], [{ t: "la vergogna", hand: true }]],
          ultimo: "ul", prossimo: "pr", views: "312" });

        // ═══ 7 · A01 · «Ed è così che si passano mesi senza farsi vedere.» Gli altri si fanno vedere (views vere), il tuo posto vuoto ═══
        S.A01 = TPL.A01({ t0: C[6], t1: C[7], X: 21500, Y: 900,

        // ═══ 8 · D13 + numeroR14 · «Convinti di essere pigri quando in realtà è pressione. Cambia il numero e cambia tutto.»
        // Il termometro è la pressione (in basso «Pigrizia?», barrata su «realtà»), la scala le views fino a «1M»; la tua foto

        // R8 MORBIDA: la camera entra nel tuo posto vuoto e dall'altra parte c'è la tua foto sul termometro ═══
        { const t0 = C[7];
          const r = { t0, t1: C[8], X: 25000, Y: 900, parole: { sale: wt(90), titolo: [wt(97), wt(98), wt(99), wt(100), wt(101)] } };
          S.D13 = TPL.D13(r, { titolo: [[{ t: "È " }, { t: "pressione", box: true }], [{ t: "cambia il numero", hand: true }]], titoloEsce: false,
            gradini: ["100 views", "1K", "10K", "100K", "1M views"], etichette: ["Pigrizia?", "Pressione"], tu: true, ingresso: "nessuno" });

          S.D13.elementi.termo.lab.forEach((l) => { l.style.fontSize = "42px"; l.style.width = "360px"; l.style.left = (parseFloat(l.style.left) - 40) + "px"; });
          S.D13.elementi.titolo.outAt(r.t1 - 0.47 - 5 * 0.012);
          const fine = tplZoomThrough(t0, S.A01.ancore.tu, S.D13.pose);
          tplTenuta(fine, r.t1);
          TPL_FERMO.push([fine, r.t1]);
          S.N = numeroR14(S.D13, { numero: wt(101), testo: "100 PERSONE GIUSTE", tutto: wt(104), barra: wt(96) });
        }

        // ═══ 9 · O10 · «L'obiettivo non è un milione di visualizzazioni. È arrivare alle persone giuste col messaggio giusto.»
        // «1M di views» fuori e barrato, al centro le persone giuste (silhouette), la freccetta = il messaggio giusto ═══
        S.O10 = TPL.O10({ t0: C[8], t1: C[9], X: 28500, Y: 900,
          parole: { fuori: wt(110), spegni: wt(112), centro: wt(116), freccia: wt(119),
            titolo: [wt(107), wt(109), wt(110), wt(115), wt(116), wt(117)] } }, {

          etichette: { fuori: "1M di views", centro: "Le persone giuste" } });

        // R7: sfondo fermo nella tenuta di ogni scena
        tplFermo();

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
