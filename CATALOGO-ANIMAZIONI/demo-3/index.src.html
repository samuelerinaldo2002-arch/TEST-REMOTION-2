<html lang="it">
  <head>

    <style>
      @font-face { font-family: "Advercase"; src: url("assets/fonts/Advercase-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: block; }
      @font-face { font-family: "Advercase"; src: url("assets/fonts/Advercase-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: "Patrick Hand"; src: url("assets/fonts/PatrickHand-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: "Zalando Sans"; src: url("assets/fonts/ZalandoSans-Variable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1e1e1e; }
      body { font-family: "Zalando Sans", sans-serif; color: #f4f4f2; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      #glow { position: absolute; inset: 0; opacity: 0.35; background: radial-gradient(58% 32% at 50% 46%, rgba(207, 251, 80, 0.08), rgba(207, 251, 80, 0) 70%); }
      #vignette { position: absolute; inset: 0; background: radial-gradient(110% 78% at 50% 44%, rgba(0, 0, 0, 0) 44%, rgba(0, 0, 0, 0.62) 100%); }
      .cam { position: absolute; left: 540px; top: 880px; width: 1px; height: 1px; }
      .layer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; }
      #dots { position: absolute; left: -6000px; top: -6000px; width: 40000px; height: 20000px; background-image: radial-gradient(circle, rgba(255, 255, 255, 0.095) 1.25px, rgba(255, 255, 255, 0) 1.95px); background-size: 24px 24px; }
      #stage { position: absolute; inset: 0; overflow: hidden; }
      #safe { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(to bottom, #000 0px, #000 1385px, transparent 1450px); mask-image: linear-gradient(to bottom, #000 0px, #000 1385px, transparent 1450px); }
      #mbwrap, #shake { position: absolute; inset: 0; }
      #hud { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="44" data-track-index="0">
        <div class="cam" id="gcam2" data-layout-allow-overflow><div class="layer" id="gzoom2"><div class="layer" id="gpan2"><div class="layer" id="bokeh"></div></div></div></div>
        <div class="cam" id="gcam" data-layout-allow-overflow><div class="layer" id="gzoom"><div class="layer" id="gpan"><div id="dots"></div></div></div></div>
        <div id="glow"></div>
        <div id="vignette"></div>

      <div id="stage">
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
          <filter id="mb" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="mbn" in="SourceGraphic" stdDeviation="0 0" /></filter>
        </svg>
        <div id="safe"><div id="mbwrap"><div id="shake"><div class="cam" id="cam" data-layout-allow-overflow><div class="layer" id="zoom"><div class="layer" id="pan"></div></div></div></div></div></div>
        <!--VIDEOS
          # K11 · gli outlier che escono dal muro: reel veri di creator
          vO1 assets/clips/c05.mp4 2.6 2.8
          vO2 assets/clips/c25.mp4 2.6 2.8
          vO3 assets/clips/c26.mp4 2.6 2.8
          # C03 · il tuo profilo con reel di temi diversi
          vT1 assets/clips/t_cuc1.mp4 22.2 5 1
          vT2 assets/clips/t_via1.mp4 22.2 5 1.5
          vT3 assets/clips/t_fit1.mp4 22.2 5 3
        -->
      </div>

      <!--SFX
        0.0 whoosh .12 ; 1.0 whoosh .18 ; 1.85 ding .14 ; 2.65 whoosh .1 ; 3.25 pop .12 ; 3.35 pop .12 ; 3.45 pop .12
        5.4 whoosh .14 ; 5.85 whoosh .1 ; 7.6 whoosh .1 ; 9.05 whoosh .1
        10.6 whoosh .14 ; 11.25 tick .08 ; 11.35 tick .08 ; 11.45 tick .08 ; 11.55 tick .08 ; 11.65 tick .08 ; 11.75 tick .08 ; 15.65 ding .16
        16.4 whoosh .14 ; 17.0 rise .08 ; 18.45 pop .12 ; 19.0 pop .12
        22.2 whoosh .14 ; 23.1 click2 .12 ; 23.9 error .07 ; 24.3 error .07 ; 24.7 error .07 ; 25.25 glitch .12
        27.2 whoosh .14 ; 30.7 sub .16
        31.6 whoosh .14 ; 32.6 toggle .14 ; 33.2 toggle .14
        36.4 whoosh .12 ; 37.4 whoosh .16 ; 39.3 whoosh .1 ; 40.4 whoosh .14 ; 41.9 whoosh .16

    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        const L = layer(10);
        const S = svgLayer(L, 6, -60000, -60000, 200000, 200000);
        const head = (t, lines, times, out, size) => { const T = titleW({ lines, size: size || 80 }); T.inAt(times || t); if (out) T.outAt(out); return T; };
        const Y = 900;
        camInit(540, 900, 1);

        // ═══ K11 · il muro di reel scorre come una slot e si ferma sugli outlier (08/09: "trova quelle che hanno già funzionato") (0 – 5,4) ═══
        // zoom out 0,22 s → il muro deriva → scorrimento 0,4 s con la scia + frenata 0,3 s → riflettore sulle scelte → escono come reel veri
        let X = 540;
        const wl = wallScroll(L, X, 0, { cols: 15, rows: 34, tw: 118, gap: 12 });
        wl.open(0, 8, 12, { dur: 0.24, k: 2.3 });
        float(0.32, 0.68, 0, 150, 0.012);
        wl.roll(1.0, 27, 31, { dur: 0.7, peak: 26 });
        const OUT = [[28, 4], [29, 9], [30, 6]];
        wl.spot(1.85, OUT);
        const pk = wl.pick(2.65, OUT, ["vO1", "vO2", "vO3"], { views: ["2,4M", "1,1M", "860K"], w: 270, gap: 34 });
        frameRect(2.75, 0.9, pk.rect, { top: 360 });
        float(3.65, 1.75, 0, -12, 0.025);
        head(0.08, [[{ t: "Trova gli " }, { t: "outlier", box: true }]], [0.08, 0.26, 0.44], 4.95);
        // [catalogo] K11 — muro di reel veri (atlante) che scorre come una slot, frena, riflettore e outlier in primo piano con le views

        // ═══ O08 · la triade ruota e porta in alto l'emozione detta (07/10: "curiosità, desiderio, paura") (5,4 – 10,6) ═══
        X = 3500;
        const tr = triad(L, X, Y - 60, ["Curiosità", "Desiderio", "Paura"], { r: 520, start: -60, icons: ["circle-help", "heart", "triangle-alert"], esempi: ["Come va a finire?", "Lo voglio anch'io", "E se capita a me?"] });
        arriveRect(5.4, tr.rect, { dy: 330, top: 390 });
        head(5.45, [[{ t: "Tre " }, { t: "emozioni", box: true }]], [5.45, 5.62], 10.15);
        tr.show(5.5);
        tr.rotateTo(0, 5.85);
        frameRect(6.0, 0.9, tr.rectDown, { top: 380 });
        float(7.2, 3.4, 0, -10, 0.03);
        tr.rotateTo(1, 7.6);
        tr.rotateTo(2, 9.05);
        // [catalogo] O08 — triade 3D (cornice in grafite, triangolo lime) che ruota sulla voce detta, icona al centro

        // ═══ L08 · la tabella argomenti × formati si compila cella per cella (10/09: "sei argomenti × cinque formati") (10,6 – 16,4) ═══
        X = 6500;
        const tb = table(L, X, Y - 60, ["Tutorial", "Errori", "Storia", "Mito", "Prima<br>e dopo"], ["Dieta", "Forza", "Cardio", "Sonno", "Postura", "Mente"], { cw: 152, rh: 116, hw: 200, hh: 112, fs: 31, cfs: 54 });
        arriveRect(10.6, [tb.rect[0], tb.rect[1], tb.rect[2], tb.rect[3] + 150], { dy: 330, top: 380 });
        float(11.7, 4.7, 0, -10, 0.02);
        head(10.65, [[{ t: "6 argomenti " }, { t: "× 5 formati", box: true }]], [10.65, 10.82, 11.0, 11.12, 11.24], 15.95);
        tb.show(10.7);
        tb.heads(11.25, 0.1);
        [0, 1, 2, 3, 4, 5].forEach((i) => tb.rowHead(i, 11.85 + i * 0.1));
        tb.fill(12.5, { step: 0.06 });
        tb.pill(15.6, "= 30 contenuti");
        // [catalogo] L08 — tabella di vetro: sheen sull'intestazione, titoli che vanno a fuoco, celle che si riempiono una per una, totale lime

        // ═══ D03 · la curva si disegna e la camera segue la punta (06/09: "le storie: +27% views, +31% condivisioni") (16,4 – 22,2) ═══
        X = 9500;
        const ox = X - 360, oy = Y + 400;
        const lc = lineChart(L, ox, oy, [[0, 0.07], [0.16, 0.12], [0.3, 0.15], [0.44, 0.3], [0.58, 0.5], [0.76, 0.66], [1, 0.93]], { w: 800, h: 720, ghost: true, area: true, bars: true, playhead: true, yTicks: ["2K", "4K", "6K", "8K"], xTicks: ["S1", "S2", "S3", "S4", "S5", "S6", "S7", "S8"] });
        arriveRect(16.4, [lc.rect[0] - 150, lc.rect[1], lc.rect[2], lc.rect[3]], { dx: 320, dy: 0, top: 380 });
        head(16.45, [[{ t: "Le views " }, { t: "salgono", box: true }]], [16.45, 16.62], 21.75);
        lc.axes(16.5);
        lc.axisLabel(16.75, "y", "Views");
        lc.axisLabel(16.85, "x", "Settimane");
        lc.draw(17.0, 1.1);
        lc.storyAt(2, 17.42, "tu");
        lc.label(2, 17.5, "Inizi le storie", "b", { gap: 66 });
        frameRect(17.55, 1.15, [ox + 230, lc.rect[1], lc.rect[2], oy + 70], { top: 380 });
        lc.label(4, 17.95, "+27% views", "l", { lime: true });
        lc.label(6, 18.45, "+31% condivisioni", "l", { lime: true });
        frameRect(19.0, 1.0, [lc.rect[0] - 150, lc.rect[1], lc.rect[2], lc.rect[3]], { top: 380 });
        float(20.0, 2.2, 0, -10, 0.02);
        // [catalogo] D03 — assi a L, curva al neon che si traccia con la testa luminosa, pallini, pill che si aprono, camera sulla punta

        // ═══ C03 · i segnali "−" tornano all'algoritmo: non capisce (01/10: "l'algoritmo non capisce") (22,2 – 27,2) ═══
        X = 12500;
        const rcard = glass(L, X - 500, Y - 560, 470, 470, { zIndex: 14, borderRadius: 30 });
        avatar(rcard, 56, 52, 64, "tu", { bw: 3, z: 3 });
        el(rcard, { position: "absolute", left: 100, top: 34, fontFamily: FS, fontWeight: 800, fontSize: 25, color: K.white, whiteSpace: "nowrap" }, "samuelerinaldo.media");
        [["vT1", "Cucina", "pizza"], ["vT2", "Viaggi", "plane"], ["vT3", "Fitness", "dumbbell"]].forEach(([id, lb, ic], i) => {
          const tx = 24 + i * 146;
          const tt = el(rcard, { position: "absolute", left: tx, top: 100, width: 130, height: 231, borderRadius: 14, overflow: "hidden", background: "#111", border: "1.5px solid rgba(255,255,255,.2)" });
          videoTile(tt, 0, 0, 130, 231, id, 1);
          el(rcard, { position: "absolute", left: tx - 6, top: 346, width: 142, height: 50, borderRadius: 25, display: "flex", alignItems: "center", justifyContent: "center", gap: 7, background: "linear-gradient(180deg,#3b3b3b,#262626)", border: "1.5px solid rgba(255,255,255,.2)", fontFamily: FS, fontWeight: 800, fontSize: 22, color: K.white, whiteSpace: "nowrap" }, svg(ic, 22, K.white, 2.2) + lb);
        });
        const alg = nodePill(L, X + 270, Y - 310, svg("cpu", 40, K.lime, 2.2) + "Algoritmo", { w: 420, h: 110, fs: 42 });
        const cr = crowd(L, X, Y + 350, 9, 3, { s: 56, gap: 14, label: "200 persone" });
        const c1 = connector(S, [[X - 265, Y - 90], [X - 170, Y + 350 - 170]], { color: "rgba(255,255,255,.7)", w: 4 });
        const c2 = connector(S, [[X + 270, Y - 255], [X + 170, Y + 350 - 170]], { color: "rgba(255,255,255,.7)", w: 4 });
        const c3 = connector(S, [[X - 30, Y - 310], [X + 60, Y - 310]], { color: "rgba(255,255,255,.7)", w: 4 });
        arriveRect(22.2, [X - 500, Y - 560, X + 500, Y + 540], { dy: 320, top: 380 });
        float(23.3, 3.9, 0, -10, 0.02);
        head(22.25, [[{ t: "L'algoritmo " }, { t: "non capisce", box: true }]], [22.25, 22.45, 22.6], 26.75);
        blurIn(rcard, 22.3, { y: 30, blur: 12, dur: 0.45 });
        // [i reel di temi diversi: è il "pubblicare di tutto" che confonde l'algoritmo]
        blurIn(alg, 22.45, { y: 20, blur: 10, dur: 0.4 });
        blurIn(cr.c, 22.55, { y: 30, blur: 12, dur: 0.45 });
        cr.fillIn(22.65, 0.5);
        c3.draw(22.7, 0.3); c1.draw(22.8, 0.35); c2.draw(22.9, 0.35);
        signal(L, c1, 23.1, 0.4, { sign: "+" });
        [23.9, 24.3, 24.7].forEach((t) => signal(L, c2, t, 0.4, { sign: "-", back: true }));
        cr.dim(23.9, [0, 1, 2, 3, 9, 10, 11, 12, 13, 18, 19, 20, 21, 22, 23], 0.18);
        const qm = el(L, { position: "absolute", left: X + 270 + 160, top: Y - 310 - 98, width: 76, height: 76, borderRadius: "50%", background: "radial-gradient(circle at 38% 30%, #5a5a5a, #2a2a2a 70%)", border: "2.5px solid rgba(255,255,255,.9)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 25, boxShadow: "0 10px 24px rgba(0,0,0,.5)" }, svg("circle-help", 46, "#ffffff", 2.4));
        pop(qm, 25.25, 0.3, "back.out(3)");
        shake(25.27, 6, 5);
        tl.to(alg, { borderColor: "rgba(255,255,255,.35)", color: "rgba(207,251,80,.45)", boxShadow: "0 0 0 rgba(0,0,0,0)", duration: 0.3 }, 25.25);
        cr.count(25.4, 200, 40, 0.8);
        // [catalogo] C03 — il tuo reel va al pubblico (+), i segnali "−" tornano all'algoritmo, che non capisce (punto di domanda, persone spente)

        // ═══ F10 · la storia che nessuno apre si sbriciola (10/10: "se non la aprono viene sepolta") (27,2 – 31,6) ═══
        X = 15500;
        const SW = 380, SH = 676, sx = X - SW / 2, sy = Y - SH / 2 + 20;
        const story = el(L, { position: "absolute", left: sx, top: sy, width: SW, height: SH, borderRadius: 26, overflow: "hidden", background: "#111", border: "2px solid rgba(255,255,255,.25)", boxShadow: "0 40px 90px rgba(0,0,0,.65)", zIndex: 14 });
        mediaTile(story, 0, 0, SW, SH, "th-mio_03", 1);
        el(story, { position: "absolute", left: 0, top: 0, width: SW, height: 150, background: "linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0))", zIndex: 2 });
        [0, 1, 2].forEach((k) => el(story, { position: "absolute", left: 16 + k * ((SW - 40) / 3 + 4), top: 14, width: (SW - 40) / 3, height: 5, borderRadius: 3, background: k === 0 ? "#fff" : "rgba(255,255,255,.4)", zIndex: 3 }));
        avatar(story, 42, 54, 46, "tu", { ring: "#fff", bw: 2, z: 3 });
        el(story, { position: "absolute", left: 76, top: 40, fontFamily: FS, fontWeight: 800, fontSize: 21, color: "#fff", whiteSpace: "nowrap", zIndex: 3 }, "samuelerinaldo.media <span style='opacity:.6;font-weight:600'>· 2 h</span>");
        const vw = el(story, { position: "absolute", left: 16, bottom: 18, display: "flex", alignItems: "center", gap: 10, padding: "8px 16px", borderRadius: 18, background: "rgba(0,0,0,.55)", fontFamily: FS, fontWeight: 800, fontSize: 28, color: "#fff", zIndex: 3 }, svg("eye", 30, "#fff", 2.4));
        const vwn = el(vw, {}, "190", "span");
        arriveRect(27.2, [sx - 120, sy - 40, sx + SW + 120, sy + SH + 40], { dy: 320, top: 400 });
        float(28.3, 3.3, 0, -12, 0.03);
        head(27.25, [[{ t: "Se non la aprono" }], [{ t: "sparisce", box: true }]], [27.25, 27.4, 27.55, 27.8], 31.15);
        blurIn(story, 27.3, { y: 40, blur: 14, dur: 0.5, scale: 0.94 });
        counter(vwn, 190, 0, 27.9, 2.6, "power1.in");
        tl.to(vw, { color: "#ff6b5e", duration: 0.2 }, 30.2);
        disintegrate(L, story, sx, sy, SW, SH, "th-mio_03", 30.7, { spread: 520, dur: 0.75 });
        // [catalogo] F10 — la storia (copertina vera + la tua foto) perde le views e si sbriciola in polvere dai bordi

        // ═══ L05 · lista con i lucchetti: due voci sbloccate, tre ancora chiuse (25/09: "te ne mancano tre") (31,6 – 36,4) ═══
        X = 18500;
        const lk = listK(L, X, Y - 40, 920, ["Strategia", "Contenuti", "Distribuzione", "Relazione", "Monetizzazione"], { h: 128, gap: 22, fs: 44, locks: true });
        const lr = lk.rect(5);
        const pb = progressBar(L, X - 460, lr[3] + 96, 920, { label: "Il tuo profilo", h: 30 });
        arriveRect(31.6, [lr[0], lr[1], lr[2], lr[3] + 150], { dy: 330, top: 390 });
        float(32.7, 3.7, 0, -10, 0.02);
        head(31.65, [[{ t: "Te ne mancano " }, { t: "tre", box: true }]], [31.65, 31.8, 31.95, 32.15], 35.95);
        lk.show(5, 31.75);
        lk.unlock(0, 32.6);
        lk.unlock(1, 33.2);
        pb.fill(32.65, 0.4, 0.75, "power2.out");
        [2, 3, 4].forEach((i) => tl.fromTo(lk.rows[i].lk, { scale: 1 }, { scale: 1.25, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 34.1 + (i - 2) * 0.12));
        // [catalogo] L05 — lista con i lucchetti: le voci fatte diventano lime col lucchetto aperto, le altre restano chiuse e sfocate

        // ═══ K17 · mappa a ∞: la camera viaggia lungo il tubo da una tappa all'altra (23/09: il ciclo della dopamina) (36,4 – 44) ═══
        X = 22000;
        const lm = loopMap(L, X, Y, ["Posta\nin gioco", "Domanda", "Finta", "Riaggancio"], { a: 430, b: 280, w: 76, fs: 66 });
        lm.go(0, 36.4);
        float(36.42, 0.98, -16, -8, 0.02);
        lm.name(0, [36.55, 36.7, 36.82]);
        lm.go(1, 37.4, { dur: 1.3 });
        float(38.7, 0.6, 18, 10, 0.015);
        lm.name(1, 38.2);
        lm.overview(39.3, 0.95);
        lm.dive(2, 40.4, 1.15);
        lm.name(2, 41.0);
        lm.go(3, 41.9, { dur: 1.3 });
        float(43.2, 0.8, -18, 10, 0.015);
        lm.name(3, 42.7);
        // [catalogo] K17 — mappa a ∞ (tubo al neon con molecole di dopamina): la camera viaggia da una tappa all'altra lungo il simbolo

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
