    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        camInit(540, 900, 1);
        // copertina della «scena prima» (0–1 s): sotto, il primo template monta la sua scena (R2: piena al taglio)
        const cover = el(document.getElementById("hud"), { position: "absolute", left: 0, top: 0, width: 1080, height: 1920, background: "#1e1e1e", zIndex: 99 });
        const sottoCopertina = (L) => [L, ...L.querySelectorAll("*")].forEach((n) => n.setAttribute("data-layout-allow-occlusion", ""));
        const S = {}; // i risultati dei template (ancore, tempi) per legare le scene fra loro (R8)

        // ═══ 1 · F02 · pulse a disco pieno — 14/10 «Se non diventi virale, non stai andando da nessuna parte. E se si
        // sbagliassero?» (d14 1,37–6,1 s → −0,25 s). I tuoi reel veri; «1M views» è il «virale» dello script («un milione di
        // visualizzazioni», 37,2 s) ═══
        { const o = -0.25;
          S.F02 = TPL.F02({ t0: 1.0, t1: 6.1, X: 600, Y: 900,
            parole: { parola: o + 2.233, dubbio: o + 5.5, titolo: [o + 1.367, o + 1.667, o + 1.8, o + 2.233, o + 4.633, o + 5.233, o + 5.367, o + 5.5] } }, {
            titolo: [[{ t: "Se non diventi " }, { t: "virale", box: true }], [{ t: "e se si sbagliassero?", hand: true }]],
            media: ["m1", "m2", "m3", "m4", "m5", "m6"], etichetta: { testo: "1M views", icona: "eye" }, dubbio: true });
          tl.set(cover, { opacity: 0 }, S.F02.tempi.taglio);
          sottoCopertina(S.F02.elementi.L);
        }

        // ═══ 2 · O13 · cervello luminoso — 14/10 «E il cervello si convince che quello sia il livello normale.» (d14 11,0–13,97 s
        // → −4,85 s). «Quello» = i contenuti con tantissima interazione della frase prima: reel veri di Hormozi col badge «1M
        // views» (lo stesso «virale» della scena 1). R8: taglio netto + zoom d'arrivo ═══
        { const o = -4.85;
          S.O13 = TPL.O13({ t0: 6.1, t1: 9.75, X: 3600, Y: 900,
            parole: { accende: o + 11.833, etichetta: o + 13.233, titolo: [o + 11.267, o + 11.333, o + 11.733, o + 11.833] } }, {
            titolo: [[{ t: "Il cervello " }, { t: "si convince", box: true }]],
            media: ["h1", "h2", "h3"], ratio: 4 / 3, badge: "1M views", etichetta: "= il livello normale" });
        }

        // ═══ 3 · K11 · muro di reel veri che scorre (slot) — 14/10 «Non lo è. È l'eccezione mostrata in continuazione.» (d14
        // 14,53–17,97 s → −4,65 s). Il muro = il feed (fotogrammi veri di reel, atlante muro); l'eccezione accesa col badge «1M»,
        // lo scorrimento su «mostrata»: all'arrivo ce ne sono altre accese. R8: taglio netto (il muro si apre) ═══
        { const o = -4.65;
          S.K11 = TPL.K11({ t0: 9.75, t1: 13.6, X: 7000, Y: 900,
            parole: { eccezione: o + 15.833, scorre: o + 16.433, titolo: [o + 15.333, o + 15.7, o + 17.133, o + 17.267] } }, {
            titolo: [[{ t: "È " }, { t: "l'eccezione", box: true }], [{ t: "in continuazione", hand: true }]], badge: "1M" });
        }

        // ═══ 4 · F04 · riflettore + oscuramento — 14/10 «Ma da quel momento ogni video sotto quella soglia sembra un fallimento.»
        // (d14 18,43–21,67 s → −4,75 s; «soia» nella trascrizione = «soglia»). I tuoi reel veri sotto la soglia, il reel virale
        // sopra. R8 MORBIDA: le idee si toccano (l'eccezione → la soglia): la camera entra nell'eccezione accesa del muro
        // (tplZoomThrough) e dall'altra parte c'è il grafico, col reel virale sopra la soglia ═══

          const r = { t0, t1: 17.3, X: 10200, Y: 900, parole: { soglia: o + 20.4, riflettore: o + 21.067,
            titolo: [o + 19.933, o + 20.167, o + 20.4, o + 20.7, o + 21.033, o + 21.067] } };
          S.F04 = TPL.F04(r, { titolo: [[{ t: "Sotto la " }, { t: "soglia", box: true }], [{ t: "sembra un fallimento", hand: true }]],

            soglia: { v: 0.8, testo: "1M views" }, ingresso: "nessuno", fermoDa: t0 + 0.45 });
          tplTenuta(tplZoomThrough(t0, S.K11.ancore.eccezione(2), S.F04.pose), r.t1);
        }

        // ═══ 5 · O10 · bersaglio costruito dal centro — 14/10 «L'obiettivo non è un milione di visualizzazioni. È arrivare alle
        // persone giuste col messaggio giusto.» (d14 37,2–42,03 s → −19,7 s). Al centro le persone giuste (silhouette, mai volti
        // veri), fuori il pubblico largo «1M di views» che si spegne; la freccetta = il messaggio giusto. R8: taglio netto ═══
        { const o = -19.7;
          S.O10 = TPL.O10({ t0: 17.3, t1: 22.75, X: 13400, Y: 900,
            parole: { fuori: o + 38.167, spegni: o + 38.6, centro: o + 40.167, freccia: o + 41.167,

            etichette: { fuori: "1M di views", centro: "Le persone giuste" } });
        }

        // ═══ 6 · U15 · timer, conto alla rovescia — 15/10 «30 giorni di contenuti pianificati in meno di 30 secondi.» (d15
        // 0–4,03 s → +22,85 s). Il cronometro conta in tempo reale da 30, l'anello dei 30 giorni pianificati si riempie in 1,5 s.
        // Dal reel 15 in poi. R8: taglio netto (cambia reel) ═══
        { const o = 22.85;
          S.U15 = TPL.U15({ t0: 22.75, t1: 27.2, X: 16600, Y: 900,
            parole: { pieno: o + 1.5, secondi: o + 3.333, titolo: [o + 0, o + 0.333, o + 1.967, o + 2.767, o + 3.333] } }, {
            titolo: [[{ t: "30 giorni " }, { t: "in 30 secondi", box: true }]] });
        }

        { const o = 22.9;
          S.O24 = TPL.O24({ t0: 27.2, t1: 31.15, X: 19600, Y: 900,
            parole: { riempie: o + 5.667, conta: o + 7.2, titolo: [o + 4.367, o + 4.967, o + 5.067, o + 5.667, o + 5.967, o + 6.1, o + 6.867, o + 6.867, o + 7.2] } }, {
            titolo: [[{ t: "Scegli un " }, { t: "volume", box: true }], [{ t: "uno al giorno = 30 video", hand: true }]],
            media: Array.from({ length: 30 }, (_, i) => "g" + String(i + 1).padStart(2, "0")) });
        }

        // ═══ 8 · O23 · griglia di 100 puntini — 15/10 «Io uso 70% valore, 20% fiducia, 10% conversione.» (d15 10,3–15,43 s →
        // +20,9 s). Ogni gruppo si colora sulla sua parola, con la sua voce di legenda. R8: taglio netto ═══
        { const o = 20.9;
          S.O23 = TPL.O23({ t0: 31.15, t1: 36.65, X: 22600, Y: 900,
            parole: { gruppi: [o + 11.8, o + 13.267, o + 14.633], titolo: [o + 11.8, o + 13.267, o + 14.633] } }, {
            titolo: [[{ t: "Valore, fiducia, " }, { t: "conversione", box: true }]],
            gruppi: [{ n: 70, nome: "Valore", stile: "lime" }, { n: 20, nome: "Fiducia", stile: "bianco" }, { n: 10, nome: "Conversione", stile: "anello" }] });

        // ═══ 9 · L09 · albero che cresce — 15/10 «Scegli i tuoi filoni tematici dentro la tua nicchia.» (d15 16,07–18,27 s →

        // R8: taglio netto ═══
        { const o = 20.7;
          S.L09 = TPL.L09({ t0: 36.65, t1: 39.5, X: 25600, Y: 900,
            parole: { esempi: o + 16.533, radice: o + 17.867, titolo: [o + 16.067, o + 16.333, o + 16.467, o + 16.533] } }, {

          const r = { t0, t1: 45.6, X: 28600, Y: 900, parole: { sezioni: [o + 25.7, o + 26.3, o + 27.167, o + 27.9],

        // ═══ 11 · K16 · push-in lento su un oggetto che si costruisce — 15/10 «Infine, organizza tutto in un calendario, alternando
        // i filoni durante la settimana per non ripetere sempre lo stesso tema.» (d15 29,73–34,9 s → +16,0 s; «Infine» resta fuori).

        // venerdì: mai vicini). R8: taglio netto (la spinta parte al taglio) ═══
