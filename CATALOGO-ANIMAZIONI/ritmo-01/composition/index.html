/* @scheda D06 · Barra di avanzamento / timeline del video (i capitoli che si accendono mentre il video scorre)
 * quando: durata, momenti del video, progressi, il riassunto dei passi ("ecco come pianifici 30 giorni in meno di 30
 *   secondi"): il tuo reel nel lettore, sotto la timeline a segmenti (un segmento per passo) che si riempie lineare col
 *   tempo che corre; accanto i capitoli, che si accendono quando la testina li supera
 * frase: «Ecco come pianifici 30 giorni di contenuti in meno di 30 secondi.» (15/10, 35,4–39,4 s)
 * durata: 3–5 s (consigliata 4)
 * scena: t0 (taglio: la testina parte), t1, X, Y (centro), parole: { fine (la barra è piena: es. «meno»), tempo (accento sul
 *   tempo: es. «secondi»), titolo ([…]) }
 * opzioni: titolo, media (id del tuo reel nel lettore), capitoli ([{ t: "Volume", icona: "layers" }, …] 3–6), durata ("0:30"
 *   il totale scritto), fino (secondi a cui arriva il contatore, 28), ingresso ("arrivo" default | "zoom" | "nessuno" = la
 *   camera la muove la composizione, es. tplPan), fermoDa, fermo (R7)
 * restituisce: rect, pose, ancore { lettore, barra(f) }, elementi { lettore, segmenti, capitoli, contatore, L }, tempi {
 *   taglio, fine, tempo }
 * suoni: whoosh .14 al taglio · tick .04 per capitolo · ding .1 su «tempo»
 * regole: R2 lettore, timeline vuota e capitoli spenti già in scena al taglio · R6 la testina corre lineare dal primo
 *   fotogramma e il contatore conta lineare (reel 24: il tempo «12:20 / 22:20» corre e i segmenti si colorano in ordine; reel
 *   115: la barra a segmenti colorati sotto la striscia di clip) · ogni capitolo si accende quando la testina passa il suo
 *   segmento (lime = fatto) · R3 un accento sul tempo · R7 sfondo fermo
 * prima: (demo-2 45,4 s) progressBar().fill con una barra sola sotto un oggetto, dopo la costruzione
 * chiamata:
 *   TPL.D06({ t0: 51.2, t1: 55.6, X: 32850, Y: 900, parole: { fine: 53.9, tempo: 54.5, titolo: [51.37, 51.83, 52.0, 52.57] } }, {
 *     titolo: [[{ t: "Ecco come " }, { t: "pianifici", box: true }]], media: "d1",
 *     capitoli: [{ t: "Volume", icona: "layers" }, { t: "Suddivisione", icona: "chart-pie" }, { t: "Filoni", icona: "git-branch" },
 *       { t: "Script", icona: "file-text" }, { t: "Calendario", icona: "calendar-days" }] });
 */
TPL.D06 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const C = o.capitoli || [];
  const n = C.length, pw = o.pw || 420, ph = Math.round((pw * 16) / 9), gapC = 40, cw = o.cw || 470, rh = Math.min(140, (ph - (n - 1) * 14) / n);
  const W = pw + gapC + cw, barH = 26, barGap = 44, cntH = 70;
  const H = ph + barGap + barH + 20 + cntH;
  const x0 = X - W / 2, y0 = Y - H / 2;
  // il lettore: il tuo reel vero
  const pl = layered(el(L, { position: "absolute", left: x0, top: y0, width: pw, height: ph, borderRadius: 30, overflow: "hidden", border: "2.5px solid rgba(255,255,255,.28)", boxShadow: "0 30px 70px rgba(0,0,0,.6)", background: "#111", zIndex: 12 }));
  if (o.media) mediaTile(pl, 0, 0, pw, ph, o.media, 1);
  // i capitoli a destra (spenti) e la timeline a segmenti sotto (vuota)
  const caps = C.map((c, i) => {
    const y = y0 + (ph - (n * rh + (n - 1) * 14)) / 2 + i * (rh + 14);
    const r = layered(el(L, { position: "absolute", left: x0 + pw + gapC, top: y, width: cw, height: rh, borderRadius: 24, display: "flex", alignItems: "center", gap: 18, padding: "0 22px", background: "linear-gradient(180deg, rgba(52,52,52,.95), rgba(28,28,28,.97))", border: "2px solid rgba(255,255,255,.16)", fontFamily: FS, fontWeight: 800, fontSize: 40, color: "#8a8a8a", whiteSpace: "nowrap", zIndex: 12 },
      `<span style="font-family:${FD};font-size:34px;opacity:.7">${i + 1}</span>` + (c.icona ? svg(c.icona, 42, "#8a8a8a", 2.2) : "") + `<span>${c.t}</span>`));
    return r;
  });
  const yB = y0 + ph + barGap, segW = (W - (n - 1) * 10) / n;
  const segs = C.map((c, i) => {
    const s = layered(el(L, { position: "absolute", left: x0 + i * (segW + 10), top: yB, width: segW, height: barH, borderRadius: barH / 2, background: "rgba(255,255,255,.14)", overflow: "hidden", zIndex: 12 }));
    const f = el(s, { position: "absolute", left: 0, top: 0, width: segW, height: barH, background: limeFill(1), boxShadow: GLOW_A(0.6), transformOrigin: "0 50%" });
    gsap.set(f, { scaleX: 0 });
    return { s, f };
  });
  const tot = o.durata || "0:30", fino = o.fino == null ? 28 : o.fino;
  const cnt = layered(el(L, { position: "absolute", left: X + W / 2 - 330, top: yB + barH + 20, width: 330, height: cntH, display: "flex", alignItems: "center", justifyContent: "flex-end", fontFamily: FD, fontWeight: 700, fontSize: 56, color: K.white, textShadow: GLOW_T, whiteSpace: "nowrap", zIndex: 12 }, `<span>0:00</span>&nbsp;<span style="opacity:.5">/ ${tot}</span>`));
  const cntN = cnt.querySelector("span");
  const tutto = [pl, ...caps, ...segs.map((s) => s.s), cnt];
  gsap.set(tutto, { opacity: 0 });
  tplMonta(t0, (t) => tl.to(tutto, { opacity: 1, duration: 0.2 }, t), () => gsap.set(tutto, { opacity: 1 }));
  // il movimento principale: la testina corre lineare dal primo fotogramma, segmento dopo segmento (R6); il contatore insieme
  const ts = t0 + 0.03, tf = P.fine == null ? t0 + 2.4 : P.fine, dF = Math.max(1.2, tf - ts), dS = dF / n;
  segs.forEach((s, i) => tl.to(s.f, { scaleX: 1, duration: dS, ease: "none" }, ts + i * dS));
  caps.forEach((r, i) => {
    const t = ts + (i + 1) * dS;
    tl.to(r, { color: K.white, borderColor: K.lime, boxShadow: GLOW_A(0.45), duration: 0.15 }, t);
    const ic = r.querySelector("svg");
    if (ic) tl.to(ic, { attr: { stroke: K.lime }, duration: 0.15 }, t);
  });
  const V = { v: 0 };
  tl.fromTo(V, { v: 0 }, { v: fino, duration: dF, ease: "none", immediateRender: false, onUpdate: () => (cntN.textContent = `0:${String(Math.floor(V.v)).padStart(2, "0")}`) }, ts);
  // accento sul tempo
  const tt = P.tempo == null ? tf + 0.4 : P.tempo;
  glowFlash(cnt, tt);
  tl.to(cntN, { color: K.lime, textShadow: GLOW_LT, duration: 0.2 }, tt);
  // la camera
  const rect = [x0 - 10, y0 - 10, x0 + W + 10, yB + barH + 20 + cntH + 10];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380, fill: o.fill || 0.98 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "arrivo", top: 380, fill: o.fill || 0.98 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { lettore: [x0 + pw / 2, y0 + ph / 2], barra: (f) => [x0 + f * W, yB + barH / 2] },
    elementi: { lettore: pl, segmenti: segs, capitoli: caps, contatore: cnt, titolo: T, L },
    tempi: { taglio: t0, fine: ts + dF, tempo: tt },
  };
};

// ──── kit2-tpl-liste.js ────
// ═══ KW kit v2 · TEMPLATE · liste e strutture (L) — blocco 1 del rifacimento col ritmo (RIFACIMENTO-RITMO.md) ═════════════
// Stesso standard di kit2-template.js. Scene di prova in CATALOGO-ANIMAZIONI/ritmo-01 (KW_RITMO).

/* @scheda L11 · Catena di passi: percorso a tappe con il tuo video che lo percorre
 * quando: procedure in N passi ("carica → salva in bozza → duplica → pubblica"), un metodo, "il mio sistema": tutte le tappe
 *   si vedono subito (quelle non ancora dette restano sfocate) e il tuo contenuto corre di tappa in tappa sulle parole
 * frase: «La prossima volta che carichi un video, prima di pubblicarlo, salvalo come bozza. Poi, duplicalo.» (16/10,
 *   6,5–12,8 s)
 * durata: 3–7 s (consigliata 4–6)
 * scena: t0 (taglio: il tracciato si disegna), t1, X, Y (centro), parole: { tappe: [quando si accende ogni tappa detta: la
 *   prima con l'arrivo del video, le altre con la corsa che finisce sulla parola] (le tappe senza tempo restano sfocate),
 *   copia (il video si sdoppia, facoltativo), titolo ([…]) }
 * opzioni: tappe ([{ t: nome, icona }], 3–6), media (copertina o video del tuo reel che corre: «th-mio_04»), copia (true: alla
 *   tappa «copia» compare la seconda copia), titolo, ingresso ("fermo" default, come il reel 124 | "arrivo" | "nessuno"),
 *   fermo (R7, default true), layout ("diagonale" default con KW_RITMO: il tracciato attraversa tutta la larghezza come il
 *   reel 124 e la scena riempie o.area, default [90, 390, 990, 1250] dello schermo | "colonna": la S verticale di prima),
 *   durTracciato (1.0: tracciato 10 → 90% in ~0,45 s con i due tratti, K r124 0,50 s)
 * restituisce: rect, pose, ancore { tappa(i), video (elemento), copia }, elementi { metro, video, copia, L },
 *   tempi { taglio, tappe }
 * suoni: whoosh .14 al taglio (il tracciato) · pop .1 quando arriva il video · tick .06 su ogni tappa · card .1 sulla copia
 * regole: R2 tappe ed etichette (sfocate) già in scena; al taglio si disegna il tracciato (reel 124: la linea entra dal
 *   bordo e attraversa tutta la larghezza e le 7 tappe, 10 → 90% in 0,50 s dal primo fotogramma, camera ferma) · R3 la
 *   camera tiene; accenti sulle parole: il video arriva sulla prima tappa, corre alla seconda e alla terza (0,7 s
 *   power2.inOut, arriva sulla parola) · R5 niente back.out · la scena riempie l'area utile (regia 13/10)
 * prima: (demo-2 30,15–32,5 s) metroPath.show + go con la pallina; la scena arrivava con arriveRect da 340 px e la checklist
 *   sopra (due oggetti in una scena). Prima stesura del blocco 1: S verticale stretta a metà larghezza (scala 0,80), sotto un
 *   grande vuoto
 * chiamata:
 *   TPL.L11({ t0: 31.45, t1: 38.0, X: 17000, Y: 900, parole: { tappe: [32.9, 35.8, 37.26], copia: 37.3,
 *     titolo: [32.9, 35.3, 36.53, 37.26] } }, {
 *     titolo: [[{ t: "Carica, " }, { t: "salva", box: true }], [{ t: "e duplica", hand: true }]], media: "th-mio_04", copia: true,
 *     tappe: [{ t: "Carica il video", icona: "upload" }, { t: "Salva in bozza", icona: "save" },
 *             { t: "Duplica", icona: "copy" }, { t: "Pubblica ×2", icona: "send" }] });
 */
TPL.L11 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const tp = o.tappe || [], n = tp.length;
  // layout «diagonale» (default con KW_RITMO, correzioni della regia al blocco 1): come il reel 124 il tracciato attraversa
  // tutta la larghezza, entra dal bordo sinistro, scende a S per le tappe e esce dal bordo destro; tutto più grande (tappe,
  // etichette, il tuo video) e la scena riempie l'area utile (x 90–990, dal titolo a y ~1250). Layout «colonna» (di prima):
  // tappe su una S verticale stretta (±dx) al centro
  const diag = o.layout === "diagonale" || (o.layout == null && KW_RITMO);
  let pts, xs, dx, passo;
  if (diag) {
    // tappe in discesa da sinistra a destra (fra una e l'altra il tracciato piega a S), fino a 6; etichette a destra, l'ultima
    // a sinistra (resta dentro lo schermo); il tuo video corre a sinistra del tracciato
    const base = [[-230, -290], [-40, -80], [10, 145], [220, 385], [300, 470], [380, 560]];
    pts = tp.map((_, i) => [X + base[i][0], Y + base[i][1]]);
    xs = X; dx = 0; passo = 0;
  } else {
    // tappe su una S verticale (9:16, il tracciato ondeggia di ±dx) con le etichette grandi a destra; il tuo video corre a
    // sinistra del tracciato, così non copre mai le etichette
    dx = o.dx || 70; passo = o.passo || 235; xs = X - 190;
    const y0 = Y - ((n - 1) * passo) / 2;
    pts = tp.map((_, i) => [xs + (i % 2 ? dx : -dx), y0 + i * passo]);
  }
  const S = svgLayer(L, 8, X - 3000, Y - 3000, 6000, 6000);
  // il tuo video che corre: una card 9:16 a sinistra di un punto lime che sta sul tracciato (è il «walker» di metroPath)
  const cw = o.cw || (diag ? 180 : 168), ch = Math.round((cw * 16) / 9), R = diag ? 50 : 46, FSZ = diag ? 50 : 46;
  const mk = (z) => {
    const w = layered(el(L, { position: "absolute", left: 0, top: 0, width: 1, height: 1, zIndex: z }));
    el(w, { position: "absolute", left: -13, top: -13, width: 26, height: 26, borderRadius: "50%", background: limeFill(1), boxShadow: GLOW_A(0.9) });
    const c = el(w, { position: "absolute", left: -cw - R - 26, top: -ch / 2, width: cw, height: ch, borderRadius: 18, overflow: "hidden", background: "#111", border: `3px solid ${K.lime}`, boxShadow: `${GLOW_A(0.55)}, 0 18px 40px rgba(0,0,0,.6)` });
    if (o.media) mediaTile(c, 0, 0, cw, ch, o.media, 1);
    return w;
  };
  const video = mk(40);
  gsap.set(video, { x: pts[0][0], y: pts[0][1], opacity: 0 });
  const lati = tp.map((_, i) => (diag && (i === n - 1 || i >= 3) ? "l" : "r"));
  const metro = metroPath(L, S, pts, tp.map((q) => q.t), { r: R, fs: FSZ, lw: 470, w: 9, side: lati, icons: tp.map((q) => q.icona), z: 14, walker: video });
  // 1) prima del taglio: stazioni ed etichette (sfocate: non ancora dette) già in scena
  const tutte = metro.st.map((s) => [s.n, s.lb]).flat();
  tplMonta(t0, (t) => tl.set(tutte, { opacity: 1 }, t), () => gsap.set(tutte, { opacity: 1 }));
  // 2) al taglio: il tracciato si disegna (0,85 s, reel 124). Diagonale: con un tratto che entra dal bordo sinistro e uno che
  //    esce dal bordo destro, disegnati di seguito come una linea sola (una curva power1.inOut su tutta la lunghezza)
  if (diag) {
    const p0 = pts[0], p1 = pts[1] || [p0[0] + 100, p0[1] + 100], pn = pts[n - 1], pm = pts[n - 2] || [pn[0] - 100, pn[1] - 100];
    const v0 = [p1[0] - p0[0], p1[1] - p0[1]], vn = [pn[0] - pm[0], pn[1] - pm[1]];
    const dIn = `M${X - 760} ${p0[1] - 120} C${X - 520} ${p0[1] - 120}, ${(p0[0] - v0[0] * 0.35).toFixed(1)} ${(p0[1] - v0[1] * 0.35).toFixed(1)}, ${p0[0]} ${p0[1]}`;
    const dOut = `M${pn[0]} ${pn[1]} C${(pn[0] + vn[0] * 0.25).toFixed(1)} ${(pn[1] + vn[1] * 0.25).toFixed(1)}, ${pn[0] + 230} ${pn[1] + 70}, ${pn[0] + 560} ${pn[1] + 65}`;
    const base = S.getElementsByTagName("path")[0]; // il tracciato di metroPath (il primo path del livello)
    const tratto = (d) => {
      const p = pathEl(S, d, { fill: "none", stroke: "rgba(255,255,255,.7)", "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" });
      p.style.filter = "drop-shadow(0 0 6px rgba(255,255,255,.35))";
      const l = p.getTotalLength();
      p.setAttribute("stroke-dasharray", `${l.toFixed(1)} ${l.toFixed(1)}`);
      p.setAttribute("stroke-dashoffset", l.toFixed(1));
      return [p, l];
    };
    const [pIn, lIn] = tratto(dIn), [pOut, lOut] = tratto(dOut), lM = metro.L, U = { u: 0 };
    const metti = (p, l, a) => p.setAttribute("stroke-dashoffset", (l - Math.max(0, Math.min(l, a))).toFixed(1));
    tl.fromTo(U, { u: 0 }, { u: lIn + lM + lOut, duration: o.durTracciato || 1.0, ease: "power1.inOut", immediateRender: false,
      onUpdate: () => { metti(pIn, lIn, U.u); metti(base, lM, U.u - lIn); metti(pOut, lOut, U.u - lIn - lM); } }, t0 + 0.03);
  } else metro.show(t0 + 0.03, 0.85, true);
  // 3) accenti: il video arriva sulla prima tappa, poi corre di tappa in tappa e arriva sulla parola
  const T = P.tappe || [t0 + 1.0, t0 + 2.2, t0 + 3.4];
  if (T[0] != null) {
    tl.fromTo(video, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, T[0]);
    metro.go(0, T[0], 0.05);
  }
  let cur = 0;
  for (let i = 1; i < T.length && i < n; i++) {
    if (T[i] == null) continue;
    const du = Math.min(0.7, Math.max(0.35, T[i] - T[i - 1] - 0.2));
    metro.go(i, T[i] - du, du); // il video corre (power2.inOut), dietro di lui il tratto fatto si accende, la tappa si accende all'arrivo
    cur = i;
  }
  // la copia (facoltativa): alla tappa detta il video si sdoppia, la copia esce di lato e resta dietro (due card)
  let copia = null;
  if (o.copia && P.copia != null) {
    const k = Math.min(n - 1, cur), [cx, cy] = pts[k];
    copia = mk(39);
    gsap.set(copia, { x: cx, y: cy, opacity: 0 });
    tl.set(copia, { opacity: 1 }, P.copia);
    tl.to(copia, { x: cx - 34, y: cy - 30, duration: 0.3, ease: "power2.out" }, P.copia);
  }
  // 4) la camera: ferma come nel reel 124 (il movimento è il tracciato), poi tiene
  let rect, posa = null;
  if (diag) {
    // il rettangolo delle cose vere (tappe, etichette stimate, il video dove arriva) riempie l'area utile o.area (schermo,
    // default x 90–990, y 390–1250): la scala è la più grande che ci sta
    const est = (t) => FSZ * 0.56 * t.length + FSZ * 1.2;
    let a0 = 1e9, b0 = 1e9, a1 = -1e9, b1 = -1e9;
    const add = (a, b, c, d) => { a0 = Math.min(a0, a); b0 = Math.min(b0, b); a1 = Math.max(a1, c); b1 = Math.max(b1, d); };
    pts.forEach(([x, y], i) => {
      add(x - R, y - R, x + R, y + R);
      const w = est(tp[i].t || "");
      if (lati[i] === "r") add(x + R + 16, y - FSZ * 0.95, x + R + 16 + w, y + FSZ * 0.95);
      else add(x - R - 16 - w, y - FSZ * 0.95, x - R - 16, y + FSZ * 0.95);
    });
    T.forEach((tt, i) => { if (tt != null && i < n) add(pts[i][0] - R - 26 - cw, pts[i][1] - ch / 2, pts[i][0] - R - 26, pts[i][1] + ch / 2); });
    rect = [a0 - 10, b0 - 10, a1 + 10, b1 + 10];
    const A = o.area || [90, 390, 990, 1250];
    const s = Math.min((A[2] - A[0]) / (rect[2] - rect[0]), (A[3] - A[1]) / (rect[3] - rect[1]));
    posa = { fx: (rect[0] + rect[2]) / 2 - ((A[0] + A[2]) / 2 - ANCHOR.x) / s, fy: (rect[1] + rect[3]) / 2 - ((A[1] + A[3]) / 2 - ANCHOR.y) / s, s };
  } else {
    const r0 = metro.rect;
    rect = [Math.min(r0[0], xs - dx - cw - R - 60), Math.min(r0[1], pts[0][1] - ch / 2 - 40), r0[2], Math.max(r0[3], pts[n - 1][1] + ch / 2 + 20)];
  }
  let pose = posa || fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "fermo", top: 380, posa });
  tplFermo0(scena, o);
  const Ti = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { tappa: (i) => pts[i], videoXY: (i) => [pts[i][0] - cw / 2 - R - 26, pts[i][1]], video, copia },
    elementi: { metro, video, copia, titolo: Ti, L },
    tempi: { taglio: t0, tappe: T },
  };
};

// ═══ blocco 2 del rifacimento (ritmo-02) ═══════════════════════════════════════════════════════════════════════════════════

/* @scheda L09 · Albero che cresce (la nicchia e i suoi filoni, coi reel veri sotto ogni filone)
 * quando: categorie e sotto-categorie (nicchia → filoni, argomento → formati), cause → effetti: la radice in alto, i rami
 *   che si disegnano verso i figli, sotto ogni figlio i reel veri che ne sono un esempio
 * frase: «Scegli i tuoi filoni tematici dentro la tua nicchia.» (15/10, 16,1–18,3 s)
 * durata: 2,5–5 s (consigliata 3–4)
 * scena: t0 (taglio: i rami crescono), t1, X, Y (centro), parole: { esempi (i reel compaiono sotto i rami: es. «filoni»),
 *   radice (la radice si accende: es. «nicchia»), titolo ([…]) }
 * opzioni: titolo, radice (testo, "La tua nicchia"), rami ([{ t: "Profilo", media: [id] }], 3–4; uno o due reel per ramo),
 *   tw (larghezza dei reel, di default tutta la colonna del ramo: 225 con un reel), ingresso ("fermo" default: il movimento è la crescita | "arrivo" | "zoom" | "nessuno"), fermo (R7)
 * restituisce: rect, pose, ancore { radice, ramo(i), reel(i, j) }, elementi { albero, reel, L }, tempi { taglio, cresciuto,
 *   esempi, radice }
 * suoni: whoosh .14 al taglio · tick .05 sui rami · pop .08 sugli esempi · ding .08 sulla radice
 * regole: R2 la radice e i filoni (sfocati, segnaposto L01) ci sono al taglio; il movimento principale è la crescita dal
 *   primo fotogramma: i rami si disegnano (0,35 s, sfalsati di 0,06 s) e ogni filone va a fuoco quando la sua linea lo
 *   raggiunge (reel 3: linee 0,3–0,5 s, nodi 0,25 s sfalsati; reel 23: i figli coi reel veri sotto) · R3 accenti: i reel sotto i rami (popK, sfalsati), la radice che si accende · R5 niente back.out né
 *   scala sui nodi · R7 sfondo fermo
 * prima: (demo-8 29,2–36,2 s · demo 18,45 s) flowTree a tre righe che si costruiva riga per riga con la camera che scendeva
 *   dietro alla crescita (tre movimenti di camera in 7 s)
 * chiamata:
 *   TPL.L09({ t0: 36.65, t1: 39.5, X: 25600, Y: 900, parole: { esempi: 37.23, radice: 38.57,
 *     titolo: [36.77, 37.15, 37.2, 37.23] } }, {
 *     titolo: [[{ t: "Scegli i tuoi " }, { t: "filoni", box: true }]], radice: "La tua nicchia",
 *     rami: [{ t: "Profilo", media: ["f1"] }, { t: "Algoritmo", media: ["f3"] }, { t: "Idee", media: ["f5"] },
 *       { t: "Psicologia", media: ["f7"] }] });
 */
TPL.L09 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const R = o.rami || [];
  // proporzioni (blocco 2): un reel grande per ramo riempie l'area utile (con 2 reel piccoli l'albero era alto la metà)
  const n = R.length, cw = o.cw || 255, W = n * cw, nm = Math.max(1, ...R.map((r) => (r.media || []).length));
  const tw = o.tw || Math.floor((cw - 30 - (nm - 1) * 12) / nm), th = Math.round((tw * 16) / 9), nh = 84, dy = o.dy || 190;
  const H = nh + dy + nh + 40 + th;
  const y0 = Y - H / 2;
  const S = svgLayer(L, 12, X - 2000, Y - 2000, 4000, 4000);
  const FT = flowTree(L, S, X, y0, [{ nodi: [{ t: o.radice || "La tua nicchia" }], w: 500 }, { nodi: R.map((r) => ({ t: r.t, p: 0 })), w: W }], { fs: 38, h: nh, dy, z: 13 });
  // la radice c'è già al taglio, i rami sono già lì sfocati (L01: segnaposto): al taglio il fotogramma è pieno (R2)
  const rad = FT.L[0].nodes[0].b, figli = FT.L[1].nodes.map((nd) => nd.b);
  tplMonta(t0, (t) => { tl.to(rad, { opacity: 1, scale: 1, duration: 0.2 }, t); tl.to(figli, { opacity: 0.38, scale: 1, filter: "blur(6px)", duration: 0.2 }, t); },
    () => { gsap.set(rad, { opacity: 1, scale: 1 }); gsap.set(figli, { opacity: 0.38, scale: 1, filter: "blur(6px)" }); });
  // i reel sotto ogni ramo (reel veri in movimento), nascosti fino a «esempi»
  const yR = y0 + nh + dy + nh + 40;
  const reel = R.map((r, i) => (r.media || []).map((id, j, A) => {
    const [x] = FT.nodeXY(1, i), x0 = x - (A.length * tw + (A.length - 1) * 12) / 2 + j * (tw + 12);
    const c = layered(el(L, { position: "absolute", left: x0, top: yR, width: tw, height: th, borderRadius: 12, overflow: "hidden", border: "2px solid rgba(255,255,255,.22)", boxShadow: "0 18px 40px rgba(0,0,0,.55)", background: "#111", zIndex: 13 }));
    mediaTile(c, 0, 0, tw, th, id, 1);
    gsap.set(c, { opacity: 0 });
    return c;
  }));
  // il movimento principale: i rami si disegnano dal primo fotogramma (linee 0,35 s, sfalsate di 0,06 s) e ogni filone va a
  // fuoco quando la sua linea lo raggiunge (0,25 s, power2.out: niente scala né rimbalzo)
  FT.L[1].nodes.forEach((nd, i) => {
    const tt = t0 + 0.03 + i * 0.06;
    if (nd.cn) nd.cn.draw(tt, 0.35, "power2.out");
    tl.to(nd.b, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, tt + 0.245);
    tl.set(nd.b, { filter: "none" }, tt + 0.5);
  });
  const tc = t0 + 0.03 + (n - 1) * 0.06 + 0.35 * 0.7 + 0.25;
  // accento 1: i reel d'esempio compaiono sotto i rami (popK sfalsati)
  const te = P.esempi == null ? tc + 0.3 : P.esempi;
  reel.forEach((rr, i) => rr.forEach((c, j) => popK(c, te + (i * 2 + j) * 0.05, { da: 0.85, dur: 0.15 })));
  // accento 2: la radice (la tua nicchia) si accende
  const trd = P.radice == null ? te + 1.0 : P.radice;
  glowFlash(rad, trd);
  tl.to(rad, { boxShadow: `${GLOW_A(1.2)}, 0 14px 30px rgba(0,0,0,.5)`, duration: 0.25 }, trd);
  // la camera: tiene (il movimento è la crescita)
  const rect = [X - W / 2 - 10, y0 - 10, X + W / 2 + 10, yR + th + 10];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380, fill: o.fill || 0.98 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "fermo", top: 380, fill: o.fill || 0.98 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { radice: FT.nodeXY(0, 0), ramo: (i) => FT.nodeXY(1, i), reel: (i, j) => { const [x] = FT.nodeXY(1, i), A = (R[i].media || []).length; return [x - (A * tw + (A - 1) * 12) / 2 + j * (tw + 12) + tw / 2, yR + th / 2]; } },
    elementi: { albero: FT, reel, titolo: T, L },
    tempi: { taglio: t0, cresciuto: tc, esempi: te, radice: trd },
  };
};

/* @scheda L12 · Documento «Script» che si costruisce (le sezioni si accendono quando le nomini)
 * quando: script, struttura di un video, copioni, "hook, spiega, mostra, insegna": il copione in vetro con le righe già
 *   stese; ogni sezione si evidenzia di lime riga per riga sulla parola che la nomina, le sezioni già dette restano bianche
 * frase: «Scrivi gli script con un metodo fisso. Io uso hook, spiega, mostra, insegna.» (15/10, 22,8–28,4 s)
 * durata: 3,5–6 s (consigliata 4,5–5,5)
 * scena: t0 (taglio), t1, X, Y (centro del documento), parole: { sezioni: [tempo per sezione], titolo ([…]) }
 * opzioni: titolo, sezioni ([{ label: "Hook", rows: 4 }, …]), doc (titolo del documento, "Script"), w (720), ingresso
 *   ("arrivo" default | "zoom" | "nessuno" = la camera la muove la composizione, es. tplZoomThrough), fermoDa, fermo (R7)
 * restituisce: rect, pose, ancore { centro, sezione(i) }, elementi { documento, L }, tempi { taglio, sezioni }
 * suoni: whoosh .14 al taglio · tick .05 per sezione
 * regole: R2 il documento con tutte le righe grigie e le etichette spente è già in scena al taglio (reel 26: il documento
 *   bianco c'è, poi la riga «Hook» si colora sulla parola) · R3 un accento per sezione detta: etichetta e quadratino, righe
 *   evidenziate in sequenza (0,3 s per riga, 0,07 s fra le righe); la sezione prima diventa bianca (fatta) · lime =
 *   quella detta, bianco = fatte, grigio = da fare (brand) · R5 niente rimbalzi · R7 sfondo fermo
 * prima: (demo-2 48 s) scriptDoc che si stendeva dopo il taglio (cascata) e cinque colori per le sezioni
 * chiamata:
 *   TPL.L12({ t0: 39.5, t1: 44.7, X: 28600, Y: 900, parole: { sezioni: [42.2, 42.8, 43.67, 44.4],
 *     titolo: [39.62, 40.17, 40.6, 40.87] } }, {
 *     titolo: [[{ t: "Un metodo " }, { t: "fisso", box: true }]],
 *     sezioni: [{ label: "Hook", rows: 3 }, { label: "Spiega", rows: 5 }, { label: "Mostra", rows: 5 }, { label: "Insegna", rows: 4 }] });
 */
TPL.L12 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const SZ = o.sezioni || [{ label: "Hook", rows: 3 }, { label: "Spiega", rows: 5 }, { label: "Mostra", rows: 5 }, { label: "Insegna", rows: 4 }];
  const w = o.w || 720;
  const hh = 120 + SZ.reduce((a, s) => a + Math.round(36 * 1.35) + s.rows * 32 + 18, 0) + 24; // altezza del documento
  const D = scriptDoc(L, X, Y, SZ.map((s) => ({ label: s.label, rows: s.rows, color: K.lime })), { fitto: false, w, h: hh, rh: 32, title: o.doc || "Script", fsTitolo: 56, fsLab: 36, top: 120, z: 12 });
  const rows = D.secs.flatMap((s) => s.rows.map((r) => r.base));
  // 1) prima del taglio: il documento con le righe grigie già stese (R2)
  gsap.set(D.c, { opacity: 0 });
  tplMonta(t0, (t) => { tl.to(D.c, { opacity: 1, duration: 0.2 }, t); tl.to(rows, { scaleX: 1, duration: 0.2 }, t); },
    () => { gsap.set(D.c, { opacity: 1 }); gsap.set(rows, { scaleX: 1 }); });
  // le etichette ci sono già, spente (grigie): si accendono quando la sezione è detta
  D.secs.forEach((s) => { gsap.set([s.mark, s.lab], { opacity: 0.35 }); gsap.set(s.mark, { background: "#8a8a8a", boxShadow: "none" }); gsap.set(s.lab, { color: "#8a8a8a" }); });
  // 2) gli accenti: ogni sezione si evidenzia sulla sua parola; quella prima diventa bianca (fatta)
  const TS = P.sezioni || SZ.map((_, i) => t0 + 0.8 + i * 0.8);
  D.secs.forEach((s, i) => {
    const t = TS[i];
    tl.to(s.mark, { opacity: 1, background: K.lime, boxShadow: `0 0 10px ${K.lime}`, duration: 0.2 }, t);
    tl.to(s.lab, { opacity: 1, color: K.lime, textShadow: GLOW_LT, duration: 0.2 }, t);
    s.rows.forEach((r, k) => tl.to(r.fillR, { scaleX: 1, duration: 0.3, ease: "power1.inOut" }, t + 0.05 + k * 0.07));
    if (i > 0) {
      const p = D.secs[i - 1];
      tl.to(p.rows.map((r) => r.fillR), { background: "#f2f2f2", boxShadow: "0 0 6px rgba(255,255,255,.35)", duration: 0.25 }, t);
      tl.to([p.mark], { background: "#f2f2f2", boxShadow: "none", duration: 0.25 }, t);
      tl.to([p.lab], { color: "#f2f2f2", textShadow: GLOW_T, duration: 0.25 }, t);
    }
  });
  // 3) la camera
  const h = hh;
  const rect = [X - w / 2 - 10, Y - h / 2 - 10, X + w / 2 + 10, Y + h / 2 + 10];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380, fill: o.fill || 0.98 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "arrivo", top: 380, fill: o.fill || 0.98 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { centro: [X, Y], sezione: (i) => [X, Y - h / 2 + parseFloat(D.secs[i].lab.style.top) + 20] },
    elementi: { documento: D, titolo: T, L },
    tempi: { taglio: t0, sezioni: TS },
  };
};

// ═══ KW kit v2 · TEMPLATE · luce, glow ed enfasi (F) — blocco 1 del rifacimento col ritmo (RIFACIMENTO-RITMO.md) ═══════════
// Stesso standard di kit2-template.js. Scene di prova in CATALOGO-ANIMAZIONI/ritmo-01 (KW_RITMO).

/* @scheda F08 · Cambio di colore = cambio di stato (chi guarda si spegne, o si accende)
 * quando: giusto/sbagliato, chi resta/chi se ne va, capisce/non capisce, prima/dopo: lo stesso gruppo cambia stato tutto
 *   insieme ("secco", 1 fotogramma) o a onda (0,5 s); qui attorno al profilo, con la pill dell'algoritmo sopra
 * frase: «In questo modo l'algoritmo non capisce di cosa parla il tuo profilo e nemmeno chi ti guarda.» (01/10, 7,8–12,3 s)
 * durata: 3–6 s (consigliata 4–5)
 * scena: t0 (taglio), t1, X, Y (centro del telefono), parole: { algoritmo (la pill cambia stato, secco: es. «non»),
 *   profilo (riquadro sulla griglia, es. «profilo»), persone (l'onda sulle persone, es. «nemmeno»), titolo ([…]) }
 * opzioni: titolo, profilo ({ handle, nome, bio: [righe], grid: [6 id video], user (foto, facoltativa) }), algoritmo (testo della
 *   pill, "<Algoritmo/>"; false = niente pill), persone (quante, 10: persone qualunque di profilo, mai volti veri), verso
 *   ("spento" default: da accese a spente | "acceso": da spente ad accese), modo ("onda" default | "secco"), k (scala del
 *   telefono, 0.66), ingresso ("arrivo" default | "zoom" | "nessuno"), fermo (R7, default true)
 * restituisce: rect, pose, ancore { telefono, pill, persona(i) }, elementi { tel, pill, persone, L }, tempi { taglio,
 *   algoritmo, profilo, persone }
 * suoni: whoosh .14 al taglio · glitch .1 su «algoritmo» (secco) · tick .05 su «profilo» · drop .12 sull'onda
 * regole: R2 telefono, pill e persone già in scena al taglio · R2 arrivo dal basso 140 px expo.out 0,7 s · R3 tre accenti
 *   sulle parole: la pill cambia stato di colpo (reel 88: in 1 fotogramma), il riquadro sulla griglia, le persone a onda
 *   (reel 13: ~0,5 s, dalla cima in giù) · R5 niente rimbalzi · R7 sfondo fermo
 * prima: (demo-7 6,9–9,1 s) cambio di stato a onda con filter + borderColor in 0,3 s su volti veri (faceDot), dopo la
 *   costruzione della scena
 * chiamata:
 *   TPL.F08({ t0: 8.75, t1: 13.75, X: 5000, Y: 900, parole: { algoritmo: 10.17, profilo: 11.5, persone: 12.37,
 *     titolo: [9.63, 10.17, 10.33, 11.87, 12.37, 12.73, 12.87, 12.97] } }, {
 *     titolo: [[{ t: "L'algoritmo " }, { t: "non capisce", box: true }], [{ t: "e nemmeno chi ti guarda", hand: true }]],
 *     profilo: { handle: "il.tuo.profilo", nome: "Il tuo profilo", bio: ["Fitness · viaggi · cucina · gatti"],
 *       grid: ["g1", "g2", "g3", "g4", "g5", "g6"] } });
 */
TPL.F08 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const k = o.k || 0.66, pw = PH.w * k, ph = PH.h * k;
  const px0 = X - pw / 2, py0 = Y - ph / 2;
  // il telefono col profilo (scalato in un contenitore): la griglia mescolata dice «di cosa parla il tuo profilo»
  const hold = layered(el(L, { position: "absolute", left: px0, top: py0, width: PH.w, height: PH.h, transformOrigin: "0 0", zIndex: 12 }));
  gsap.set(hold, { scale: k });
  const pr = o.profilo || {};
  const tel = igProfile(hold, 0, 0, Object.assign({ post: "41", follower: "212", seguiti: "380" }, pr));
  // la pill dell'algoritmo sopra il telefono, con due linee che scendono al profilo
  let pill = null, qm = null;
  const yP = py0 - 100;
  if (o.algoritmo !== false) {
    pill = algoPill(L, X, yP, { testo: o.algoritmo || "<Algoritmo/>", fs: 38, z: 20 });
    pill.tx.textContent = o.algoritmo || "<Algoritmo/>"; // senza decode() l'innerHTML "<Algoritmo/>" diventerebbe un tag vuoto
    const S = svgLayer(L, 6, X - 2000, Y - 2000, 4000, 4000);
    [-1, 1].forEach((s) => { const c = connector(S, [[X + s * 60, yP + pill.h / 2], [X + s * 90, py0 + 4]], { w: 2.5, color: "rgba(207,251,80,.55)" }); c.p.setAttribute("stroke-dashoffset", 0); });
    qm = handNote(L, X + pill.w / 2 + 16, yP - 62, "?", { size: 110, rot: 8, z: 22 });
  }
  // chi guarda: persone qualunque di profilo (sagoma sul disco), ai due lati del telefono (cima e fondo liberi: la pill sopra)
  const nP = o.persone || 10, d = o.d || 116, rx = pw / 2 + 250, ry = ph / 2 + 20;
  const ang = []; for (let i = 0; i < nP; i++) { const half = Math.ceil(nP / 2), j = i % half, side = i < half ? 1 : -1; const a = -45 + (j * 100) / Math.max(1, half - 1); ang.push(side > 0 ? a : 180 - a); }
  const acceso = o.verso !== "acceso"; // stato iniziale: acceso se si spengono
  const persone = ang.map((a, i) => {
    const r = (a * Math.PI) / 180, cx = X + rx * Math.cos(r), cy = Y + 30 + ry * Math.sin(r);
    const g = layered(el(L, { position: "absolute", left: cx - d / 2, top: cy - d / 2, width: d, height: d, borderRadius: "50%", zIndex: 14 }));
    personaK(g, 0, 0, d, { z: 1 });
    const ring = el(g, { position: "absolute", left: -6, top: -6, width: d + 12, height: d + 12, borderRadius: "50%", border: `4px solid ${acceso ? K.lime : "rgba(255,255,255,.25)"}`, boxShadow: acceso ? GLOW_A(0.6) : "none", zIndex: 2 });
    if (!acceso) gsap.set(g, { filter: "grayscale(1) brightness(.5)" });
    return { g, ring, cx, cy };
  });
  // 1) prima del taglio: tutto c'è già (R2); la pill è accesa senza la decodifica (non si ripete T05)
  if (pill) tplMonta(t0, (t) => tl.set(pill.g, { opacity: 1 }, t), () => gsap.set(pill.g, { opacity: 1 }));
  // 2) accento 1: la pill cambia stato di colpo (secco, 1 fotogramma) e compare il punto di domanda
  const ta = P.algoritmo == null ? t0 + 0.9 : P.algoritmo;
  if (pill) {
    tl.set(pill.box, { borderColor: "#7d7d7d", boxShadow: "0 18px 40px rgba(0,0,0,.6)", background: "linear-gradient(180deg, rgba(48,48,48,.96), rgba(26,26,26,.98))" }, ta);
    tl.set(pill.tx, { color: "#9a9a9a", textShadow: "none" }, ta);
    qm.write(ta + 0.05, 0.12);
  }
  // 3) accento 2: il riquadro lime sulla griglia (di cosa parla il profilo: di tutto)
  const tp = P.profilo == null ? ta + 1.0 : P.profilo;
  tel.hl(tp, "griglia", { bw: 6 });
  // 4) accento 3: le persone cambiano stato a onda dalla cima in giù (reel 13: ~0,5 s) oppure tutte insieme (secco)
  const tw = P.persone == null ? tp + 1.0 : P.persone;
  const ord = persone.map((p, i) => [p.cy, i]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
  const passo = o.modo === "secco" ? 0 : 0.5 / Math.max(1, nP - 1);
  ord.forEach((i, j) => {
    const p = persone[i], t = tw + j * passo, du = o.modo === "secco" ? 0.03 : 0.25;
    if (acceso) {
      // fromTo (regia 15/10): da "none" GSAP partirebbe da brightness(0) e ogni persona faceva un fotogramma nero
      tl.fromTo(p.g, { filter: "grayscale(0) brightness(1)" }, { filter: "grayscale(1) brightness(.45)", duration: du, ease: "power2.out", immediateRender: false }, t);
      tl.to(p.ring, { borderColor: "rgba(255,255,255,.22)", boxShadow: "0 0 0px rgba(207,251,80,0)", duration: du }, t);
    } else {
      tl.to(p.g, { filter: "grayscale(0) brightness(1)", duration: du, ease: "power2.out" }, t);
      tl.to(p.ring, { borderColor: K.lime, boxShadow: GLOW_A(0.6), duration: du }, t);
    }
  });
  // 5) la camera: arrivo che frena, poi tiene (R2, R3)
  const rect = [X - rx - d / 2 - 10, (pill ? yP - 72 : py0) - 10, X + rx + d / 2 + 10, Math.max(py0 + ph, Y + 30 + ry * Math.sin(0.96)) + d / 2 + 10];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "arrivo", top: 380 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { telefono: [X, Y], pill: [X, yP], persona: (i) => [persone[i].cx, persone[i].cy] },
    elementi: { tel, pill, persone, titolo: T, L },
    tempi: { taglio: t0, algoritmo: ta, profilo: tp, persone: tw },
  };
};

// ═══ blocco 2 del rifacimento (ritmo-02) ═══════════════════════════════════════════════════════════════════════════════════

/* @scheda F02 · Pulse a disco pieno (la parola chiave fa nascere l'etichetta)
 * quando: la parola chiave del concetto ("virale", "il livello normale", "non ovvio"): un disco lime pieno nasce dal centro
 *   dell'oggetto, si allarga e svanisce, e dal disco nasce l'etichetta che dà il nome alla cosa; con dubbio l'etichetta si
 *   spegne e compare il punto di domanda ("e se si sbagliassero?")
 * frase: «Se non diventi virale, non stai andando da nessuna parte. E se si sbagliassero?» (14/10, 1,4–6,1 s)
 * durata: 3–6 s (consigliata 4–5)
 * scena: t0 (taglio), t1, X, Y (centro dell'oggetto e del disco), parole: { parola (disco + etichetta, es. «virale»),
 *   dubbio (l'etichetta si spegne e compare «?», es. «sbagliassero?»), titolo ([tempo per parola]) }
 * opzioni: titolo, media ([6 id dei tuoi reel] → griglia 3 × 2 di reel veri in movimento) oppure oggetto (id di un'immagine
 *   del pool, "obj-…", con oggettoW), etichetta ({ testo, icona: "eye" }), dubbio (true: «?» a mano accanto all'etichetta),
 *   disco (diametro sullo schermo in frazione della larghezza, 0.56 come Kallaway), ingresso ("arrivo" default | "zoom" |
 *   "nessuno"), fermo (R7, default true)
 * restituisce: rect, pose, ancore { centro, etichetta, cella(i) }, elementi { celle, disco, etichetta, nota, L }, tempi {
 *   taglio, parola, dubbio }
 * suoni: whoosh .14 al taglio · pop .12 su «parola» · glitch .08 su «dubbio»
 * regole: R2 griglia (o oggetto) già piena al taglio, arrivo dal basso 140 px expo.out 0,7 s, poi la camera tiene · F02 come
 *   Kallaway (reel 14, 7, 79): il disco davanti all'oggetto, semitrasparente, arriva pieno (diametro ~0,55 della larghezza)
 *   in 0,15 s e svanisce allargandosi del 20% in 0,3 s; l'etichetta nasce nel disco (popK 0,8 → 1 in 0,15 s, niente
 *   rimbalzo) e resta · R3 al massimo due accenti (disco + etichetta, poi il dubbio) · R5 · R7 sfondo fermo
 * prima: (demo 2,6 s · demo-2 21,2 s · reel-09 4,1 s) pulse() dietro gli oggetti, 0,22 s + 0,5 s a scala 1,13; non faceva
 *   nascere niente e spesso arrivava dopo la costruzione della scena
 * chiamata:
 *   TPL.F02({ t0: 1.0, t1: 6.1, X: 600, Y: 900, parole: { parola: 1.98, dubbio: 5.25,
 *     titolo: [1.12, 1.42, 1.55, 1.98, 4.38, 4.98, 5.12, 5.25] } }, {
 *     titolo: [[{ t: "Se non diventi " }, { t: "virale", box: true }], [{ t: "e se si sbagliassero?", hand: true }]],
 *     media: ["m1", "m2", "m3", "m4", "m5", "m6"], etichetta: { testo: "1M views", icona: "eye" }, dubbio: true });
 */
TPL.F02 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  // l'oggetto: la griglia dei tuoi reel (3 × 2, card 9:16 vere in movimento) oppure un'immagine del pool
  const celle = [];
  let ow, oh;
  if (o.media && o.media.length) {
    const n = o.media.length, cols = n >= 6 ? 3 : n, rows = Math.ceil(n / cols);
    const cw = o.cw || 300, ch = Math.round((cw * 16) / 9), g = o.gap || 26;
    ow = cols * cw + (cols - 1) * g; oh = rows * ch + (rows - 1) * g;
    o.media.forEach((id, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      const x = X - ow / 2 + c * (cw + g), y = Y - oh / 2 + r * (ch + g);
      const card = layered(el(L, { position: "absolute", left: x, top: y, width: cw, height: ch, borderRadius: Math.round(cw * 0.07), overflow: "hidden", border: "2.5px solid rgba(255,255,255,.22)", boxShadow: "0 30px 70px rgba(0,0,0,.6)", background: "#111", zIndex: 12 }));
      mediaTile(card, 0, 0, cw, ch, id, 1);
      celle.push({ card, cx: x + cw / 2, cy: y + ch / 2 });
    });
  } else if (o.oggetto) {
    ow = o.oggettoW || 620; oh = o.oggettoH || ow;
    const g = layered(el(L, { position: "absolute", left: X - ow / 2, top: Y - oh / 2, width: ow, height: oh, zIndex: 12 }));
    imgIn(g, o.oggetto);
    celle.push({ card: g, cx: X, cy: Y });
  } else { ow = oh = 600; }
  // la posa (serve per il diametro del disco sullo schermo)
  const lab = o.etichetta || { testo: "1M views", icona: "eye" };
  // proporzioni di Kallaway (reel 14: l'anello largo 0,68 della larghezza, alto da sotto il titolo alla faccia): rettangolo
  // stretto sull'oggetto e fill 0,98 → la griglia 3 × 2 larga ~0,70
  const rect = [X - ow / 2 - 8, Y - oh / 2 - 8, X + ow / 2 + 8, Y + oh / 2 + 8];
  const FILL = o.fill || 0.98;
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380, fill: FILL });
  // 1) prima del taglio: tutto c'è già (R2)
  gsap.set(celle.map((c) => c.card), { opacity: 0 });
  tplMonta(t0, (t) => tl.to(celle.map((c) => c.card), { opacity: 1, duration: 0.2 }, t), () => gsap.set(celle.map((c) => c.card), { opacity: 1 }));
  // 2) accento 1: il disco pieno davanti al centro (Kallaway: pieno in 0,15 s, poi +20% e svanisce in 0,3 s) e l'etichetta
  //    che nasce dentro il disco
  const tp = P.parola == null ? t0 + 0.9 : P.parola;
  const R = ((o.disco || 0.56) * 1080) / 2 / pose.s;
  const disco = pulse(L, X, Y, tp, { r: R, z: 30, a: o.discoA == null ? 0.82 : o.discoA, cresce: 0.15, svanisce: 0.32, allarga: 1.2 });
  const fs = o.fs || 60;
  const box = layered(el(L, { position: "absolute", left: X, top: Y, width: 1, height: 1, zIndex: 34 }));
  const pill = layered(el(box, { position: "absolute", left: 0, top: 0, transform: "translate(-50%,-50%)", display: "flex", alignItems: "center", gap: Math.round(fs * 0.35), padding: `${Math.round(fs * 0.3)}px ${Math.round(fs * 0.62)}px`, borderRadius: Math.round(fs * 0.7), background: limeFill(1), color: K.ink, fontFamily: FS, fontWeight: 800, fontSize: fs, whiteSpace: "nowrap", boxShadow: `0 16px 40px rgba(0,0,0,.55), ${GLOW_A(0.7)}`, zIndex: 34 }, (lab.icona ? svg(lab.icona, Math.round(fs * 1.05), K.ink, 2.4) : "") + `<span>${lab.testo}</span>`));
  popK(box, tp + 0.12, { da: 0.8, dur: 0.15 });
  // 3) accento 2 (facoltativo): l'etichetta si spegne e compare il punto di domanda a mano
  let nota = null;
  const td = P.dubbio == null ? null : P.dubbio;
  if (o.dubbio && td != null) {
    tl.to(pill, { background: "linear-gradient(180deg, rgba(64,64,64,.98), rgba(34,34,34,.98))", color: "#a8a8a8", boxShadow: "0 16px 40px rgba(0,0,0,.55)", duration: 0.12, ease: "power2.out" }, td);
    const ic = pill.querySelector("svg");
    if (ic) tl.to(ic, { attr: { stroke: "#a8a8a8" }, duration: 0.12 }, td);
    // fromTo: da "none" GSAP partirebbe da brightness(0) (un fotogramma nero al primo passo)
    tl.fromTo(celle.map((c) => c.card), { filter: "grayscale(0) brightness(1)" }, { filter: "grayscale(.85) brightness(.55)", duration: 0.3, ease: "power2.out", immediateRender: false }, td);
    nota = handNote(L, X + (o.notaDx || 250), Y - 150, "?", { size: 190, rot: 10, z: 36 });
    nota.write(td + 0.05, 0.12);
  }
  // 4) la camera: arrivo che frena, poi tiene (R2, R3)
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "arrivo", top: 380, fill: FILL });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { centro: [X, Y], etichetta: [X, Y], cella: (i) => [celle[i].cx, celle[i].cy] },
    elementi: { celle, disco, etichetta: box, nota, titolo: T, L },
    tempi: { taglio: t0, parola: tp, dubbio: td },
  };
};

/* @scheda F04 · Riflettore + oscuramento del resto (sopra la soglia / sotto la soglia)
 * quando: selezione, "questi sono i migliori", uno fra tanti, "ogni video sotto quella soglia sembra un fallimento": i reel
 *   veri in riga, sopra ognuno la sua barra (alta quanto vale), una soglia orizzontale che taglia le barre; su una parola gli
 *   scelti si accendono e tutto il resto scende al 40% e perde il colore
 * frase: «Ma da quel momento ogni video sotto quella soglia sembra un fallimento.» (14/10, 18,4–21,7 s)
 * durata: 3–5 s (consigliata 3,5–4,5)
 * scena: t0 (taglio), t1, X, Y (centro), parole: { soglia (la linea della soglia si accende con l'etichetta: es. «soglia»),
 *   riflettore (gli scelti si accendono e il resto si spegne: es. «fallimento»), titolo ([…]) }
 * opzioni: titolo, colonne ([{ media (id video o "th-…"), v (altezza della barra 0–1), scelto (true = sopra la soglia,
 *   resta acceso) }]), soglia ({ v (0–1), testo: "1M views" }; false = senza soglia, solo il riflettore), barre (true),
 *   cw (larghezza delle card, 180), ingresso ("arrivo" default | "zoom" | "nessuno" = la camera la muove la composizione,
 *   es. tplZoomThrough), fermoDa (R7), fermo
 * restituisce: rect, pose, ancore { scelto (centro della card scelta), soglia (y della linea), colonna(i) }, elementi {
 *   colonne, linea, etichetta, L }, tempi { taglio, soglia, riflettore }
 * suoni: whoosh .14 al taglio · tick .06 su «soglia» · drop .1 su «riflettore»
 * regole: R2 colonne, barre e linea (spenta) già in scena al taglio · R3 due accenti: la soglia si accende (0,25 s), poi il
 *   riflettore come Kallaway (reel 61: la selezione si accende e il resto scende dal 100 al 72% di luminosità in ~0,37 s):
 *   gli scelti bordo lime + alone senza crescere, il resto al 40% grigio in 0,4 s power2.out · R5 niente scala né rimbalzo
 *   (spotlight() del kit con s: 1) · R7 sfondo fermo
 * prima: (demo-8 19,55 s · demo 30,5 s) spotlight() con lo scelto che cresce a 1,05 e il resto a 0,32, dopo la costruzione
 * chiamata:
 *   TPL.F04({ t0: 13.6, t1: 17.3, X: 10000, Y: 900, parole: { soglia: 15.65, riflettore: 16.32,
 *     titolo: [15.18, 15.42, 15.65, 15.95, 16.28, 16.32] } }, {
 *     titolo: [[{ t: "Sotto la " }, { t: "soglia", box: true }], [{ t: "sembra un fallimento", hand: true }]],
 *     colonne: [{ media: "m7", v: 0.3 }, { media: "m8", v: 0.42 }, { media: "h4", v: 1, scelto: true }, { media: "m9", v: 0.22 },
 *       { media: "m10", v: 0.36 }], soglia: { v: 0.8, testo: "1M views" } });
 */
TPL.F04 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const C = o.colonne || [];
  const n = C.length, cw = o.cw || 180, ch = Math.round((cw * 16) / 9), g = o.gap || 34, HB = o.hb || 600;
  const rowW = n * cw + (n - 1) * g;
  // i reel in riga in basso; sopra ognuno la sua barra (alta quanto vale): la soglia taglia solo le barre
  const yC = Y + (HB + ch) / 2 - ch + 20;  // bordo alto delle card
  const base = yC - 14;                    // piede delle barre
  const so = o.soglia === false ? null : Object.assign({ v: 0.8, testo: "1M views" }, o.soglia || {});
  const ySo = so ? base - so.v * HB : null;
  const col = C.map((c, i) => {
    const x = X - rowW / 2 + i * (cw + g), bh = Math.max(30, c.v * HB);
    const bar = o.barre === false ? null : layered(el(L, { position: "absolute", left: x + cw * 0.14, top: base - bh, width: cw * 0.72, height: bh, borderRadius: "12px 12px 4px 4px", background: c.scelto ? "linear-gradient(180deg, #e4ff8f 0%, #CFFB50 40%, #a9d23a 100%)" : "linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.07))", border: `2px solid ${c.scelto ? "#e9ffa8" : "rgba(255,255,255,.3)"}`, boxShadow: "0 18px 40px rgba(0,0,0,.45)", zIndex: 11 }));
    const card = layered(el(L, { position: "absolute", left: x, top: yC, width: cw, height: ch, borderRadius: Math.round(cw * 0.08), overflow: "hidden", border: "2.5px solid rgba(255,255,255,.24)", boxShadow: "0 24px 56px rgba(0,0,0,.6)", background: "#111", zIndex: 13 }));
    mediaTile(card, 0, 0, cw, ch, c.media, 1);
    return { card, bar, cx: x + cw / 2, cy: yC + ch / 2, scelto: !!c.scelto };
  });
  // la soglia: linea tratteggiata spenta da bordo a bordo + etichetta sopra la linea, a sinistra (sopra le barre basse)
  const S = svgLayer(L, 12, X - 1500, Y - 1500, 3000, 3000);
  let linea = null, etich = null;
  if (so) {
    linea = connector(S, [[X - rowW / 2 - 30, ySo], [X + rowW / 2 + 30, ySo]], { w: 4, color: "rgba(255,255,255,.3)" });
    linea.p.setAttribute("stroke-dashoffset", 0);
    linea.p.setAttribute("stroke-dasharray", "18 12");
    etich = layered(el(L, { position: "absolute", left: X - rowW / 2 - 20, top: ySo - 76, width: 290, height: 60, borderRadius: 30, display: "flex", alignItems: "center", justifyContent: "center", gap: 10, background: "rgba(40,40,40,.92)", border: "2px solid rgba(255,255,255,.25)", fontFamily: FS, fontWeight: 800, fontSize: 32, color: "#bdbdbd", whiteSpace: "nowrap", zIndex: 30 }, svg("eye", 32, "#bdbdbd", 2.4) + so.testo));
  }
  // accento 1: la soglia si accende (linea lime con alone, etichetta lime)
  const ts = P.soglia == null ? t0 + 0.8 : P.soglia;
  if (so) {
    tl.to(linea.p, { attr: { stroke: K.lime }, duration: 0.25, ease: "power2.out" }, ts);
    tl.set(S, { filter: `drop-shadow(0 0 7px ${rgba(K.lime, 0.6)})` }, ts);
    tl.to(etich, { background: limeFill(1), borderColor: K.lime, color: K.ink, boxShadow: GLOW_A(0.6), duration: 0.25, ease: "power2.out" }, ts);
    const ic = etich.querySelector("svg");
    if (ic) tl.to(ic, { attr: { stroke: K.ink }, duration: 0.25 }, ts);
  }
  // accento 2: il riflettore (reel 61: ~0,37 s): gli scelti si accendono senza crescere, il resto al 40% e grigio
  const tr = P.riflettore == null ? ts + 0.8 : P.riflettore;
  const scelti = col.filter((c) => c.scelto), altri = col.filter((c) => !c.scelto);
  spotlight(scelti.map((c) => c.card), [], tr, { s: 1 });
  const spenti = altri.flatMap((c) => [c.card, c.bar].filter(Boolean));
  tl.to(spenti, { opacity: 0.4, duration: 0.4, ease: "power2.out" }, tr);
  // fromTo: da "none" GSAP partirebbe da brightness(0) (un fotogramma nero al primo passo)
  tl.fromTo(spenti, { filter: "grayscale(0) brightness(1)" }, { filter: "grayscale(1) brightness(.7)", duration: 0.4, ease: "power2.out", immediateRender: false }, tr);
  scelti.forEach((c) => c.bar && tl.to(c.bar, { boxShadow: `${GLOW_A(0.8)}, 0 18px 40px rgba(0,0,0,.45)`, duration: 0.4 }, tr));
  // la camera (proporzioni: grafico largo ~0,9 dello schermo, dalla soglia alle card)
  const yTop = Math.min(...C.map((c) => base - Math.max(30, c.v * HB)), so ? ySo - 80 : 1e9);
  const rect = [X - rowW / 2 - 34, yTop - 12, X + rowW / 2 + 34, yC + ch + 12];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380, fill: o.fill || 0.98 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "arrivo", top: 380, fill: o.fill || 0.98 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  const sc = scelti[0] || col[0];
  return {
    rect, pose,
    ancore: { scelto: [sc.cx, sc.cy], soglia: ySo, colonna: (i) => [col[i].cx, col[i].cy] },
    elementi: { colonne: col, linea, etichetta: etich, titolo: T, L },
    tempi: { taglio: t0, soglia: ts, riflettore: tr },
  };
};

// ──── kit2-tpl-oggetti.js ────
// ═══ KW kit v2 · TEMPLATE · oggetti-metafora (O) — blocco 1 del rifacimento col ritmo (RIFACIMENTO-RITMO.md) ═══════════
// Stesso standard di kit2-template.js (scheda @scheda, TPL.<ID>(scena, opzioni) → { rect, pose, ancore, elementi, tempi }).
// Le scene di prova sono in CATALOGO-ANIMAZIONI/ritmo-01 (KW_RITMO).

/* @scheda O01 · Anello di reel che ruota (la risposta al centro)
 * quando: un insieme di contenuti ("pubblicare di tutto", "i formati", "i creator", "i contenuti che…"); hook su un errore o
 *   una categoria di video, con la risposta al centro dell'insieme
 * frase: «L'errore numero uno che fanno i principianti? Pubblicare di tutto.» (01/10, 0–4,3 s)
 * durata: 3–6 s (consigliata 4–5)
 * scena: t0 (taglio: l'anello si apre), t1, X, Y (centro dell'anello), parole: { accento (disco lime dietro la risposta, es.
 *   «uno»), risposta (la risposta al centro va a fuoco, es. «Pubblicare»), sottolinea (es. «tutto.»), titolo ([tempo per
 *   parola]) }
 * opzioni: titolo, media (6–8 id video del pool: reel veri, uno per card), risposta ([riga 1, riga 2 a mano] al centro,
 *   facoltativa), r (raggio, 380), w (card 9:16, 170), giri (°/s, 24), apertura (s, 0.85), ingresso ("fermo" default: la
 *   camera tiene | "zoom" | "nessuno" = la camera la muove la composizione), fermo (R7, default true)
 * restituisce: rect, pose, ancore { centro, bordo(a) (punto dell'anello all'angolo a, rad), card(i) }, elementi { anello,
 *   risposta, sotto, L }, tempi { taglio, aperto, accento, risposta }
 * suoni: whoosh .14 al taglio · pop .12 su «accento» · card .1 su «risposta»
 * regole: R2 le card ci sono già al taglio, vicine al centro (30% del raggio); il movimento principale è l'apertura dal primo
 *   fotogramma: 0,85 s power1.out, misurata sui reel 13 e 14 (raggio ×2–3, metà a 0,2 s, 90% a 0,67 s, power1.out) · R3 la
 *   camera tiene (deriva 1,2% che si spegne); l'anello gira lento e continuo (24°/s, card sempre dritte) · accenti: disco
 *   lime (F02) e la risposta che va a fuoco · R5 niente rimbalzi · R7 sfondo fermo nella tenuta
 * prima: (demo 1,35–5 s, reel-01 v5) l'anello si apriva da una pila sfocata col rack focus, float +5% su tutta la scena,
 *   punto lime che sbocciava con back.out(3), la pill della risposta entrava con back.out(1,6) + sheen, il punto di domanda a
 *   mano e poi i reel scagliati via (fling): tre movimenti grandi in 4 s
 * chiamata:
 *   TPL.O01({ t0: 1.0, t1: 5.65, X: 600, Y: 900, parole: { accento: 1.83, risposta: 4.1, sottolinea: 4.87,
 *     titolo: [1.1, 1.27, 1.63, 1.83, 2.5, 2.6] } }, {
 *     titolo: [[{ t: "L'errore " }, { t: "numero uno", box: true }], [{ t: "dei principianti", hand: true }]],
 *     media: ["c1", "c2", "c3", "c4", "c5", "c6", "c7"], risposta: ["Pubblicare", "di tutto"] });
 */
TPL.O01 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const R = o.r || 380, w = o.w || 170, h = Math.round((w * 16) / 9);
  const ring = reelRing(L, X, Y, o.media || [], { r: R, w, r0: Math.round(R * 0.3), a0: o.a0 == null ? -2.2 : o.a0, z: 12 });
  // la risposta al centro: card scura col bordo lime, due righe (la seconda nella «seconda voce», a mano, sottolineata);
  // c'è già al taglio ma sfocata (L01: non ancora detta)
  let card = null, und = null;
  if (o.risposta) {
    const [r1, r2] = o.risposta, cw = o.rw || 400, ch = r2 ? 180 : 116;
    card = layered(el(L, { position: "absolute", left: X - cw / 2, top: Y - ch / 2, width: cw, height: ch, borderRadius: 30, background: "linear-gradient(180deg, rgba(56,56,56,.97), rgba(26,26,26,.98))", border: "2px solid rgba(207,251,80,.55)", boxShadow: "0 24px 60px rgba(0,0,0,.6), inset 0 1.5px 0 rgba(255,255,255,.12)", zIndex: 16, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2 }));
    el(card, { fontFamily: FD, fontWeight: 700, fontSize: 54, lineHeight: 1.05, color: K.white, textShadow: GLOW_T, whiteSpace: "nowrap" }, r1);
    if (r2) {
      const s2 = el(card, { position: "relative", fontFamily: FH, fontSize: 62, lineHeight: 1, color: K.lime, textShadow: GLOW_LT, whiteSpace: "nowrap" }, r2);
      und = el(s2, { position: "absolute", left: "-4%", bottom: -6, width: "108%", height: 5, borderRadius: 3, background: K.lime, boxShadow: GLOW_A(0.6), transformOrigin: "0 50%" });
      gsap.set(und, { scaleX: 0 });
    }
    gsap.set(card, { filter: "blur(9px)", opacity: 0.4 });
  }
  // 1) prima del taglio: le card ci sono già, raggruppate al centro (reel 14 al fotogramma 0)
  tplMonta(t0, (t) => tl.to(ring.cards.map((c) => c.wrap), { opacity: 1, duration: 0.2 }, t), () => gsap.set(ring.cards.map((c) => c.wrap), { opacity: 1 }));
  // 2) il movimento principale: l'anello si apre al taglio, poi gira lento fino alla fine
  const tAp = t0 + 0.02, dAp = o.apertura || 0.85;
  ring.open(tAp, dAp, "power1.out");
  ring.spin(tAp, Math.max(0.5, t1 - tAp + 0.3), o.giri || 24);
  // 3) accenti: disco lime dietro la risposta (F02), la risposta va a fuoco, la sottolineatura a mano
  const ta = P.accento == null ? t0 + 0.6 : P.accento;
  pulse(L, X, Y, ta, { r: R - 70, z: 11 });
  const tr = P.risposta == null ? ta + 0.5 : P.risposta;
  if (card) {
    tl.to(card, { filter: "blur(0px)", opacity: 1, duration: 0.3, ease: "power2.out" }, tr);
    tl.to(card, { borderColor: "rgba(207,251,80,.95)", boxShadow: `${GLOW_A(0.55)}, 0 24px 60px rgba(0,0,0,.6)`, duration: 0.3 }, tr);
    tl.set(card, { filter: "none" }, tr + 0.31);
    if (und) tl.to(und, { scaleX: 1, duration: 0.3, ease: "power2.out" }, P.sottolinea == null ? tr + 0.4 : P.sottolinea);
  }
  // 4) la camera: tiene ferma l'inquadratura dell'anello (il movimento è l'apertura) oppure "zoom"/"nessuno"
  // inquadratura stretta come Kallaway (anello largo ~80% del fotogramma): le card in cima e in fondo toccano la banda utile
  const rect = [X - R - w / 2, Y - R - h / 2, X + R + w / 2, Y + R + h / 2];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 370, fill: 1 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "fermo", top: 370, fill: 1, ds: 0.1 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { centro: [X, Y], bordo: (a) => [X + Math.cos(a) * R, Y + Math.sin(a) * R], card: (i) => ring.cards[i].wrap },
    elementi: { anello: ring, risposta: card, sotto: und, titolo: T, L },
    tempi: { taglio: t0, aperto: tAp + dAp, accento: ta, risposta: tr },
  };
};

/* @scheda O21 · Anelli orbitali di persone (chi vede il tuo reel: i follower dentro, le persone nuove fuori)
 * quando: pubblico, chi ti segue e chi no, a chi viene mostrato un contenuto, chi resta / chi se ne va ("il reel di prova
 *   verrà mostrato solo a persone nuove", "prima ai follower che interagiscono"); al centro il tuo reel vero
 * frase: «…ma il reel di prova verrà mostrato solo a persone nuove che non ti seguono ancora.» (03/10, 26,4–30,9 s)
 * durata: 3–6 s (consigliata 4–5)
 * scena: t0 (taglio), t1, X, Y (centro), parole: { spegni (l'anello interno si spegne: es. «solo»), accendi (gli anelli
 *   esterni si accendono di lime a onda: es. «persone»), titolo ([…]) }
 * opzioni: media (il tuo reel al centro: video o copertina), tag (true: etichetta PROVA sotto il centro), anelli ([[raggio,
 *   quanti], …], il primo = i tuoi follower), legenda ([[colore, testo], …]), giri (°/s della rotazione lenta, 9), titolo,
 *   ingresso ("zoom" default | "arrivo" | "nessuno"), fermo (R7, default true)
 * restituisce: rect, pose, ancore { centro, bordo }, elementi { anelli, L }, tempi { taglio, spegni, accendi }
 * suoni: whoosh .14 al taglio · drop .1 su «spegni» · rise .06 su «accendi»
 * regole: R2 anelli, persone e il tuo reel già in scena al taglio (reel 44: gli anelli pieni appena arriva la grafica) ·
 *   R2 zoom d'arrivo +15% in 0,4 s power2.out, poi camera ferma; gli anelli girano piano (elementi, non camera) · R3 due
 *   accenti sulle parole: i follower si spengono, le persone nuove si accendono a onda (reel 5: il colore cambia in ~0,3 s;
 *   qui 0,5 s) · R5 niente back.out
 * prima: (reel-01 v5 10,75–12,75 s; reel-03 22,8–31 s) gli anelli si aprivano dopo il taglio (0,5 s expo) e i puntini
 *   poppavano con back.out(2,5), whip d'ingresso e due spostamenti di camera fra due anelli
 * chiamata:
 *   TPL.O21({ t0: 50.15, t1: 55.0, X: 17000, Y: 4400, parole: { spegni: 52.36, accendi: 52.9,
 *     titolo: [51.0, 51.16, 51.3, 52.9, 53.26] } }, {
 *     titolo: [[{ t: "Il reel " }, { t: "di prova", box: true }], [{ t: "solo a persone nuove", hand: true }]],
 *     media: "r04v", tag: true, legenda: [["#ececec", "I tuoi follower"], ["#CFFB50", "Persone nuove"]] });
 */
TPL.O21 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const AN = o.anelli || [[250, 16], [345, 24], [440, 32]];
  const R = AN[AN.length - 1][0];
  const pr = peopleRings(L, X, Y, AN, { media: o.media, d: Math.round(R * 0.44), dot: o.dot || 24, legenda: o.legenda, z: 10 });
  let tag = null;
  if (o.tag) { tag = tplTagReel(L, X, Y + Math.round(R * 0.22) + 44, o.prova !== false, 20); gsap.set(tag, { opacity: 0 }); }
  // 1) prima del taglio: anelli, persone, il reel al centro e la legenda già costruiti (R2)
  tplMonta(t0, (t) => { pr.show(t, { dur: 0.3 }); if (tag) tl.to(tag, { opacity: 1, duration: 0.2 }, t + 0.3); },
    () => { gsap.set(pr.av, { opacity: 1, scale: 1 }); pr.holders.forEach((h) => { gsap.set(h.ring, { opacity: 1 }); gsap.set(h.dots.map((x) => x.d), { opacity: 1, scale: 1 }); }); if (tag) gsap.set(tag, { opacity: 1 }); });
  // gli anelli girano piano per tutta la scena (elementi: la camera resta ferma)
  const dps = o.giri || 9;
  pr.spin(Math.max(0, t0 - 1), t1 - t0 + 1.3, dps * (t1 - t0 + 1.3));
  // 2) accento: l'anello interno (i tuoi follower) si spegne
  const ts = P.spegni == null ? t0 + 1.2 : P.spegni;
  const dentro = pr.holders[0];
  tl.to(dentro.dots.map((x) => x.d), { background: "#4a4a4a", boxShadow: "0 0 0px rgba(255,255,255,0)", duration: 0.25 }, ts);
  tl.to(dentro.ring, { borderColor: "rgba(255,255,255,.06)", duration: 0.25 }, ts);
  // 3) accento: le persone nuove (anelli esterni) si accendono di lime a onda, per angolo
  const ta = P.accendi == null ? ts + 0.6 : P.accendi;
  const fuori = pr.holders.slice(1).flatMap((h) => h.dots).sort((p, q) => ((p.a % 6.283) + 6.283) % 6.283 - (((q.a % 6.283) + 6.283) % 6.283));
  fuori.forEach((x, i) => tl.to(x.d, { background: K.lime, boxShadow: GLOW_A(0.8), duration: 0.12 }, ta + (i / fuori.length) * 0.5));
  pr.holders.slice(1).forEach((h) => tl.to(h.ring, { borderColor: "rgba(207,251,80,.35)", duration: 0.4 }, ta));
  // 4) la camera: zoom d'arrivo che frena, poi ferma
  const rect = pr.rect;
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "zoom", top: 380, ds: 0.15, dur: 0.4 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { centro: [X, Y], bordo: (a) => [X + Math.cos(a) * R, Y + Math.sin(a) * R] },
    elementi: { anelli: pr, tag, titolo: T, L },
    tempi: { taglio: t0, spegni: ts, accendi: ta },
  };
};

// ═══ blocco 2 del rifacimento (ritmo-02) ═══════════════════════════════════════════════════════════════════════════════════

/* @scheda O13 · Cervello luminoso (si accende col battito di Kallaway e scrive cosa ha capito)
 * quando: psicologia, cervello, abitudine, dopamina, vergogna, "il cervello si convince che…", "ti resta in testa": in alto
 *   quello che il cervello vede (i reel veri), sotto il cervello che si accende e nell'etichetta la conclusione che ne tira
 * frase: «E il cervello si convince che quello sia il livello normale.» (14/10, 11,0–14,0 s)
 * durata: 3–5 s (consigliata 3,5–4,5)
 * scena: t0 (taglio), t1, X, Y (centro della scena), parole: { accende (il cervello si accende: es. «convince»),
 *   etichetta (si scrive la conclusione: es. «livello»), titolo ([…]) }
 * opzioni: titolo, media ([1–3 id video]: quello che il cervello vede, reel veri in movimento), ratio (altezza/larghezza delle
 *   card, 4/3 per le clip 3:4, 16/9 per i reel), badge (testo sulle card, es. "1M views"; false = niente), etichetta (testo
 *   scritto a macchina sotto il cervello), size (larghezza del cervello nel mondo, 600), ingresso ("zoom" default | "arrivo"
 *   | "nessuno"), fermo (R7)
 * restituisce: rect, pose, ancore { cervello, etichetta, card(i) }, elementi { cervello, card, linee, etichetta, L }, tempi {
 *   taglio, accende, etichetta }
 * suoni: whoosh .14 al taglio · sub .1 + glitch .06 su «accende» · key1 .05 su «etichetta»
 * regole: R2 card, linee e cervello già in scena al taglio; zoom d'arrivo +15% in 0,4 s power2.out, poi la
 *   camera tiene · il battito misurato su Kallaway (kit brain()): il disco grafite con l'anello lime nasce ~0,15 s prima
 *   (reel 48/79), poi acceso/spento a ogni fotogramma per ~0,17 s e fisso con l'alone (reel 48); le linee dalle card al cervello
 *   si accendono di lime insieme (il segnale arriva) · il riquadro dell'etichetta entra con la scritta (popK 0,8 → 1 in 0,15 s)
 *   e la scritta si batte a macchina come «Two Hits Of Dopamine» (reel 34, ~0,6 s): mai un riquadro vuoto · R3 due accenti · R5 niente rimbalzi · R7 sfondo fermo
 * prima: (demo-2 20–23,5 s · demo-oggetti 0–4 s · reel-09 0–7 s) il cervello entrava sfocato col rack focus e float, oppure
 *   si accendeva con .on() in 0,3 s senza il battito; nessun legame con quello che vede
 * chiamata:
 *   TPL.O13({ t0: 6.1, t1: 9.75, X: 3600, Y: 900, parole: { accende: 6.98, etichetta: 8.38,
 *     titolo: [6.42, 6.48, 6.88, 6.98] } }, {
 *     titolo: [[{ t: "Il cervello " }, { t: "si convince", box: true }]],
 *     media: ["h1", "h2", "h3"], ratio: 4 / 3, badge: "1M views", etichetta: "= il livello normale" });
 */
TPL.O13 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const media = o.media || [];
  const n = media.length, cw = o.cw || (n >= 3 ? 300 : 340), ch = Math.round(cw * (o.ratio || 16 / 9)), gap = o.gap || 30;
  const LG = 70; // spazio delle linee fra le card e il cervello
  const size = o.size || 600, bh = size / 1.18; // il cervello vero è 1800 × 1523
  const eh = 104, ew = o.etichettaW || Math.max(560, size * 1.02);
  // colonna: card in alto, le linee, il cervello, l'etichetta (proporzioni: la riga di card larga ~0,7 dello schermo come
  // la griglia di F02; il cervello ~0,43, Kallaway reel 34 0,40)
  const H = (n ? ch + LG : 0) + bh + 40 + eh;
  const yTop = Y - H / 2, yB = yTop + (n ? ch + LG : 0) + bh / 2, yE = yB + bh / 2 + 40;
  const rowW = n * cw + (n - 1) * gap;
  // 1) le card (reel veri in movimento) col badge
  const card = media.map((id, i) => {
    const x = X - rowW / 2 + i * (cw + gap);
    const c = layered(el(L, { position: "absolute", left: x, top: yTop, width: cw, height: ch, borderRadius: Math.round(cw * 0.07), overflow: "hidden", border: "2.5px solid rgba(255,255,255,.22)", boxShadow: "0 26px 60px rgba(0,0,0,.6)", background: "#111", zIndex: 12 }));
    mediaTile(c, 0, 0, cw, ch, id, 1);
    let b = null;
    if (o.badge !== false) { b = viewBadge(L, x + cw / 2, yTop + ch - 2, o.badge || "1M views", { fs: 26, z: 14 }); gsap.set(b, { scale: 1 }); }
    return { c, b, cx: x + cw / 2 };
  });
  // 2) le linee dalle card al cervello (convergono in cima al cervello): grigie, si accendono col cervello
  const S = svgLayer(L, 11, X - 1500, Y - 1500, 3000, 3000);
  const linee = card.map((k) => {
    const c = connector(S, [[k.cx, yTop + ch + 16], [X + (k.cx - X) * 0.18, yB - bh * 0.38]], { w: 3, color: "rgba(255,255,255,.32)", curve: "v" });
    c.p.setAttribute("stroke-dashoffset", 0);
    return c;
  });
  // 3) il cervello (oggetto vero) e il riquadro dell'etichetta, vuoto, col cursore
  const BR = brain(L, X, yB, size, { z: 13 });
  const box = layered(el(L, { position: "absolute", left: X - ew / 2, top: yE, width: ew, height: eh, borderRadius: 22, background: "linear-gradient(180deg, rgba(44,44,44,.94), rgba(22,22,22,.96))", border: "2px solid rgba(255,255,255,.28)", boxShadow: "0 20px 50px rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 14 }));
  const tx = el(box, { fontFamily: FD, fontWeight: 700, fontSize: 52, color: K.white, textShadow: GLOW_T, whiteSpace: "nowrap" });
  // il riquadro dell'etichetta NON è in scena al taglio (regia 15/10: niente riquadro vuoto): entra con la scritta
  const tutto = [...card.map((k) => k.c), ...card.map((k) => k.b).filter(Boolean), BR.g, S];
  gsap.set(tutto, { opacity: 0 });
  gsap.set(box, { opacity: 0 });
  tplMonta(t0, (t) => tl.to(tutto, { opacity: 1, duration: 0.2 }, t), () => gsap.set(tutto, { opacity: 1 }));
  // 4) accento 1: il cervello si accende col battito di Kallaway (disco ~0,15 s prima, poi il lampeggio a ogni fotogramma);
  //    le linee diventano lime (il segnale arriva dalle card)
  const ta = P.accende == null ? t0 + 0.9 : P.accende;
  BR.disco(ta - 0.15, { z: 12, r: size * 0.52 });
  BR.accendi(ta);
  linee.forEach((c) => { tl.to(c.p, { attr: { stroke: K.lime }, duration: 0.15 }, ta); });
  tl.set(S, { filter: `drop-shadow(0 0 7px ${rgba(K.lime, 0.6)})` }, ta);
  // 5) accento 2: il riquadro entra con la scritta (popK 0,8 → 1 in 0,15 s, R5) e la conclusione si scrive a macchina
  //    (reel 34: riquadro e «Two Hits Of Dopamine» compaiono insieme, ~0,6 s); il bordo è già lime
  const te = P.etichetta == null ? ta + 1.2 : P.etichetta;
  if (o.etichetta) {
    gsap.set(box, { borderColor: K.lime, boxShadow: `0 20px 50px rgba(0,0,0,.6), ${GLOW_A(0.5)}` });
    popK(box, te, { da: 0.8, dur: 0.15 });
    typeIn(tx, o.etichetta, te + 0.04, o.cps || 32, { caret: true, size: 52, blinks: 1 });
  }
  // 6) la camera: zoom d'arrivo che frena, poi tiene
  const rect = [X - Math.max(rowW, ew, size) / 2 - 10, yTop - 10, X + Math.max(rowW, ew, size) / 2 + 10, yE + eh + 10];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380, fill: o.fill || 0.98 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "zoom", top: 380, fill: o.fill || 0.98, ds: 0.15, dur: 0.4 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { cervello: [X, yB], etichetta: [X, yE + eh / 2], card: (i) => [card[i].cx, yTop + ch / 2] },
    elementi: { cervello: BR, card, linee, etichetta: box, titolo: T, L },
    tempi: { taglio: t0, accende: ta, etichetta: te },
  };
};

/* @scheda O10 · Bersaglio costruito dal centro (il pubblico giusto al centro, la freccetta del messaggio giusto)
 * quando: dal pubblico più specifico al più ampio, posizionamento, nicchia, "non è un milione di visualizzazioni, è arrivare
 *   alle persone giuste col messaggio giusto": al centro le persone giuste, fuori il pubblico largo che si spegne, la
 *   freccetta (il messaggio) si pianta al centro
 * frase: «L'obiettivo non è un milione di visualizzazioni. È arrivare alle persone giuste col messaggio giusto.» (14/10,
 *   37,2–42,0 s)
 * durata: 3,5–6 s (consigliata 4,5–5)
 * scena: t0 (taglio: il bersaglio si costruisce dal centro), t1, X, Y (centro del bersaglio), parole: { fuori (l'etichetta
 *   esterna va a fuoco: es. «milione»), spegni (il pubblico largo si spegne e l'etichetta si barra: es. «visualizzazioni»),
 *   centro (il centro si accende con le persone giuste: es. «persone»), freccia (la freccetta si pianta: es. «messaggio»),
 *   titolo ([…]) }
 * opzioni: titolo, raggi ([centro, …, esterno], default [150, 250, 340, 430]), etichette ({ fuori: "1M di views",
 *   centro: "Le persone giuste" }), fs (46), passo (0.17), durAnello (0.42), persone (silhouette nel centro, 3: «chi ti guarda», mai volti veri), freccia (true),
 *   ingresso ("fermo" default: la camera tiene, il movimento è la costruzione | "zoom" | "nessuno"), fermo (R7)
 * restituisce: rect, pose, ancore { centro, bordo }, elementi { bersaglio, persone, etichette, L }, tempi { taglio, costruito,
 *   fuori, spegni, centro, freccia }
 * suoni: whoosh .14 al taglio · tick .05 su «fuori» · drop .08 su «spegni» · pop .1 su «centro» · slam .12 su «freccia»
 * regole: R2 il centro (con le persone) c'è al taglio; il movimento principale è la costruzione dal centro, dal primo
 *   fotogramma: un anello ogni 0,17 s, 0,42 s power1.out, ~0,76 s in tutto (reel 42: dal punto al bersaglio pieno in 0,85 s,
 *   quasi lineare) · le etichette ci sono
 *   già, sfocate (L01), pill sul bersaglio (reel 42: «Specific topic» nel centro), e vanno a fuoco quando sono dette · R3 accenti sulle
 *   parole (fuori a fuoco, spento e barrato, centro acceso, freccetta) · la freccetta trema (è un colpo voluto, F12) ma niente
 *   scossa della camera e niente back.out sugli anelli · R7 sfondo fermo
 * prima: (demo 22–28 s · demo-2 52–54 s · reel-09 16,1–18,3 s) gli anelli entravano uno per parola con back.out, la camera
 *   scuoteva all'impatto (shake 11 px) e gli anelli rimbalzavano (back.out(3))
 * chiamata:
 *   TPL.O10({ t0: 17.3, t1: 22.2, X: 13400, Y: 900, parole: { fuori: 18.45, spegni: 18.9, centro: 20.45, freccia: 21.45,
 *     titolo: [17.73, 18.05, 18.23, 20.45, 20.82] } }, {
 *     titolo: [[{ t: "Non " }, { t: "un milione", box: true }], [{ t: "le persone giuste", hand: true }]],
 *     etichette: { fuori: "1M di views", centro: "Le persone giuste" } });
 */
TPL.O10 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const RR = o.raggi || [150, 250, 340, 430], n = RR.length, R = RR[n - 1];
  const B = bullseye(L, X, Y, RR, { z: 10 });
  // le persone giuste nel centro: silhouette di profilo sul disco bianco (mai volti veri)
  const np = o.persone == null ? 3 : o.persone, dp = Math.round(RR[0] * 0.56);
  const pers = [];
  for (let i = 0; i < np; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / np, rr = np > 1 ? RR[0] * 0.48 : 0;
    const g = layered(el(L, { position: "absolute", left: X + Math.cos(a) * rr - dp / 2, top: Y + Math.sin(a) * rr - dp / 2, width: dp, height: dp, borderRadius: "50%", zIndex: 10 + n + 4, boxShadow: "0 8px 20px rgba(0,0,0,.45)" }));
    personaK(g, 0, 0, dp, { z: 1 });
    pers.push(g);
  }
  // etichette: pill scure SUL bersaglio (come «Specific topic» nel centro del reel 42), così il bersaglio può riempire
  // l'inquadratura: «fuori» in cima all'anello esterno, «centro» sotto il disco centrale; già lì, sfocate (L01)
  const E = Object.assign({ fuori: "1M di views", centro: "Le persone giuste" }, o.etichette || {});
  const lab = (cy, testo, z) => {
    const box = layered(el(L, { position: "absolute", left: X, top: cy, width: 1, height: 1, zIndex: z }));
    const tx = layered(el(box, { position: "absolute", left: 0, top: 0, transform: "translate(-50%,-50%)", padding: "12px 30px", borderRadius: 34, background: "rgba(30,30,30,.94)", border: "2px solid rgba(255,255,255,.3)", boxShadow: "0 14px 34px rgba(0,0,0,.55)", fontFamily: FS, fontWeight: 800, fontSize: o.fs || 46, color: K.white, whiteSpace: "nowrap", textShadow: GLOW_T }, testo));
    const strike = el(tx, { position: "absolute", left: 22, top: "50%", height: 5, marginTop: -2, width: 0, background: "#e6e6e6", borderRadius: 3 });
    gsap.set(tx, { filter: "blur(8px)" });
    return { box, tx, strike };
  };
  const eF = lab(Y - R + 26, E.fuori, 10 + n + 7);
  const eC = lab(Y + RR[0] + 44, E.centro, 10 + n + 7);
  const S = null;
  // 1) prima del taglio: il centro, le persone, le linee e le etichette sfocate ci sono già (R2)
  const sub = [eF.box, eC.box, ...pers];
  gsap.set(sub, { opacity: 0 });
  gsap.set([eF.tx, eC.tx], { opacity: 0.5 });
  tplMonta(t0, (t) => { tl.to(B.rings[0], { opacity: 1, scale: 1, duration: 0.2 }, t); tl.to(sub, { opacity: 1, duration: 0.2 }, t); },
    () => { gsap.set(B.rings[0], { opacity: 1, scale: 1 }); gsap.set(sub, { opacity: 1 }); });
  // 2) il movimento principale: gli anelli si costruiscono dal centro, dal primo fotogramma (reel 42: ~0,7 s)
  // reel 42: dal punto al bersaglio pieno in ~0,85 s, quasi lineare → un anello ogni 0,17 s, 0,42 s power1.out (~0,76 s)
  const stg = o.passo || 0.17, dR = o.durAnello || 0.42;
  for (let i = 1; i < n; i++) B.ring(i, t0 + 0.02 + (i - 1) * stg, dR, "power1.out");
  const tc0 = t0 + 0.02 + (n - 2) * stg + dR;
  // 3) accenti: l'etichetta esterna a fuoco, poi spenta e barrata con gli anelli esterni
  const tf = P.fuori == null ? t0 + 1.0 : P.fuori;
  tl.to(eF.tx, { filter: "blur(0px)", opacity: 1, duration: 0.25, ease: "power2.out" }, tf);
  tl.set(eF.tx, { filter: "none" }, tf + 0.26);
  const ts = P.spegni == null ? tf + 0.5 : P.spegni;
  B.dimOuter(1, ts);
  tl.to(eF.strike, { width: "calc(100% - 44px)", duration: 0.25, ease: "power2.out" }, ts);
  tl.to(eF.tx, { color: "#8a8a8a", textShadow: "none", duration: 0.25 }, ts);
  // il centro si accende: le persone giuste e l'etichetta del centro
  const tcn = P.centro == null ? ts + 1.0 : P.centro;
  tl.to(eC.tx, { filter: "blur(0px)", opacity: 1, color: K.lime, textShadow: GLOW_LT, duration: 0.25, ease: "power2.out" }, tcn);
  tl.set(eC.tx, { filter: "none" }, tcn + 0.26);
  pulse(L, X, Y, tcn, { r: RR[0] * 1.5, z: 10 + n - 1, cresce: 0.15, svanisce: 0.35, allarga: 1.2, a: 0.7 });
  tl.to(eC.tx, { borderColor: K.lime, boxShadow: `0 14px 34px rgba(0,0,0,.55), ${GLOW_A(0.6)}`, duration: 0.25 }, tcn);
  // la freccetta (il messaggio giusto) si pianta al centro: niente scossa della camera
  const tfr = P.freccia == null ? tcn + 0.9 : P.freccia;
  if (o.freccia !== false) B.hit(tfr, { shake: false, r: RR[1], dx: 1, dy: -0.55 }); // dall'alto a destra: la coda non copre l'etichetta del centro
  // 4) la camera: tiene (il movimento è la costruzione)
  // proporzioni: il bersaglio riempie l'area utile (reel 42: 0,55–0,75 della larghezza; qui ~0,8)
  const rect = [X - R - 10, Y - R - 10, X + R + 10, Y + R + 10];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380, fill: o.fill || 0.98 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "fermo", top: 380, fill: o.fill || 0.98 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { centro: [X, Y], bordo: (a) => [X + Math.cos(a) * R, Y + Math.sin(a) * R] },
    elementi: { bersaglio: B, persone: pers, etichette: [eF, eC], titolo: T, L },
    tempi: { taglio: t0, costruito: tc0, fuori: tf, spegni: ts, centro: tcn, freccia: tfr },
  };
};

/* @scheda O24 · Calendario che si riempie (un reel vero al giorno)
 * quando: "30 giorni di contenuti", "uno al giorno vuol dire 30 video al mese", piani e frequenza di pubblicazione: il mese in
 *   vetro, i giorni ricevono in ordine un tuo reel vero che si muove, il contatore conta i video
 * frase: «Scegli un volume. Uno al giorno vuol dire 30 video al mese.» (15/10, 4,4–7,9 s)
 * durata: 3–5 s (consigliata 3,5–4,5)
 * scena: t0 (taglio), t1, X, Y (centro del calendario), parole: { riempie (parte il riempimento: es. «Uno»), conta
 *   (accento sul contatore: es. «video»), titolo ([…]) }
 * opzioni: titolo, media ([30 id video]: i tuoi reel, mini-clip in assets/clips/cal), mese ("Il tuo mese"; un mese vero con
 *   il suo start, es. "Novembre", 6), start (0 = lunedì, 6 = domenica), giorni (30), passo (s fra un giorno e l'altro, 0.04: tutto il mese in ~1,2 s), etichetta ("video"),
 *   cell (120), cellH (150), ingresso ("arrivo" default | "zoom" | "nessuno"), fermo (R7)
 * restituisce: rect, pose, ancore { giorno(i) (centro della cella i), contatore }, elementi { calendario, tiles, contatore, L },
 *   tempi { taglio, riempie, pieno, conta }
 * suoni: whoosh .14 al taglio · rise .06 sul riempimento · ding .1 su «conta»
 * regole: R2 il mese vuoto è già in scena al taglio, arrivo dal basso 140 px expo.out 0,7 s · R6 un solo riempimento in
 *   ordine, a passo costante (reel 67: 31 giorni in ~1,1 s, lineari; reel 68: reel veri nei giorni), ogni reel entra con
 *   popK (0,8 → 1 in 0,15 s, niente back.out) e il contatore conta insieme, lineare · R3 un accento sul contatore · R7
 *   sfondo fermo
 * prima: (demo-2 0–5 s · r03 35,5–38,8 s) fillVideos con 0,055 s a giorno e i reel che entravano da 0,5 con back.out(2,2);
 *   reel di altri creator
 * chiamata:
 *   TPL.O24({ t0: 27.2, t1: 31.0, X: 19600, Y: 900, parole: { riempie: 28.57, conta: 30.1,
 *     titolo: [28.57, 28.87, 29.0, 29.77, 30.1, 30.37, 30.5] } }, {
 *     titolo: [[{ t: "Uno al giorno " }, { t: "= 30 video", box: true }]],
 *     media: Array.from({ length: 30 }, (_, i) => "g" + String(i + 1).padStart(2, "0")) });
 */
TPL.O24 = (scena, o) => {
  o = o || {};
