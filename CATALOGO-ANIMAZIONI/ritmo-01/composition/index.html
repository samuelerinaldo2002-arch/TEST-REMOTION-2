// ═══ storia aperta (vecchio stile) ═══════════════════════════════════════════════════════════════════════════════
// o: { user, nome, quando ("2 h"), media, segs (segmenti della barra, 1), seg (quello in corso, 0), z }
// .play(t, dur, {da, a, ease}) riempie il segmento in corso · .fillTo(k, t) segmenti pieni fino a k · .like(t) · .reply(t, testo)
// · .share(t) · .swipe(t, idProssima) la storia scivola via (cubo) e arriva quella dopo · .barRect() · .heartXY() .inputXY()
// .sendXY() (mondo) · .content (media + intestazione: per spegnerla/girarla) · .bar (contenitore della barra)
const igStoryView = (parent, X, Y, o) => {
  o = o || {};
  const P = phone2(parent, X, Y, o);
  const S = P.screen, W = PH.sw, H = PH.sh;
  const content = el(S, { position: "absolute", left: 0, top: 0, width: W, height: H, zIndex: 1, transformOrigin: "0% 50%" });
  if (o.media) mediaTile(content, 0, 0, W, H, o.media, 1);
  el(content, { position: "absolute", left: 0, top: 0, width: W, height: 220, background: "linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0))", zIndex: 2 });
  el(content, { position: "absolute", left: 0, top: H - 200, width: W, height: 200, background: "linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.6))", zIndex: 2 });
  // barra a segmenti
  const n = o.segs || 1, gp = n > 8 ? 3 : 5, bx = 14, bw = W - 28, sw = (bw - (n - 1) * gp) / n, by = 58;
  const bar = el(S, { position: "absolute", left: bx, top: by, width: bw, height: 5, zIndex: 4 });
  const fills = [];
  for (let k = 0; k < n; k++) {
    const s = el(bar, { position: "absolute", left: k * (sw + gp), top: 0, width: sw, height: 5, borderRadius: 3, background: "rgba(255,255,255,.38)", overflow: "hidden" });
    const f = el(s, { position: "absolute", left: 0, top: 0, width: sw, height: 5, background: "#fff", transformOrigin: "0 50%" });
    gsap.set(f, { scaleX: k < (o.seg || 0) ? 1 : 0 });
    fills.push(f);
  }
  // intestazione
  const head = el(content, { position: "absolute", left: 16, top: 78, display: "flex", alignItems: "center", gap: 12, zIndex: 3, whiteSpace: "nowrap" });
  const av = el(head, { width: 56, height: 56, borderRadius: "50%", overflow: "hidden", border: "2px solid rgba(255,255,255,.8)", position: "relative", flex: "none" });
  if (o.user === "anon") personaK(av, 0, 0, 52, { z: 1 });
  else if (o.user) imgIn(av, "av-" + o.user, { objectFit: "cover" });
  el(head, { fontFamily: FS, fontWeight: 700, fontSize: 23, color: "#fff", textShadow: "0 1px 6px rgba(0,0,0,.6)" }, o.nome || "", "span");
  el(head, { fontFamily: FS, fontWeight: 500, fontSize: 21, color: "rgba(255,255,255,.75)", textShadow: "0 1px 6px rgba(0,0,0,.6)" }, o.quando || "2 h", "span");
  el(content, { position: "absolute", right: 16, top: 88, display: "flex", gap: 20, zIndex: 3 }, svg("ellipsis", 32, "#fff", 2.4) + svg("x", 34, "#fff", 2.6));
  // footer: Invia messaggio · cuore · condividi
  const fy = H - 104;
  const inp = el(S, { position: "absolute", left: 16, top: fy, width: W - 150, height: 70, borderRadius: 35, border: "2px solid rgba(255,255,255,.7)", display: "flex", alignItems: "center", paddingLeft: 26, fontFamily: FS, fontWeight: 500, fontSize: 23, color: "#fff", whiteSpace: "nowrap", overflow: "hidden", zIndex: 4 });
  const ph = el(inp, { position: "absolute", left: 26, top: 0, height: 66, display: "flex", alignItems: "center" }, "Invia messaggio");
  const txt = el(inp, { position: "absolute", left: 26, top: 0, height: 66, display: "flex", alignItems: "center", fontWeight: 700 }, "");
  const hx0 = W - 120, sx0 = W - 62;
  const heart = el(S, { position: "absolute", left: hx0 - 22, top: fy + 13, width: 44, height: 44, zIndex: 4 }, svg("heart", 42, "#fff", 2.2));
  const heartOn = el(S, { position: "absolute", left: hx0 - 22, top: fy + 13, width: 44, height: 44, zIndex: 5, opacity: 0 }, svg("heart", 42, "#ff3040", 2.2, "#ff3040"));
  const send = el(S, { position: "absolute", left: sx0 - 22, top: fy + 13, width: 44, height: 44, zIndex: 4 }, svg("send", 40, "#fff", 2.2));
  // la storia che arriva dopo lo scorrimento (chi scorre via passa a un'altra persona)
  let next = null;
  const nextIn = (id) => {
    next = el(S, { position: "absolute", left: 0, top: 0, width: W, height: H, zIndex: 1, background: "#151515", transformOrigin: "100% 50%", opacity: 0 });
    if (id && id.atlas != null) atlasCrop(next, 0, 0, W, H, id.atlas);
    else if (id) mediaTile(next, 0, 0, W, H, id, 1);
    el(next, { position: "absolute", left: 0, top: 0, width: W, height: 220, background: "linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0))", zIndex: 2 });
    const h2 = el(next, { position: "absolute", left: 16, top: 78, display: "flex", alignItems: "center", gap: 12, zIndex: 3, whiteSpace: "nowrap" });
    const a2 = el(h2, { width: 56, height: 56, borderRadius: "50%", overflow: "hidden", border: "2px solid rgba(255,255,255,.8)", position: "relative", flex: "none" });
    faceDot(a2, 0, 0, 52, 5, null, { bw: 0 });
    el(h2, { fontFamily: FS, fontWeight: 700, fontSize: 23, color: "#fff" }, "giulia.ferri", "span");
    el(h2, { fontFamily: FS, fontWeight: 500, fontSize: 21, color: "rgba(255,255,255,.75)" }, "1 h", "span");
    return next;
  };
  let lastReply = "";
  S.style.perspective = "1400px";
  const W2 = (x, y) => P.at(x, y);
  return Object.assign(P, {
    content, bar, fills, inp, heart, send,
    barRect: () => { const a = W2(bx - 6, by - 14), b = W2(bx + bw + 6, by + 19); return [a[0], a[1], b[0], b[1]]; },
    heartXY: () => W2(hx0, fy + 35),
    sendXY: () => W2(sx0, fy + 35),
    inputXY: () => W2(16 + (W - 150) / 2, fy + 35),
    play: (t, dur, oo) => {
      oo = oo || {};
      const f = fills[o.seg || 0];
      tl.fromTo(f, { scaleX: oo.da || 0 }, { scaleX: oo.a == null ? 1 : oo.a, duration: dur, ease: oo.ease || "none", immediateRender: false }, t);
    },
    fillTo: (k, t) => fills.forEach((f, i) => tl.set(f, { scaleX: i < k ? 1 : 0 }, t)),
    like: (t) => {
      tl.to(heartOn, { opacity: 1, duration: 0.05 }, t);
      tl.fromTo(heartOn, { scale: 0.4 }, { scale: 1, duration: 0.4, ease: "back.out(3.2)", immediateRender: false }, t);
      tl.to(heart, { opacity: 0, duration: 0.05 }, t);
      // cuoricini che salgono (le reazioni del vecchio stile)
      for (let k = 0; k < 6; k++) {
        const h = el(S, { position: "absolute", left: hx0 - 18, top: fy - 10, width: 36, height: 36, zIndex: 6, opacity: 0 }, svg("heart", 34, "#ff3040", 2, "#ff3040"));
        const dx = hash(k, 5) * 110, up = 260 + Math.abs(hash(k, 9)) * 260;
        tl.fromTo(h, { opacity: 1, x: 0, y: 0, scale: 0.6 }, { opacity: 0, x: dx, y: -up, scale: 1.25, duration: 0.9, ease: "power2.out", immediateRender: false }, t + 0.05 + k * 0.05);
      }
    },
    reply: (t, testo, cps) => {
      lastReply = testo;
      tl.to(ph, { opacity: 0, duration: 0.08 }, t);
      typeIn(txt, testo, t + 0.05, cps || 30);
      tl.to(inp, { borderColor: "#ffffff", duration: 0.15 }, t);
    },
    // la risposta parte: la pill si svuota e il fumetto (blu, come i DM) sale
    sent: (t) => {
      const b = el(S, { position: "absolute", left: 24, top: fy - 6, padding: "14px 22px", borderRadius: 28, background: K.ig, fontFamily: FS, fontWeight: 700, fontSize: 23, color: "#fff", whiteSpace: "nowrap", zIndex: 6, opacity: 0 }, lastReply);
      tl.set(b, { opacity: 1 }, t);
      tl.to(b, { y: -300, opacity: 0, duration: 0.6, ease: "power2.in" }, t + 0.05);
      tl.set(txt, { opacity: 0 }, t);
      tl.set(ph, { opacity: 1 }, t + 0.1);
    },
    share: (t) => {
      tl.to(send, { scale: 0.8, duration: 0.07, ease: "power2.out" }, t);
      tl.to(send, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t + 0.08);
      const pl = el(S, { position: "absolute", left: sx0 - 22, top: fy + 13, width: 44, height: 44, zIndex: 6, opacity: 0 }, svg("send", 40, K.lime, 2.6));
      tl.fromTo(pl, { opacity: 1, x: 0, y: 0, rotation: 0 }, { opacity: 0, x: 120, y: -360, rotation: -12, scale: 1.6, duration: 0.7, ease: "power2.in", immediateRender: false }, t + 0.05);
    },
    swipe: (t, idNext) => {
      const nx = next || nextIn(idNext);
      tl.to(content, { x: -W, rotationY: 55, opacity: 0.2, duration: 0.42, ease: "power2.in" }, t);
      tl.fromTo(nx, { x: W, rotationY: -55, opacity: 0.5 }, { x: 0, rotationY: 0, opacity: 1, duration: 0.42, ease: "power2.in", immediateRender: false }, t);
      tl.to(bar, { opacity: 0, duration: 0.15 }, t);
      return nx;
    },
    // torna la storia di prima (dopo uno swipe), pronta da riguardare
    reset: (t) => {
      tl.set(content, { x: 0, rotationY: 0, opacity: 1 }, t);
      if (next) tl.set(next, { opacity: 0 }, t);
      tl.set(bar, { opacity: 1 }, t);
    },
  });
};

// ═══ `<Algoritmo/>` (reel 40 di Kallaway: pill in stile codice, bordo luminoso, linee verso tutto il resto) ═════════════
// o: { testo, fs (40), z } → { g, box, rect, cx, cy, w, h, show(t), flash(t, "+" | "-") }
const algoPill = (parent, cx, cy, o) => {
  o = o || {};
  const fs = o.fs || 40, testo = o.testo || "<Algoritmo/>", w = Math.round(fs * 0.62 * testo.length + fs * 1.6), h = Math.round(fs * 2.1);
  const g = el(parent, { position: "absolute", left: cx - w / 2, top: cy - h / 2, width: w, height: h, zIndex: o.z || 30 });
  const box = el(g, { position: "absolute", left: 0, top: 0, width: w, height: h, borderRadius: Math.round(h * 0.28), background: "linear-gradient(180deg, rgba(40,44,32,.96), rgba(18,20,14,.98))", border: `3px solid ${K.lime}`, boxShadow: `${GLOW_A(0.85)}, 0 18px 40px rgba(0,0,0,.6), inset 0 0 22px rgba(207,251,80,.18)` });
  const tx = el(g, { position: "absolute", left: 0, top: 0, width: w, height: h, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: '"Consolas", "Courier New", monospace', fontWeight: 700, fontSize: fs, color: "#efffc2", textShadow: GLOW_LT, whiteSpace: "nowrap" }, testo);
  const off = el(g, { position: "absolute", left: -3, top: -3, width: w + 6, height: h + 6, borderRadius: Math.round(h * 0.28) + 3, border: "3px solid #ffffff", opacity: 0 });
  gsap.set(g, { opacity: 0 });
  return {
    g, box, tx, w, h, cx, cy, rect: [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2],
    show: (t, oo) => {
      oo = oo || {};
      tl.fromTo(g, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      if (oo.decode !== false) decode(tx, testo, t + 0.04, oo.dur || 0.45);
      pulse(parent, cx, cy, t + 0.05, { r: oo.pr || h * 0.7, z: (o.z || 30) - 1 }); // piccolo: la pill sta subito sotto il titolo (oo.pr = raggio)
    },
    // un segnale arriva: "+" il bordo lampeggia lime pieno, "-" diventa bianco/grigio per un attimo
    flash: (t, s) => {
      if (s === "-") {
        tl.to(off, { opacity: 1, duration: 0.06 }, t);
        tl.to(off, { opacity: 0, duration: 0.4 }, t + 0.12);
        tl.to(box, { borderColor: "#8a8a8a", boxShadow: "0 18px 40px rgba(0,0,0,.6)", duration: 0.08 }, t);
        tl.to(box, { borderColor: K.lime, boxShadow: `${GLOW_A(0.85)}, 0 18px 40px rgba(0,0,0,.6), inset 0 0 22px rgba(207,251,80,.18)`, duration: 0.4 }, t + 0.3);
      } else {
        pulse(parent, cx, cy, t, { r: h * 1.3, z: (o.z || 30) - 1 }); // il disco pieno dietro la pill sul dato positivo (reel 40)
        tl.fromTo(g, { scale: 1 }, { scale: 1.12, duration: 0.08, ease: "power2.out", immediateRender: false }, t);
        tl.to(g, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t + 0.08);
        tl.to(box, { boxShadow: `${GLOW_A(1.6)}, 0 18px 40px rgba(0,0,0,.6), inset 0 0 30px rgba(207,251,80,.4)`, duration: 0.08 }, t);
        tl.to(box, { boxShadow: `${GLOW_A(0.85)}, 0 18px 40px rgba(0,0,0,.6), inset 0 0 22px rgba(207,251,80,.18)`, duration: 0.45 }, t + 0.1);
      }
    },
  };
};

// ═══ orologio: quadrante d'acciaio (come il cronometro U15) con le lancette che girano ═══════════════════════════════
// o: { ora (ore, 9), min (minuti, 0), z } → { g, show(t), spin(t, dur, ore) le lancette avanzano di "ore" ore, off(t) }
const orologio = (parent, cx, cy, d, o) => {
  o = o || {};
  const R = d / 2, z = o.z || 14;
  const g = layered(el(parent, { position: "absolute", left: cx - R, top: cy - R, width: d, height: d, zIndex: z }));
  el(g, { position: "absolute", inset: 0, borderRadius: "50%", background: "conic-gradient(from 200deg, #f4f4f4, #8a8a8a, #dcdcdc, #6a6a6a, #ececec, #8a8a8a, #f4f4f4)", boxShadow: "0 34px 70px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.4)" });
  const fd = d * 0.88, fc = fd / 2;
  const face = el(g, { position: "absolute", left: d * 0.06, top: d * 0.06, width: fd, height: fd, borderRadius: "50%", background: "radial-gradient(circle at 45% 35%, #333, #111 72%)", boxShadow: "inset 0 10px 26px rgba(0,0,0,.85)", overflow: "hidden" });
  const SV = svgIn(face, fd, fd);
  for (let k = 0; k < 60; k++) {
    const a = (k / 60) * Math.PI * 2, rr = fd * 0.44, l = k % 5 ? fd * 0.025 : fd * 0.07;
    pathEl(SV, `M${(fc + Math.sin(a) * rr).toFixed(1)} ${(fc - Math.cos(a) * rr).toFixed(1)} L${(fc + Math.sin(a) * (rr - l)).toFixed(1)} ${(fc - Math.cos(a) * (rr - l)).toFixed(1)}`, { stroke: k % 5 ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.9)", "stroke-width": k % 5 ? 2 : 6, "stroke-linecap": "round" });
  }
  [12, 3, 6, 9].forEach((n, i) => {
    const a = (i / 4) * Math.PI * 2, rr = fd * 0.3;
    el(face, { position: "absolute", left: fc + Math.sin(a) * rr - 40, top: fc - Math.cos(a) * rr - 30, width: 80, height: 60, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: fd * 0.1, color: K.white }, String(n));
  });
  const hand = (len, w, col) => el(face, { position: "absolute", left: fc - w / 2, top: fc - len, width: w, height: len + w * 0.8, borderRadius: w / 2, background: col, transformOrigin: `50% ${len}px`, boxShadow: "0 4px 10px rgba(0,0,0,.6)", zIndex: 3 });
  const hH = hand(fd * 0.22, fd * 0.04, "#ffffff"), hM = hand(fd * 0.34, fd * 0.026, "#ffffff");
  el(face, { position: "absolute", left: fc - fd * 0.04, top: fc - fd * 0.04, width: fd * 0.08, height: fd * 0.08, borderRadius: "50%", background: K.lime, boxShadow: GLOW_A(0.8), zIndex: 4 });
  const h0 = o.ora == null ? 9 : o.ora, m0 = o.min || 0;
  gsap.set(hH, { rotation: (h0 % 12) * 30 + m0 * 0.5 });
  gsap.set(hM, { rotation: m0 * 6 });
  gsap.set(g, { opacity: 0 });
  let cur = 0;
  return {
    g, face,
    show: (t) => tl.fromTo(g, { opacity: 0, scale: 0.8, rotation: -8 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, t),
    spin: (t, dur, ore, ease) => {
      cur += ore;
      tl.to(hM, { rotation: m0 * 6 + cur * 360, duration: dur, ease: ease || "power1.inOut" }, t);
      tl.to(hH, { rotation: (h0 % 12) * 30 + m0 * 0.5 + cur * 30, duration: dur, ease: ease || "power1.inOut" }, t);
    },
    off: (t) => tl.to(g, { filter: "grayscale(1) brightness(.5)", duration: 0.3 }, t),
  };
};

// ──── kit2-template.js ────
// ═══ KW kit v2 · TEMPLATE — scene semilavorate del catalogo, rifatte con le regole del ritmo (RIFACIMENTO-RITMO.md) ══════
// Un template per voce del catalogo: TPL.<ID>(scena, opzioni). Si usa quando una voce è giusta per una frase dello script:
// si prende il template e si adattano testi, numeri, media e tempi, invece di ricostruire la scena da zero.
//   scena   = { t0 (il taglio), t1 (fine), X, Y (centro della scena nel mondo), parole: { …tempi delle parole chiave }, parent }
//   opzioni = il contenuto: titolo, voci, numeri, media (i tuoi reel veri), utente, colori di stato…
//   → { rect, pose, ancore, elementi, tempi } — rect/pose per inquadrare, ancore (punti del mondo) per legare le scene fra
//     loro (arrivo dalla scena prima, match cut), elementi per gli accenti in più, tempi per gli SFX della composizione.
// Le regole del ritmo stanno dentro il template (va usato nelle composizioni col marcatore KW_RITMO):
//   - si monta PRIMA di t0 (montaT) e al taglio parte un solo movimento principale (apertura / spinta), poi la tenuta (R1–R4);
//   - niente back.out (R5, kit2-ritmo.js), riempimenti e conteggi continui (R6);
//   - gli accenti (al massimo 2–3) si agganciano alle parole (scena.parole);
//   - ingresso "nessuno" = la camera la muove la composizione (transizione morbida R8, match cut sulle ancore).
// SCHEDA in testa a ogni template: commento che comincia con "@scheda <ID> · <nome>", righe "chiave: valore" (le righe che
// seguono con più rientro continuano il valore). La legge _tools/genera_catalogo_ritmo.py per la pagina catalogo-ritmo.html.
// Chiavi: quando, frase, durata, scena, opzioni, restituisce, suoni, regole, prima (cosa è cambiato), chiamata (codice).
// Contro la ripetizione: in un reel ogni template compare una volta (al massimo due se è il centro del concetto); il concetto
// del reel resta originale (un mondo e una metafora per reel): i template sono i mattoni, non il reel.
const TPL = {};

// ── R7 (da provare nel blocco 1, ritmo-01): titolo e sfondo fermi mentre il contenuto si muove ──
// Il titolo è già fermo (HUD). Per lo sfondo ogni template del blocco 1 registra la sua finestra [t0 (o o.fermoDa), t1] quando
// KW_RITMO e o.fermo !== false; la composizione chiama tplFermo() UNA volta dopo le scene (sfondoFermo a finestre: i puntini
// stanno fermi durante la tenuta e seguono la camera nelle transizioni morbide). Per togliere R7: non chiamare tplFermo()
// (una riga nella composizione), oppure fermo: false nella singola scena.
const TPL_FERMO = [];
const tplFermo0 = (scena, o) => { if (KW_RITMO && o.fermo !== false) TPL_FERMO.push([o.fermoDa == null ? scena.t0 : o.fermoDa, scena.t1]); };
const tplFermo = () => sfondoFermo(TPL_FERMO);
// montaggio prima del taglio (R2): fa(t, dur) costruisce gli oggetti da t (t0 − 1 s) e restituisce true; per la prima scena
// del reel (t0 < 1 s) chiama pieno() che li mette già pieni con gsap.set
const tplMonta = (t0, fa, pieno) => { const m = montaT(t0); if (m) fa(m.t, m.dur, m); else if (pieno) pieno(); return m; };

// titolo della scena (T01): nell'HUD, fermo; le parole entrano dal taglio a 0,12 s l'una oppure sui tempi della voce
// (scena.parole.titolo = [tempo per parola]); esce 0,45 s prima della fine (regola 16) se o.titoloEsce !== false
const tplTitolo = (scena, o) => {
  if (!o.titolo) return null;
  const T = titleW({ lines: o.titolo, size: o.titoloSize || 80 });
  const tp = scena.parole && scena.parole.titolo;
  T.inAt(Array.isArray(tp) ? tp : scena.t0 + 0.05);
  if (o.titoloEsce !== false) T.outAt(scena.t1 - 0.45);
  return T;
};

// ── R8 (da provare nel blocco 1, ritmo-01): transizione morbida «zoom-through» (K07) fra due scene che si toccano ──
// La camera corre DENTRO un punto della scena prima (verso = [x, y] del mondo: un'ancora, es. il tuo video su una tappa) e
// dall'altra parte la scena dopo si assesta sulla sua posa. Corta (0,16 s + 0,45 s): niente corsa nel vuoto. La scena dopo va
// chiamata con ingresso: "nessuno" e fermoDa = il valore restituito (R7: lo sfondo si ferma ad assestamento finito).
// o: { pre (0.16), zoom (1.5: quanto si entra), settle (0.45), blur (12), da (0.86: scala d'arrivo rispetto alla posa) }
const tplZoomThrough = (t, verso, pose, o) => {
  o = o || {};
  const pre = o.pre || 0.16, st = o.settle || 0.45, bl = o.blur || 12;
  camK(t - pre, pre, verso[0], verso[1], CAM.s * (o.zoom || 1.5), "power2.in");
  tl.fromTo(mbwrap, { filter: "blur(0px)" }, { filter: `blur(${bl}px)`, duration: pre, ease: "power2.in", immediateRender: false }, t - pre);
  cutTo(t, pose.fx, pose.fy, pose.s * (o.da || 0.86));
  camK(t, st, pose.fx, pose.fy, pose.s, "power3.out");
  tl.to(mbwrap, { filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, t);
  tl.set(mbwrap, { filter: "none" }, t + 0.21);
  return t + st;
};
// R8 «spinta di lato» (la card che entra di lato, reel 9 di Kallaway: ~740 px in ~0,75 s, sine.out, picco ~2000 px/s): la
// camera scorre dalla scena prima alla dopo, che sta vicina (circa una schermata), con un filo di scia → restituisce la fine
const tplPan = (t, pose, o) => {
  o = o || {};
  const dur = o.dur || 0.7;
  const dx = Math.abs(pose.fx - CAM.fx), dy = Math.abs(pose.fy - CAM.fy);
  camK(t, dur, pose.fx, pose.fy, pose.s, o.ease || "sine.out");
  if (o.blur !== 0) mblur(t, 0.3, o.blur || 8, dy > dx ? "y" : "x");
  return t + dur;
};
// tenuta dopo una transizione fatta dalla composizione (R3): deriva dell'1,2% che si spegne fino a t1
const tplTenuta = (t, t1, ds) => { if (t1 - t > 0.3) camK(t, t1 - t, CAM.fx, CAM.fy, CAM.s * (1 + (ds == null ? 0.012 : ds)), "sine.out"); };

// blocco 1: come tplTitolo, ma l'uscita finisce PRIMA del taglio anche coi titoli lunghi (tplTitolo esce a t1 − 0,45 s e con
// 6+ parole l'ultima sfuma 0,05–0,1 s dopo il taglio: si vedeva nel primo fotogramma della scena dopo). D13 resta com'è.
const tplTitoloK = (scena, o) => {
  if (!o.titolo) return null;
  const T = tplTitolo(scena, Object.assign({}, o, { titoloEsce: false }));
  if (o.titoloEsce !== false) T.outAt(scena.t1 - 0.47 - T.n * 0.012);
  return T;
};

/* @scheda D13 · Termometro accanto alla scala (si riempie fino al gradino)
 * quando: un valore che cresce per livelli; "dalla base all'ultimo gradino"; fiducia, qualità o risultato che sale passo
 *   per passo; "uno step alla volta"
 * frase: «Non serve rifare il profilo da zero, serve salire di uno step alla volta.» (06/10, 29,1–34,2 s)
 * durata: 3–6 s (consigliata 4–5)
 * scena: t0 (taglio), t1 (fine), X, Y (centro nel mondo), parole: { sale (parte il riempimento, default t0 + 0,05),
 *   arriva (la barra è in cima, default sale + 2,25 come Kallaway: è la scelta dell'utente del 14/10; arriva su una parola
 *   più lontana allunga il riempimento fino a 4,5 s), titolo ([tempo per parola], facoltativo) }
 * opzioni: titolo (righe di titleW), gradini (nomi dal basso, 3–8), etichette ([basso, alto] del tubo), fino (indice del
 *   gradino d'arrivo, default l'ultimo), tu (la tua foto sale con la barra), ingresso ("spinta" default | "nessuno")
 * restituisce: rect, pose, ancore { bulbo, cima, punta(f), gradino(i) }, elementi { scala, termo, tu, titolo, L },
 *   tempi { taglio, sale, arriva }
 * suoni: whoosh .14 al taglio · rise .06 su «sale» · ding .1 su «arriva»
 * regole: R2 scena piena al taglio (scala, tubo e nomi già lì) · R4 spinta +9% in 2,4 s power2.out, poi coda +1% · R6 un
 *   riempimento solo, lineare; i gradini si accendono quando la barra li raggiunge · R3 un accento all'arrivo (disco dietro
 *   la tua foto, bagliore sul gradino) · R5 niente rimbalzi
 * prima: la scala si costruiva dopo il taglio (0,6 s) e il termometro sfumava; il riempimento andava a 5 scatti da 0,5 s
 *   (power2.inOut) con le pause, fino a 3,6 s; i nomi si scrivevano a ogni scatto; la camera faceva float +2% in 5,4 s
 * chiamata:
 *   TPL.D13({ t0: at("Non", 87), t1: at("volta.") + 1, X: 600, Y: 900 }, {
 *     titolo: [[{ t: "Uno step " }, { t: "alla volta", box: true }]],
 *     gradini: ["Foto profilo", "Nome + cosa fai", "Chi aiuti", "Perché fidarti", "Parola nei DM"],
 *     etichette: ["Base", "Ultimo gradino"], tu: true });
 */
TPL.D13 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const nomi = o.gradini || ["Livello 1", "Livello 2", "Livello 3", "Livello 4", "Livello 5"];
  const n = nomi.length;
  // misure: quelle del lab (5 gradini da 180 px); con più gradini il passo si stringe e il testo rimpicciolisce
  const gap = o.gap || Math.max(110, Math.min(200, 720 / (n - 1)));
  const fsN = o.fs || Math.round(Math.min(32, gap * 0.19));
  const B = Y + (gap * (n - 1)) / 2 + 140; // piede della scala
  const xT = X - 300, yBot = B - 30, yTop = B - (n - 1) * gap - 80;
  const ld = ladder(L, X + 130, B, nomi, { gap, w: 480, fs: fsN });
  const th = thermo(L, xT, yTop, yBot, { w: 48, etichette: o.etichette === false ? [] : o.etichette || ["Base", "Cima"] });
  const rungY = (i) => B - i * gap;
  const rungF = (i) => Math.max(0, Math.min(1, (yBot - rungY(i)) / (yBot - yTop)));
  const k = o.fino == null ? n - 1 : o.fino;
  const fFin = k >= n - 1 ? 1 : Math.min(1, rungF(k) + 0.04);
  // la tua foto: a sinistra del tubo, all'altezza della punta del lime (sale con la barra)
  let tu = null;
  if (o.tu) {
    const d = 96;
    tu = layered(el(L, { position: "absolute", left: xT - 48 - d, top: th.tipY(0) - d / 2, width: d + 24, height: d, zIndex: 15 }));
    avatar(tu, d / 2, d / 2, d, o.tu === true ? "tu" : o.tu, { z: 2 });
    el(tu, { position: "absolute", left: d - 2, top: d / 2 - 2, width: 26, height: 4, borderRadius: 2, background: K.lime, boxShadow: GLOW_A(0.6) });
    if (th.lab[1]) th.lab[1].style.top = `${yTop - 124}px`; // l'etichetta in cima si alza: la foto e il disco arrivano lì
  }
  // 1) prima del taglio: scala e termometro già costruiti, i nomi dei gradini già scritti e attenuati (reel 72: si leggono
  //    da subito e si accendono quando la barra li raggiunge)
  ld.tags.forEach((g) => { g.nm.textContent = g.tx.toUpperCase(); gsap.set(g.nm, { opacity: 0 }); });
  const m = montaT(t0);
  if (m) {
    ld.build(m.t, m.dur);
    th.show(m.t);
    tl.to(ld.tags.map((g) => g.nm), { opacity: 0.42, duration: 0.2 }, m.t + 0.2);
    if (tu) { gsap.set(tu, { opacity: 0 }); tl.to(tu, { opacity: 1, duration: 0.2 }, m.t + 0.2); }
  } else {
    // prima scena del reel: tutto pieno al fotogramma 0
    Array.from(ld.S.getElementsByTagName("path")).forEach((p) => p.setAttribute("stroke-dashoffset", 0));
    gsap.set([th.tube, th.bulb, ...th.lab], { opacity: 1 });
    gsap.set(ld.tags.map((g) => g.nm), { opacity: 0.42 });
  }
  // 2) il riempimento: uno solo, lineare (R6), dal primo fotogramma o da «sale»; ogni gradino si accende quando la barra
  //    raggiunge la sua quota sul tubo
  const ts = P.sale == null ? t0 + 0.05 : P.sale;
  const ta = P.arriva == null ? ts + 2.25 : P.arriva;
  const FILL = Math.max(1.2, Math.min(4.5, ta - ts));
  th.to(ts, fFin, FILL, "none");
  if (tu) tl.to(tu, { y: th.tipY(fFin) - th.tipY(0), duration: FILL, ease: "none" }, ts);
  for (let i = 0; i <= k; i++) {
    const t = ts + FILL * (rungF(i) / fFin);
    const [g, b, c] = ld.rungs[i];
    tl.to([g], { attr: { opacity: 0.4 }, duration: 0.2 }, t);
    tl.to([b], { attr: { opacity: 1 }, duration: 0.2 }, t);
    tl.to([c], { attr: { opacity: 0.9 }, duration: 0.2 }, t);
    tl.to([ld.tags[i].lvl, ld.tags[i].nm], { opacity: 1, duration: 0.2 }, t);
  }
  // 3) l'accento all'arrivo (R3): il gradino d'arrivo s'illumina, un disco lime dietro la tua foto
  glowFlash(ld.tags[k].nm, ts + FILL);
  if (tu) pulse(L, xT - 48 - 48, th.tipY(fFin), ts + FILL, { r: 72, z: 14 });
  // 4) la camera: R4 spinta (+9% in 2,4 s power2.out, il contenuto scivola un po' verso la cima del tubo), poi la coda
  const rect = [X - 470, yTop - (tu ? 170 : 140), X + 450, B + 120];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: "spinta", top: 380, spinta: { dx: -60, dy: -18, ds: 0.09, dur: 2.4, dxCoda: -8, dyCoda: -4, dsCoda: 0.01 } });
  const T = tplTitolo(scena, o);
  return {
    rect, pose,
    ancore: { bulbo: [xT, yBot], cima: [xT, yTop], punta: (f) => [xT, th.tipY(f)], gradino: (i) => [X + 130, rungY(i)] },
    elementi: { scala: ld, termo: th, tu, titolo: T, L },
    tempi: { taglio: t0, sale: ts, arriva: ts + FILL },
  };
};

// ──── kit2-tpl-camera.js ────
// ═══ KW kit v2 · TEMPLATE · camera e transizioni (K) — blocco 2 del rifacimento col ritmo (RIFACIMENTO-RITMO.md) ═══════════
// Stesso standard di kit2-template.js (scheda @scheda, TPL.<ID>(scena, opzioni) → { rect, pose, ancore, elementi, tempi }).
// Le scene di prova sono in CATALOGO-ANIMAZIONI/ritmo-02 (KW_RITMO).

// fascia scura dietro al titolo nell'HUD (per le scene a tutto schermo, come il muro K11): sale al taglio, sparisce a t1
const tplFasciaTitolo = (t0, t1, h) => {
  const f = el(hud, { position: "absolute", left: 0, top: 0, width: 1080, height: h || 400, background: "linear-gradient(180deg, rgba(24,24,24,.96) 0%, rgba(24,24,24,.82) 55%, rgba(24,24,24,0) 100%)", zIndex: 40, opacity: 0 });
  tl.set(f, { opacity: 1 }, t0);
  tl.set(f, { opacity: 0 }, t1);
  return f;
};

/* @scheda K11 · Muro di reel veri che scorre come una slot (l'eccezione che torna)
 * quando: "tra tutti i contenuti…", "ho analizzato migliaia di video", "l'eccezione mostrata in continuazione", il feed che
 *   scorre: un muro di reel veri a tutto schermo che si apre al taglio, una miniatura si accende (l'eccezione, col badge),
 *   poi il muro scorre velocissimo e si ferma dove ce ne sono altre accese
 * frase: «Non lo è. È l'eccezione mostrata in continuazione.» (14/10, 14,5–18,0 s)
 * durata: 3–5 s (consigliata 3,5–4)
 * scena: t0 (taglio: il muro si apre), t1, X, Y (centro della prima inquadratura), parole: { eccezione (si accende la prima
 *   miniatura, es. «eccezione»), scorre (il muro scorre, es. «mostrata»), titolo ([…]) }
 * opzioni: titolo, eccezioni ([[riga, colonna], …] accese: la prima si accende su «eccezione», le altre sono già accese nelle
 *   righe d'arrivo), badge ("1M"; false = niente), cols (11), vis (colonne inquadrate, 9: il muro esce dai bordi), da (prima
 *   riga della prima inquadratura, 3), a (prima riga dell'arrivo, 19), seed, fascia (true: fascia scura dietro al titolo),
 *   ingresso ("apertura" default | "nessuno"), fermo
 * restituisce: rect, pose (l'arrivo dello scorrimento), ancore { eccezione(i) (centro della miniatura i nel mondo) }, elementi {
 *   muro, celle, badge, L }, tempi { taglio, eccezione, scorre, fermo }
 * suoni: whoosh .14 al taglio · tick .06 su «eccezione» · whoosh .12 su «scorre» · land .1 all'arrivo
 * regole: R2 il muro è già lì al taglio e il movimento principale è l'apertura: zoom out ×2,4 → muro in 0,32 s con la scia
 *   (reel 61: ~0,35 s, la scia più forte a metà) · R3 una miniatura si accende (bordo lime + alone, 0,25 s, come la selezione
 *   del reel 61) · il secondo movimento è lo scorrimento della slot: 0,6 s, scia verticale legata alla velocità, frena forte
 *   (reel 61: ~0,6 s, 10,25 → 10,83 s) · poi la camera tiene (+1%) · R5 niente rimbalzi (la .spot() del kit con back.out non
 *   si usa) · R7 lo sfondo è coperto dal muro
 * prima: (demo-3 0–5,4 s · reel-09 9,8–11 s) apertura 0,24 s, scorrimento 0,7 s, .spot() con velo e scala 1,1 back.out(2,4),
 *   poi .pick() dei reel in riga: quattro movimenti in 5 s
 * chiamata:
 *   TPL.K11({ t0: 9.75, t1: 13.6, X: 7000, Y: 900, parole: { eccezione: 11.18, scorre: 11.78,
 *     titolo: [10.68, 11.05, 12.48, 12.62] } }, {
 *     titolo: [[{ t: "È " }, { t: "l'eccezione", box: true }], [{ t: "in continuazione", hand: true }]], badge: "1M" });
 */
TPL.K11 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const cols = o.cols || 11, rows = o.rows || 30, vis = o.vis || 9, r0 = o.da == null ? 3 : o.da, r1 = o.a == null ? 19 : o.a;
  const tw = 118, gap = 12, th = Math.round((tw * 228) / 128), pitch = th + gap;
  const top = Y - (r0 + 2) * pitch;
  const WS = wallScroll(L, X, top, { cols, rows, tw, gap, seed: o.seed == null ? 5 : o.seed, z: 10 });
  const cm = Math.floor(cols / 2);
  const ecc = o.eccezioni || [[r0 + 1, cm], [r1, cm - 3], [r1 + 1, cm + 2], [r1 + 3, cm - 1]];
  // le miniature accese: bordo lime + alone, sopra il muro; badge views sotto
  const celle = ecc.map(([r, c]) => WS.tiles[r * cols + c]);
  const badge = ecc.map(([r, c]) => {
    if (o.badge === false) return null;
    const [x, y] = WS.cellXY(r, c);
    const b = viewBadge(L, x, y + th / 2 - 4, o.badge || "1M", { fs: 22, z: 12 });
    gsap.set(b, { scale: 1, opacity: 0 });
    return b;
  });
  const accendi = (i, t, d) => {
    celle[i].style.zIndex = 6;
    tl.to(celle[i], { borderColor: K.lime, borderWidth: 4, boxShadow: `${GLOW_A(1)}, 0 14px 30px rgba(0,0,0,.6)`, duration: d, ease: "power2.out" }, t);
    if (badge[i]) tl.to(badge[i], { opacity: 1, duration: d, ease: "power2.out" }, t);
  };
  // 1) prima del taglio: le eccezioni delle righe d'arrivo sono già accese (fuori campo)
  const m = montaT(t0);
  for (let i = 1; i < ecc.length; i++) accendi(i, m ? m.t : 0, m ? 0.2 : 0.001);
  // 2) il movimento principale: il muro si apre (zoom out con la scia)
  const tE = P.eccezione == null ? t0 + 0.9 : P.eccezione;
  const tS = P.scorre == null ? tE + 0.6 : P.scorre;
  let pose = WS.poseRows(r0, r0 + 3, { vis });
  if (o.ingresso !== "nessuno") {
    const p0 = WS.open(t0, r0, r0 + 3, { vis, dur: 0.32, k: 2.4, hold: 0.04 });
    if (tS - (t0 + 0.4) > 0.3) camK(t0 + 0.37, tS - (t0 + 0.37), p0.fx, p0.fy, p0.s * 1.01, "sine.out");
  }
  // 3) accento: l'eccezione si accende (reel 61: la selezione si accende in ~0,25 s)
  accendi(0, tE, 0.25);
  // 4) secondo movimento: lo scorrimento della slot, poi tiene
  const dR = o.durScorre || 0.6;
  pose = WS.roll(tS, r1, r1 + 3, { vis, dur: dR, peak: 26 });
  const tF = tS + dR;
  if (t1 - tF > 0.3) camK(tF, t1 - tF, pose.fx, pose.fy, pose.s * 1.01, "sine.out");
  if (o.fascia !== false) tplFasciaTitolo(t0, t1);
  if (o.fermo !== false && KW_RITMO) TPL_FERMO.push([t0, t1]);
  const T = tplTitoloK(scena, o);
  return {
    rect: WS.rect, pose,
    ancore: { eccezione: (i) => WS.cellXY(ecc[i][0], ecc[i][1]) },
    elementi: { muro: WS, celle, badge, titolo: T, L },
    tempi: { taglio: t0, eccezione: tE, scorre: tS, fermo: tF },
  };
};

/* @scheda K16 · Push-in lento su un oggetto che si costruisce (la settimana che si compila)
 * quando: documenti, tabelle, piani che si compilano mentre parli ("organizza tutto in un calendario, alternando i filoni
 *   durante la settimana"): un solo oggetto che si legge, la camera si avvicina piano mentre si riempie
 * frase: «Infine, organizza tutto in un calendario, alternando i filoni durante la settimana per non ripetere sempre lo
 *   stesso tema.» (15/10, 28,4–34,9 s)
 * durata: 4–6,5 s (consigliata 5–6)
 * scena: t0 (taglio: parte la spinta), t1, X, Y (centro della scheda), parole: { riempie (i reel entrano nei giorni: es.
 *   «calendario»), filoni (i filoni compaiono alternati: es. «alternando»), tema (lo stesso filone s'illumina nei suoi giorni,
 *   lontani fra loro: es. «stesso»), titolo ([…]) }
 * opzioni: titolo, giorni ([{ g: "LUN", filone: "Profilo", icona: "user-round", media: "th-mio_04" }, …] 5–7), evidenzia
 *   (nome del filone da far risaltare su «tema», default il primo), titoloScheda ("La tua settimana"), spinta ({ ds: 0.15,
 *   dur: 2.0 }), ingresso ("spinta" default | "nessuno"), fermo (R7)
 * restituisce: rect, pose, ancore { riga(i), centro }, elementi { scheda, righe, L }, tempi { taglio, riempie, filoni, tema }
 * suoni: whoosh .14 al taglio · tick .04 sui reel · pop .06 sui filoni · ding .08 su «tema»
 * regole: R4 un solo oggetto che si legge → la spinta lunga misurata sul reel 35 (il copione: +15,8% in ~2 s, rallenta: +6% nei
 *   primi 0,25 s dopo l'arrivo, poi +3% e +1,4%), power2.out, poi coda quasi ferma · R2 la scheda coi giorni e gli spazi vuoti
 *   c'è già al taglio · R3 accenti sulle parole: i reel nei giorni (popK sfalsati), i filoni alternati, lo stesso filone che si
 *   accende nei suoi giorni (si vede che non sono mai vicini) · R6 i riempimenti in ordine, a passo costante · R7 sfondo
 *   fermo
 * prima: (demo-7 16,25–17,85 s · demo-4 44,65 s) camK +10% in 1,6 s sine.inOut mentre un oggetto si costruiva pezzo per pezzo
 * chiamata:
 *   TPL.K16({ t0: 45.6, t1: 51.2, X: 31600, Y: 900, parole: { riempie: 46.53, filoni: 47.33, tema: 50.17,
 *     titolo: [45.73, 46.07, 46.3, 46.53] } }, {
 *     titolo: [[{ t: "Tutto in un " }, { t: "calendario", box: true }]],
 *     giorni: [{ g: "LUN", filone: "Profilo", icona: "user-round", media: "th-mio_04" }, …] });
 */
TPL.K16 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const G = o.giorni || [];
  const n = G.length, rh = o.rh || 132, gap = 12, W = o.w || 820, head = 118, pad = 26;
  const H = head + n * rh + (n - 1) * gap + pad;
  const x0 = X - W / 2, y0 = Y - H / 2;
  const card = glass(L, x0, y0, W, H, { zIndex: 11, borderRadius: 34 });
  el(card, { position: "absolute", left: 34, top: 26, fontFamily: FD, fontWeight: 700, fontSize: 60, color: K.white, textShadow: GLOW_T, whiteSpace: "nowrap" }, o.titoloScheda || "La tua settimana");
  const tw = Math.round(((rh - 22) * 9) / 16);
  const righe = G.map((d, i) => {
    const y = head + i * (rh + gap);
    const row = el(card, { position: "absolute", left: 22, top: y, width: W - 44, height: rh, borderRadius: 22, background: "rgba(255,255,255,.04)", border: "1.5px solid rgba(255,255,255,.09)" });
    el(row, { position: "absolute", left: 24, top: 0, height: rh, display: "flex", alignItems: "center", fontFamily: FD, fontWeight: 700, fontSize: 54, color: "rgba(255,255,255,.6)", width: 130, whiteSpace: "nowrap" }, d.g);
    // lo spazio del reel (tratteggiato) e il reel vero che ci entra
    const slot = el(row, { position: "absolute", left: 160, top: 11, width: tw, height: rh - 22, borderRadius: 10, border: "2px dashed rgba(255,255,255,.2)" });
    const tile = d.media ? mediaTile(row, 160, 11, tw, rh - 22, d.media, 3) : null;
    if (tile) { tile.style.borderRadius = "10px"; gsap.set(tile, { opacity: 0 }); }
    // il filone (pill con icona), alternato
    // la pill del filone grande (riempie la riga: nel primo render era piccola e metà riga restava vuota)
    const chip = el(row, { position: "absolute", left: 160 + tw + 30, top: (rh - 88) / 2, height: 88, padding: "0 32px", display: "flex", alignItems: "center", gap: 14, borderRadius: 44, background: "linear-gradient(180deg,#3b3b3b,#262626)", border: "1.5px solid rgba(255,255,255,.22)", fontFamily: FS, fontWeight: 800, fontSize: 48, color: K.white, whiteSpace: "nowrap" }, (d.icona ? svg(d.icona, 46, K.white, 2.2) : "") + `<span>${d.filone || ""}</span>`);
    gsap.set(chip, { opacity: 0 });
    return { row, slot, tile, chip, d };
  });
  // 1) prima del taglio: la scheda coi giorni e gli spazi vuoti (R2)
  gsap.set(card, { opacity: 0 });
  tplMonta(t0, (t) => tl.to(card, { opacity: 1, duration: 0.2 }, t), () => gsap.set(card, { opacity: 1 }));
  // 2) accenti: i reel entrano nei giorni (in ordine), poi i filoni alternati, poi lo stesso filone nei suoi giorni
  const tr = P.riempie == null ? t0 + 0.6 : P.riempie;
  righe.forEach((r, i) => { if (r.tile) { popK(r.tile, tr + i * 0.08, { da: 0.85, dur: 0.15 }); tl.to(r.slot, { opacity: 0, duration: 0.1 }, tr + i * 0.08); } });
  const tf = P.filoni == null ? tr + 0.9 : P.filoni;
  righe.forEach((r, i) => popK(r.chip, tf + i * 0.1, { da: 0.85, dur: 0.15 }));
  const tt = P.tema == null ? tf + 1.6 : P.tema;
  const ev = o.evidenzia || (G[0] && G[0].filone);
  righe.forEach((r) => {
    if (r.d.filone !== ev) return;
    tl.to(r.chip, { background: limeFill(1), color: K.ink, borderColor: K.lime, boxShadow: GLOW_A(0.7), duration: 0.2 }, tt);
    const ic = r.chip.querySelector("svg");
    if (ic) tl.to(ic, { attr: { stroke: K.ink }, duration: 0.2 }, tt);
    tl.to(r.row, { borderColor: "rgba(207,251,80,.6)", background: "rgba(207,251,80,.06)", duration: 0.2 }, tt);
  });
  // 3) la camera: K16 / R4, la spinta lunga sulla scheda (reel 35: +15,8% in ~2 s, rallenta), poi quasi ferma
  const rect = [x0 - 10, y0 - 10, x0 + W + 10, y0 + H + 10];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380, fill: o.fill || 0.86 });
  const sp = Object.assign({ ds: 0.15, dur: 2.0, dx: 0, dy: -10, dsCoda: 0.01 }, o.spinta || {});
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: "spinta", top: 380, fill: o.fill || 0.86, spinta: sp });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { centro: [X, Y], riga: (i) => [X, y0 + head + i * (rh + gap) + rh / 2] },
    elementi: { scheda: card, righe, titolo: T, L },
    tempi: { taglio: t0, riempie: tr, filoni: tf, tema: tt },
  };
};

// ──── kit2-tpl-connettori.js ────
// ═══ KW kit v2 · TEMPLATE · connettori e segnali (C) — blocco 1 del rifacimento col ritmo (RIFACIMENTO-RITMO.md) ═════════
// Stesso standard di kit2-template.js. Scene di prova in CATALOGO-ANIMAZIONI/ritmo-01 (KW_RITMO).

/* @scheda C01 · Linea che si allunga mentre la camera viaggia (fino alle tappe dette)
 * quando: si passa da A a B collegati (la causa e i suoi esempi, un elenco nel tempo: "lunedì…, martedì…, venerdì…",
 *   "prima… poi…"); è anche la transizione morbida R8 fra due scene che si toccano (la linea parte da un'ancora della scena
 *   prima)
 * frase: «Lunedì parno di fitness, martedì di viaggi, venerdì di motivazione.» (01/10, 4,7–7,5 s)
 * durata: 2,5–5 s (consigliata 3–4)
 * scena: t0 (la linea parte e la camera la segue), t1, X, Y (centro della fila di tappe), parole: { tappe: [quando si
 *   accende ogni tappa: la prima all'arrivo, le altre sulle parole], titolo ([tempo per parola]) }
 * opzioni: da ([x, y] del mondo: l'ancora della scena prima da cui parte la linea; senza, la scena entra col taglio netto e un
 *   arrivo da destra), tappe ([{ media (id video del pool), giorno (etichetta sopra), tema, icona (lucide) }], 2–4),
 *   viaggio (s, 0.7), w (card 9:16, 300; tre card riempiono la larghezza), titolo, fermo (R7, default true: dall'arrivo)
 * restituisce: rect, pose, ancore { nodo(i), card(i) (centro), fine (ultimo nodo) }, elementi { linee, card, titolo, L },
 *   tempi { partenza, arrivo, tappe: [...] }
 * suoni: whoosh .16 alla partenza (la linea) · land .12 all'arrivo · tick .06 su ogni tappa
 * regole: R2 le tappe ci sono già (fuori fuoco, non ancora dette) quando la camera arriva · R8 la linea riempie il viaggio: la
 *   camera la segue con la stessa curva (power1.out, 0,7 s; misurati reel 79 e 14: ~0,7 schermate, 90% in 0,42–0,71 s,
 *   picco 2400–3000 px/s, frena sull'oggetto già in scena) e la scena dopo sta vicina (~1 schermata): niente corsa nel vuoto · R3 dopo l'arrivo la camera tiene (1,2%) e la linea va avanti da sola
 *   di tappa in tappa sulle parole (accenti: nodo + card che va a fuoco) · R5 niente rimbalzi · R7 sfondo fermo dall'arrivo
 * prima: (demo-7 0,8–4,05 s) connector().draw insieme a camK con la stessa curva; nel reel-01 v5 la settimana arrivava con un
 *   whip e la camera correva lungo i giorni (due movimenti)
 * chiamata:
 *   TPL.C01({ t0: 5.6, t1: 8.75, X: 1850, Y: 900, parole: { tappe: [6.2, 6.93, 7.63], titolo: [5.83, 6.5, 6.93, 7.63] } }, {
 *     da: S.O01.ancore.bordo(0), titolo: [[{ t: "Ogni giorno " }, { t: "un tema", box: true }], [{ t: "diverso", hand: true }]],
 *     tappe: [{ media: "w1", giorno: "LUN", tema: "Fitness", icona: "dumbbell" },
 *             { media: "w2", giorno: "MAR", tema: "Viaggi", icona: "plane" },
 *             { media: "w3", giorno: "VEN", tema: "Motivazione", icona: "flame" }] });
 */
TPL.C01 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const tp = o.tappe || [], n = tp.length;
  const w = o.w || 300, h = Math.round((w * 16) / 9), g = o.gap || 40;
  const RW = n * w + (n - 1) * g, x0 = X - RW / 2;
  const cx = (i) => x0 + w / 2 + i * (w + g);
  const yN = Y - h / 2 - 72; // la linea delle tappe corre sopra le card
  const S = svgLayer(L, 6, X - 6000, Y - 3000, 12000, 6000);
  // le tappe: card col reel vero, etichetta del giorno sopra il nodo, tema sotto; ci sono già, fuori fuoco (L01)
  const cards = tp.map((q, i) => {
    const c = layered(el(L, { position: "absolute", left: cx(i) - w / 2, top: Y - h / 2, width: w, height: h, borderRadius: Math.round(w * 0.09), overflow: "hidden", background: "#111", border: "2px solid rgba(255,255,255,.28)", boxShadow: "0 24px 60px rgba(0,0,0,.6)", zIndex: 12 }));
    if (q.media) mediaTile(c, 0, 0, w, h, q.media, 1);
    const nodo = el(L, { position: "absolute", left: cx(i) - 13, top: yN - 13, width: 26, height: 26, borderRadius: "50%", background: "#2a2a2a", border: "3px solid rgba(255,255,255,.55)", zIndex: 14 });
    const gi = el(L, { position: "absolute", left: cx(i) - 120, top: yN - 78, width: 240, textAlign: "center", fontFamily: FD, fontWeight: 700, fontSize: 46, lineHeight: 1, color: K.white, textShadow: GLOW_T, zIndex: 14 }, q.giorno || "");
    const te = el(L, { position: "absolute", left: cx(i) - (w + 40) / 2, top: Y + h / 2 + 24, width: w + 40, height: 64, borderRadius: 32, display: "flex", alignItems: "center", justifyContent: "center", gap: 10, background: "linear-gradient(180deg,#3b3b3b,#262626)", border: "1.5px solid rgba(255,255,255,.22)", boxShadow: "0 12px 26px rgba(0,0,0,.5)", fontFamily: FS, fontWeight: 800, fontSize: 28, color: K.white, whiteSpace: "nowrap", zIndex: 14 }, (q.icona ? svg(q.icona, 28, K.lime, 2.4) : "") + (q.tema || ""));
    gsap.set(c, { filter: "blur(8px)", opacity: 0.38 });
    gsap.set([gi, te], { opacity: 0.3, filter: "blur(5px)" });
    return { c, nodo, gi, te };
  });
  // le linee: dall'ancora della scena prima al primo nodo (curva a S), poi da nodo a nodo
  const linee = [];
  if (o.da) linee.push(connector(S, [o.da, [cx(0) - 13, yN]], { curve: "h", w: 4, color: "rgba(255,255,255,.85)" }));
  for (let i = 1; i < n; i++) linee.push(connector(S, [[cx(i - 1) + 13, yN], [cx(i) - 13, yN]], { w: 4, color: "rgba(255,255,255,.85)" }));
  const lv = o.da ? 1 : 0; // indice della prima linea fra le tappe
  // 1) prima della partenza: le tappe ci sono già (fuori fuoco)
  tplMonta(t0, (t) => { gsap.set(cards.map((c) => [c.c, c.nodo, c.gi, c.te]).flat(), { visibility: "hidden" }); tl.set(cards.map((c) => [c.c, c.nodo, c.gi, c.te]).flat(), { visibility: "visible" }, t); });
  // 2) il viaggio: la linea parte e la camera la segue con la stessa curva, la punta resta in campo (R8 morbida); senza «da»
  //    la scena entra col taglio netto e un arrivo da destra (R2)
  const rect = [x0 - 30, yN - 100, x0 + RW + 30, Y + h / 2 + 100];
  const dv = o.viaggio || 0.7;
  const pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380, fill: 0.97 });
  let tArr = t0;
  if (o.da) {
    linee[0].draw(t0, dv + 0.05, "power1.out");
    camK(t0 + 0.05, dv, pose.fx, pose.fy, pose.s, "power1.out");
    mblur(t0 + 0.05, 0.3, 10, "x", "decay");
    tArr = t0 + 0.05 + dv;
    if (t1 - tArr > 0.3) camK(tArr, t1 - tArr, CAM.fx, CAM.fy, CAM.s * 1.012, "sine.out");
  } else {
    apertura(t0, t1, rect, { modo: "arrivo", dx: -220, top: 380, fill: 0.97 });
    tArr = t0 + 0.1;
  }
  // 3) le tappe: la prima all'arrivo, le altre sulle parole; la linea va avanti da sola (la camera tiene)
  const T = P.tappe || tp.map((_, i) => tArr + i * 0.6);
  cards.forEach((c, i) => {
    const t = Math.max(T[i], i === 0 ? tArr - 0.08 : 0);
    if (i > 0) linee[lv + i - 1].draw(t - 0.22, 0.24, "power2.out");
    tl.to(c.nodo, { backgroundColor: K.lime, borderColor: "#f4ffd0", boxShadow: GLOW_A(0.8), duration: 0.15 }, t);
    tl.fromTo(c.nodo, { scale: 0.8 }, { scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, t);
    tl.to(c.c, { filter: "blur(0px)", opacity: 1, borderColor: "rgba(207,251,80,.9)", boxShadow: `${GLOW_A(0.45)}, 0 24px 60px rgba(0,0,0,.6)`, duration: 0.25, ease: "power2.out" }, t);
    tl.set(c.c, { filter: "none" }, t + 0.26);
    tl.to([c.gi, c.te], { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, t);
    tl.set([c.gi, c.te], { filter: "none" }, t + 0.23);
  });
  if (o.da) tplFermo0(scena, Object.assign({ fermoDa: tArr }, o)); else tplFermo0(scena, o);
  const Ti = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { nodo: (i) => [cx(i), yN], card: (i) => [cx(i), Y], fine: [cx(n - 1), yN] },
    elementi: { linee, card: cards, titolo: Ti, L },
    tempi: { partenza: t0, arrivo: tArr, tappe: cards.map((_, i) => Math.max(T[i], i === 0 ? tArr - 0.08 : 0)) },
  };
};

/* @scheda D01 · Contatore + grafico che si disegna + bagliore finale (con le fonti del numero sopra)
 * quando: risultati, crescita, views, soldi, follower: "raddoppi le visualizzazioni", "+27% di views"; il numero conta in
 *   modo continuo mentre la linea sale, all'arrivo il punto con l'anello e il bagliore; sopra, facoltative, le cose che
 *   fanno il numero (i tuoi reel coi loro badge views)
 * frase: «Stesso identico video ma raddoppi le visualizzazioni, gratis.» (03/10, 31,2–35,2 s)
 * durata: 3–5 s (consigliata 4)
 * scena: t0 (taglio o arrivo), t1, X, Y (centro), parole: { uguale (il segno «=» fra le fonti si accende, es. «identico»),
 *   conta (parte il conteggio, es. «raddoppi»; default il primo fotogramma come il reel 9), arriva (fine del conteggio, es.
 *   fine di «visualizzazioni»), finale (accento finale: il badge, es. «gratis»), titolo ([…]) }
 * opzioni: etichetta ("Visualizzazioni totali"), icona ("eye"), da, a, fmt, fonti ([{ media, badge, tag: "PROVA" | "NORMALE" }]
 *   0–2 reel sopra la card), badge (testo del badge finale, "×2"), titolo, ingresso ("arrivo" default, di lato come la card
 *   del reel 9 | "zoom" | "nessuno" = la camera la muove la composizione, es. la frusta R8), fermo (R7), fermoDa
 * restituisce: rect, pose, ancore { card, numero }, elementi { card, fonti, badge, L }, tempi { taglio, conta, arriva, finale }
 * suoni: whoosh .16 all'arrivo · tick .05 su «uguale» · rise .06 sul conteggio · ding .12 all'arrivo del numero · pop .12 sul badge
 * regole: R2 card, fonti e badge views già in scena all'arrivo · misurato su Kallaway (reel 9 e 30): la card arriva di lato
 *   (~0,35 s) e il conteggio è continuo, ~1 s quasi lineare insieme alla linea del grafico; all'arrivo punto con l'anello e
 *   bagliore 0,25 s · R6 un conteggio solo, lineare · R3 al massimo tre accenti · R5 niente back.out
 * prima: (demo-8 6,75–9,9 s) statCard.slideIn + count; nel reel-03 le card entravano con blurIn una dopo l'altra (0,45 s)
 *   dopo il whip, il «×2» con back.out(3)
 * chiamata:
 *   TPL.D01({ t0: 55.0, t1: 59.4, X: 18450, Y: 4400, parole: { uguale: 55.73, conta: 56.8, arriva: 58.3, finale: 58.5,
 *     titolo: [55.13, 55.73, 56.13, 56.8, 57.43, 58.5] } }, {
 *     titolo: [[{ t: "Stesso video, " }, { t: "×2 views", box: true }], [{ t: "gratis", hand: true }]], da: 1240, a: 2420,
 *     fonti: [{ media: "th-mio_04", badge: "1.240", tag: "NORMALE" }, { media: "th-mio_04", badge: "1.180", tag: "PROVA" }] });
 */
TPL.D01 = (scena, o) => {
  o = o || {};
  const { t0, t1, X, Y } = scena, P = scena.parole || {};
  const L = scena.parent || layer(10);
  const fonti = o.fonti || [];
  const tw = 200, th = Math.round((tw * 16) / 9), gap = 150;
  const cw = o.cw || 860, chh = o.ch || 400;
  const topF = Y - (fonti.length ? (th + 90 + 40 + chh) / 2 : chh / 2);
  const yCard = fonti.length ? topF + th + 90 + 40 : topF;
  // le fonti: i tuoi reel coi badge views e l'etichetta (prova / normale), il segno «=» in mezzo
  const fn = fonti.map((q, i) => {
    const cx = X + (i - (fonti.length - 1) / 2) * (tw + gap);
    const c = layered(el(L, { position: "absolute", left: cx - tw / 2, top: topF, width: tw, height: th, borderRadius: 18, overflow: "hidden", background: "#111", border: "2.5px solid rgba(255,255,255,.3)", boxShadow: "0 22px 50px rgba(0,0,0,.6)", zIndex: 12 }));
    mediaTile(c, 0, 0, tw, th, q.media, 1);
    let b = null;
    if (q.badge) { b = viewBadge(L, cx, topF + th + 4, q.badge, { fs: 30, dark: q.tag !== "PROVA", z: 20 }); gsap.set(b, { opacity: 1, scale: 1 }); }
    let tg = null;
    if (q.tag) tg = el(L, { position: "absolute", left: cx - 80, top: topF - 52, width: 160, height: 42, borderRadius: 21, background: q.tag === "PROVA" ? limeFill(1) : "linear-gradient(180deg,#f4f4f2,#d9d9d4)", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, fontFamily: FS, fontWeight: 800, fontSize: 20, color: K.ink, zIndex: 20 }, svg(q.tag === "PROVA" ? "flask-conical" : "send", 20, K.ink, 2.4) + q.tag);
    return { c, b, tg, cx };
  });
  let uguale = null;
  if (fonti.length === 2) uguale = el(L, { position: "absolute", left: X - 50, top: topF + th / 2 - 50, width: 100, height: 100, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: 96, color: "rgba(255,255,255,.35)", zIndex: 13 }, "=");
  // la card coi numeri e il grafico (statCard del kit): il numero parte dal valore di prima
  const fmt = o.fmt || ((v) => itNum(v));
  const card = statCard(L, X - cw / 2, yCard, { label: o.etichetta || "Visualizzazioni totali", icon: o.icona || "eye", w: cw, h: chh, fs: 140, start: fmt(o.da || 0), points: o.punti || [[0, 0], [0.2, 0.1], [0.4, 0.22], [0.55, 0.3], [0.7, 0.6], [0.85, 0.82], [1, 1]], z: 14 });
  // il badge finale (×2)
  const badge = el(L, { position: "absolute", left: X + cw / 2 - 250, top: yCard + 40, width: 190, height: 100, borderRadius: 24, background: limeFill(1), boxShadow: GLOW_A(0.9), display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: 70, color: K.ink, zIndex: 20 }, o.badge || "×2");
  gsap.set(badge, { opacity: 0 });
  // 1) prima del taglio: tutto in scena (statico) — niente da montare
  // 2) accento: il segno «=» si accende (stesso identico video)
  const tu = P.uguale == null ? t0 + 0.7 : P.uguale;
  if (uguale) { tl.to(uguale, { color: K.lime, textShadow: GLOW_LT, duration: 0.2 }, tu); fn.forEach((f) => tl.to(f.c, { borderColor: "rgba(207,251,80,.9)", duration: 0.2 }, tu)); }
  // 3) il conteggio: uno, lineare, con la linea del grafico; all'arrivo il punto con l'anello e il bagliore (statCard)
  const tc = P.conta == null ? t0 + 0.05 : P.conta;
  const ta = P.arriva == null ? tc + 1.0 : P.arriva;
  card.count(tc, o.da || 0, o.a || 100, Math.max(0.5, ta - tc), fmt, "none");
  // 4) accento finale: il badge
  const tf = P.finale == null ? ta + 0.1 : P.finale;
  popK(badge, tf, { da: 0.8, dur: 0.18 });
  // 5) la camera: arrivo di lato (reel 9) o la composizione (frusta R8); poi ferma
  const rect = [X - cw / 2 - 30, (fonti.length ? topF - 70 : yCard) - 20, X + cw / 2 + 30, yCard + chh + 30];
  let pose = fitPose(rect[0], rect[1], rect[2], rect[3], { top: 380 });
  if (o.ingresso !== "nessuno") pose = apertura(t0, t1, rect, { modo: o.ingresso || "arrivo", dx: 300, dy: 0, dur: 0.5, top: 380 });
  tplFermo0(scena, o);
  const T = tplTitoloK(scena, o);
  return {
    rect, pose,
    ancore: { card: [X, yCard + chh / 2], numero: [X - cw / 2 + 120, yCard + 120] },
    elementi: { card, fonti: fn, badge, titolo: T, L },
    tempi: { taglio: t0, conta: tc, arriva: ta, finale: tf },
  };
};
