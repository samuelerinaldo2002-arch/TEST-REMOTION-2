};

// O09 · forma che ruota e cambia forma (reel ~38 di Kallaway): esagono → pentagono → triangolo (≈1,4 s) e poi il triangolo si
// taglia in fasce (0,25 s) con le etichette. Forma lucida lime con il bordo chiaro e l'alone; i vertici sono 12 punti fissi, così
// GSAP interpola l'attributo d tra una forma e l'altra. o: { z }
const morphShape = (parent, cx, cy, r, o) => {
  o = o || {};
  const z = o.z || 12, N = 12;
  const poly = (k, rot) => { const V = []; for (let i = 0; i < k; i++) { const a = rot + (i / k) * Math.PI * 2; V.push([Math.cos(a) * r, Math.sin(a) * r]); } return V; };
  // distribuisce N punti lungo il perimetro del poligono (così ogni forma ha 12 punti)
  const spread = (V) => { const P = [], per = []; let tot = 0; for (let i = 0; i < V.length; i++) { const a = V[i], b = V[(i + 1) % V.length], l = Math.hypot(b[0] - a[0], b[1] - a[1]); per.push(l); tot += l; } for (let j = 0; j < N; j++) { let d = (j / N) * tot, i = 0; while (d > per[i]) { d -= per[i]; i++; } const a = V[i], b = V[(i + 1) % V.length], f = d / per[i]; P.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); } return P; };
  const D = (P) => "M" + P.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(" L") + " Z";
  const SH = { esagono: spread(poly(6, -Math.PI / 2)), pentagono: spread(poly(5, -Math.PI / 2)), triangolo: spread(poly(3, -Math.PI / 2)) };
  const g = layered(el(parent, { position: "absolute", left: cx, top: cy, width: 1, height: 1, zIndex: z }));
  const SV = svgIn(g, 1, 1);
  const gid = "ms" + ++SVGN;
  SV._defs.insertAdjacentHTML("beforeend", `<linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4ffd0"/><stop offset=".35" stop-color="#d9fd6a"/><stop offset=".7" stop-color="#CFFB50"/><stop offset="1" stop-color="#9fca2c"/></linearGradient>`);
  const halo = pathEl(SV, D(SH.esagono), { fill: K.lime, opacity: 0.3 });
  halo.style.filter = "blur(26px)";
  const body = pathEl(SV, D(SH.esagono), { fill: `url(#${gid})`, stroke: "#f6ffd8", "stroke-width": 4, "stroke-linejoin": "round" });
  body.style.filter = "drop-shadow(0 20px 30px rgba(0,0,0,.5))";
  // fasce del triangolo finale (per .slice)
  const T = poly(3, -Math.PI / 2), top = T[0][1], bot = T[1][1], H = bot - top;
  const xAt = (y, side) => { const f = (y - top) / H; return side * (T[1][0] * f); };
  let bands = [], labs = [];
  gsap.set(g, { opacity: 0 });
  const shape = { cur: "esagono" };
  return {
    g, rect: [cx - r - 40, cy - r - 40, cx + r + 40, cy + r + 40],
    show: (t) => { tl.fromTo(g, { opacity: 0, scale: 0.7, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false }, t); tl.set(g, { filter: "none" }, t + 0.51); },
    spin: (t, dur, deg) => tl.fromTo(SV, { rotation: 0 }, { rotation: deg || 120, duration: dur, ease: "power1.inOut", transformOrigin: "0px 0px", immediateRender: false }, t),
    morph: (t, to, dur) => { [body, halo].forEach((p) => tl.to(p, { attr: { d: D(SH[to]) }, duration: dur || 0.7, ease: "power2.inOut" }, t)); shape.cur = to; },
    // il triangolo si taglia in n fasce staccate (dal vertice alla base) con le etichette a destra
    slice: (t, etichette, oo) => {
      oo = oo || {};
      const n = etichette.length, gp = oo.gap || 18;
      tl.set(SV, { rotation: 0 }, t);
      tl.set([body, halo], { opacity: 0 }, t);
      bands = etichette.map((lb, i) => {
        const y0 = top + (H * i) / n, y1 = top + (H * (i + 1)) / n;
        const P = [[xAt(y0, -1), y0], [xAt(y0, 1), y0], [xAt(y1, 1), y1], [xAt(y1, -1), y1]];
        const p = pathEl(SV, "M" + P.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(" L") + " Z", { fill: `url(#${gid})`, stroke: "#f6ffd8", "stroke-width": 4, "stroke-linejoin": "round", opacity: 0 });
        tl.set(p, { attr: { opacity: 1 } }, t);
        tl.to(p, { y: (i - (n - 1) / 2) * gp, duration: 0.25, ease: "power3.out" }, t);
        const l = el(parent, { position: "absolute", left: cx + xAt((y0 + y1) / 2, 1) + 40, top: cy + (y0 + y1) / 2 + (i - (n - 1) / 2) * gp - 26, height: 52, display: "flex", alignItems: "center", padding: "0 20px", borderRadius: 14, background: "linear-gradient(180deg, rgba(56,56,56,.95), rgba(28,28,28,.97))", border: "1.5px solid rgba(255,255,255,.22)", fontFamily: FS, fontWeight: 800, fontSize: 28, color: K.white, whiteSpace: "nowrap", zIndex: z + 2 }, lb);
        gsap.set(l, { opacity: 0 });
        blurIn(l, t + 0.2 + i * 0.12, { x: -20, y: 0, blur: 8, dur: 0.3 });
        return p;
      });
    },
  };
};

// O17 · onda che sale e inghiotte (reel 32 di Kallaway): superficie scura col bordo lime ondulato (mai lime trasparente: il
// corpo è grafite) che scorre di lato; .rise(t, dy, dur) sale; .sink(node, t) l'elemento affonda in 0,8 s e diventa traslucido
// dietro l'onda. x0..x1 = estensione orizzontale · y = livello dell'acqua · o: { amp (18), z (davanti agli elementi) }
const sinkWave = (parent, x0, x1, y, o) => {
  o = o || {};
  const z = o.z || 30, amp = o.amp || 18, W = x1 - x0, depth = o.depth || 900;
  const g = el(parent, { position: "absolute", left: x0, top: y - amp * 2, width: W, height: depth, zIndex: z, overflow: "hidden", pointerEvents: "none" });
  const SV = svgIn(g, W, depth);
  const wv = (ph) => { let d = `M0 ${amp * 2}`; for (let i = 0; i <= 24; i++) { const x = (i / 24) * W * 2; d += ` L${x.toFixed(1)} ${(amp * 2 + Math.sin((i / 24) * Math.PI * 8 + ph) * amp).toFixed(1)}`; } return d; };
  const strip = el(g, { position: "absolute", left: 0, top: 0, width: W * 2, height: depth });
  const SS = svgIn(strip, W * 2, depth);
  const gid = "sw" + ++SVGN;
  SS._defs.insertAdjacentHTML("beforeend", `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3236" stop-opacity=".9"/><stop offset=".3" stop-color="#1b2124" stop-opacity=".94"/><stop offset="1" stop-color="#121618" stop-opacity=".97"/></linearGradient>`);
  const fillD = wv(0) + ` L${W * 2} ${depth} L0 ${depth} Z`;
  pathEl(SS, fillD, { fill: `url(#${gid})` });
  const crest = pathEl(SS, wv(0), { fill: "none", stroke: K.lime, "stroke-width": 5, "stroke-linejoin": "round" });
  crest.style.filter = "drop-shadow(0 0 10px rgba(207,251,80,.8))";
  gsap.set(g, { opacity: 0 });
  return {
    g,
    show: (t, dur) => { tl.fromTo(g, { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, t); tl.fromTo(strip, { x: 0 }, { x: -W, duration: dur || 6, ease: "none", immediateRender: false }, t); },
    rise: (t, dy, dur) => tl.to(g, { y: -dy, duration: dur || 1.2, ease: "power1.inOut" }, t),
    sink: (node, t, dist) => {
      tl.to(node, { y: dist || 300, rotation: (hash(t * 10, 3) > 0 ? 1 : -1) * 6, duration: 0.8, ease: "power2.in" }, t);
      tl.to(node, { opacity: 0.35, filter: "blur(3px) saturate(.4)", duration: 0.6 }, t + 0.25);
    },
  };
};

// O19 · costellazione (reel 60 di Kallaway): linee sottili bianche tra i punti, punti lime luminosi ai vertici, etichette che si
// scrivono; si disegna tratto per tratto (0,2 s l'uno). pts: [[x, y], …] · labels: testo per punto · o: { lato: per ogni punto
// "l" | "r" (default destra), fs (28) }
const constellation = (parent, S, pts, labels, o) => {
  o = o || {};
  const fs = o.fs || 28, z = o.z || 14;
  const segs = [];
  for (let i = 1; i < pts.length; i++) segs.push(connector(S, [pts[i - 1], pts[i]], { color: "rgba(255,255,255,.8)", w: 2.5 }));
  const dots = pts.map(([x, y]) => { const d = el(parent, { position: "absolute", left: x - 12, top: y - 12, width: 24, height: 24, borderRadius: "50%", background: "radial-gradient(circle at 40% 35%, #fbffe6, #CFFB50 60%, #a6d332)", boxShadow: `${GLOW_A(0.9)}`, zIndex: z }); gsap.set(d, { opacity: 0, scale: 0.3 }); return d; });
  const labs = pts.map(([x, y], i) => {
    const sd = (o.lato && o.lato[i]) || "r";
    const l = el(parent, { position: "absolute", left: sd === "r" ? x + 26 : x - 26 - 420, top: y - fs * 0.7, width: 420, textAlign: sd === "r" ? "left" : "right", fontFamily: FS, fontWeight: 800, fontSize: fs, color: K.white, textShadow: GLOW_T, whiteSpace: "nowrap", zIndex: z }, labels[i] || "");
    gsap.set(l, { opacity: 0 });
    return l;
  });
  return {
    dots, labs,
    draw: (t, step) => {
      step = step || 0.2;
      pts.forEach((_, i) => {
        const tt = t + i * step;
        if (i > 0) segs[i - 1].draw(tt - step, step, "none");
        tl.to(dots[i], { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(3)" }, tt);
        blurIn(labs[i], tt + 0.04, { x: 0, y: 8, blur: 8, dur: 0.25 });
      });
      return t + pts.length * step;
    },
  };
};

// C05 · circuito ad angoli retti (reel 49 di Kallaway): linea che va da a a b con un solo gomito a 90° arrotondato (prima in
// orizzontale o prima in verticale), si disegna in 0,3 s; .pulse(t) un punto lime corre lungo il tracciato.
// o: { prima: "h" | "v" (default h), raggio (18), color, w }
const circuit = (S, a, b, o) => {
  o = o || {};
  const R = o.raggio || 18, h = (o.prima || "h") === "h";
  const [x0, y0] = a, [x1, y1] = b, sx = Math.sign(x1 - x0) || 1, sy = Math.sign(y1 - y0) || 1;
  const d = h
    ? `M${x0} ${y0} L${x1 - sx * R} ${y0} Q${x1} ${y0} ${x1} ${y0 + sy * R} L${x1} ${y1}`
    : `M${x0} ${y0} L${x0} ${y1 - sy * R} Q${x0} ${y1} ${x0 + sx * R} ${y1} L${x1} ${y1}`;
  const p = pathEl(S, d, { fill: "none", stroke: o.color || "rgba(255,255,255,.85)", "stroke-width": o.w || 4, "stroke-linecap": "round", "stroke-linejoin": "round" });
  p.style.filter = "drop-shadow(0 0 6px rgba(255,255,255,.45))";
  const L = p.getTotalLength();
  p.setAttribute("stroke-dasharray", `${L.toFixed(1)} ${L.toFixed(1)}`); p.setAttribute("stroke-dashoffset", L.toFixed(1));
  return {
    p, L,
    draw: (t, dur) => tl.to(p, { attr: { "stroke-dashoffset": 0 }, duration: dur || 0.3, ease: "power2.out" }, t),
    pulse: (t, dur, parent) => {
      const q = layered(el(parent || S.parentNode, { position: "absolute", left: -9, top: -9, width: 18, height: 18, borderRadius: "50%", background: "#fff", boxShadow: "0 0 12px #fff, 0 0 26px rgba(207,251,80,.95)", opacity: 0, zIndex: 40 }));
      const U = { u: 0 }, NP = 120, PT = [];
      for (let i = 0; i <= NP; i++) { const pt = p.getPointAtLength((i / NP) * L); PT.push([pt.x + (S._ox || 0), pt.y + (S._oy || 0)]); }
      const put = () => { const f = U.u * NP, i = Math.min(NP - 1, Math.floor(f)), r = f - i; gsap.set(q, { x: PT[i][0] + (PT[i + 1][0] - PT[i][0]) * r, y: PT[i][1] + (PT[i + 1][1] - PT[i][1]) * r }); };
      tl.set(q, { opacity: 1 }, t);
      tl.fromTo(U, { u: 0 }, { u: 1, duration: dur || 0.6, ease: "power1.inOut", onUpdate: put, immediateRender: false }, t);
      tl.to(q, { opacity: 0, duration: 0.15 }, t + (dur || 0.6));
    },
  };
};

// F09 · mosaico / pixel (reel 132 di Kallaway): un'immagine vera del pool disegnata a blocchi su canvas; .resolve(t, dur) i blocchi
// scendono (36 → 24 → 14 → 8 → nitida) con lo sfarfallio di tinta lime ogni 2 fotogrammi: la "scansione" digitale.
// x, y, w, h nel parent · id dell'immagine nel pool ("av-tu", "th-…") · o: { b0 (36), r (raggio angoli), z }
const pixelate = (parent, x, y, w, h, id, o) => {
  o = o || {};
  const RS = 1.5, z = o.z || 14, b0 = o.b0 || 36;
  const wrap = el(parent, { position: "absolute", left: x, top: y, width: w, height: h, borderRadius: o.r == null ? 24 : o.r, overflow: "hidden", border: "2px solid rgba(255,255,255,.3)", boxShadow: "0 30px 70px rgba(0,0,0,.55)", zIndex: z });
  const cv = el(wrap, { position: "absolute", left: 0, top: 0, width: w, height: h }, null, "canvas");
  cv.width = Math.round(w * RS); cv.height = Math.round(h * RS);
  const ctx = cv.getContext("2d");
  const small = document.createElement("canvas"), sctx = small.getContext("2d");
  const img = document.getElementById(id);
  if (!img) throw new Error("pixelate: immagine non nel pool: " + id);
  const tint = el(wrap, { position: "absolute", inset: 0, background: K.lime, mixBlendMode: "multiply", opacity: 0 });
  // disegna con blocchi di b px (b ≤ 1: nitida); copre l'immagine come object-fit: cover
  const paint = (b) => {
    const iw = img.naturalWidth || w, ih = img.naturalHeight || h, k = Math.max(w / iw, h / ih), sw = w / k, sh = h / k, sx = (iw - sw) / 2, sy = (ih - sh) / 2;
    ctx.imageSmoothingEnabled = true;
    if (b <= 1.5) { ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height); return; }
    const cw = Math.max(1, Math.round(w / b)), ch = Math.max(1, Math.round(h / b));
    small.width = cw; small.height = ch;
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, cw, ch, 0, 0, cv.width, cv.height);
  };
  const B = { b: b0 };
  gsap.set(wrap, { opacity: 0 });
  return {
    wrap, rect: [x, y, x + w, y + h],
    show: (t) => { tl.set(wrap, { opacity: 1 }, t); tl.fromTo(B, { b: b0 }, { b: b0, duration: 0.01, onUpdate: () => paint(B.b), immediateRender: false }, t); },
    // la risoluzione sale a scatti (un livello ogni dur/4) con la tinta che sfarfalla
    resolve: (t, dur) => {
      dur = dur || 1.0;
      const L = [b0, 24, 14, 8, 1];
      L.forEach((b, i) => tl.fromTo(B, { b: L[Math.max(0, i - 1)] }, { b, duration: 0.01, onUpdate: () => paint(B.b), immediateRender: false }, t + (i * dur) / (L.length - 1)));
      for (let k = 0; k < Math.round((dur / (2 / 30)) * 0.6); k++) tl.set(tint, { opacity: k % 2 ? 0 : 0.45 }, t + k * (2 / 30));
      tl.set(tint, { opacity: 0 }, t + dur);
    },
  };
};

// ──── kit2-reel11.js ────
// ═══ KW kit v2 · REEL 11/10 "Non è la fotocamera, è la luce" (sessione 5) ═══════════════════════════════════
// File a parte (variante "una chat per reel"): nessuna funzione esistente del kit cambia; tutti i nomi hanno il suffisso R11.
// Solo definizioni: niente codice eseguito al caricamento (il build inlinea questo file in ogni composizione).
// La scala della luce: stanza con la lampadina (stanzaR11, lampadinaR11), il tuo reel con gli stati di luce (reelLuceR11),
// il telefono che registra (telefonoR11), il mirino con l'ISO e l'autofocus che cerca (mirinoR11), la finestra con i raggi
// (finestraR11), il controluce a tubo LED (ledR11), il cartellino del prezzo (cartellinoR11), il treppiede (treppiedeR11),
// la folla di 100 persone (follaR11) e la scala di 4 gradini con la folla sulle alzate (scalaR11).

let R11N = 0;

// ── stati di luce del tuo reel: filtro sul video + veli (nero, luce dall'alto, luce di lato, grana, vignetta) ──
// f = [brightness, contrast, saturate, sepia] · nero/alto/lato/grana/vign = opacità dei veli
const LUCI_R11 = {
  buio: { f: [0.36, 0.9, 0.42, 0.12], nero: 0.3, alto: 0, lato: 0, grana: 0.16, vign: 0.8 },
  lampadina: { f: [0.6, 1.14, 0.5, 0.5], nero: 0.08, alto: 0.7, lato: 0, grana: 0.38, vign: 0.88 },
  telefono: { f: [0.66, 0.86, 0.66, 0.24], nero: 0.1, alto: 0.32, lato: 0, grana: 0.22, vign: 0.62 },
  finestra: { f: [1.02, 0.98, 0.98, 0.12], nero: 0, alto: 0, lato: 0.85, grana: 0.04, vign: 0.22 },
  faro: { f: [1.08, 1.07, 1.06, 0], nero: 0, alto: 0, lato: 0.3, grana: 0, vign: 0.12 },
  controluce: { f: [1.1, 1.09, 1.08, 0], nero: 0, alto: 0, lato: 0.24, grana: 0, vign: 0.04 },
};
const filtroR11 = (f) => `brightness(${f[0]}) contrast(${f[1]}) saturate(${f[2]}) sepia(${f[3]})`;

// ═══ il tuo reel vero con la luce che cambia sopra di lui ═══════════════════════════════════════════════════
// (x, y, w, h) nel parent · vid = id del pool · o: { stato ("buio"), bare (senza cornice né maniglia: dentro uno schermo),
// z, play: [t0, dur] barra di avanzamento } → { f, vw, dietro, stato(t, nome, dur), sfarfalla(t, seq), grana(t0, t1, passo),
// rim(t) controluce: bordo lime + alone dietro, maniglia(t, a), rect }
const reelLuceR11 = (parent, x, y, w, h, vid, o) => {
  o = o || {};
  const z = o.z || 24, bare = !!o.bare, rad = bare ? 0 : Math.round(w * 0.07), s0 = LUCI_R11[o.stato || "buio"];
  // alone dietro al reel (il controluce lo stacca dallo sfondo): luce bianca calda, mai lime trasparente
  const dietro = bare ? null : el(parent, { position: "absolute", left: x - w * 0.5, top: y - h * 0.24, width: w * 2, height: h * 1.48, borderRadius: "50%", background: "radial-gradient(closest-side, rgba(255,253,240,.6), rgba(255,253,240,.2) 52%, rgba(255,253,240,0) 100%)", opacity: 0, zIndex: z - 1, pointerEvents: "none" });
  const f = el(parent, { position: "absolute", left: x, top: y, width: w, height: h, borderRadius: rad, overflow: "hidden", background: "#0e0e0e", border: bare ? "none" : "2px solid rgba(255,255,255,.26)", boxShadow: bare ? "none" : "0 40px 90px rgba(0,0,0,.62)", zIndex: z });
  const vw = el(f, { position: "absolute", left: 0, top: 0, width: w, height: h, filter: filtroR11(s0.f) });
  videoTile(vw, 0, 0, w, h, vid, 1);
  const velo = (bg, extra) => el(f, Object.assign({ position: "absolute", left: 0, top: 0, width: w, height: h, background: bg, pointerEvents: "none", zIndex: 2 }, extra || {}));
  const nero = velo("#000", { opacity: s0.nero });
  // lampadina nuda: chiazza gialla in alto, il resto affonda nell'ombra
  const alto = velo("radial-gradient(ellipse 78% 40% at 50% -6%, rgba(255,222,150,.6), rgba(255,222,150,0) 74%), linear-gradient(180deg, rgba(0,0,0,0) 28%, rgba(0,0,0,.66) 100%)", { opacity: s0.alto });
  // luce di lato (finestra, faro): il lato sinistro si scalda e si schiarisce, il destro resta in ombra morbida
  const lato = velo("linear-gradient(90deg, rgba(255,246,222,.5) 0%, rgba(255,246,222,.14) 40%, rgba(255,246,222,0) 62%)", { opacity: s0.lato, mixBlendMode: "screen" });
  const ombra = velo("linear-gradient(90deg, rgba(0,0,0,0) 52%, rgba(0,0,0,.3) 100%)", { opacity: s0.lato });
  // grana (poca luce = ISO alto): rumore vero con feTurbulence, il seme cambia nel tempo
  const gid = "grR11_" + ++R11N;
  const gr = el(f, { position: "absolute", left: 0, top: 0, width: w, height: h, opacity: s0.grana, mixBlendMode: "overlay", pointerEvents: "none", zIndex: 3 },
    `<svg width="${w}" height="${h}" style="display:block"><filter id="${gid}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#${gid})"/></svg>`);
  const turb = gr.querySelector("feTurbulence");
  const vign = velo("radial-gradient(ellipse 80% 64% at 50% 40%, rgba(0,0,0,0) 42%, rgba(0,0,0,.9) 100%)", { opacity: s0.vign, zIndex: 3 });
  const flk = velo("#000", { opacity: 0, zIndex: 4 });
  let hd = null, rimEl = null;
  if (!bare) {
    el(f, { position: "absolute", left: 0, bottom: 0, width: w, height: Math.round(h * 0.2), background: "linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6))", zIndex: 5 });
    const ad = Math.round(w * 0.11);
    hd = el(f, { position: "absolute", left: Math.round(w * 0.06), bottom: Math.round(w * 0.075), display: "flex", alignItems: "center", gap: Math.round(ad * 0.3), zIndex: 6 });
    const avb = el(hd, { position: "relative", width: ad, height: ad, borderRadius: "50%", overflow: "hidden", border: `2px solid ${K.white}`, flex: "none" });
    imgIn(avb, "av-tu", { objectFit: "cover" });
    el(hd, { fontFamily: FS, fontWeight: 700, fontSize: Math.round(w * 0.052), color: K.white, whiteSpace: "nowrap", textShadow: "0 1px 6px rgba(0,0,0,.8)" }, "samuelerinaldo.media");
    rimEl = el(f, { position: "absolute", left: 0, top: 0, width: w, height: h, borderRadius: rad, boxShadow: `inset 0 0 0 5px ${K.lime}, inset 0 0 34px rgba(255,255,255,.55)`, opacity: 0, zIndex: 7, pointerEvents: "none" });
    if (o.play) {
      const bar = el(f, { position: "absolute", left: 0, bottom: 0, width: w, height: 5, background: "rgba(255,255,255,.35)", zIndex: 8 });
      const prog = el(bar, { position: "absolute", left: 0, top: 0, width: w, height: 5, background: K.white, transformOrigin: "0 50%" });
      gsap.set(prog, { scaleX: 0 });
      tl.fromTo(prog, { scaleX: 0 }, { scaleX: 1, duration: o.play[1], ease: "none", immediateRender: false }, o.play[0]);
    }
  }
  const stato = (t, nome, dur) => {
    const s = LUCI_R11[nome];
    dur = dur == null ? 0.35 : dur;
    tl.to(vw, { filter: filtroR11(s.f), duration: dur, ease: "power2.out" }, t);
    tl.to(nero, { opacity: s.nero, duration: dur }, t);
    tl.to(alto, { opacity: s.alto, duration: dur }, t);
    tl.to([lato, ombra], { opacity: s.lato, duration: dur }, t);
    tl.to(gr, { opacity: s.grana, duration: dur }, t);
    tl.to(vign, { opacity: s.vign, duration: dur }, t);
  };
  return {
    f, vw, dietro, hd, rect: [x, y, x + w, y + h],
    stato,
    // la luce cala per qualche fotogramma (lampadina che sfarfalla): seq = [[dt, opacità del velo nero], …]
    sfarfalla: (t, seq) => (seq || [[0, 0.62], [0.07, 0.12], [0.13, 0.5], [0.2, 0]]).forEach(([dt, a]) => tl.to(flk, { opacity: a, duration: 0.03 }, t + dt)),
    grana: (t0, t1, passo) => { for (let k = 0, t = t0; t < t1; k++, t += passo || 0.08) tl.set(turb, { attr: { seed: 3 + (k % 11) } }, t); },
    rim: (t) => {
      if (!rimEl) return;
      tl.to(rimEl, { opacity: 1, duration: 0.18 }, t);
      tl.to(f, { borderColor: K.lime, boxShadow: `${GLOW_A(1.15)}, 0 40px 90px rgba(0,0,0,.62)`, duration: 0.25 }, t);
      if (dietro) tl.fromTo(dietro, { opacity: 0, scale: 0.78 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
    },
    rimOff: (t) => {
      if (!rimEl) return;
      tl.to(rimEl, { opacity: 0, duration: 0.25 }, t);
      tl.to(f, { borderColor: "rgba(255,255,255,.26)", boxShadow: "0 40px 90px rgba(0,0,0,.62)", duration: 0.25 }, t);
      if (dietro) tl.to(dietro, { opacity: 0, duration: 0.3 }, t);
    },
    maniglia: (t, a) => hd && tl.to(hd, { opacity: a, duration: 0.2 }, t),
  };
};

// ═══ stanza (cutaway): pareti, pavimento e soffitto in prospettiva ══════════════════════════════════════════════
// rettangolo davanti (x0, y0, w, h); la parete di fondo è rientrata di ix, iy. Listelli verticali sul fondo (come lo studio),
// assi del pavimento in prospettiva. .show(t, dur) gli spigoli si disegnano e le facce si riempiono · .back · .rect · .g
const stanzaR11 = (parent, x0, y0, w, h, o) => {
  o = o || {};
  const ix = o.ix || Math.round(w * 0.14), iy = o.iy || Math.round(h * 0.12), z = o.z || 8;
  const g = layered(el(parent, { position: "absolute", left: x0, top: y0, width: w, height: h, zIndex: z }));
  const SV = svgIn(g, w, h);
  const gid = "stR11_" + ++R11N;
  SV._defs.insertAdjacentHTML("beforeend",
    `<linearGradient id="${gid}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151515"/><stop offset="1" stop-color="#202020"/></linearGradient>` +
    `<linearGradient id="${gid}l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#1d1d1d"/></linearGradient>` +
    `<linearGradient id="${gid}r" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#1d1d1d"/></linearGradient>` +
    `<linearGradient id="${gid}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#3a3a3a"/></linearGradient>` +
    `<linearGradient id="${gid}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a1a"/><stop offset="1" stop-color="#232323"/></linearGradient>`);
  const A = [0, 0], B = [w, 0], C = [w, h], D = [0, h], a = [ix, iy], b = [w - ix, iy], c = [w - ix, h - iy], d = [ix, h - iy];
  const P = (pts) => "M" + pts.map((p) => p.join(" ")).join(" L") + " Z";
  const facce = [
    pathEl(SV, P([A, B, b, a]), { fill: `url(#${gid}c)` }),
    pathEl(SV, P([A, a, d, D]), { fill: `url(#${gid}l)` }),
    pathEl(SV, P([B, C, c, b]), { fill: `url(#${gid}r)` }),
    pathEl(SV, P([D, d, c, C]), { fill: `url(#${gid}f)` }),
    pathEl(SV, P([a, b, c, d]), { fill: `url(#${gid}b)` }),
  ];
  const det = [];
  // listelli verticali sulla parete di fondo e assi del pavimento che convergono
  for (let k = 1; k < 14; k++) { const xx = ix + ((w - 2 * ix) * k) / 14; det.push(pathEl(SV, `M${xx} ${iy + 6} L${xx} ${h - iy - 6}`, { stroke: "rgba(255,255,255,.085)", "stroke-width": 3 })); }
  for (let k = 1; k < 9; k++) { const u = k / 9; det.push(pathEl(SV, `M${ix + (w - 2 * ix) * u} ${h - iy} L${w * u} ${h}`, { stroke: "rgba(255,255,255,.1)", "stroke-width": 2.5 })); }
  const spigoli = [[a, b], [b, c], [c, d], [d, a], [A, a], [B, b], [C, c], [D, d]].map(([p, q]) => {
    const s = pathEl(SV, `M${p[0]} ${p[1]} L${q[0]} ${q[1]}`, { stroke: "rgba(255,255,255,.42)", "stroke-width": 3.5, "stroke-linecap": "round", fill: "none" });
    drawable(s);
    return s;
  });
  gsap.set([...facce, ...det], { opacity: 0 });
  return {
    g, SV, facce, spigoli, rect: [x0, y0, x0 + w, y0 + h], back: [x0 + ix, y0 + iy, x0 + w - ix, y0 + h - iy],
    show: (t, dur) => {
      dur = dur || 0.45;
      spigoli.forEach((s, k) => drawOn(s, t + (k % 4) * 0.04, dur, "power2.out"));
      tl.to([...facce, ...det], { opacity: 1, duration: dur, ease: "power1.out" }, t + 0.12);
    },
  };
};

// ═══ lampadina nuda appesa al soffitto ═══════════════════════════════════════════════════════════════════════
// filo da (cx, yTop) lungo len, portalampada, vetro a pera col filamento. Accesa = luce gialla spenta, cono duro verso il
// basso (o.cono = [larghezza in fondo, altezza]). .on(t) sfarfalla e si accende (F05) · .sfarfalla(t) · .off(t) · .dondola(t, dur)
const lampadinaR11 = (parent, cx, yTop, len, o) => {
  o = o || {};
  const bw = o.w || 64, bh = Math.round(bw * 1.42), z = o.z || 30, [cw, ch] = o.cono || [760, 900];
  const g = layered(el(parent, { position: "absolute", left: cx - bw, top: yTop, width: bw * 2, height: len + bh + 10, zIndex: z }));
  el(g, { position: "absolute", left: bw - 2, top: 0, width: 4, height: len + 4, background: "linear-gradient(90deg,#0c0c0c,#3c3c3c,#0c0c0c)" });
  el(g, { position: "absolute", left: bw - bw * 0.27, top: len, width: bw * 0.54, height: bw * 0.46, borderRadius: "7px 7px 3px 3px", background: "linear-gradient(90deg,#141414,#4c4c4c 46%,#181818)" });
  const gy = len + bw * 0.4;
  const pera = `M${bw * 0.72} ${gy} C${bw * 0.72} ${gy + bh * 0.22}, ${bw * 0.18} ${gy + bh * 0.4}, ${bw * 0.18} ${gy + bh * 0.66} C${bw * 0.18} ${gy + bh * 0.92}, ${bw * 0.6} ${gy + bh}, ${bw} ${gy + bh} C${bw * 1.4} ${gy + bh}, ${bw * 1.82} ${gy + bh * 0.92}, ${bw * 1.82} ${gy + bh * 0.66} C${bw * 1.82} ${gy + bh * 0.4}, ${bw * 1.28} ${gy + bh * 0.22}, ${bw * 1.28} ${gy} Z`;
  const SV = svgIn(g, bw * 2, len + bh + 10);
  const gid = "lpR11_" + ++R11N;
  SV._defs.insertAdjacentHTML("beforeend", `<radialGradient id="${gid}o" cx="0.42" cy="0.62" r="0.6"><stop offset="0" stop-color="#5c5c5c" stop-opacity=".55"/><stop offset="1" stop-color="#1f1f1f" stop-opacity=".85"/></radialGradient><radialGradient id="${gid}a" cx="0.5" cy="0.62" r="0.6"><stop offset="0" stop-color="#fffbe9"/><stop offset="0.45" stop-color="#ffe7a6"/><stop offset="1" stop-color="#d9a748"/></radialGradient>`);
  pathEl(SV, pera, { fill: `url(#${gid}o)`, stroke: "rgba(255,255,255,.35)", "stroke-width": 2 });
  const lit = pathEl(SV, pera, { fill: `url(#${gid}a)`, opacity: 0 });
  pathEl(SV, `M${bw * 0.8} ${gy + bh * 0.2} L${bw * 0.86} ${gy + bh * 0.55} L${bw} ${gy + bh * 0.48} L${bw * 1.14} ${gy + bh * 0.55} L${bw * 1.2} ${gy + bh * 0.2}`, { fill: "none", stroke: "rgba(120,100,60,.9)", "stroke-width": 2.5 });
  const cyB = yTop + gy + bh * 0.6;
  // alone e cono di luce (nel parent: restano dritti anche se la lampadina dondola)
  const alone = el(parent, { position: "absolute", left: cx - bw * 3.2, top: cyB - bw * 3.2, width: bw * 6.4, height: bw * 6.4, borderRadius: "50%", background: "radial-gradient(circle, rgba(255,240,196,.75) 0%, rgba(255,214,130,.28) 34%, rgba(255,214,130,0) 70%)", opacity: 0, zIndex: z - 1, mixBlendMode: "screen", pointerEvents: "none" });
  const cono = el(parent, { position: "absolute", left: cx - cw / 2, top: cyB, width: cw, height: ch, clipPath: `polygon(${(cw / 2 - bw * 0.9).toFixed(1)}px 0px, ${(cw / 2 + bw * 0.9).toFixed(1)}px 0px, ${cw}px ${ch}px, 0px ${ch}px)`, background: "linear-gradient(180deg, rgba(255,226,160,.34) 0%, rgba(255,226,160,.12) 55%, rgba(255,226,160,0) 100%)", filter: "blur(6px)", opacity: 0, zIndex: z - 2, mixBlendMode: "screen", pointerEvents: "none" });
  // chiazza di luce sul pavimento (o.pozza = [cx, cy, w, h])
  const pozza = o.pozza ? el(parent, { position: "absolute", left: o.pozza[0] - o.pozza[2] / 2, top: o.pozza[1] - o.pozza[3] / 2, width: o.pozza[2], height: o.pozza[3], borderRadius: "50%", background: "radial-gradient(closest-side, rgba(255,226,160,.42), rgba(255,226,160,.12) 60%, rgba(255,226,160,0) 100%)", opacity: 0, zIndex: z - 3, mixBlendMode: "screen", pointerEvents: "none" }) : null;
  const luci = pozza ? [lit, alone, cono, pozza] : [lit, alone, cono];
  return {
    g, luci, xy: [cx, cyB],
    on: (t) => [[0, 1], [0.05, 0.15], [0.11, 0.9], [0.17, 0.25], [0.24, 1]].forEach(([dt, a]) => tl.to(luci, { opacity: a, duration: 0.03 }, t + dt)),
    sfarfalla: (t) => [[0, 0.2], [0.06, 1], [0.12, 0.35], [0.18, 1]].forEach(([dt, a]) => tl.to(luci, { opacity: a, duration: 0.03 }, t + dt)),
    off: (t) => tl.to(luci, { opacity: 0, duration: 0.2 }, t),
    dondola: (t, dur) => {
      gsap.set(g, { transformOrigin: `${bw}px 0px` });
      const k = Math.max(1, Math.round(dur / 0.9));
      for (let i = 0; i < k; i++) tl.to(g, { rotation: i % 2 ? -2.2 : 2.2, duration: dur / k, ease: "sine.inOut" }, t + (i * dur) / k);
    },
  };
};

// ═══ treppiede: colonna e tre gambe in metallo scuro, da yTop (attacco) a yFloor (pavimento) ═════════════════════
const treppiedeR11 = (parent, cx, yTop, yFloor, o) => {
  o = o || {};
  const H = yFloor - yTop, sp = o.spread || Math.round(H * 0.5), z = o.z == null ? 11 : o.z, col = o.col || 14;
  const W = 2 * sp + 40, mx = sp + 20, hub = Math.round(H * (o.hub || 0.4));
  const g = layered(el(parent, { position: "absolute", left: cx - mx, top: yTop, width: W, height: H + 10, zIndex: z }));
  const SV = svgIn(g, W, H + 10);
  const metallo = (d, wd) => {
    pathEl(SV, d, { fill: "none", stroke: "#111", "stroke-width": wd + 3, "stroke-linecap": "round" });
    pathEl(SV, d, { fill: "none", stroke: "#474747", "stroke-width": wd, "stroke-linecap": "round" });
    pathEl(SV, d, { fill: "none", stroke: "rgba(255,255,255,.3)", "stroke-width": Math.max(1.5, wd * 0.24), "stroke-linecap": "round" });

// accendi(t, quanti, "bianco" | "lime" | "grigio", {riga, col}) in ordine di lettura (le righe si contano: 50 = 5 righe)
// te(t) la tua foto · lampo(t) tutti i dischi accesi lampeggiano · .dots · .tu
const COL_R11 = {
  spento: ["#2e2e2e", "rgba(255,255,255,.2)", "rgba(255,255,255,.32)", "0 0 0px rgba(0,0,0,0), 0 0 0px rgba(0,0,0,0)"],
  bianco: ["#ededea", "rgba(255,255,255,.95)", "#2c2c2c", "0 0 9px rgba(255,255,255,.55), 0 0 26px rgba(255,255,255,.18)"],
  lime: ["#CFFB50", "#efffc2", "#1e1e1e", "0 0 9px rgba(207,251,80,.7), 0 0 26px rgba(207,251,80,.28)"],
  grigio: ["#575757", "rgba(255,255,255,.22)", "#2a2a2a", "0 0 0px rgba(0,0,0,0), 0 0 0px rgba(0,0,0,0)"],
};
const follaR11 = (parent, x, y, o) => {
  o = o || {};
  const n = 10, p = o.p || 50, d = o.d || 38, io = o.io == null ? 4 : o.io, C0 = COL_R11.spento;
  const c = el(parent, { position: "absolute", left: x, top: y, width: (n - 1) * p + d, height: (n - 1) * p + d });
  const dots = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++)
    dots.push(el(c, { position: "absolute", left: i * p, top: j * p, width: d, height: d, borderRadius: "50%", overflow: "hidden", backgroundColor: C0[0], border: `1.5px solid ${C0[1]}`, color: C0[2], boxShadow: C0[3], display: "flex", alignItems: "flex-end", justifyContent: "center" }, svg("user-round", Math.round(d * 0.92), "currentColor", 2.3)));
  const tu = avatar(c, (io % n) * p + d / 2, Math.floor(io / n) * p + d / 2, Math.round(d * 1.42), "tu", { bw: 3, ring: K.lime, z: 5 });
  tu.setAttribute("data-layout-allow-overlap", "");
  gsap.set(tu, { opacity: 0, scale: 0.4 });
  const colora = (t, k, col) => { const C = COL_R11[col]; tl.to(dots[k], { backgroundColor: C[0], borderColor: C[1], color: C[2], boxShadow: C[3], duration: 0.1 }, t); };
  return {
    c, dots, tu,
    accendi: (t, quanti, col, o2) => {
      o2 = o2 || {};
      const rs = o2.riga == null ? 0.045 : o2.riga, cs = o2.col == null ? 0.012 : o2.col;
      for (let k = 0; k < quanti; k++) colora(t + Math.floor(k / n) * rs + (k % n) * cs, k, col || "bianco");
    },
    // a onda (F11): i dischi da da a a-1 passano a col
    tinta: (t, da, a, col, passo) => { for (let k = da; k < a; k++) colora(t + (k - da) * (passo == null ? 0.004 : passo), k, col); },
    te: (t) => { tl.to(tu, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2.6)" }, t); tl.to(dots[io], { opacity: 0, duration: 0.1 }, t); },
    lampo: (t, quanti) => {

      tl.to(acc, { scale: 1.22, duration: 0.09, ease: "power2.out" }, t);
      tl.to(acc, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t + 0.09);
    },
  };
};

// ═══ la scala della luce: 4 gradini 3D in grafite (O05/O07/O28: reel 4, 109, 90), sull'alzata il numero, la pill e la folla ═══
// x0 = bordo sinistro del gradino 1 · ground = pavimento · o: { n, w (pedata), r (alzata), dx, dy (profondità), pill: [testi], z }
// → { B, tread(i) {x0, x1, y}, faceRect(i), rect, rise(t, passo), num(i, t), edge(i, t, lime), pill(i, t) }
const scalaR11 = (parent, x0, ground, o) => {
  o = o || {};

      `<linearGradient id="${gid}s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#202020"/><stop offset="1" stop-color="#121212"/></linearGradient>`);
    pathEl(SV, `M0 ${dy} L${dx} 0 L${W + dx} 0 L${W} ${dy} Z`, { fill: `url(#${gid}t)`, stroke: "rgba(255,255,255,.16)", "stroke-width": 2 });
    if (last) pathEl(SV, `M${W} ${dy} L${W + dx} 0 L${W + dx} ${H} L${W} ${dy + H} Z`, { fill: `url(#${gid}s)` });
    pathEl(SV, `M0 ${dy} L${W} ${dy} L${W} ${dy + H} L0 ${dy + H} Z`, { fill: `url(#${gid}f)`, stroke: "rgba(255,255,255,.12)", "stroke-width": 2 });
    const edge = pathEl(SV, `M3 ${dy} L${W - 3} ${dy}`, { stroke: "rgba(255,255,255,.7)", "stroke-width": 5, "stroke-linecap": "round", opacity: 0 });
    edge.style.filter = "drop-shadow(0 0 6px rgba(255,255,255,.7))";

    edgeL.style.filter = "drop-shadow(0 0 12px rgba(207,251,80,.95))";
    const face = el(g, { position: "absolute", left: 0, top: dy, width: W, height: H });
    const num = el(face, { position: "absolute", left: 50, top: 22, fontFamily: FD, fontWeight: 700, fontSize: 168, lineHeight: 1, color: "#f4f4f2", textShadow: GLOW_T, whiteSpace: "nowrap", opacity: 0 }, String(i + 1));
    const pill = el(face, { position: "absolute", right: 48, top: 64, height: 96, padding: "0 34px", borderRadius: 48, display: "flex", alignItems: "center", fontFamily: FS, fontWeight: 800, fontSize: 54, color: K.ink, background: i ? limeFill(1) : "linear-gradient(180deg,#ffffff,#d9d9d3)", boxShadow: i ? `${GLOW_A(0.8)}, 0 16px 34px rgba(0,0,0,.5)` : "0 0 24px rgba(255,255,255,.35), 0 16px 34px rgba(0,0,0,.5)", whiteSpace: "nowrap", opacity: 0 }, testi[i]);
    const folla = follaR11(face, (W - (9 * 50 + 38)) / 2, 232, { io: 4 });
    gsap.set(g, { opacity: 0 });
    B.push({ g, left, top, H, num, pill, folla, edge, edgeL });
  }
  return {
    B, W, R, dx, dy,
    tread: (i) => ({ x0: x0 + i * W, x1: x0 + (i + 1) * W, y: ground - (i + 1) * R }),
    faceRect: (i) => [x0 + i * W - 12, ground - (i + 1) * R - 14, x0 + (i + 1) * W + 12, ground - (i + 1) * R + 760],
    rect: [x0, ground - n * R - dy, x0 + n * W + dx, ground],
    rise: (t, passo) => B.forEach((b, i) => {
      const tt = t + i * (passo == null ? 0.1 : passo);

    edge: (i, t, lime) => tl.to(lime ? B[i].edgeL : B[i].edge, { opacity: 1, duration: 0.15 }, t),
    pill: (i, t) => tl.fromTo(B[i].pill, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2.6)", immediateRender: false }, t),
  };
};

  const lab = el(parent, { position: "absolute", left: xm - 400, top: y - 30 - fs * 1.05, width: 800, display: "flex", alignItems: "baseline", justifyContent: "center", gap: Math.round(fs * 0.16), whiteSpace: "nowrap", zIndex: o.z || 30 });
  const n = el(lab, { fontFamily: FD, fontWeight: 700, fontSize: fs, lineHeight: 1, color: o.lime ? K.lime : "#ffffff", textShadow: o.lime ? GLOW_LT : GLOW_T }, o.num || "", "span");
  const w = el(lab, { fontFamily: FS, fontWeight: 800, fontSize: Math.round(fs * 0.42), color: o.lime ? K.lime : "#ffffff", textShadow: o.lime ? GLOW_LT : GLOW_T }, o.word || "", "span");
  gsap.set(lab, { opacity: 0 });
  return {
    p, lab, n, w,
    draw: (t, dur) => {
      drawOn(p, t, dur || 0.35, "power2.out");
      tl.fromTo(lab, { opacity: 0, y: 16, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power2.out", immediateRender: false }, t + 0.12);
      tl.set(lab, { filter: "none" }, t + 0.43);
    },
  };
};

// ── anello a n segmenti attorno a una foto (D10): .seg(i, t, "dai" | "chiedi", dur) disegna un segmento · .pulse(t) ─────────
// cx, cy: centro · r: raggio · o: { n (10), w (spessore 26), gap (gradi tra i segmenti, 5), z } → { S, segs, seg(i, t, kind, dur), pulse(t) }
const anelloR12 = (parent, cx, cy, r, o) => {
  o = o || {};
  const n = o.n || 10, w = o.w || 26, gap = o.gap == null ? 5 : o.gap, R = r + w;
  const box = el(parent, { position: "absolute", left: cx - R, top: cy - R, width: 2 * R, height: 2 * R, zIndex: o.z || 22 });
  box.setAttribute("data-layout-allow-overlap", "");
  const S = svgIn(box, 2 * R, 2 * R);
  const pt = (a) => [R + r * Math.cos(a), R + r * Math.sin(a)];
  const segs = [];
  for (let i = 0; i < n; i++) {
    const a0 = ((-90 + (i * 360) / n + gap / 2) * Math.PI) / 180, a1 = ((-90 + ((i + 1) * 360) / n - gap / 2) * Math.PI) / 180;
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    const base = pathEl(S, `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`, { fill: "none", stroke: "rgba(255,255,255,.14)", "stroke-width": w, "stroke-linecap": "butt" });
    const p = pathEl(S, `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`, { fill: "none", stroke: "#ffffff", "stroke-width": w, "stroke-linecap": "butt" });
    drawable(p);
    segs.push({ p, base });
  }
  gsap.set(box, { opacity: 0 });
  return {
    box, S, segs,
    show: (t, dur) => tl.to(box, { opacity: 1, duration: dur || 0.25 }, t),
    seg: (i, t, kind, dur) => {
      const lime = kind === "chiedi";
      segs[i].p.setAttribute("stroke", lime ? K.lime : "#ffffff");
      segs[i].p.style.filter = lime ? "drop-shadow(0 0 10px rgba(207,251,80,.9))" : "drop-shadow(0 0 8px rgba(255,255,255,.7))";
      drawOn(segs[i].p, t, dur || 0.14, "power1.out");
    },
    pulse: (t) => {
      tl.fromTo(box, { scale: 1 }, { scale: 1.06, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
      tl.to(box, { scale: 1, duration: 0.35, ease: "power2.out" }, t + 0.14);
    },
  };
};

// ──── kit2-reel13.js ────
// ═══ KW kit v2 · reel 13/10 "Le storie in evidenza" (sotto-agente della regia, 11/10) ════════════════════════════════════════
// File a parte (variante "una chat per reel"): nessuna funzione esistente cambia, tutti i nomi hanno il suffisso R13.
// Grammatica del reel: la PROFONDITÀ — la camera entra ed esce dagli oggetti (i cerchi delle storie in evidenza sono oblò).
// - zoomR13: camera in profondità (scala esponenziale = velocità percepita costante; il punto scelto scorre dritto sullo schermo)
// - obloInR13 / obloOutR13: L'OBLÒ (nuova, nello stile di K07 zoom-through + K13 match cut): corsa dentro un cerchio del mondo,
//   taglio sotto un filo di sfocatura, dall'altra parte l'iride della "stanza" ha lo stesso posto e la stessa misura sullo
//   schermo e si apre con la cornice d'acciaio; la copertina del cerchio si dissolve nella storia. L'uscita è il gesto inverso.
// - evidenzaR13: un cerchio delle storie in evidenza · profiloR13: il tuo profilo visto da chi arriva, con la fila delle evidenze
// - pillMsgR13 (i messaggi ricevuti) · stickerR13 (testo delle storie) · domandaR13 (lo sticker "Fammi una domanda") ·
//   dubbiR13 (chi guarda con i suoi dubbi) · tastoMsgR13 (il tasto "Messaggio" col lucchetto) · primaDopoR13 · cartellinoR13 ·
//   recensioneR13 · vetrinaR13 · reelFeedR13 (il tuo reel nel feed) · dmR13 (la chat del DM)

// ── camera in profondità ──────────────────────────────────────────────────────────────────────────────────────────────────────
// t, dur · (px, py) punto del mondo che scorre in linea retta sullo schermo fino a (o.sx, o.sy) (default: l'ancora 540, 880)
// mentre la scala va a s1 in modo esponenziale. Segmenti di un fotogramma del gestore kit2 (seek-safe, si tronca come move).
// o: { ease (curva della scala), easePos (curva dello spostamento sullo schermo: nelle entrate il cerchio va al centro presto,
//   power2.out, mentre lo zoom accelera, power2.in), sx, sy, steps }
const zoomR13 = (t, dur, px, py, s1, o) => {
  o = o || {};
  const a = camCut(t);
  Object.assign(CAM, a);
  const e = easeFn(o.ease || "power2.inOut"), ep = o.easePos ? easeFn(o.easePos) : e;
  const X0 = ANCHOR.x + (px - a.fx) * a.s, Y0 = ANCHOR.y + (py - a.fy) * a.s;
  const sx = o.sx == null ? ANCHOR.x : o.sx, sy = o.sy == null ? ANCHOR.y : o.sy;
  const N = o.steps || Math.max(6, Math.round(dur * 30));
  for (let k = 0; k < N; k++) {
    const u = e((k + 1) / N), v = ep((k + 1) / N), s = a.s * Math.pow(s1 / a.s, u);
    const X = X0 + (sx - X0) * v, Y = Y0 + (sy - Y0) * v;
    camK(t + (dur * k) / N, dur / N, px - (X - ANCHOR.x) / s, py - (Y - ANCHOR.y) / s, s, "none");
  }
  return { fx: CAM.fx, fy: CAM.fy, s: CAM.s };
};
// punto del mondo → posizione sullo schermo in una posa
const aSchermoR13 = (x, y, P) => [ANCHOR.x + (x - P.fx) * P.s, ANCHOR.y + (y - P.fy) * P.s];

// ── copertina di un cerchio (riusata dall'oblò) ───────────────────────────────────────────────────────────────────────────────
// cover: { img: id del pool } | { user: "tu" | handle } | { icon, bg, col } | { anon: true } | null
const copertinaR13 = (parent, d, cover) => {
  const f = el(parent, { position: "absolute", left: 0, top: 0, width: d, height: d, borderRadius: "50%", overflow: "hidden", background: (cover && cover.bg) || "#1c1c1e" });
  if (!cover) return f;
  if (cover.img) imgIn(f, cover.img, { objectFit: "cover" });
  else if (cover.user) imgIn(f, "av-" + cover.user, { objectFit: "cover" });
  else if (cover.anon) personaK(f, 0, 0, d, { z: 1 });
  else if (cover.icon) el(f, { position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }, svg(cover.icon, Math.round(d * 0.46), cover.col || K.ink, 2.3));
  return f;
};

// ── la cornice d'acciaio dell'oblò (anello lucido con i bulloni) attorno a un cerchio di raggio r ──────────────────────────────────
const corniceR13 = (parent, cx, cy, r, o) => {
  o = o || {};
  const R = r * 1.24, g = layered(el(parent, { position: "absolute", left: cx - R, top: cy - R, width: 2 * R, height: 2 * R, zIndex: o.z || 60, pointerEvents: "none" }));
  g.setAttribute("data-layout-allow-occlusion", "");
  // anello: gradiente conico d'acciaio, bucato al centro
  const ring = el(g, { position: "absolute", inset: 0, borderRadius: "50%", background: "conic-gradient(from 210deg, #f2f2f2, #7c7c7c 12%, #d9d9d9 24%, #5e5e5e 38%, #eeeeee 52%, #6c6c6c 66%, #cfcfcf 80%, #8a8a8a 90%, #f2f2f2)",
    WebkitMaskImage: `radial-gradient(circle, transparent ${(r / R) * 70.7 - 0.1}%, #000 ${(r / R) * 70.7 + 0.3}%)`, maskImage: `radial-gradient(circle, transparent ${(r / R) * 70.7 - 0.1}%, #000 ${(r / R) * 70.7 + 0.3}%)`,
    boxShadow: "0 24px 60px rgba(0,0,0,.6)" });
  // filo lime pieno sul bordo interno (la luce della stanza)
  el(g, { position: "absolute", left: R - r - 3, top: R - r - 3, width: 2 * r + 6, height: 2 * r + 6, borderRadius: "50%", border: `${Math.max(3, r * 0.035)}px solid ${K.lime}`, boxShadow: GLOW_A(0.8), boxSizing: "border-box" });
  // bulloni
  for (let k = 0; k < 8; k++) {
    const a = (k / 8) * Math.PI * 2 + Math.PI / 8, rb = (r + R) / 2, bd = (R - r) * 0.34;
    el(g, { position: "absolute", left: R + Math.cos(a) * rb - bd / 2, top: R + Math.sin(a) * rb - bd / 2, width: bd, height: bd, borderRadius: "50%", background: "radial-gradient(circle at 35% 30%, #ffffff 0%, #bdbdbd 40%, #5a5a5a 100%)", boxShadow: "0 2px 4px rgba(0,0,0,.6)" });
  }
  gsap.set(g, { opacity: 0 });
  return { g, ring, R, r };
};

// ── L'OBLÒ: entrata ───────────────────────────────────────────────────────────────────────────────────────────────────────────
// t = istante del taglio · c = { x, y, d } il cerchio da cui si entra (mondo) · room = { el (contenitore della stanza, livello
// 1×1 nel mondo, parte nascosto), x, y (centro dell'iride, mondo), pose (posa finale) } · o: { parent (livello del mondo per
// cornice e copertina), cover (come copertinaR13), pre (0.42 corsa nel cerchio), D (520, diametro a schermo al taglio),
// k (0.78: la stanza parte un filo più lontana e la camera continua ad avanzare), settle (0.55), iris (0.5), blur (5), z }
const obloInR13 = (t, c, room, o) => {
  o = o || {};
  const pre = o.pre || 0.42, D = o.D || 520, settle = o.settle || 0.45, iris = o.iris || 0.42, par = o.parent || room.el.parentNode; // confronto con K07/K13: più secco
  // 1 · la corsa nel cerchio; la cornice compare attorno al cerchio mentre ci si avvicina
  const F1 = corniceR13(par, c.x, c.y, c.d / 2, { z: o.z || 70 });
  tl.fromTo(F1.g, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: pre * 0.6, ease: "power2.out", immediateRender: false }, t - pre * 0.75);
  tl.set(F1.g, { opacity: 0 }, t);
  zoomR13(t - pre, pre, c.x, c.y, D / c.d, { ease: "power2.in", easePos: "power2.out" });
  tl.fromTo(mbwrap, { filter: "blur(0px)" }, { filter: `blur(${o.blur || 5}px)`, duration: pre * 0.45, ease: "power2.in", immediateRender: false }, t - pre * 0.45);
  // 2 · il taglio: la stanza con l'iride della stessa misura sullo schermo, la camera continua ad avanzare e si assesta
  const P = room.pose, s0 = P.s * (o.k || 0.78), r0 = D / 2 / s0;
  const [Xf, Yf] = aSchermoR13(room.x, room.y, P);
  const R = (Math.hypot(1080, 1920) / 2 + Math.hypot(Xf - 540, Yf - 960)) / P.s + 40;
  cutTo(t, room.x, room.y, s0);
  zoomR13(t, settle, room.x, room.y, P.s, { ease: "power2.out", sx: Xf, sy: Yf });
  tl.to(mbwrap, { filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, t);
  tl.set(mbwrap, { filter: "none" }, t + 0.23);
  // 3 · l'iride si apre
  tl.set(room.el, { opacity: 1, clipPath: `circle(${r0.toFixed(1)}px at ${room.x}px ${room.y}px)` }, t);
  tl.to(room.el, { clipPath: `circle(${R.toFixed(1)}px at ${room.x}px ${room.y}px)`, duration: iris, ease: "power2.in" }, t);
  tl.set(room.el, { clipPath: "none" }, t + iris + 0.02);
  // 4 · cornice e copertina dalla parte della stanza: crescono con l'iride, la copertina si dissolve nella storia
  const F2 = corniceR13(par, room.x, room.y, r0, { z: (o.z || 70) + 1 });
  tl.set(F2.g, { opacity: 1 }, t);
  tl.to(F2.g, { scale: R / r0, duration: iris, ease: "power2.in" }, t);
  tl.to(F2.g, { opacity: 0, duration: iris * 0.45, ease: "power1.in" }, t + iris * 0.4);
  if (o.cover !== undefined) {
    const cw = layered(el(par, { position: "absolute", left: room.x - r0, top: room.y - r0, width: 2 * r0, height: 2 * r0, zIndex: (o.z || 70) - 1, pointerEvents: "none" }));
    copertinaR13(cw, 2 * r0, o.cover);
    gsap.set(cw, { opacity: 0 });
    tl.set(cw, { opacity: 1 }, t);
    tl.to(cw, { scale: 1.35, opacity: 0, duration: 0.3, ease: "power1.in" }, t + 0.04);
  }
  return { r0, R, end: t + Math.max(settle, iris) };
};

// ── L'OBLÒ: uscita ────────────────────────────────────────────────────────────────────────────────────────────────────────────
// t = istante del taglio · room = { el, x, y } · c = { x, y, d } il cerchio in cui si torna · o: { pose (posa d'arrivo nel mondo
// di partenza), cover, pre (0.4), D (520), k (0.85), out (0.6), parent, z }
const obloOutR13 = (t, room, c, o) => {
  o = o || {};
  const pre = o.pre || 0.4, D = o.D || 520, out = o.out || 0.6, par = o.parent || room.el.parentNode;
  const a = camCut(t - pre);
  Object.assign(CAM, a);
  const s1 = a.s * (o.k || 0.85), r1 = D / 2 / s1;
  const [Xa, Ya] = aSchermoR13(room.x, room.y, a);
  const R = (Math.hypot(1080, 1920) / 2 + Math.hypot(Xa - 540, Ya - 960)) / a.s + 40;
  // 1 · l'iride si chiude sul centro della stanza, che va al centro dello schermo
  zoomR13(t - pre, pre, room.x, room.y, s1, { ease: "power2.in" });
  tl.set(room.el, { clipPath: `circle(${R.toFixed(1)}px at ${room.x}px ${room.y}px)` }, t - pre);
  tl.to(room.el, { clipPath: `circle(${r1.toFixed(1)}px at ${room.x}px ${room.y}px)`, duration: pre, ease: "power2.in" }, t - pre);
  const F2 = corniceR13(par, room.x, room.y, r1, { z: (o.z || 70) + 1 });
  tl.fromTo(F2.g, { opacity: 0, scale: R / r1 }, { opacity: 1, scale: 1, duration: pre, ease: "power2.in", immediateRender: false }, t - pre);
  tl.set(F2.g, { opacity: 0 }, t);
  if (o.cover !== undefined) {
    const cw = layered(el(par, { position: "absolute", left: room.x - r1, top: room.y - r1, width: 2 * r1, height: 2 * r1, zIndex: (o.z || 70) - 1, pointerEvents: "none" }));
    copertinaR13(cw, 2 * r1, o.cover);
    gsap.set(cw, { opacity: 0 });
    tl.to(cw, { opacity: 1, duration: 0.18, ease: "power1.in" }, t - 0.2);
    tl.set(cw, { opacity: 0 }, t);
  }
  tl.fromTo(mbwrap, { filter: "blur(0px)" }, { filter: "blur(4px)", duration: 0.16, ease: "power2.in", immediateRender: false }, t - 0.16);
  // 2 · il taglio sul cerchio piccolo e la camera esce all'indietro fino alla posa d'arrivo
  tl.set(room.el, { opacity: 0 }, t);
  cutTo(t, c.x, c.y, D / c.d);
  const F1 = corniceR13(par, c.x, c.y, c.d / 2, { z: o.z || 70 });
  tl.set(F1.g, { opacity: 1 }, t);
  tl.to(F1.g, { opacity: 0, duration: out * 0.6, ease: "power1.out" }, t + 0.05);
  const P = o.pose, [Xf, Yf] = aSchermoR13(c.x, c.y, P);
  zoomR13(t, out, c.x, c.y, P.s, { ease: "power2.out", sx: Xf, sy: Yf });
  tl.to(mbwrap, { filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, t);
  tl.set(mbwrap, { filter: "none" }, t + 0.21);
  return { end: t + out };
};

// ── un cerchio delle storie in evidenza ───────────────────────────────────────────────────────────────────────────────────────
// o: { cover (come copertinaR13), vuoto (numero del posto vuoto: cerchio tratteggiato col numero), nome, ring ("grigio" | "lime"),
//      fs, lw, z } → { g, face, lab, num, lime(t), grey(t), load(t, dur), numOn(t), fill(t, cover, nome), d }
const evidenzaR13 = (parent, cx, cy, d, o) => {
  o = o || {};
  const g = el(parent, { position: "absolute", left: cx - d / 2, top: cy - d / 2, width: d, height: d, zIndex: o.z || 4 });
  const bw = Math.max(2, Math.round(d * 0.028)), gp = Math.max(3, Math.round(d * 0.05)), cd = d - 2 * bw - 2 * gp;
  const ringG = el(g, { position: "absolute", inset: 0, borderRadius: "50%", background: "#48484b", opacity: o.vuoto ? 0 : 1 });
  const ringL = el(g, { position: "absolute", inset: 0, borderRadius: "50%", background: LIME_RING, boxShadow: GLOW_A(0.7), opacity: o.ring === "lime" ? 1 : 0 });
  const inner = el(g, { position: "absolute", left: bw, top: bw, width: d - 2 * bw, height: d - 2 * bw, borderRadius: "50%", background: "#000", opacity: o.vuoto ? 0 : 1 });
  const fw = el(g, { position: "absolute", left: bw + gp, top: bw + gp, width: cd, height: cd, borderRadius: "50%", overflow: "hidden" });
  let face = o.cover ? copertinaR13(fw, cd, o.cover) : null;
  // posto vuoto: cerchio tratteggiato con il numero (come le voci-segnaposto sfocate di L01)
  let dash = null, num = null, numOn = null;
  if (o.vuoto) {
    dash = el(g, { position: "absolute", inset: 0, borderRadius: "50%", border: `${Math.max(3, d * 0.035)}px dashed rgba(255,255,255,.42)`, boxSizing: "border-box" });
    num = el(g, { position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: Math.round(d * 0.42), color: "rgba(255,255,255,.5)" }, String(o.vuoto));
    numOn = el(g, { position: "absolute", left: d * 0.12, top: d * 0.12, width: d * 0.76, height: d * 0.76, borderRadius: "50%", background: limeFill(1), boxShadow: GLOW_A(0.9), display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: Math.round(d * 0.42), color: K.ink, opacity: 0 }, String(o.vuoto));
  }
  let lab = null;
  const fs = o.fs || Math.round(d * 0.19), lw = o.lw || d * 1.12;
  lab = el(g, { position: "absolute", left: (d - lw) / 2, top: d + fs * 0.4, width: lw, textAlign: "center", fontFamily: FS, fontWeight: 600, fontSize: fs, color: "rgba(255,255,255,.92)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }, o.nome || "");
  // anello che gira mentre la storia si carica (come in Instagram)
  const S = svgIn(g, d, d);
  const spin = pathEl(S, `M ${d / 2} ${bw / 2 + 1} A ${d / 2 - bw / 2 - 1} ${d / 2 - bw / 2 - 1} 0 1 1 ${d / 2 - 0.01} ${bw / 2 + 1}`, { fill: "none", stroke: "#ffffff", "stroke-width": bw + 2, "stroke-dasharray": `${d * 0.22} ${d * 0.09}`, "stroke-linecap": "round" });
  S.style.transformOrigin = "50% 50%";
  gsap.set(S, { opacity: 0 });
  const api = {
    g, fw, face, lab, num, numOn, dash, ringG, ringL, d, cx, cy,
    lime: (t, dur) => { tl.to(ringL, { opacity: 1, duration: dur || 0.2 }, t); tl.to(ringG, { opacity: 0, duration: dur || 0.2 }, t); },
    grey: (t) => { tl.to(ringL, { opacity: 0, duration: 0.2 }, t); tl.to(g, { filter: "grayscale(1) brightness(.5)", duration: 0.3 }, t); },
    load: (t, dur) => { tl.set(S, { opacity: 1 }, t); tl.fromTo(S, { rotation: 0 }, { rotation: 360 * dur * 1.2, duration: dur, ease: "none", immediateRender: false }, t); tl.set(S, { opacity: 0 }, t + dur); },
    numOn: (t) => { tl.to(numOn, { opacity: 1, duration: 0.12 }, t); tl.fromTo(numOn, { scale: 0.4 }, { scale: 1, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, t); tl.to(num, { opacity: 0, duration: 0.12 }, t); tl.to(dash, { borderColor: "rgba(207,251,80,.9)", duration: 0.15 }, t); },
    // la copertina vera si posa nel posto vuoto: anello, nero e copertina compaiono, il numero lascia il posto
    fill: (t, cover, nome) => {
      const nf = copertinaR13(fw, cd, cover);
      gsap.set(nf, { opacity: 0 });
      tl.set([inner, nf], { opacity: 1 }, t);
      tl.set(ringL, { opacity: 1 }, t);
      if (dash) tl.set([dash, numOn, num], { opacity: 0 }, t);
      if (nome) { lab.textContent = ""; typeIn(lab, nome, t + 0.1, 26); }
      api.face = nf;
      return nf;
    },
  };
  return api;
};

// ── il tuo profilo visto da chi arriva (vecchio stile, dark), con la fila delle storie in evidenza ─────────────────────────────────
// o: { user, handle, nome, bio: [righe], grid: [id video], evidenze: [{ cover, nome }], ring ("ig" | "lime"), z }
// → phone2 + { stat, cells, msgBtn, seguiBtn, row (contenitore della fila, scorre in x), ev (cerchi iniziali), HD, HP, HY, BY,
//   TY, GY, evLocal(i) (centro nello schermo), evXY(i, scroll) (mondo), msgXY(), backXY(), avXY(), bioRect(), partY(y) (mondo) }

// ═══ KW kit v2 · RITMO — regole R1–R6 misurate su Kallaway (CATALOGO-ANIMAZIONI/_analisi/ritmo/RITMO.md) ══════════════
// Il cambio di comportamento (niente back.out) vale SOLO nelle composizioni che hanno il marcatore "KW_RITMO" nel sorgente
// (build.cjs → const KW_RITMO = true), come KW_FISSO al contrario. Senza il marcatore questo file aggiunge solo funzioni
// nuove e non cambia niente: verificato il 13/10 con le snapshot di demo-8 (differenza 0). I template (kit2-template.js)
// usano queste funzioni.

// ── safe zone dell'11/10 (SAFEZONE.jpg): da y = 1332 in giù c'è la faccia → con KW_RITMO fitPose / apertura / i template
// inquadrano sopra y = 1290 (nella shell la maschera di #safe sfuma tra 1288 e 1330, come nei reel 11–13) ──
if (KW_RITMO) BAND.y1 = 1290;

// ── R5 · niente rimbalzi ──
// Con KW_RITMO ogni ease "back.*" con parametro > 1,2 (senza parametro GSAP usa 1,7), scritta nel kit o nella composizione,
// diventa la curva morbida corrispondente (back.out → power2.out, back.in → power2.in, back.inOut → power2.inOut) con la
// stessa durata: i pop di scala del kit (back.out(2–3)) crescono senza passare oltre la misura. Resta solo il colpo voluto
// (timbro F12): back.out(≤ 1,2) oppure una funzione di ease. Kallaway: 67% dei movimenti di camera senza overshoot, 8 entrate
// di elementi su 8 senza rimbalzo visibile.
const senzaRimbalzo = (e) => {
  const m = /^back\.(out|inOut|in)(?:\(\s*([\d.]+)\s*\))?$/.exec(e);
  if (!m || (m[2] != null && +m[2] <= 1.2)) return e;
  return m[1] === "in" ? "power2.in" : m[1] === "inOut" ? "power2.inOut" : "power2.out";
};
if (KW_RITMO) [["to", 1], ["from", 1], ["fromTo", 2]].forEach(([m, k]) => {
  const f = tl[m].bind(tl);
  tl[m] = (...a) => {
    const v = a[k];
    if (v && typeof v.ease === "string") a[k] = Object.assign({}, v, { ease: senzaRimbalzo(v.ease) });
    return f(...a);
  };
});

// ── R5 · pop morbido (al posto dei pop con back.out) ──
// Opacità + scala da → 1 in 0,1–0,2 s con power2.out, senza rimbalzo. Misurati: badge views 0,66 → 1 in 0,13 s (reel 1),
// loghi in dissolvenza a scala piena in 0,13 s (reel 6). o: { da (scala iniziale, 0.8), dur (0.15), y (px di salita), stagger }
const popK = (target, t, o) => {
  o = o || {};
  const a = { opacity: 0, scale: o.da == null ? 0.8 : o.da }, b = { opacity: 1, scale: 1 };
  if (o.y) { a.y = o.y; b.y = 0; }
  gsap.set(target, a);
  tl.to(target, Object.assign(b, { duration: o.dur || 0.15, ease: "power2.out", stagger: o.stagger || 0 }), t);
};

// ── R4 · spinta: la deriva lunga, solo per un oggetto solo che si legge (termometro, documento) ──
// Reel 72: +9,6% in 2,4 s con power2.out, il contenuto scivola un po' verso il punto che conta (+78/+23 px), poi quasi fermo.
// o: { ds (0.09), dur (2.4), dx, dy (px schermo di cui si sposta la camera: negativi = il contenuto scivola a destra / in
//      basso), coda (s di coda quasi ferma dopo la spinta, 0 = nessuna), dsCoda (0.01), dxCoda, dyCoda }
const spinta = (t, o) => {
  o = o || {};
  const dur = o.dur || 2.4, s0 = CAM.s;
  camK(t, dur, CAM.fx + (o.dx || 0) / s0, CAM.fy + (o.dy || 0) / s0, s0 * (1 + (o.ds == null ? 0.09 : o.ds)), "power2.out");
  if (o.coda > 0.05) camK(t + dur, o.coda, CAM.fx + (o.dxCoda || 0) / CAM.s, CAM.fy + (o.dyCoda || 0) / CAM.s, CAM.s * (1 + (o.dsCoda == null ? 0.01 : o.dsCoda)), "sine.out");
};

// ── R2 + R3 · apertura di una scena sul suo rettangolo del mondo ──
// Al taglio (t0) la scena è già piena; parte subito UN movimento principale che frena forte, poi la camera tiene quasi ferma
// (deriva dell'1–2% che si spegne) fino a t1. Misure (RITMO.md §2): arrivo −112 px expo.out (reel 31), −160 px in 0,75 s
// (reel 98), −137 px expo.out (reel 65); zoom +16% in 0,35 s (reel 69), +15% in 0,4 s (reel 49); spinta +9,6% in 2,4 s (72).
// modo: "arrivo" (default) — la scena entra dal basso o di lato (dx, dy px schermo; default dy 140) in dur 0,7 s, expo.out
//       "zoom"   — si avvicina del ds (0.15) in dur 0,4 s, power2.out
//       "spinta" — R4, un oggetto solo che si legge; o.spinta = opzioni di spinta() (la coda arriva fino a t1)
//       "fermo"  — la camera sta ferma: il movimento principale è dell'oggetto (riempimento o conteggio dal primo fotogramma)
// o: { modo, top, bottom, fill (come fitPose), dx, dy, ds, dur, tenuta (zoom della tenuta, 0.012), blur (scia all'arrivo, 0),
//      posa (in coda, correzioni del blocco 1: una posa { fx, fy, s } già calcolata al posto di fitPose(rect), es. il telefono
//      nella proporzione di Kallaway; senza posa = come prima) }
// → la posa inquadrata { fx, fy, s }
const apertura = (t0, t1, rect, o) => {
  o = o || {};
  const p = o.posa || fitPose(rect[0], rect[1], rect[2], rect[3], o);
  const modo = o.modo || "arrivo";
  let fine = t0;
  if (modo === "arrivo") {
    const dx = o.dx || 0, dy = o.dy == null ? (o.dx ? 0 : 140) : o.dy, dur = o.dur || 0.7;
    cutTo(t0, p.fx - dx / p.s, p.fy - dy / p.s, p.s);
    camK(t0, dur, p.fx, p.fy, p.s, "expo.out");
    if (o.blur) mblur(t0, 0.25, o.blur, Math.abs(dx) > Math.abs(dy) ? "x" : "y", "decay");
    fine = t0 + dur;
  } else if (modo === "zoom") {
    const ds = o.ds == null ? 0.15 : o.ds, dur = o.dur || 0.4;
    cutTo(t0, p.fx, p.fy, p.s / (1 + ds));
    camK(t0, dur, p.fx, p.fy, p.s, "power2.out");
    fine = t0 + dur;
  } else if (modo === "spinta") {
    cutTo(t0, p.fx, p.fy, p.s);
    const sp = o.spinta || {};
    spinta(t0, Object.assign({ coda: Math.max(0, t1 - t0 - (sp.dur || 2.4)) }, sp));
    return p;
  } else cutTo(t0, p.fx, p.fy, p.s);
  // R3 · tenuta: la camera quasi ferma, deriva dell'1–2% che si spegne
  if (t1 - fine > 0.3) camK(fine, t1 - fine, CAM.fx, CAM.fy, CAM.s * (1 + (o.tenuta == null ? 0.012 : o.tenuta)), "sine.out");
  return p;
};

// ── R2 · scena piena al taglio: gli oggetti si montano PRIMA di t0 ──
// Si costruiscono mentre si vede ancora la scena prima (sono altrove nel mondo, fuori campo). montaT(t0) = { t, dur, fine }:
// i build del kit partono a t con durata dur e devono essere finiti entro fine (0,1 s prima del taglio; i build con le
// cascate, come ladder.build, durano più di dur: controllare la snapshot al taglio). Per la prima scena (t0 < 1 s)
// restituisce null: il template mette gli oggetti già pieni con gsap.set (fotogramma 0 pieno, regola 24).
const montaT = (t0) => (t0 >= 1 ? { t: t0 - 1, dur: 0.35, fine: t0 - 0.1 } : null);

// ── R7 (da provare nel blocco 1, poi ok dell'utente): sfondo fermo ──
// Nel reel 72 la griglia di fondo e il titolo restano fermi mentre il contenuto deriva. sfondoFermo() stacca i puntini dalla
// camera: restano fermi nello sfondo, il titolo è già fermo (HUD). Si chiama una volta, prima delle scene.
// Blocco 1 (opzione in coda, senza argomento non cambia niente): sfondoFermo([[t0, t1], …]) tiene fermi i puntini SOLO dentro le
// finestre (la tenuta delle scene) e li lascia seguire la camera fuori (transizioni morbide R8, whip): una copia ferma dei
// puntini nello sfondo si accende nelle finestre e quelli della camera si spengono. Le finestre che si toccano (scene col
// taglio netto) si uniscono. I template registrano la loro finestra con o.fermo (kit2-template.js, tplFermo()).
const sfondoFermo = (finestre) => {
  const d = document.getElementById("dots"), g = document.getElementById("gcam"), bg = document.getElementById("bg");
  if (!d || !g || !bg) return;
  if (!finestre) { if (d.parentNode !== bg) bg.insertBefore(d, g); return; }
  if (!finestre.length) return;
  const f = d.cloneNode(false);
  f.id = "dotsFermi";
  f.setAttribute("data-layout-allow-overflow", "");
  bg.insertBefore(f, g);
  gsap.set(f, { opacity: 0 });
  const W = finestre.slice().sort((a, b) => a[0] - b[0]).reduce((acc, w) => {
    const l = acc[acc.length - 1];
    if (l && w[0] <= l[1] + 0.05) l[1] = Math.max(l[1], w[1]); else acc.push([w[0], w[1]]);
    return acc;
  }, []);
  W.forEach(([a, b]) => { tl.set(f, { opacity: 1 }, a); tl.set(g, { opacity: 0 }, a); tl.set(f, { opacity: 0 }, b); tl.set(g, { opacity: 1 }, b); });
};

// ──── kit2-storie.js ────
// ═══ KW kit v2 · storie di Instagram (reel 10/10 "l'algoritmo delle storie", servono anche al 13/10) ═══════════════
// UI del vecchio stile (come igDrafts / igShare): telefono vero, schermate realistiche, il dito che preme. File a parte: non
// cambia nessuna funzione usata dai reel approvati.
// - storyCircle / storyRow: i cerchi delle storie (anello a gradiente = da vedere, grigio = vista, lime = spinta/scelta)
// - igHome: la home con la fila delle storie e un post · igStoryEdit: l'editor con "La tua storia" · igStoryView: la storia
//   aperta (barra a segmenti, nome e ora, "Invia messaggio", cuore, condividi)
// - algoPill: la pill `<Algoritmo/>` del reel 40 di Kallaway (bordo luminoso, testo in stile codice che si decodifica)
// - orologio: quadrante d'acciaio con le lancette (l'ora di pubblicazione)
// - sagomaK / personaK: la persona qualunque di profilo del reel 09 (sagoma nera sul disco bianco), per chi guarda

const IG_GRAD = "linear-gradient(45deg,#feda75 0%,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5 100%)";
const LIME_RING = "linear-gradient(135deg,#f4ffc8 0%,#CFFB50 45%,#a6d136 100%)";

// figura umana di profilo (testa e spalle), rivolta a destra; o.flip la gira (stessa sagoma del reel 09)
const sagomaK = (parent, x, y, W, o) => {
  o = o || {};
  const P = [[0.30, 1.25], [0.30, 1.06], [0.24, 0.97], [0.17, 0.83], [0.05, 0.62], [0.06, 0.30], [0.24, 0.14], [0.40, 0.01], [0.68, -0.01], [0.82, 0.11], [0.92, 0.20], [0.94, 0.33], [0.93, 0.42], [0.93, 0.47], [0.97, 0.50], [0.99, 0.53], [1.07, 0.63], [1.07, 0.66], [1.03, 0.68], [1.0, 0.69], [1.02, 0.72], [1.0, 0.74], [1.01, 0.77], [0.98, 0.79], [0.99, 0.83], [0.95, 0.88], [0.86, 0.90], [0.76, 0.92], [0.70, 1.0], [0.70, 1.24], [1.02, 1.33], [1.22, 1.46], [1.3, 1.72], [-0.32, 1.72], [-0.24, 1.47], [-0.02, 1.34]];
  const ox = 0.34 * W, X = (u) => ((o.flip ? 0.98 - u : u) * W + ox).toFixed(1), Y = (v) => (v * W + 0.03 * W).toFixed(1), n = P.length;
  let d = `M${X(P[0][0])} ${Y(P[0][1])}`;
  for (let i = 1; i <= n; i++) {
    const p0 = P[(i - 2 + n) % n], p1 = P[(i - 1) % n], p2 = P[i % n], p3 = P[(i + 1) % n];
    d += ` C${X(p1[0] + (p2[0] - p0[0]) / 6)} ${Y(p1[1] + (p2[1] - p0[1]) / 6)} ${X(p2[0] - (p3[0] - p1[0]) / 6)} ${Y(p2[1] - (p3[1] - p1[1]) / 6)} ${X(p2[0])} ${Y(p2[1])}`;
  }
  const g = el(parent, { position: "absolute", left: x - ox, top: y - 0.03 * W, width: 1.66 * W, height: 1.78 * W, zIndex: o.z || 14 });
  const SV = svgIn(g, 1.66 * W, 1.78 * W);
  const body = pathEl(SV, d + " Z", { fill: o.fill || "#202020", stroke: o.stroke || "rgba(255,255,255,.7)", "stroke-width": o.sw || 3 });
  return { g, body };
};
// chi guarda: una persona qualunque (sagoma di profilo sul disco bianco, come nel reel 48 di Kallaway)
const personaK = (parent, x, y, d, o) => {
  o = o || {};
  const c = el(parent, { position: "absolute", left: x, top: y, width: d, height: d, borderRadius: "50%", overflow: "hidden", background: "radial-gradient(circle at 50% 40%, #ffffff 0%, #f3f3ef 46%, #d9d9d1 74%, #b9b9b1 100%)", zIndex: o.z || 3 });
  const W = d * 0.46;
  sagomaK(c, d * 0.5 - 0.49 * W, d * 0.15, W, { z: 1, fill: "#1b1b1b", stroke: "rgba(0,0,0,0)", sw: 0 });
  return c;
};

// riquadro con un fotogramma vero di un reel di un altro creator (atlante dei muri, 12 × 12 miniature 128 × 228), a riempire
const atlasCrop = (parent, x, y, w, h, q, o) => {
  o = o || {};
  const t = el(parent, { position: "absolute", left: x, top: y, width: w, height: h, overflow: "hidden", background: "#111", zIndex: o.z || 1 });
  const k = Math.max(w / 128, h / 228), qc = q % 12, qr = Math.floor(q / 12) % 12;
  imgIn(t, "atlas-muro", { left: -qc * 128 * k + (w - 128 * k) / 2 + "px", top: -qr * 228 * k + (h - 228 * k) / 2 + "px", width: 12 * 128 * k + "px", height: 12 * 228 * k + "px", objectFit: "fill" });
  return t;
};

// ── cerchio di una storia ──
// src: "tu" | handle di assets/avatars | { face: i } (volto vero dell'atlante) | { anon: true } (persona qualunque) |
//      { media: id } (video/immagine del pool)
// o: { ring: "ig" (da vedere, default) | "visto" | "lime" | "none", nome, fs, lw (larghezza dell'etichetta), plus (il "+" blu della tua storia), z }
// → { g, rIG, rSeen, rLime, face, lab, d, seen(t), lime(t, dur), ig(t), dim(t, k) }
const storyCircle = (parent, cx, cy, d, src, o) => {
  o = o || {};
  const ring = o.ring || "ig";
  const g = el(parent, { position: "absolute", left: cx - d / 2, top: cy - d / 2, width: d, height: d, zIndex: o.z || 12 });
  const mk = (bg, on) => el(g, { position: "absolute", left: 0, top: 0, width: d, height: d, borderRadius: "50%", background: bg, opacity: on ? 1 : 0 });
  const rSeen = mk("#4c4c4f", ring === "visto");
  const rIG = mk(IG_GRAD, ring === "ig");
  const rLime = mk(LIME_RING, ring === "lime");
  rLime.style.boxShadow = GLOW_A(0.75);
  const bw = Math.max(3, Math.round(d * 0.05)), gp = Math.max(3, Math.round(d * 0.035));
  const inner = el(g, { position: "absolute", left: bw, top: bw, width: d - 2 * bw, height: d - 2 * bw, borderRadius: "50%", background: o.bg || "#000" });
  const fd = d - 2 * bw - 2 * gp;
  const face = el(inner, { position: "absolute", left: gp, top: gp, width: fd, height: fd, borderRadius: "50%", overflow: "hidden", background: "#2a2a2a" });
  if (src && src.anon) personaK(face, 0, 0, fd, { z: 1 });
  else if (src && src.face != null) faceDot(face, 0, 0, fd, src.face, null, { bw: 0 });
  else if (src && src.media) mediaTile(face, 0, 0, fd, fd, src.media, 1);
  else if (src) imgIn(face, "av-" + src, { objectFit: "cover" });
  if (o.plus) {
    const pd = Math.round(d * 0.3);
    el(g, { position: "absolute", left: d - pd + 2, top: d - pd + 2, width: pd, height: pd, borderRadius: "50%", background: "#3897f0", border: `${Math.max(2, Math.round(d * 0.03))}px solid #000`, display: "flex", alignItems: "center", justifyContent: "center", zIndex: 3 }, svg("plus", Math.round(pd * 0.62), "#fff", 3.2));
  }
  let lab = null;
  if (o.nome) {
    const fs = o.fs || Math.round(d * 0.165);
    const lw = o.lw || d * 1.12;
    lab = el(g, { position: "absolute", left: (d - lw) / 2, top: d + fs * 0.35, width: lw, textAlign: "center", fontFamily: FS, fontWeight: 500, fontSize: fs, color: "rgba(255,255,255,.92)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }, o.nome);
  }
  const to = (on, t, dur) => [rSeen, rIG, rLime].forEach((r) => tl.to(r, { opacity: r === on ? 1 : 0, duration: dur || 0.2 }, t));
  return {
    g, rIG, rSeen, rLime, face, lab, d,
    seen: (t, dur) => to(rSeen, t, dur),
    ig: (t, dur) => to(rIG, t, dur),
    lime: (t, dur) => to(rLime, t, dur),
    dim: (t, k) => tl.to(g, { filter: `grayscale(1) brightness(${k == null ? 0.45 : k})`, duration: 0.3 }, t),
  };
};

// ── fila di storie (una "tray"): items [{ src, nome, ring, plus }] · o: { d (118), gap (26), fs, panel (striscia scura dietro,
// come la fila di un telefono), pad, z } → { items, panel, xy(i), rect, pitch }
const storyRow = (parent, x, y, items, o) => {
  o = o || {};
  const d = o.d || 118, gap = o.gap == null ? 26 : o.gap, pitch = d + gap, pad = o.pad == null ? 26 : o.pad, z = o.z || 12;
  const W = items.length * pitch - gap + pad * 2, H = d + (o.fs || Math.round(d * 0.165)) * 1.9 + pad * 1.4;
  let panel = null;
  if (o.panel) panel = el(parent, { position: "absolute", left: x, top: y, width: W, height: H, borderRadius: Math.round(d * 0.3), background: "linear-gradient(180deg,#121212,#050505)", border: "1.5px solid rgba(255,255,255,.12)", boxShadow: "0 24px 50px rgba(0,0,0,.55)", zIndex: z - 1 });
  const xy = (i) => [x + pad + d / 2 + i * pitch, y + pad * 0.8 + d / 2];
  const out = items.map((it, i) => storyCircle(parent, xy(i)[0], xy(i)[1], d, it.src, Object.assign({ fs: o.fs, z }, it)));
  return { items: out, panel, xy, pitch, d, rect: [x, y, x + W, y + H] };
};

// ═══ home di Instagram (vecchio stile, dark) con la fila delle storie e un post ═══════════════════════════════════
// o: { storie: [{ src, nome, ring, plus }], d (diametro dei cerchi, 118), post: { user, nome, media }, user (tab bar), z }
// → phone2 + { tray (storyCircle[]), circleXY(i) (mondo), circleRect(i), trayRect(), postRect(), screenTop: [elementi alti] }
const igHome = (parent, X, Y, o) => {
  o = o || {};
  const P = phone2(parent, X, Y, o);
  const S = P.screen, W = PH.sw, H = PH.sh;
  const hd = el(S, { position: "absolute", left: 24, top: 58, fontFamily: FH, fontSize: 52, color: "#fff", whiteSpace: "nowrap", lineHeight: 1.1 }, "Instagram");
  const ic = el(S, { position: "absolute", right: 22, top: 70, display: "flex", gap: 26 }, svg("square-plus", 32, "#fff", 2) + svg("heart", 32, "#fff", 2) + svg("send", 32, "#fff", 2));
  const d = o.d || 118, pitch = d + 22, ty = 140;
  const tray = (o.storie || []).map((it, i) => storyCircle(S, 24 + d / 2 + i * pitch, ty + d / 2, d, it.src, Object.assign({ fs: 19, z: 4 }, it)));
  el(S, { position: "absolute", left: 0, top: ty + d + 52, width: W, height: 1, background: "rgba(255,255,255,.12)" });
  // il post
  const py = ty + d + 68, ps = o.post || {};
  const pav = el(S, { position: "absolute", left: 20, top: py, width: 54, height: 54, borderRadius: "50%", overflow: "hidden", border: "2px solid rgba(255,255,255,.2)" });
  if (ps.user) imgIn(pav, "av-" + ps.user, { objectFit: "cover" });
  el(S, { position: "absolute", left: 88, top: py + 12, fontFamily: FS, fontWeight: 700, fontSize: 23, color: "#fff", whiteSpace: "nowrap" }, ps.nome || "");
  el(S, { position: "absolute", right: 20, top: py + 12, width: 30, height: 30 }, svg("ellipsis", 30, "#fff", 2.2));
  const my = py + 70, mh = H - 112 - my - 64;
  const media = el(S, { position: "absolute", left: 0, top: my, width: W, height: mh, overflow: "hidden", background: "#111" });
  if (ps.media) mediaTile(media, 0, 0, W, mh, ps.media, 1);
  else if (ps.atlas != null) atlasCrop(media, 0, 0, W, mh, ps.atlas);
  el(S, { position: "absolute", left: 20, top: my + mh + 14, display: "flex", gap: 22 }, svg("heart", 32, "#fff", 2) + svg("message-circle", 32, "#fff", 2) + svg("send", 32, "#fff", 2));
  el(S, { position: "absolute", right: 20, top: my + mh + 14, width: 32, height: 32 }, svg("bookmark", 32, "#fff", 2));
  const tb = el(S, { position: "absolute", left: 0, top: H - 112, width: W, height: 112, background: "#000", borderTop: "1px solid rgba(255,255,255,.12)", display: "flex", justifyContent: "space-around", alignItems: "flex-start", paddingTop: 24, zIndex: 8 });
  ["house", "search", "square-play", "shopping-bag"].forEach((n) => el(tb, { width: 40, height: 40 }, svg(n, 36, "#fff", 2)));
  const me = el(tb, { width: 44, height: 44, borderRadius: "50%", overflow: "hidden", border: "2.5px solid #fff", position: "relative" });
  if (o.user) imgIn(me, "av-" + o.user, { objectFit: "cover" });
  const cxy = (i) => P.at(24 + d / 2 + i * pitch, ty + d / 2);
  return Object.assign(P, {
    tray, header: [hd, ic], media,
    circleXY: cxy,
    circleRect: (i) => { const [x, y] = cxy(i); return [x - d / 2, y - d / 2, x + d / 2, y + d / 2]; },
    trayRect: () => { const a = P.at(0, ty - 20), b = P.at(W, ty + d + 52); return [a[0], a[1], b[0], b[1]]; },
    postRect: () => { const a = P.at(0, py), b = P.at(W, my + mh + 60); return [a[0], a[1], b[0], b[1]]; },
  });
};
