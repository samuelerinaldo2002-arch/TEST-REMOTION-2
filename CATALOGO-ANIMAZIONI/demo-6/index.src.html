    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        const L = layer(10);
        const S = svgLayer(L, 6, -60000, -60000, 200000, 200000);
        const SH = svgLayer(L, 45, -60000, -60000, 200000, 200000);
        const head = (t, lines, times, out, size) => { const T = titleW({ lines, size: size || 80 }); T.inAt(times || t); if (out) T.outAt(out); return T; };
        const Y = 900;
        camInit(540, 900, 1);

        // ═══ H04 · L16 — "riordina la griglia" (08/10) (0 – 5,6) ═══
        // la tua griglia con le views vere: gli angoli di selezione si chiudono sui reel che non funzionano, poi la griglia si
        // riordina: in alto quelli che portano views
        // come il reel 69 di Kallaway: un elemento alla volta. Gli angoli scelgono il reel che porta più views, si stacca e fa una
        // S fino al primo posto mentre l'altro scivola al suo; poi il secondo. La prima riga (quella che vede chi arriva) si accende
        let X = 600;
        const TW = 270, TH = 360, TG = 18, gx0 = X - (3 * TW + 2 * TG) / 2, gy0 = Y - (3 * TH + 2 * TG) / 2 + 60;
        const views1 = ["88K", "2,1M", "41K", "1,4M", "12K", "650K", "96K", "3,2M", "1,1M"];
        const posti1 = [], tiles1 = [], badges1 = [];
        ["g1", "g2", "g3", "g4", "g5", "g6", "g7", "g8", "g9"].forEach((m, i) => {
          const left = gx0 + (i % 3) * (TW + TG), top = gy0 + Math.floor(i / 3) * (TH + TG);
          posti1.push([left, top]);
          const tile = el(L, { position: "absolute", left, top, width: TW, height: TH, borderRadius: 18, overflow: "hidden", border: "2px solid rgba(255,255,255,.16)", boxShadow: "0 18px 40px rgba(0,0,0,.5)", zIndex: 12 });
          mediaTile(tile, 0, 0, TW, TH, m, 1);
          badges1.push(viewBadge(tile, TW / 2, TH - 34, views1[i], { fs: 24, z: 5, dark: !/M$/.test(views1[i]) }));
          blurIn(tile, 0.05 + i * 0.03, { y: 20, blur: 10, dur: 0.35 });
          tiles1.push(tile);
        });
        popSeq(badges1, 0.55, 0.04);
        const rr = (i) => [posti1[i][0], posti1[i][1], posti1[i][0] + TW, posti1[i][1] + TH];
        const sc1 = selectCorners(L, rr(7), { len: 56, w: 8, pad: 14 });
        sc1.show(1.15); sc1.hide(1.55);
        swapPlaces(tiles1[7], tiles1[0], 1.55, { dur: 0.62 });
        const sc1b = selectCorners(L, rr(3), { len: 56, w: 8, pad: 14 });
        sc1b.show(2.45); sc1b.hide(2.85);
        swapPlaces(tiles1[3], tiles1[2], 2.85, { dur: 0.62 });
        // la prima riga si accende, il resto si abbassa (F04)
        const top1 = [tiles1[7], tiles1[1], tiles1[3]], rest1 = tiles1.filter((x) => !top1.includes(x));
        tl.to(tiles1[1], { borderColor: K.lime, boxShadow: `${GLOW_A(0.8)}, 0 24px 50px rgba(0,0,0,.55)`, duration: 0.2 }, 3.75);
        tl.to(rest1, { opacity: 0.38, filter: "grayscale(.6)", duration: 0.35 }, 3.8);
        const lb1 = el(L, { position: "absolute", left: gx0 - 10, top: gy0 - 74, width: 3 * TW + 2 * TG + 20, textAlign: "center", fontFamily: FS, fontWeight: 800, fontSize: 34, color: K.lime, textShadow: GLOW_LT, whiteSpace: "nowrap", zIndex: 13 }, "La prima riga: quella che vede chi arriva");
        blurIn(lb1, 3.9, { y: 10, blur: 8, dur: 0.35 });
        cutRect(0, [gx0 - 20, gy0 - 90, gx0 + 3 * TW + 2 * TG + 20, gy0 + 3 * TH + 2 * TG + 20], { top: 380 });
        float(0, 5.6, 0, -12, 0.02);
        head(0.05, [[{ t: "Riordina " }, { t: "la griglia", box: true }]], [0.05, 0.2, 0.35], 5.15);
        // [catalogo] H04 · L16 — gli angoli lime si chiudono sui reel deboli, poi la griglia si riordina per views

        // ═══ T13 · F12 — "il profilo non è un curriculum, è un venditore" (04/10) (5,6 – 11,2) ═══
        // come il reel 31 di Kallaway (la correzione avviene dentro un'interfaccia vera): il tuo profilo Instagram; la camera entra
        // sulla bio, le righe da curriculum si barrano e si chiudono, si scrive la bio da venditore; la camera si allarga e cala il
        // timbro (reel 80/104), il bottone "Messaggio" si accende: chi arriva sa cosa fare
        X = 4600;
        const pf2 = igProfile(L, X - 280, Y - 570, { user: "tu", handle: "samuelerinaldo.media", nome: "Samuele Rinaldo", bio: ["", "", ""], blurStats: true, ring: "lime", grid: ["q1", "q2", "q3", "q4", "q5", "q6"], z: 12 });
        const [bx2, by2] = pf2.at(24, 334);
        const sl = strikeLines(L, bx2, by2, ["Laureato in Economia", "10 anni nel marketing", "Amo il caffè e i viaggi"], { fs: 23, w: 500, lh: 1.32, z: 14 });
        const p2 = arriveRect(5.6, pf2.rect, { top: 380, dy: 300 });
        // la camera entra sulla parte alta del telefono partendo dal suo bordo (regola 17: niente interfaccia dietro al titolo)
        const bio2 = [X - 290, Y - 580, X + 290, Y - 570 + 600];
        frameRect(6.15, 0.5, bio2, { top: 380 });
        [6.55, 6.8, 7.05].forEach((t, i) => sl.strike(i, t));
        [7.6, 7.7, 7.8].forEach((t, i) => sl.remove(i, t));
        sl.add(8.05, "Ti porto clienti da Instagram", { color: K.lime });
        sl.add(8.65, "Scrivimi CLIENTI in DM");
        frameRect(9.3, 0.45, pf2.rect, { top: 380 });
        const [sx2, sy2] = pf2.at(267, 400);
        stamp(L, sx2 + 40, sy2 + 10, "Venditore", { w: 520, h: 190, rot: -10, fs: 78 }).down(9.75);
        pf2.hl(10.25, "bottoni");
        float(10.3, 0.9, 0, -8, 0.015);
        head(5.65, [[{ t: "Non è " }, { t: "un curriculum", box: true }]], [5.65, 5.8, 5.95, 6.1], 7.95);
        head(8.45, [[{ t: "È un " }, { t: "venditore", box: true }]], [8.45, 8.6, 8.75], 10.75);
        // [catalogo] T13 · F12 — reel 31: la bio del tuo profilo vero si corregge (camera dentro); reel 80: cala il timbro

        // ═══ O28 — "cinque pezzi di un profilo che porta clienti" (25/09) (11,2 – 16,6) ═══
        X = 8600;
        // come il reel 90 di Kallaway: mattoncini 3D veri (pioli, faccia sopra, fianco) con l'etichetta sfocata a sinistra; ognuno
        // si accende quando è detto; alla fine si incastrano in una torre sola (i cinque pezzi fanno un profilo)
        const bt = brickTower(L, S, X + 170, Y + 500, ["Strategia", "Contenuti", "Distribuzione", "Relazione", "Monetizzazione"], { w: 320, h: 100, lw: 380, fs: 36 });
        // nel reel 90 la torre è in piedi in mezzo secondo (cadono quasi insieme), poi le etichette vanno a fuoco una alla volta
        [0, 1, 2, 3, 4].forEach((i) => bt.drop(i, 11.3 + i * 0.1));
        [0, 1, 2, 3, 4].forEach((i) => bt.say(i, 12.25 + i * 0.7));
        bt.snap(15.8);
        cutRect(11.2, bt.rect, { top: 380 });
        float(11.2, 5.4, 0, -10, 0.02);
        head(11.25, [[{ t: "5 pezzi " }, { t: "di un profilo", box: true }]], [11.25, 11.4, 11.55, 11.7], 16.15);
        // [catalogo] O28 — mattoncini in grafite che si impilano; l'etichetta va a fuoco e il mattoncino si accende quando è detto

        // ═══ L15 — "tre tipi di carosello: personali, di valore, firma" (27/09) (16,6 – 22) ═══
        // come il reel 15 di Kallaway: una card grande al centro (anteprima vera del carosello + due punti che dicono a cosa serve);
        // quando arriva la successiva, quella vista rimpicciolisce nella fila in alto sotto il titolo; alla fine le tre in riga
        X = 12600;
        const kinds = [["1", "Personali", "mio_03", ["La tua storia", "Ti fanno conoscere"]], ["2", "Di valore", "mio_05", ["Consigli pratici", "Si salvano"]], ["3", "Firma", "mio_08", ["Il tuo metodo", "Ti distinguono"]]];
        const CW4 = 600, CH4 = 780;
        const cards4 = kinds.map(([n, nm, m, pts], k) => {
          const c = glass(L, X - CW4 / 2, Y - CH4 / 2 + 70, CW4, CH4, { zIndex: 14 + k, borderRadius: 34 });
          el(c, { position: "absolute", left: 30, top: 28, height: 60, display: "flex", alignItems: "center", gap: 14, fontFamily: FS, fontWeight: 800, fontSize: 40, color: K.white, whiteSpace: "nowrap" }, `<span style="display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:15px;background:${limeFill(1)};color:${K.ink};font-family:${FD}">${n}</span>${nm}`);
          // anteprima del carosello: slide vera 3:4, la successiva che spunta di lato, "1/5" e i puntini
          const sl4b = el(c, { position: "absolute", left: 388, top: 122, width: 180, height: 400, borderRadius: 18, overflow: "hidden", border: "1.5px solid rgba(255,255,255,.18)", zIndex: 1 });
          mediaTile(sl4b, 0, 0, 180, 400, "th-" + ["mio_06", "mio_09", "mio_02"][k], 1);
          el(sl4b, { position: "absolute", inset: 0, background: "rgba(20,20,20,.5)" });
          const sl4 = el(c, { position: "absolute", left: 30, top: 110, width: 400, height: 534 * 0.8, borderRadius: 20, overflow: "hidden", border: "1.5px solid rgba(255,255,255,.24)", boxShadow: "0 18px 40px rgba(0,0,0,.55)", zIndex: 2 });
          mediaTile(sl4, 0, 0, 400, 534 * 0.8, "th-" + m, 1);
          el(sl4, { position: "absolute", right: 14, top: 14, padding: "4px 12px", borderRadius: 12, background: "rgba(20,20,20,.7)", fontFamily: FS, fontWeight: 800, fontSize: 22, color: K.white }, "1/5");
          [0, 1, 2, 3, 4].forEach((d) => el(c, { position: "absolute", left: 30 + 200 - 46 + d * 22, top: 110 + 534 * 0.8 + 18, width: 11, height: 11, borderRadius: "50%", background: d ? "rgba(255,255,255,.35)" : K.lime }));
          pts.forEach((p, j) => el(c, { position: "absolute", left: 34, top: 590 + j * 62, display: "flex", alignItems: "center", gap: 14, fontFamily: FS, fontWeight: 800, fontSize: 36, color: j ? "rgba(255,255,255,.75)" : K.white, whiteSpace: "nowrap" }, `<span style="width:12px;height:12px;border-radius:50%;background:${K.lime};box-shadow:${GLOW_A(0.6)}"></span>${p}`));
          gsap.set(c, { opacity: 0 });
          return c;
        });
        // fila delle card già viste, sotto il titolo; alla fine la riga delle tre al centro
        const row4 = (k, sc, yy) => [X - (CW4 * sc + 26) + k * (CW4 * sc + 26), yy];
        cards4.forEach((c, k) => {
          const t0 = 16.7 + k * 1.55;
          tl.fromTo(c, { opacity: 0, x: 160, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: false }, t0);
          tl.set(c, { filter: "none" }, t0 + 0.46);
          [c, ...c.querySelectorAll("*")].forEach((nd) => nd.setAttribute("data-layout-allow-overlap", ""));
          const go = (t, sc, yy, dur, rot) => { const [rx, ry] = row4(k, sc, yy); tl.to(c, { x: rx - X, y: ry - (Y + 70), scale: sc, rotation: rot || 0, duration: dur, ease: "power3.inOut" }, t); };
          // nel reel 15 la card vista sale e rimpicciolisce in ~1 s con una coda morbida, mentre arriva la nuova
          if (k < 2) go(t0 + 1.2, 0.26, Y - 520, 0.9);
          // finale: le tre a ventaglio, grandi (quella al centro davanti), come la riga finale del reel 15
          const fx4 = [-300, 0, 300][k], fy4 = [40, 0, 40][k];
          tl.set(c, { zIndex: k === 1 ? 20 : 15 }, 20.95);
          tl.to(c, { x: fx4, y: fy4 - 60, scale: 0.62, rotation: [-8, 0, 8][k], duration: 0.75, ease: "power2.inOut" }, 20.95);
        });
        cutRect(16.6, [X - 480, Y - 620, X + 480, Y + 500], { top: 380 });
        float(16.6, 5.4, 0, -10, 0.02);
        head(16.65, [[{ t: "3 tipi " }, { t: "di carosello", box: true }]], [16.65, 16.8, 16.95, 17.1], 21.55);
        // [catalogo] L15 — la card appena spiegata rimpicciolisce e va nella pila nell'angolo, arriva la successiva

        // ═══ D10 · U15 — "profilo ottimizzato in 60 secondi" (05/10) (22 – 27,4) ═══
        // come il reel 46 di Kallaway: il profilo al centro (foto vera, nome) dentro anelli sottili concentrici; l'anello lime si
        // riempie a scatti, uno per ogni pezzo del profilo, e il pezzo nasce sul bordo; il cronometro scende da 60 a 0 (U15)
