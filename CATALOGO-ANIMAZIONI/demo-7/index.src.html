    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        const L = layer(10);
        const S = svgLayer(L, 6, -60000, -60000, 200000, 200000);
        // segni a mano (H02, A08) sopra le interfacce: un pennarello sullo screenshot
        const SH = svgLayer(L, 45, -60000, -60000, 200000, 200000);
        const head = (t, lines, times, out, size) => { const T = titleW({ lines, size: size || 80 }); T.inAt(times || t); if (out) T.outAt(out); return T; };
        const Y = 900;
        camInit(540, 900, 1);

        // ═══ A05 · C01 · F02 — "lunedì fitness, martedì viaggi…: l'algoritmo non capisce" (01/10) (0 – 5,6) ═══
        // si parte da una clip vera (A05); una linea esce dal reel e cresce verso il successivo mentre la camera la segue (C01):
        // tre giorni, tre temi; l'ultima linea porta al cervello (l'algoritmo) che non si accende: i temi gli girano attorno
        let X = 600;
        const CWd = 360, CHt = 640, GAP = 960;
        const days = [["vF", "fitness", "dumbbell"], ["vV", "viaggi", "plane"], ["vC", "ricette", "chef-hat"]];
        days.forEach(([v, tema, ic], i) => videoCard(L, X + i * GAP, Y + 60, CWd, CHt, v, { label: tema, icon: ic, z: 12 }));
        const pose1 = (i) => fitPose(X + i * GAP - 360, Y - 300, X + i * GAP + 360, Y + 420, { top: 380 });
        { const p = pose1(0); cutTo(0, p.fx, p.fy, p.s); }
        float(0, 0.8, 0, -8, 0.01);
        const T1 = titleW({ lines: [[{ t: "Lunedì " }, { t: "fitness", box: true }]], size: 86 });
        T1.inAt([0.05, 0.2]);
        // C01 · la linea cresce verso il reel successivo e la camera la segue (stessa durata, stessa curva): la punta resta in campo
        const lineCam = (a, b, t, dur, pose) => { const cn = connector(S, [a, b], { color: "rgba(255,255,255,.85)", w: 4, glow: true }); cn.draw(t, dur, "power2.inOut"); camK(t, dur, pose.fx, pose.fy, pose.s, "power2.inOut"); return cn; };
        lineCam([X + CWd / 2 + 6, Y + 60], [X + GAP - CWd / 2 - 6, Y + 60], 0.8, 0.9, pose1(1));
        swapWord(T1, 0, "Martedì", 1.55); swapWord(T1, 1, "viaggi", 1.72);
        lineCam([X + GAP + CWd / 2 + 6, Y + 60], [X + 2 * GAP - CWd / 2 - 6, Y + 60], 1.95, 0.9, pose1(2));
        swapWord(T1, 0, "Mercoledì", 2.7); swapWord(T1, 1, "ricette", 2.9);
        const BX = X + 3 * GAP, BRy = Y + 40;
        const br1 = brain(L, BX, BRy, 540, { z: 12 });
        gsap.set(br1.g, { opacity: 0 });
        const pB = fitPose(BX - 400, BRy - 360, BX + 400, BRy + 360, { top: 380 });
        lineCam([X + 2 * GAP + CWd / 2 + 6, Y + 60], [BX - 290, BRy + 20], 3.15, 0.9, pB);
        T1.outAt(3.45);
        // A05 · la clip è diventata schema: il cervello (l'algoritmo) arriva col pulse, i tre temi gli girano attorno storti
        tl.fromTo(br1.g, { opacity: 0, scale: 0.85, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out", immediateRender: false }, 3.75);
        tl.set(br1.g, { filter: "none" }, 4.16);
        pulse(L, BX, BRy, 4.05, { r: 300, z: 10 });
        [["dumbbell", "Fitness", -300, -250, -9], ["plane", "Viaggi", 310, -170, 8], ["chef-hat", "Ricette", -250, 250, 6]].forEach(([ic, tx, dx, dy, rot], i) => {
          const pl = el(L, { position: "absolute", left: BX + dx - 115, top: BRy + dy - 38, width: 230, height: 76, borderRadius: 38, display: "flex", alignItems: "center", justifyContent: "center", gap: 12, background: "linear-gradient(180deg,#3b3b3b,#232323)", border: "1.5px solid rgba(255,255,255,.22)", boxShadow: "0 16px 36px rgba(0,0,0,.5)", fontFamily: FS, fontWeight: 800, fontSize: 30, color: K.white, whiteSpace: "nowrap", zIndex: 14, transform: `rotate(${rot}deg)` }, svg(ic, 30, K.white, 2.2) + tx);
          gsap.set(pl, { opacity: 0 });
          tl.fromTo(pl, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, 4.35 + i * 0.1);
          tl.to(pl, { y: i % 2 ? 10 : -10, rotation: rot * 1.6, duration: 1.0, ease: "sine.inOut" }, 4.7 + i * 0.1);
        });
        handNote(L, BX + 170, BRy + 120, "?", { size: 150, rot: 8 }).write(4.6, 0.15);
        head(3.95, [[{ t: "L'algoritmo " }], [{ t: "non capisce", box: true }]], [3.95, 4.15, 4.3], 5.15);
        float(4.05, 1.55, 0, -10, 0.02);
        // [catalogo] A05 · C01 · F02 — clip vera → linea che cresce con la camera → cervello col pulse: la scena diventa schema

        // ═══ F08 · cambio di colore = cambio di stato — "se la guardano, viene spinta in cima" (10/10) (5,6 – 11) ═══
        // in alto le storie di chi ti segue (volti veri), la tua è la quarta con l'anello grigio (già vista); sotto chi la apre:
        // i volti passano da spenti a lime a onda (F08) e la tua storia sale al primo posto con l'anello di nuovo acceso
        X = 6000;
        const TY = Y - 300, DD = 176, SP = 220;
        const ringIG = "linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)";
        const names = ["giulia", "marco", "sara", "tu", "luca"];
        const stories = names.map((nm, i) => {
          const g = el(L, { position: "absolute", left: X + (i - 2) * SP - DD / 2, top: TY - DD / 2, width: DD, height: DD + 44, zIndex: 13 });
          el(g, { position: "absolute", left: 0, top: 0, width: DD, height: DD, borderRadius: "50%", background: ringIG });
          const grey = el(g, { position: "absolute", left: 0, top: 0, width: DD, height: DD, borderRadius: "50%", background: "linear-gradient(180deg,#8a8a8a,#5c5c5c)", opacity: nm === "tu" ? 1 : 0 });
          const inner = el(g, { position: "absolute", left: 6, top: 6, width: DD - 12, height: DD - 12, borderRadius: "50%", background: "#1e1e1e" });
          if (nm === "tu") { const fc = el(inner, { position: "absolute", left: 5, top: 5, width: DD - 22, height: DD - 22, borderRadius: "50%", overflow: "hidden" }); imgIn(fc, "av-tu", { objectFit: "cover" }); }
          else faceDot(inner, 5, 5, DD - 22, 3 + i * 7, "atlas-muro", { bw: 0 });
          el(g, { position: "absolute", left: -20, top: DD + 8, width: DD + 40, textAlign: "center", fontFamily: FS, fontWeight: 700, fontSize: 26, color: nm === "tu" ? K.white : "rgba(255,255,255,.62)" }, nm === "tu" ? "La tua storia" : nm);
          gsap.set(g, { opacity: 0 });
          blurIn(g, 5.65 + i * 0.05, { y: 16, blur: 10, dur: 0.35 });
          return { g, grey };
        });
        // chi la apre: 10 volti veri spenti → lime a onda
        const viewers = Array.from({ length: 10 }, (_, k) => {
          const x = X - 400 + (k % 5) * 200, y = Y + 90 + Math.floor(k / 5) * 190;
          const f = faceDot(L, x - 62, y - 62, 124, 40 + k * 5, "atlas-muro", { bw: 4 });
          f.style.zIndex = 12;
          gsap.set(f, { opacity: 0, filter: "grayscale(1) brightness(.5)", borderColor: "rgba(255,255,255,.3)" });
          tl.to(f, { opacity: 1, duration: 0.25 }, 6.0 + k * 0.03);
          return f;
        });
        const eyeP = el(L, { position: "absolute", left: X - 170, top: Y - 66, width: 340, height: 64, borderRadius: 32, display: "flex", alignItems: "center", justifyContent: "center", gap: 12, background: limeFill(1), boxShadow: GLOW_A(0.6), fontFamily: FS, fontWeight: 800, fontSize: 30, color: K.ink, whiteSpace: "nowrap", zIndex: 14 }, svg("eye", 30, K.ink, 2.4) + "<span>0 l'hanno vista</span>");
        const eyeN = eyeP.querySelector("span");
        gsap.set(eyeP, { opacity: 0, scale: 0.7 });
        tl.to(eyeP, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 6.75);
        const EV = { v: 0 };
        tl.to(EV, { v: 10, duration: 0.32, ease: "none", onUpdate: () => (eyeN.textContent = Math.round(EV.v) + " l'hanno vista") }, 6.9);
        // F08 · onda di colore (0,3 s): spento → acceso
        viewers.forEach((f, k) => {
          tl.to(f, { filter: "grayscale(0) brightness(1)", borderColor: K.lime, boxShadow: `${GLOW_A(0.6)}, 0 6px 14px rgba(0,0,0,.5)`, duration: 0.12 }, 6.9 + k * 0.032);
          tl.set(f, { filter: "none" }, 6.9 + k * 0.032 + 0.13);
        });
        // la tua storia sale al primo posto (le altre scalano a destra) e l'anello torna acceso (F08: cambio di stato)
        tl.to(stories[3].g, { x: -3 * SP, duration: 0.6, ease: KW.move }, 8.4);
        tl.to([stories[0].g, stories[1].g, stories[2].g], { x: SP, duration: 0.6, ease: KW.move }, 8.42);
        tl.to(stories[3].grey, { opacity: 0, duration: 0.12 }, 8.95);
        tl.fromTo(stories[3].g, { scale: 1.18 }, { scale: 1, duration: 0.4, ease: "back.out(2.6)", immediateRender: false }, 8.95);
        handArrow(SH, X + 360, TY - 128, X - 330, TY - 122, 0.12, 5, { color: K.lime, w: 6 }).draw(8.4, 0.5);
        cutRect(5.6, [X - 530, TY - 160, X + 530, Y + 340], { top: 380 });
        float(5.6, 5.4, 0, -12, 0.02);
        head(5.65, [[{ t: "Se la " }, { t: "guardano", box: true }], [{ t: "sale in cima", hand: true }]], [5.65, 5.8, 5.95, 8.4, 8.55, 8.7], 10.55);
        // [catalogo] F08 — i volti di chi guarda passano da spenti a lime a onda; la tua storia sale al primo posto e si riaccende

        // ═══ H02 · F05 · U07 — "le impostazioni, passo per passo" (26/09) (11 – 16,2) ═══
        // Impostazioni vere di Instagram: un cerchio a mano lime attorno all'interruttore giusto (H02) con la freccia e la nota,
        // il dito lo preme (U07) e la riga lampeggia prima di restare accesa (F05)
        X = 9800;
        const PX3 = X - 540, PY3 = Y - 570;
        const st3 = igSettings(L, PX3, PY3, [
          { kind: "facebook", t: "Condividi su Facebook", d: "I tuoi reel anche su Facebook" },
          { kind: "google", t: "Comparsa su Google", d: "Il profilo nelle ricerche" },
          { kind: "simili", t: "Account simili", d: "Suggerito a chi ti somiglia" },
        ], { user: "tu", sezione: "Come ti trovano gli altri" });
        const p3 = fitPose(PX3 - 10, PY3 + 50, PX3 + PH.w + 330, PY3 + 700, { top: 340 });
        cutTo(11.0, p3.fx, p3.fy, p3.s);
        float(11.0, 5.2, 0, -10, 0.02);
        head(11.05, [[{ t: "Attiva " }, { t: "questa", box: true }]], [11.05, 11.22], 15.75);
        const [sx3, sy3] = st3.sw(1);
        handCircle(SH, sx3, sy3, 82, 54, 7, { color: K.lime, w: 6 }).draw(11.9, 0.35);
        handArrow(SH, sx3 + 210, sy3 - 170, sx3 + 70, sy3 - 50, -0.3, 4, { color: K.lime, w: 6 }).draw(12.2, 0.4);
        handNote(L, sx3 + 90, sy3 - 300, "questa!", { size: 72, rot: -6 }).write(12.35, 0.35);
        const r3 = st3.rowRect(1);
        const rowOn = el(L, { position: "absolute", left: r3[0] - 6, top: r3[1] - 6, width: r3[2] - r3[0] + 12, height: r3[3] - r3[1] + 12, borderRadius: 20, border: `3px solid ${K.lime}`, boxShadow: GLOW_A(0.7), opacity: 0, zIndex: 30, pointerEvents: "none" });
        const fg3 = tapFinger(L, { size: 84 });
        fg3.show(12.9, sx3 + 60, sy3 + 330); fg3.to(12.98, sx3, sy3, 0.26); fg3.tap(13.26);
        st3.on(1, 13.28);
        flicker(rowOn, 13.3, { opacity: 0 }, { opacity: 1 }, 0.3);
        fg3.hide(13.8);
        // [catalogo] H02 · F05 · U07 — cerchio a mano sull'interruttore vero, il dito lo preme, la riga lampeggia e resta accesa

        // ═══ A03 · K16 · T07 — "hook, spiega, mostra, insegna" (15/10) (16,2 – 21,6) ═══
        // il copione è già in scena al taglio, fioco (A03: l'oggetto è il risultato promesso) e in ~1 s si riempie di righe colorate
        // per sezione; la camera intanto spinge piano in avanti (+10% in 1,6 s, K16); il titolo ha la sottolineatura che cresce (T07)
        X = 13600;
        const sd4 = scriptDoc(L, X, Y + 50, [{ label: "Hook", rows: 2 }, { label: "Spiega", rows: 3 }, { label: "Mostra", rows: 3 }, { label: "Insegna", rows: 3 }], { title: "Copione", w: 700 });
        const p4 = fitPose(X - 370, Y + 50 - 300, X + 370, Y + 50 + 300, { top: 380 });
        cutTo(16.2, p4.fx, p4.fy, p4.s);
        camK(16.25, 1.6, p4.fx, p4.fy - 10, p4.s * 1.1, "sine.inOut");
        float(17.9, 3.7, 0, -8, 0.01);
        gsap.set(sd4.c, { opacity: 0 });
        tl.set(sd4.c, { opacity: 0.55 }, 16.2);
        tl.to(sd4.c, { opacity: 1, duration: 0.3 }, 16.3);
        sd4.lay(16.2);
        [0, 1, 2, 3].forEach((i) => sd4.section(i, 16.45 + i * 0.22, 0.03));
        sd4.focus(0, 19.6); sd4.focus(1, 20.1);
        head(16.25, [[{ t: "Il copione " }], [{ t: "in 4 parti", hand: true, ul: true }]], [16.25, 16.4, 16.62, 16.78, 16.94], 21.15);
        // [catalogo] A03 · K16 · T07 — copione già in scena che si compila in ~1 s, spinta lenta in avanti, sottolineatura che cresce

        // ═══ O15 · F06 — "il riaggancio fa ripartire l'attenzione" (23/09) (21,6 – 27,4) ═══
        // la clessidra si svuota (l'attenzione che finisce); sul riaggancio si capovolge (0,5 s) e l'onda d'urto parte dalla base
        X = 17400;
        const hg = hourglass(L, X, Y + 50, 660);
        cutRect(21.6, hg.rect, { top: 400 });
        float(21.6, 5.8, 0, -12, 0.02);
        hg.show(21.62);
        hg.run(21.95, 2.6);
        head(21.65, [[{ t: "L'attenzione " }, { t: "finisce", box: true }]], [21.65, 21.85], 24.15);
        hg.flip(24.6);
        ripple(L, X, Y + 50, 25.1, { r: 250, s0: 0.6, s1: 2.0, w: 6, z: 9 });
        ripple(L, X, Y + 50, 25.24, { r: 250, s0: 0.6, s1: 2.7, w: 3, z: 9 });
        hg.run(25.15, 2.2);
        head(24.6, [[{ t: "Il riaggancio " }], [{ t: "la fa ripartire", hand: true }]], [24.6, 24.75, 24.9, 25.05, 25.2], 26.95);
        // [catalogo] O15 · F06 — clessidra di vetro con la sabbia lime che si svuota, si capovolge e l'onda d'urto riparte dalla base

        // ═══ A04 · O04 — "distribuzione ovunque" (25/09) (27,4 – 32,8) ═══
        // al centro la tua foto vera; i canali escono dal centro e si mettono in orbita (A04, 0,3 s expo.out), poi girano piano
        // sul cerchio tratteggiato (O04, i loghi restano dritti); sotto la foto nasce il concetto a ~1 s
        X = 21200;
        const C6 = Y + 70, R6 = 380;
        const hero6 = avatar(L, X, C6, 290, "tu", { bw: 6, z: 16 });
        gsap.set(hero6, { opacity: 0, scale: 0.6 });
        tl.to(hero6, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 27.42);
        const kinds6 = ["instagram", "youtube", "facebook", "google", "esplora"];
        const ic6 = kinds6.map((k) => brandIcon(L, 0, 0, 140, k, 15));
        const orb6 = orbit(L, X, C6, R6, ic6);
        gsap.set(orb6.ring, { opacity: 0 });
        tl.to(orb6.ring, { opacity: 1, duration: 0.35 }, 27.6);
        ic6.forEach((nd, i) => {
          const a = (i / ic6.length) * Math.PI * 2;
          tl.fromTo(nd._holder, { x: -Math.cos(a) * R6, y: -Math.sin(a) * R6, scale: 0.3, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, 27.5 + i * 0.03);
        });
        orb6.spin(27.5, 5.3, 48);
        const pill6 = el(L, { position: "absolute", left: X - 190, top: C6 + 168, width: 380, height: 64, borderRadius: 32, display: "flex", alignItems: "center", justifyContent: "center", background: limeFill(1), boxShadow: GLOW_A(0.6), fontFamily: FS, fontWeight: 800, fontSize: 30, color: K.ink, whiteSpace: "nowrap", zIndex: 17 }, "Un profilo, ogni canale");
        gsap.set(pill6, { opacity: 0, scale: 0.7 });
