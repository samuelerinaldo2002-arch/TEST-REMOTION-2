        const pallino = (x, y, n, d) => {
          d = d || 150;
          const b = el(L, { position: "absolute", left: x - d / 2, top: y - d / 2, width: d, height: d, borderRadius: "50%", background: "radial-gradient(circle at 38% 30%, #5a5a5a, #232323 72%)", backgroundColor: "#2a2a2a", border: "5px solid #ffffff", boxShadow: "0 18px 40px rgba(0,0,0,.6), 0 0 26px rgba(255,255,255,.35)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FD, fontWeight: 700, fontSize: Math.round(d * 0.6), color: "#ffffff", zIndex: 40 }, n);

        // gli altri reel attorno al tuo (2 colonne ai lati, tagliate dal bordo): fuori fuoco, si allargano piano, poi si spengono

        // "contenuti": le visualizzazioni del tuo reel salgono
        BB[0].viewsIn(wt(5));
        { const V = { v: 0 }; tl.fromTo(V, { v: 0 }, { v: 12400, duration: 0.7, ease: "power2.out", immediateRender: false, onUpdate: () => (BB[0].vwN.textContent = V.v >= 1000 ? (V.v / 1000).toFixed(1).replace(".", ",") + "K" : String(Math.round(V.v))) }, wt(5)); }
        const PUB = wt(9), DIR = wt(10);
