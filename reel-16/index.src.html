    <script>
      (() => {
        const ICON = __ICONS__;

        const wt = (i) => WORDS[i][1]; // istante della parola i (indici: python -X utf8 _tools/parole.py …/d16.ts)

        const S = {};
        // i tagli: 0,1 s prima della prima parola della frase
        const C = [0, wt(8) - 0.1, wt(16) - 0.1, wt(26) - 0.1, wt(31) - 0.1, wt(41) - 0.1, wt(51) - 0.1, wt(60) - 0.1, wt(76) - 0.1, wt(85) - 0.1, 33.76];
        const VIDEO = "th-mio_04"; // il tuo video (copertina vera del 04/10): lo stesso in tutte le scene

        // ═══ 1 · O01 · «Instagram ti ha appena regalato un trucco enorme.» L'anello dei tuoi reel veri dal fotogramma 0;
        // il disco su «regalato», al centro «Un trucco enorme» su «trucco» ═══
        S.O01 = TPL.O01({ t0: C[0], t1: C[1], X: 600, Y: 900,
          parole: { accento: wt(4), risposta: wt(6), sottolinea: wt(7), titolo: [wt(0), wt(1), wt(2), wt(4), wt(5), wt(6), wt(7)] } }, {
          titolo: [[{ t: "Instagram ti ha " }, { t: "regalato", box: true }], [{ t: "un trucco enorme", hand: true }]],
          media: ["c1", "c2", "c3", "c4", "c5", "c6", "c7"], risposta: ["Un trucco", "enorme"] });

        // ═══ 2 · nascosto (kit2-reel16.js) · «E probabilmente non te ne sei nemmeno accorto.» La schermata vera «Nuovo reel»:
        // la riga «Reel di prova» c'è, spenta; il resto si spegne su «non», la lente la trova su «nemmeno», NUOVO su «accorto» ═══
        S.N = nascostoR16({ t0: C[1], t1: C[2], X: 4000, Y: 900,
          parole: { spegni: wt(10), lente: wt(14), nuovo: wt(15), titolo: [wt(10), wt(11), wt(12), wt(13), wt(15)] } }, {
          titolo: [[{ t: "Non te ne sei " }, { t: "accorto", box: true }]], media: VIDEO });

        // ═══ 3 · L11 · «La prossima volta che carichi un video, prima di pubblicarlo,» Il percorso del trucco: il tuo video arriva
        // su «carichi» e, prima di pubblicarlo, corre a «Salva in bozza» (le tappe dopo restano sfocate finché non le dici) ═══
        S.L11 = TPL.L11({ t0: C[2], t1: C[3], X: 7500, Y: 900,
          parole: { tappe: [wt(20), wt(25)], titolo: [wt(20), wt(21), wt(22), wt(23), wt(24), wt(25)] } }, {
          titolo: [[{ t: "Carichi un " }, { t: "video", box: true }], [{ t: "prima di pubblicarlo", hand: true }]], media: VIDEO,
          tappe: [{ t: "Carica il video", icona: "upload" }, { t: "Salva in bozza", icona: "save" }, { t: "Duplica", icona: "copy" }, { t: "Pubblica ×2", icona: "send" }] });

        // ═══ 4 · U10 · «salvalo come bozza. Poi, duplicalo.» Le Bozze vere: il dito sui ⋯ su «bozza», la lente su «Poi», Duplica.
        // R8 MORBIDA: la camera entra nel tuo video sulla tappa «Salva in bozza», dall'altra parte la stessa bozza ═══
        { const t0 = C[3];
          const r = { t0, t1: C[4], X: 11000, Y: 900, parole: { tocca: wt(28) - 0.1, puntini: wt(28) + 0.28, lente: wt(29), duplica: wt(30),
            titolo: [wt(26), wt(27), wt(28), wt(29), wt(30)] } };
          S.U10 = TPL.U10(r, { titolo: [[{ t: "Salvalo come " }, { t: "bozza", box: true }], [{ t: "poi duplicalo", hand: true }]],
            media: VIDEO, altre: ["th-mio_02", "th-mio_07", "th-mio_09"], ingresso: "nessuno", fermoDa: t0 + 0.45 });
          tplTenuta(tplZoomThrough(t0, S.L11.ancore.videoXY(1), S.U10.pose), r.t1);
        }

        // ═══ 5 · U11 · «Prendi la prima copia e pubblicala come reel di prova.» Il bivio, ramo alto: la copia 1, l'interruttore
        // «Reel di prova» (quello della scena 2) su «pubblicala», Condividi su «reel», il reel esce con PROVA ═══
        S.U11 = TPL.U11({ t0: C[4], t1: C[5], X: 14500, Y: -1800,
          parole: { interruttore: wt(36), condividi: wt(38), titolo: [wt(32), wt(33), wt(34), wt(37), wt(38), wt(39), wt(40)] } }, {

        // ═══ 6 · U07 · «Poi torna indietro e pubblica la seconda come reel normale.» Ramo basso: la copia 2, Condividi con
        // l'interruttore spento, il reel esce con NORMALE ═══

          parole: { bozza: wt(47), condividi: wt(49), titolo: [wt(41), wt(42), wt(43), wt(46), wt(47), wt(49), wt(50)] } }, {
          titolo: [[{ t: "Poi torna " }, { t: "indietro", box: true }], [{ t: "la seconda: reel normale", hand: true }]],
          media: VIDEO, altre: ["th-mio_02", "th-mio_07", "th-mio_09"], pubblicata: true });

        // ═══ 7 · F08 · «Il reel normale raggiungerà i tuoi follower come sempre,» Il tuo profilo vero: il reel normale va nella
        // griglia (riquadro su «normale»), i tuoi follower attorno si accendono a onda su «follower» ═══
        S.F08 = TPL.F08({ t0: C[6], t1: C[7], X: 18000, Y: 3600,
          parole: { profilo: wt(53), persone: wt(57), titolo: [wt(51), wt(52), wt(53), wt(55), wt(56), wt(57)] } }, {
          titolo: [[{ t: "Il reel " }, { t: "normale", box: true }], [{ t: "i tuoi follower", hand: true }]],

          profilo: { user: "tu", handle: "samuelerinaldo.media", nome: "Samuele Rinaldo | Content creator", mio: true, ring: "lime",

            grid: ["p1", "p2", "p3", "p4", "p5", "p6"] } });

        // ═══ 8 · O21 · «ma il reel di prova verrà mostrato solo a persone nuove che non ti seguono ancora.» Ramo alto: al centro
        // lo stesso reel in movimento, i tuoi follower si spengono su «solo», le persone nuove si accendono su «persone» ═══

          media: "r04v", tag: true, legenda: [["#ececec", "I tuoi follower"], ["#CFFB50", "Persone nuove"]] });

        // ═══ 9 · D01 · «Stesso identico video, ma il doppio delle visualizzazioni. Gratis.» Le due strade si ritrovano: NORMALE +
        // PROVA = il totale; «=» su «identico», conta su «doppio», ×2 su «Gratis».
        // R8 MORBIDA: la camera scorre di lato dagli anelli alla card, vicina (una schermata) ═══
        { const t0 = C[8];
          S.D01 = TPL.D01({ t0, t1: C[9], X: 19170, Y: -1800,
            parole: { uguale: wt(77), conta: wt(81), arriva: 30.45, finale: wt(84), titolo: [wt(76), wt(78), wt(80), wt(81), wt(84)] } }, {
            titolo: [[{ t: "Stesso video, " }, { t: "il doppio", box: true }], [{ t: "gratis", hand: true }]], da: 1240, a: 2420,
            fonti: [{ media: VIDEO, badge: "1.240", tag: "NORMALE" }, { media: VIDEO, badge: "1.180", tag: "PROVA" }],
            ingresso: "nessuno", fermoDa: t0 + 0.7 });
          tplTenuta(tplPan(t0 - 0.05, S.D01.pose, { dur: 0.75 }), C[9]);
        }

        // ═══ 10 · C01 · «Fallo ogni volta.» R8 MORBIDA: la linea parte dalla card del risultato e accende i tuoi prossimi video,
        // ognuno pubblicato due volte (prova + normale) ═══
        S.C01 = TPL.C01({ t0: C[9], t1: C[10], X: 20500, Y: -1800,
          parole: { tappe: [wt(85), wt(86) + 0.05, wt(87) + 0.05], titolo: [wt(85), wt(86), wt(87)] } }, {
          da: [S.D01.rect[2] - 10, S.D01.ancore.card[1]], viaggio: 0.5, titoloEsce: false,
          titolo: [[{ t: "Fallo " }, { t: "ogni volta", box: true }]],
          tappe: [{ media: "w1", giorno: "LUN", tema: "Prova + normale", icona: "copy" },
                  { media: "w2", giorno: "MER", tema: "Prova + normale", icona: "copy" },
                  { media: "w3", giorno: "VEN", tema: "Prova + normale", icona: "copy" }] });

        // R7: sfondo fermo nella tenuta di ogni scena
        tplFermo();

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
