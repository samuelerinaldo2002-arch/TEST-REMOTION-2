    <script>
      (() => {
        const ICON = __ICONS__;
        /*__KIT__*/

        const wt = (i) => WORDS[i][1]; // istante della parola i (indici: python -X utf8 _tools/parole.py …/d15.ts)
        camInit(540, 900, 1);
        const S = {};
        // i tagli: 0,1 s prima della prima parola della frase (X01 0,5 s prima di «Commenta»: la frase prima è finita)
        const C = [0, wt(10) - 0.1, wt(24) - 0.1, wt(37) - 0.1, wt(46) - 0.1, wt(58) - 0.1, wt(71) - 0.1, wt(90) - 0.1, wt(102) - 0.5, wt(109) - 0.1, 45.83];
        // il mondo: una scala che scende, un gradino per passo del piano
        const P = (i) => [600 + i * 3000, 900 + i * 700];

        // ═══ 1 · U15 · «30 giorni di contenuti pianificati in meno di 30 secondi.» Il cronometro parte da 30 al fotogramma 0,
        // l'anello dei 30 giorni pianificati si riempie ═══
        S.U15 = TPL.U15({ t0: C[0], t1: C[1], X: P(0)[0], Y: P(0)[1],
          parole: { pieno: 1.5, secondi: wt(9), titolo: [wt(0), wt(1), wt(5), wt(8), wt(9)] } }, {
          titolo: [[{ t: "30 giorni " }, { t: "in 30 secondi", box: true }]] });

        // ═══ 2 · O24 · «Scegli un volume. Uno al giorno vuol dire 30 video al mese. Poi decidi» Il mese vuoto è il volume da
        // scegliere; su «Uno» un tuo reel vero per giorno, il contatore conta i video ═══
        S.O24 = TPL.O24({ t0: C[1], t1: C[2], X: P(1)[0], Y: P(1)[1],
          parole: { riempie: wt(13), conta: wt(19), titolo: [wt(10), wt(11), wt(12), wt(13), wt(14), wt(15), wt(17), wt(18), wt(19)] } }, {
          titolo: [[{ t: "Scegli un " }, { t: "volume", box: true }], [{ t: "uno al giorno = 30 video", hand: true }]],
          media: Array.from({ length: 30 }, (_, i) => "g" + String(i + 1).padStart(2, "0")) });

        // ═══ 3 · O23 · «…la suddivisione. Io uso 70% valore, 20% fiducia, 10% conversione.» 100 puntini, ogni gruppo si colora
        // sulla sua parola. R8 MORBIDA: il passo dopo entra nel mese (la camera entra in un giorno del calendario e dall'altra
        // parte c'è la griglia della suddivisione) ═══
        { const t0 = C[2];
          const r = { t0, t1: C[3], X: P(2)[0], Y: P(2)[1], parole: { gruppi: [wt(30), wt(33), wt(36)], titolo: [wt(24), wt(25)] } };
          S.O23 = TPL.O23(r, { titolo: [[{ t: "La " }, { t: "suddivisione", box: true }]],
            gruppi: [{ n: 70, nome: "Valore", stile: "lime" }, { n: 20, nome: "Fiducia", stile: "bianco" }, { n: 10, nome: "Conversione", stile: "anello" }],
            ingresso: "nessuno", fermoDa: t0 + 0.45 });
          tplTenuta(tplZoomThrough(t0, S.O24.ancore.giorno(15), S.O23.pose), r.t1);
        }

        // ═══ 4 · L09 · «Scegli i tuoi filoni tematici dentro la tua nicchia.» La tua nicchia → i filoni dei tuoi script coi tuoi
        // reel veri sotto ═══
        S.L09 = TPL.L09({ t0: C[3], t1: C[4], X: P(3)[0], Y: P(3)[1],
          parole: { esempi: wt(40), radice: wt(45), titolo: [wt(37), wt(38), wt(39), wt(40)] } }, {
          titolo: [[{ t: "Scegli i tuoi " }, { t: "filoni", box: true }]], radice: "La tua nicchia",
          rami: [{ t: "Profilo", media: ["r1"] }, { t: "Algoritmo", media: ["r2"] }, { t: "Idee", media: ["r3"] }, { t: "Psicologia", media: ["r4"] }] });

        // ═══ 5 · D02 · «Cerca argomenti e formati che stanno funzionando in questo momento sui social.» Quattro formati veri
        // (classifica, prima e dopo, economico vs costoso, giornata tipo) con le visualizzazioni vere ═══
        S.D02 = TPL.D02({ t0: C[4], t1: C[5], X: P(4)[0], Y: P(4)[1] + 60,
          parole: { formati: wt(49), badge: wt(52), adesso: wt(55), titolo: [wt(46), wt(49), wt(50), wt(51), wt(52)] } }, {
          titolo: [[{ t: "Cerca " }, { t: "formati", box: true }], [{ t: "che stanno funzionando", hand: true }]],
          formati: [{ media: "f1", nome: "Classifica", views: "9,1M" }, { media: "f2", nome: "Prima e dopo", views: "2,2M" },
            { media: "f3", nome: "1 € vs 100K €", views: "23,4M" }, { media: "f4", nome: "Giornata tipo", views: "2,9M" }],
          periodo: "Questa settimana" });

        // ═══ 6 · L12 · «Scrivi gli script con un metodo fisso. Io uso hook, spiega, mostra, insegna.» Il copione: ogni sezione si
        // accende quando la nomini ═══
        S.L12 = TPL.L12({ t0: C[5], t1: C[6], X: P(5)[0], Y: P(5)[1],
          parole: { sezioni: [wt(67), wt(68), wt(69), wt(70)], titolo: [wt(58), wt(59), wt(60), wt(61), wt(62), wt(63), wt(64)] } }, {
          titolo: [[{ t: "Scrivi gli " }, { t: "script", box: true }], [{ t: "con un metodo fisso", hand: true }]],
          sezioni: [{ label: "Hook", rows: 3 }, { label: "Spiega", rows: 5 }, { label: "Mostra", rows: 5 }, { label: "Insegna", rows: 4 }] });

        // ═══ 7 · K16 · «Infine, organizza tutto in un calendario, alternando i filoni durante la settimana per non ripetere sempre
        // lo stesso tema.» La tua settimana: in ogni giorno la copertina di un tuo reel del filone, i filoni alternati (profilo
        // il lunedì e il venerdì: mai vicini) ═══
        S.K16 = TPL.K16({ t0: C[6], t1: C[7], X: P(6)[0], Y: P(6)[1],
          parole: { riempie: wt(76), filoni: wt(77), tema: wt(88), titolo: [wt(71), wt(73), wt(74), wt(75), wt(76)] } }, {
          titolo: [[{ t: "Infine, " }], [{ t: "tutto in un " }, { t: "calendario", box: true }]], evidenzia: "Profilo",
          giorni: [{ g: "LUN", filone: "Profilo", icona: "user-round", media: "th-mio_04" }, { g: "MAR", filone: "Algoritmo", icona: "cpu", media: "th-mio_03" },
            { g: "MER", filone: "Idee", icona: "lightbulb", media: "th-mio_02" }, { g: "GIO", filone: "Psicologia", icona: "brain", media: "th-mio_07" },
            { g: "VEN", filone: "Profilo", icona: "user-round", media: "th-mio_05" }, { g: "SAB", filone: "Algoritmo", icona: "cpu", media: "th-mio_10" },
            { g: "DOM", filone: "Psicologia", icona: "brain", media: "th-mio_09" }] });

        // ═══ 8 · D06 · «Ecco come pianifici 30 giorni di contenuti in meno di 30 secondi.» Il tuo reel nel lettore, la timeline
        // coi 5 passi di questo reel che si riempie col tempo. R8 MORBIDA: il calendario è l'ultimo passo → il riassunto dei passi:
        // la camera scorre di lato dalla settimana al lettore, vicino ═══
        { const t0 = C[7];
          S.D06 = TPL.D06({ t0, t1: C[8], X: P(6)[0] + 1300, Y: P(6)[1],
            parole: { fine: wt(98), tempo: wt(101), titolo: [wt(90), wt(91), wt(92), wt(97), wt(98), wt(99), wt(100), wt(101)] } }, {
            titolo: [[{ t: "Ecco come " }, { t: "pianifici", box: true }], [{ t: "in meno di 30 secondi", hand: true }]], media: "d1",
            capitoli: [{ t: "Volume", icona: "layers" }, { t: "Suddivisione", icona: "chart-pie" }, { t: "Filoni", icona: "git-branch" },
              { t: "Script", icona: "file-text" }, { t: "Calendario", icona: "calendar-days" }],
            ingresso: "nessuno", fermoDa: t0 + 0.7 });
          tplTenuta(tplPan(t0 - 0.05, S.D06.pose, { dur: 0.75 }), C[8]);
        }

        // ═══ 9 · X01 · «Commenta sistema e ti mando il comando…» Le pagine della risorsa arrivano a ondate su «sistema» e
        // «mando»; «Il comando» si accende su «comando» ═══
        S.X01 = TPL.X01({ t0: C[8], t1: C[9], X: P(7)[0] + 1300, Y: P(7)[1],
          parole: { ondate: [wt(103), wt(106)], risorsa: wt(108), titolo: [wt(102), wt(103)] } }, {
          titolo: [[{ t: "Commenta " }, { t: "«sistema»", box: true }]],
          pagine: ["Il comando", "Hook", "Spiega", "Mostra", "Insegna", "Esempi"] });

        // ═══ 10 · U01 · «…che uso per scrivere i copioni con questo metodo.» La chat vera (tema scuro, la tua foto): il comando si
        // scrive, su «metodo» parte e la risposta arriva con le quattro sezioni del metodo. R8 MORBIDA: la risorsa → la risorsa
        // aperta: la camera entra nella pagina «Il comando» ═══
        { const t0 = C[9];
          S.U01 = TPL.U01({ t0, t1: C[10], X: P(8)[0] + 1300, Y: P(7)[1],
            parole: { scrive: t0 + 0.08, invia: wt(117), titolo: [wt(111), wt(112), wt(113), wt(114)] } }, {
            titolo: [[{ t: "Per scrivere i " }, { t: "copioni", box: true }]], titoloEsce: false, h: 1060, prompt: "/copione metodo: hook, spiega, mostra, insegna",
            risposta: { intro: "Ecco il copione del tuo reel:", sezioni: ["Hook", "Spiega", "Mostra", "Insegna"] },
            ingresso: "nessuno", fermoDa: t0 + 0.45 });
          S.U01.elementi.seconda(tplZoomThrough(t0, S.X01.ancore.risorsa, S.U01.pose));
        }

        // R7: sfondo fermo nella tenuta di ogni scena
        tplFermo();

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
